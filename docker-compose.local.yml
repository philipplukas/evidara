services:
  platform-control-init:
    build:
      context: .
      dockerfile: platform-control/Dockerfile
    container_name: evidara-platform-control-init
    profiles: ["apps"]
    environment:
      PLATFORM_CONTROL_DATABASE_URL: postgresql+asyncpg://platform_control:platform_control@postgres:5432/platform_control
      PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND: local
      PLATFORM_CONTROL_RAW_ARTIFACT_LOCAL_DIR: .data/raw-artifacts
      PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND: noop
    command:
      - sh
      - -c
      - alembic upgrade head && platform-control-seed-reference-data --seed-dir /app/seeds
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-control-api:
    build:
      context: .
      dockerfile: platform-control/Dockerfile
    container_name: evidara-platform-control-api
    profiles: ["apps"]
    environment:
      PLATFORM_CONTROL_DATABASE_URL: postgresql+asyncpg://platform_control:platform_control@postgres:5432/platform_control
      PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND: local
      PLATFORM_CONTROL_RAW_ARTIFACT_LOCAL_DIR: .data/raw-artifacts
      PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND: noop
      PLATFORM_CONTROL_RUN_DISPATCH_BACKEND: inline
    command:
      - uvicorn
      - platform_control.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    mem_limit: 768m
    depends_on:
      platform-control-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 12

  platform-control-admin:
    build:
      context: ./platform-control/admin
      dockerfile: Dockerfile
    container_name: evidara-platform-control-admin
    profiles: ["apps"]
    environment:
      PLATFORM_CONTROL_API_URL: http://platform-control-api:8000
    ports:
      - "3100:8080"
    mem_limit: 768m
    depends_on:
      platform-control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12

  legal-search-seed:
    image: node:22-alpine
    container_name: evidara-legal-search-seed
    profiles: ["apps"]
    working_dir: /app
    volumes:
      - ./legal-search/api:/app
    environment:
      OPENSEARCH_NODE: http://opensearch:9200
      PORT: "3102"
    command:
      - sh
      - -c
      - npm ci && i=0; until npm run seed:index; do i=$$((i+1)); if [ "$$i" -ge 8 ]; then exit 1; fi; echo "retrying legal-search seed ($$i/8)"; sleep 5; done
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  legal-search-api:
    build:
      context: .
      dockerfile: legal-search/api/Dockerfile
    container_name: evidara-legal-search-api
    profiles: ["apps"]
    environment:
      OPENSEARCH_NODE: http://opensearch:9200
      PORT: "3102"
      NODE_ENV: production
    ports:
      - "3102:3102"
    mem_limit: 768m
    depends_on:
      legal-search-seed:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12

  legal-search-frontend:
    build:
      context: ./legal-search/frontend
      dockerfile: Dockerfile
    container_name: evidara-legal-search-frontend
    profiles: ["apps"]
    environment:
      NEXT_PUBLIC_API_URL: http://legal-search-api:3102
      NEXT_PUBLIC_CONTROL_PANEL_URL: http://localhost:3100
    ports:
      - "3101:8080"
    mem_limit: 1024m
    depends_on:
      legal-search-api:
        condition: service_healthy
      platform-control-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
