services:
  platform-control-init:
    build:
      context: .
      dockerfile: platform-control/Dockerfile
    profiles: ["apps"]
    environment:
      PLATFORM_CONTROL_DATABASE_URL: postgresql+asyncpg://platform_control:platform_control@postgres:5432/platform_control
      PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND: local
      PLATFORM_CONTROL_RAW_ARTIFACT_LOCAL_DIR: .data/raw-artifacts
      PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND: noop
    command:
      - sh
      - -c
      # No --seed-dir: the seeds ship inside the installed package and
      # seed_reference_data.DEFAULT_SEED_DIR resolves them via importlib. The old
      # `--seed-dir /app/seeds` pointed at a directory that does not exist in the
      # image (the Dockerfile copies the repo to /app, so the seeds land under
      # /app/src/platform_control/seeds), which failed with
      # "Seed file not found: /app/seeds/reference/compliance_policies.yaml".
      - alembic upgrade head && platform-control-seed-reference-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-control-api:
    build:
      context: .
      dockerfile: platform-control/Dockerfile
    profiles: ["apps"]
    environment:
      PLATFORM_CONTROL_DATABASE_URL: postgresql+asyncpg://platform_control:platform_control@postgres:5432/platform_control
      PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND: ${PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND:-local}
      PLATFORM_CONTROL_RAW_ARTIFACT_LOCAL_DIR: .data/raw-artifacts
      PLATFORM_CONTROL_RAW_ARTIFACT_BUCKET: ${PLATFORM_CONTROL_RAW_ARTIFACT_BUCKET:-evidara-raw-artifacts-dev}
      PLATFORM_CONTROL_S3_ENDPOINT_URL: ${PLATFORM_CONTROL_S3_ENDPOINT_URL:-http://minio:9000}
      PLATFORM_CONTROL_S3_REGION: ${PLATFORM_CONTROL_S3_REGION:-us-east-1}
      PLATFORM_CONTROL_S3_ACCESS_KEY_ID: ${PLATFORM_CONTROL_S3_ACCESS_KEY_ID:-minioadmin}
      PLATFORM_CONTROL_S3_SECRET_ACCESS_KEY: ${PLATFORM_CONTROL_S3_SECRET_ACCESS_KEY:-minioadmin}
      PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND: ${PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND:-noop}
      PLATFORM_CONTROL_NATS_SERVERS: ${PLATFORM_CONTROL_NATS_SERVERS:-nats://nats:4222}
      PLATFORM_CONTROL_RUN_DISPATCH_BACKEND: inline
    command:
      - uvicorn
      - platform_control.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    mem_limit: 768m
    depends_on:
      platform-control-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 12

  platform-control-admin:
    build:
      context: .
      dockerfile: platform-control/admin/Dockerfile
    profiles: ["apps"]
    environment:
      PLATFORM_CONTROL_API_URL: http://platform-control-api:8000
    ports:
      - "3100:8080"
    mem_limit: 768m
    depends_on:
      platform-control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12

  legal-search-seed:
    image: node:22-alpine
    profiles: ["apps"]
    working_dir: /app
    volumes:
      - ./legal-search/api:/app
    environment:
      OPENSEARCH_NODE: http://opensearch:9200
      PORT: "3102"
    command:
      - sh
      - -c
      - npm ci && i=0; until npm run seed:index; do i=$$((i+1)); if [ "$$i" -ge 8 ]; then exit 1; fi; echo "retrying legal-search seed ($$i/8)"; sleep 5; done
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  legal-search-api:
    build:
      context: .
      dockerfile: legal-search/api/Dockerfile
    profiles: ["apps"]
    environment:
      OPENSEARCH_NODE: http://opensearch:9200
      PORT: "3102"
      NODE_ENV: production
      # Where the BFF fetches a document's canonical body (`fetchLeanDocument`).
      # `document.processed` carries only refs, so without this legal-search falls
      # back to the "Document <id>" stub and body-text search finds nothing.
      DOCUMENT_INTELLIGENCE_BASE_URL: ${DOCUMENT_INTELLIGENCE_BASE_URL:-http://document-service:8090}
    ports:
      - "3102:3102"
    mem_limit: 768m
    depends_on:
      legal-search-seed:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12

  legal-search-frontend:
    build:
      context: .
      dockerfile: legal-search/frontend/Dockerfile
    profiles: ["apps"]
    environment:
      NEXT_PUBLIC_API_URL: http://legal-search-api:3102
      NEXT_PUBLIC_CONTROL_PANEL_URL: http://localhost:3100
    ports:
      - "3101:8080"
    mem_limit: 1024m
    depends_on:
      legal-search-api:
        condition: service_healthy
      platform-control-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12

  # NATS JetStream — self-hosted Pub/Sub replacement (ADR-0029). Opt-in via the `nats`
  # profile; the default `apps` stack still runs with the noop publisher. To exercise the
  # real publish path:
  #   PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND=nats \
  #     docker compose -f docker-compose.local.yml --profile apps --profile nats up
  nats:
    image: nats:2.10-alpine
    profiles: ["nats"]
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    mem_limit: 256m

  # One-shot: create the EVIDARA stream binding evidara.> with a 2m dedup window
  # (matches the Nats-Msg-Id publish dedup in NatsRawArtifactPublisher).
  nats-init:
    image: natsio/nats-box:latest
    profiles: ["nats"]
    depends_on:
      - nats
    entrypoint: ["sh", "-c"]
    # Literal block (|), not folded (>). With `>`, YAML keeps a newline before each
    # *more-indented* line, so wrapping `nats stream add` across lines split it into
    # separate shell commands — the flags ran as their own command ("sh: --subjects:
    # not found") and the bare `nats stream add EVIDARA` then blocked on a prompt
    # ("cannot prompt for user input without a terminal"). Keep the nats invocation
    # on one line.
    command:
      - |
        for i in $$(seq 1 30); do
          if nats --server nats://nats:4222 stream add EVIDARA --subjects 'evidara.>' --storage file --retention limits --discard old --dupe-window 2m --defaults >/dev/null 2>&1; then
            echo 'EVIDARA stream ready'; exit 0;
          fi;
          echo "waiting for nats ($$i/30)"; sleep 2;
        done;
        echo 'failed to create EVIDARA stream'; exit 1
    restart: "no"

  # document-intelligence NATS JetStream consumer (ADR-0029 Slice 3). Subscribes to
  # evidara.artifact-bundle-available, processes bundles, and publishes
  # document.processed / status events back to NATS. Surfaces are unset -> in-memory
  # sink (no Delta/Databricks). Pairs with the `nats` profile.
  di-consumer:
    build:
      context: ./document-intelligence
      dockerfile: Dockerfile.runtime-ingress
    profiles: ["nats"]
    command: ["document_intelligence_nats_consumer", "--servers", "nats://nats:4222"]
    environment:
      PORT: "8092"
      # Artifact-bundle storage. platform-control writes bundles to MinIO when it
      # runs with ARTIFACT_STORE_BACKEND=s3, but the consumer had no S3 config, so
      # `_default_s3_client_factory` fell back to real AWS and every bundle
      # dead-lettered with BundleLoadError ("bundle manifest could not be read from
      # s3://…"). Without these the local DI loop can never complete. Defaults
      # mirror the platform-control S3 vars so both sides address the same bucket.
      DI_S3_ENDPOINT_URL: ${PLATFORM_CONTROL_S3_ENDPOINT_URL:-http://minio:9000}
      DI_S3_REGION: ${PLATFORM_CONTROL_S3_REGION:-us-east-1}
      DI_S3_ACCESS_KEY_ID: ${PLATFORM_CONTROL_S3_ACCESS_KEY_ID:-minioadmin}
      DI_S3_SECRET_ACCESS_KEY: ${PLATFORM_CONTROL_S3_SECRET_ACCESS_KEY:-minioadmin}
      # Canonical surface. With this unset the consumer uses the in-memory sink, so
      # the canonical title/body are never persisted and legal-search can only index
      # a metadata stub ("Document <id>", no body). Pointing it at a shared volume
      # makes `document-service` (which prefers the Delta-backed store whenever
      # DI_SURFACES_ROOT_URI is set) able to serve the real text.
      DI_SURFACES_ROOT_URI: file:///surfaces
    volumes:
      - di-surfaces:/surfaces
    depends_on:
      nats-init:
        condition: service_completed_successfully
    mem_limit: 1024m

  # Serves GET /v1/documents/{id}/lean from the canonical surface the consumer
  # writes above. Defined in docker-compose.yml for the `lean` profiles; here it
  # joins the `nats` loop and reads the shared surface instead of the demo
  # fixtures (store_from_env prefers Delta surfaces over DOCUMENT_SERVICE_CONTENT_DIR).
  document-service:
    profiles: ["nats"]
    environment:
      DI_SURFACES_ROOT_URI: file:///surfaces
      PORT: "8090"
    volumes:
      - di-surfaces:/surfaces

  # document-intelligence NATS→legal-search projection bridge (M0.2, issue #522).
  # di-consumer publishes evidara.document-processed / evidara.document-withdrawn, but
  # nothing in the local stack forwarded those into legal-search — so processed documents
  # never became searchable locally. This service closes that hop: it subscribes to both
  # subjects and POSTs each event to the legal-search projections endpoints (making the
  # admin→search loop end-to-end, required by the CH Fedlex e2e in issue #533) and to
  # platform-control's /v1/di/events endpoints (so run pipeline-health reports real
  # progress instead of `pending` forever — #550). Same runtime-ingress image as
  # di-consumer; pairs with the `nats` profile. It depends on the `apps`-profile
  # legal-search-api and platform-control-api (legal-search in turn needs opensearch from
  # the `search` profile), so bring the loop up with:
  #   --profile apps --profile search --profile nats --profile minio
  projection-bridge:
    build:
      context: ./document-intelligence
      dockerfile: Dockerfile.runtime-ingress
    profiles: ["nats"]
    command:
      - document_intelligence_projection_bridge
      - --servers
      - nats://nats:4222
      - --legal-search-api-url
      - http://legal-search-api:3102
      # DI status/lifecycle callbacks into platform-control, so run pipeline-health
      # leaves `pending` (#550). The local platform-control-api sets no API key, so the
      # bridge sends no X-API-Key header and the open dev API accepts it.
      - --platform-control-api-url
      - http://platform-control-api:8000
    environment:
      PORT: "8093"
    depends_on:
      nats-init:
        condition: service_completed_successfully
      legal-search-api:
        condition: service_healthy
      platform-control-api:
        condition: service_healthy
    mem_limit: 512m

  # MinIO — self-hosted S3-compatible object storage (ADR-0029 Slice 4). Opt-in via the
  # `minio` profile; the default stack still uses the local artifact store. To exercise
  # the S3 path:
  #   PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND=s3 \
  #     docker compose -f docker-compose.local.yml --profile apps --profile minio up
  # The raw-artifacts bucket is created in-process, just before `minio server` execs,
  # rather than by a companion one-shot container. A one-shot `minio-init` used to do
  # this, but nothing in the `minio` profile could depend on it with
  # `service_completed_successfully`: the profile holds no long-running consumer, and a
  # cross-profile depends_on hard-errors the apps-only stack ("depends on undefined
  # service"). Without such a dependent, `docker compose up --wait` keeps the one-shot in
  # its wait set and fails the entire bring-up with `container evidara-minio-init-1
  # exited (0)` whenever the container finishes before the wait set is evaluated. That
  # race is what made the E2E CH Fedlex Loop canary red on every scheduled main run.
  #
  # On the filesystem backend a bucket is just a directory under /data, so `mkdir -p` is
  # sufficient and idempotent. The healthcheck asserts the bucket is actually listable,
  # so `--wait` now gates on bucket readiness — a stronger guarantee than the one-shot
  # ever gave, since nothing previously waited on it at all.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      BUCKET: ${PLATFORM_CONTROL_RAW_ARTIFACT_BUCKET:-evidara-raw-artifacts-dev}
    entrypoint: ["sh", "-c"]
    command:
      - >
        mkdir -p "/data/$$BUCKET" &&
        exec minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mc alias set hc http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 &&
          mc ls "hc/$$BUCKET" >/dev/null 2>&1
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    mem_limit: 512m

volumes:
  # Canonical surface shared by di-consumer (writer) and document-service (reader),
  # so the local loop can serve real document text instead of a metadata stub.
  di-surfaces:
