openapi: 3.1.0
info:
  title: Document Intelligence — Document Service
  description: |
    Read API for published canonical document bodies as Docling JSON.

    Owned by **document-intelligence**; primary consumer is the **legal-search BFF** for document
    detail (not a handoff into parsing or pipeline jobs). See ADR-0010
    (`docs/adr/0010-document-content-format.md`) and `docs/architecture/boundary-contracts.md`.

    Wire format: IBM Docling `DoclingDocument` serialized as JSON. A dedicated JSON Schema may be
    added under `contracts/schemas/` when the on-wire subset is frozen.
  version: 0.2.0
  contact:
    name: Evidara Team
  license:
    # The licence decision this block used to defer was made on 2026-09-16: the
    # repository is Apache-2.0 (see /LICENSE). `identifier` is a valid SPDX
    # expression, which is what OpenAPI 3.1 requires when the field is present —
    # so declaring it also clears the two style warnings the old comment
    # catalogued (redocly `info-license-strict`, orval's bundled 3.0-shaped
    # schema).
    #
    # `identifier` and `url` are mutually exclusive in OpenAPI 3.1 — the schema
    # is a `oneOf`, so setting both is what makes a document non-conformant.
    # SPDX is the more precise of the two; do not add `url` beside it.
    #
    # This licenses the SPEC and the code implementing it. It says nothing about
    # the legal corpus served through it, which carries each issuing body's own
    # terms — see the Licence section of /README.md.
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:8082
    description: Local development (placeholder — bind to actual service or SQL gateway)
  - url: https://document-intelligence.internal
    description: Internal service URL (replace per environment)

security: []

paths:
  /v1/documents/{document_id}:
    get:
      operationId: getDocumentFull
      summary: Get full DoclingDocument JSON
      description: |
        Returns the full lossless Docling document as stored in published Delta surfaces
        (including layout metadata such as bounding boxes where present).
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/DocumentRevision"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: DoclingDocument JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoclingDocumentJson"
        "404":
          description: Document not found or not visible for the caller scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            The published-sections read failed. The service refuses rather than serving the
            document as if it had no sections — a failed read must never be indistinguishable
            from a genuine zero (#972, ADR-0052). A document that truly has no sections is
            served as `200` without a `sections` array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/documents/{document_id}/lean:
    get:
      operationId: getDocumentLean
      summary: Get lean DoclingDocument JSON
      description: |
        Same structure as full document with layout-only fields stripped (e.g. bounding boxes,
        confidence) per ADR-0010 — suitable for BFF → frontend responses.
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/DocumentRevision"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Lean DoclingDocument JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoclingDocumentJson"
        "404":
          description: Document not found or not visible for the caller scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            The published-sections read failed. The service refuses rather than serving the
            document as if it had no sections — a failed read must never be indistinguishable
            from a genuine zero (#972, ADR-0052). A document that truly has no sections is
            served as `200` without a `sections` array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/documents/{document_id}/text:
    get:
      operationId: getDocumentPlainText
      summary: Get plain text fallback
      description: Debugging and fallback retrieval — not the primary UI path.
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/DocumentRevision"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Plain text body
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Document not found or not visible for the caller scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            The published-sections read failed. The service refuses rather than serving the
            document as if it had no sections — a failed read must never be indistinguishable
            from a genuine zero (#972, ADR-0052). A document that truly has no sections is
            served as `200` without a `sections` array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/embeddings/query-sparse:
    post:
      operationId: encodeQuerySparse
      summary: Encode a query into the learned-sparse feature space
      description: |
        Encodes a search query with the same BGE-M3 model that wrote `content_sparse`
        (ADR-0054), so the search path can issue `rank_feature` clauses against it.

        The model is required, not just its tokenizer. Measured 2026-09-16, BGE-M3's
        query features are a strict subset of the tokenizer's ids (overlap 10, model-only
        0), so a tokenizer-only encoder reaches the same feature SPACE — but not the
        weights, and the weights are the point: `Zürich` 0.261 and `Hund` 0.235 against
        `meinen` 0.050. Uniform or corpus-IDF weighting rewards `meinen`, because
        colloquial first-person German is rarer in statutes than the legal subject. That
        is #973 rebuilt in the sparse arm.

        Intended as a COLD path: BM25 answers ~85% of realistic queries, so this is for
        the remainder. That is what makes a CPU-bound encode acceptable.
      tags: [embeddings]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuerySparseRequest"
      responses:
        "200":
          description: The encoded query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuerySparseResponse"
        "422":
          description: Empty query, or `max_features` out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            This image does not carry the sparse encoder. `503` and not `500`
            deliberately: "no model here" and "this query is unanswerable" are different
            facts, and a search path that cannot tell them apart is #958 at a service
            boundary. `detail.reason` is `embeddings_extra_not_installed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
      description: Stable `document_id` from Evidara contracts.
    DocumentRevision:
      name: document_revision
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: |
        Optional explicit revision. When omitted, the implementation returns the latest published
        revision the caller is allowed to see.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Propagated for tracing across BFF → Document Service → data plane.

  schemas:
    QuerySparseRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
        max_features:
          type: integer
          minimum: 1
          maximum: 2048
          default: 512
          description: |
            Features sent as `rank_feature` clauses. The default matches the vector the
            ADR-0054 D4 floor was calibrated against; a ratio computed over a
            differently sized vector is not comparable to it.
    QuerySparseResponse:
      type: object
      required: [features, feature_count, features_before_truncation, weight_mass, truncated, model]
      properties:
        features:
          type: object
          additionalProperties:
            type: number
          description: |
            `t<token-id>` -> weight. Token ids, never decoded strings: a multilingual
            vocabulary contains `.`, which OpenSearch reads as object nesting.
        feature_count:
          type: integer
        features_before_truncation:
          type: integer
        weight_mass:
          type: number
          description: |
            Mass of the features returned, NOT of the untruncated vector. ADR-0054 D4's
            coverage ratio divides by this, and it must describe the query actually issued.
        truncated:
          type: boolean
        model:
          type: string
    DoclingDocumentJson:
      type: object
      description: |
        Docling `DoclingDocument` as JSON. Field inventory is owned by the Docling version pinned
        in document-intelligence; Evidara may add a stricter schema later.
      additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
      additionalProperties: true

tags:
  - name: documents
    description: Published document body reads
  - name: embeddings
    description: |
      Query-side encoding into the learned-sparse feature space the projection
      writes (ADR-0054). Read-only and stateless — it encodes, it does not search.
