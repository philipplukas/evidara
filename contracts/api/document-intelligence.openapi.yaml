openapi: 3.1.0
info:
  title: Document Intelligence — Document Service API
  description: |
    Read API for canonical **DoclingDocument** content stored on published Delta surfaces.

    Exposed by document-intelligence (implementation may be Databricks SQL, a thin Cloud Run
    service, or Delta Sharing — see ADR-0010). Intended callers: **legal-search BFF** for
    interactive document detail; operators may use plain-text responses for debugging.

    This spec is the source of truth for paths, parameters, and response **media types**.
    The JSON shape of DoclingDocument follows IBM Docling; a stricter JSON Schema may be
    added later under `contracts/schemas/`.
  version: 0.1.0
  contact:
    name: Evidara Team
  license:
    name: Proprietary
    identifier: UNLICENSED

servers:
  - url: http://localhost:8090
    description: Local development (representative port)
  - url: https://document-intelligence.evidara.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: documents
    description: Published document body reads (Docling / plain text)

paths:
  /v1/documents/{document_id}:
    get:
      operationId: getDocumentDoclingFull
      summary: Get full DoclingDocument JSON
      description: |
        Returns the **full** DoclingDocument JSON for a published document revision, including
        layout metadata (e.g. bounding boxes, confidence) when present in the canonical store.
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/ProcessingManifestId"
      responses:
        "200":
          description: DoclingDocument JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoclingDocumentJson"
        "400":
          description: Invalid document or processing manifest id
        "404":
          description: Document revision not found or not published

  /v1/documents/{document_id}/lean:
    get:
      operationId: getDocumentDoclingLean
      summary: Get lean DoclingDocument JSON
      description: |
        Same structure as the full document, but **without** layout-only fields such as
        bounding boxes and confidence scores, suitable for BFF → frontend pass-through (ADR-0010).
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/ProcessingManifestId"
      responses:
        "200":
          description: Lean DoclingDocument JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeanDoclingDocumentJson"
        "400":
          description: Invalid document or processing manifest id
        "404":
          description: Document revision not found or not published

  /v1/documents/{document_id}/text:
    get:
      operationId: getDocumentPlainText
      summary: Get plain text body
      description: |
        Flattened plain text for debugging, tooling, or simple fallbacks. Not a substitute
        for structured rendering in the product UI.
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/ProcessingManifestId"
      responses:
        "200":
          description: Plain text body
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid document or processing manifest id
        "404":
          description: Document revision not found or not published

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service or user token as agreed for the deployment.

  parameters:
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Canonical document identifier (`doc_…` ULID).
      schema:
        type: string
        pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
      example: doc_01jq7bdptzqv3xs0c41xpw1ybg

    ProcessingManifestId:
      name: processing_manifest_id
      in: query
      required: false
      description: |
        Selects a specific published processing revision. When omitted, the implementation
        returns the **latest** published revision for `document_id` (behavior must be
        deterministic and documented at deploy time).
      schema:
        type: string
        pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
      example: pm_01jq7bhgy7g0pkj4f1d03f8f8c

  schemas:
    DoclingDocumentJson:
      type: object
      description: |
        IBM Docling **DoclingDocument** as JSON. Canonical field-level constraints may be
        shared via `contracts/schemas/` in a later change; consumers must tolerate unknown
        properties as Docling evolves.
      additionalProperties: true

    LeanDoclingDocumentJson:
      type: object
      description: |
        DoclingDocument JSON with layout-only fields stripped (see ADR-0010). Same
        openness as the full document for forward compatibility.
      additionalProperties: true
