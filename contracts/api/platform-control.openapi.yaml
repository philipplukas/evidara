    SourceBlueprintPreviewResponse:
      properties:
        overlay_id:
          type: string
          title: Overlay Id
        provider_template_id:
          type: string
          title: Provider Template Id
        acquisition_spec:
          oneOf:
          - $ref: '#/components/schemas/FirecrawlAcquisitionSpec'
          - $ref: '#/components/schemas/DeterministicHttpAcquisitionSpec'
          - $ref: '#/components/schemas/FedlexSparqlAcquisitionSpec'
          - $ref: '#/components/schemas/RisOgdAcquisitionSpec'
          - $ref: '#/components/schemas/LegifranceAcquisitionSpec'
          - $ref: '#/components/schemas/EurLexSparqlAcquisitionSpec'
          - $ref: '#/components/schemas/ChCourtDecisionsAcquisitionSpec'
          - $ref: '#/components/schemas/CantonHttpAcquisitionSpec'
          - $ref: '#/components/schemas/GemeindeHttpAcquisitionSpec'
          - $ref: '#/components/schemas/BundeslandHttpAcquisitionSpec'
          - $ref: '#/components/schemas/RegioneHttpAcquisitionSpec'
          title: Acquisition Spec
          discriminator:
            propertyName: provider
            mapping:
              bundesland_http: '#/components/schemas/BundeslandHttpAcquisitionSpec'
              canton_http: '#/components/schemas/CantonHttpAcquisitionSpec'
              ch_court_decisions: '#/components/schemas/ChCourtDecisionsAcquisitionSpec'
              deterministic_http: '#/components/schemas/DeterministicHttpAcquisitionSpec'
              eur_lex_sparql: '#/components/schemas/EurLexSparqlAcquisitionSpec'
              fedlex_sparql: '#/components/schemas/FedlexSparqlAcquisitionSpec'
              firecrawl: '#/components/schemas/FirecrawlAcquisitionSpec'
              gemeinde_http: '#/components/schemas/GemeindeHttpAcquisitionSpec'
              legifrance: '#/components/schemas/LegifranceAcquisitionSpec'
              regione_http: '#/components/schemas/RegioneHttpAcquisitionSpec'
              ris_ogd: '#/components/schemas/RisOgdAcquisitionSpec'
        enabled:
          type: boolean
          title: Enabled
          description: 'Effective ADR-0030 config key: DB override an operator flipped, else the shipped
            source_blueprints.yaml default (fail-closed).'
        live_ready:
          type: boolean
          title: Live Ready
          description: 'ADR-0030 code key, as a boolean: true only when acquisition_readiness is ''live''.
            Retained so existing clients keep working; prefer acquisition_readiness, which distinguishes
            a scaffold from a provider that is merely awaiting acceptance evidence (#743).'
        acquisition_readiness:
          $ref: '#/components/schemas/AcquisitionReadiness'
          description: ADR-0030 code key, three-state. 'scaffold' = the provider cannot acquire its targets
            and needs engineering (usually a stub start_run, sometimes a real one facing sources it cannot
            fetch); 'awaiting_evidence' = implemented and verified, but no acceptance run captured yet
            (the operator can run one themselves); 'live' = evidence accepted. `live_ready` is the legacy
            boolean projection of this field and is true only for 'live'.
          default: scaffold
        launchable:
          type: boolean
          title: Launchable
          description: Both keys turned — a live run will not be blocked by the two-key lock.
        notes:
          items:
            type: string
          type: array
          title: Notes
          description: Human-readable explanation of any closed key (why the template is inert).
        plan_notes:
          items:
            type: string
          type: array
          title: Plan Notes
          description: The provider's own `plan()` notes for this spec (#634) — seed URLs it would hit,
            config errors, and provider-specific caveats. Distinct from `notes`, which explains the two-key
            lock; these describe the acquisition itself. Empty when the provider exposes no plan or plan
            computation failed.
      type: object
      required:
      - overlay_id
      - provider_template_id
      - acquisition_spec
      - enabled
      - live_ready
      - launchable
      title: SourceBlueprintPreviewResponse
    SourceBlueprintTemplateListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/SourceBlueprintTemplateResponse'
          type: array
          title: Data
      type: object
      required:
      - data
      title: SourceBlueprintTemplateListResponse
    SourceBlueprintTemplateResponse:
      properties:
        overlay_id:
          type: string
          title: Overlay Id
        provider_template_id:
          type: string
          title: Provider Template Id
        provider:
          type: string
          title: Provider
        enabled:
          type: boolean
          title: Enabled
          description: 'Effective ADR-0030 config key: DB override an operator flipped, else the shipped
            source_blueprints.yaml default (fail-closed).'
        live_ready:
          type: boolean
          title: Live Ready
          description: 'ADR-0030 code key, as a boolean: true only when acquisition_readiness is ''live''.
            Retained so existing clients keep working; prefer acquisition_readiness (#743).'
        acquisition_readiness:
          $ref: '#/components/schemas/AcquisitionReadiness'
          description: ADR-0030 code key, three-state. 'scaffold' = the provider cannot acquire its targets
            and needs engineering (usually a stub start_run, sometimes a real one facing sources it cannot
            fetch); 'awaiting_evidence' = implemented and verified, but no acceptance run captured yet
            (the operator can run one themselves); 'live' = evidence accepted. `live_ready` is the legacy
            boolean projection of this field and is true only for 'live'.
          default: scaffold
        launchable:
          type: boolean
          title: Launchable
          description: Both keys turned — a live run will not be blocked by the two-key lock.
        notes:
          items:
            type: string
          type: array
          title: Notes
          description: Human-readable explanation of any closed key (why the template is inert).
        default_enabled:
          type: boolean
          title: Default Enabled
          description: The shipped source_blueprints.yaml default for the config key.
        source:
          type: string
          title: Source
          description: 'Provenance of the effective config key: ''override'' (an operator flipped it)
            or ''default'' (running on the shipped value, never touched).'
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: Evidence note the operator recorded with the override, if any.
        updated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By
          description: 'Operator identity that last flipped the override. Key-shaped, not person-shaped:
            every human sharing an operator API key resolves to the same row.'
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: When the override was last written.
      type: object
      required:
      - overlay_id
      - provider_template_id
      - provider
      - enabled
      - live_ready
      - launchable
      - default_enabled
      - source
      title: SourceBlueprintTemplateResponse
