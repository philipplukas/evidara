          pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
        causation_id:
          type: string
        payload:
          $ref: "#/components/schemas/DocumentProcessedPayload"
      additionalProperties: false

    DocumentWithdrawnPayload:
      type: object
      required:
        - document_id
        - document_revision
        - processing_manifest_id
        - provenance
        - reason_code
        - search_disposition
      properties:
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        provenance:
          $ref: "#/components/schemas/ProcessingStatusProvenance"
        reason_code:
          type: string
          enum: [duplicate, invalid_source, rights_restricted, operator_withdrawn]
        reason_summary:
          oneOf:
            - type: string
            - type: "null"
        search_disposition:
          type: string
          enum: [remove, hide]
      additionalProperties: false

    DocumentWithdrawnEvent:
      type: object
      required:
        - event_type
        - event_version
        - event_id
        - occurred_at
        - producer
        - payload
      properties:
        event_type:
          type: string
          const: document.withdrawn
        event_version:
          type: integer
          const: 1
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
          const: document-intelligence
        correlation_id:
          type: string
          pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
        causation_id:
          type: string
        payload:
          $ref: "#/components/schemas/DocumentWithdrawnPayload"
      additionalProperties: false

    DocumentLifecycleEvent:
      type: object
      required:
        - event_id
        - event_type
        - run_id
        - document_id
        - document_revision
        - processing_manifest_id
        - occurred_at
        - created_at
        - updated_at
      properties:
        event_id:
          type: string
        event_type:
          type: string
          enum: [document.processed, document.withdrawn]
        run_id:
          type: string
          pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        processing_version:
          oneOf:
            - type: string
            - type: "null"
        lifecycle_status:
          oneOf:
            - type: string
              enum: [active, superseded, repealed, withdrawn]
            - type: "null"
        reason_code:
          oneOf:
            - type: string
              enum: [duplicate, invalid_source, rights_restricted, operator_withdrawn]
            - type: "null"
        reason_summary:
          oneOf:
            - type: string
            - type: "null"
        search_disposition:
          oneOf:
            - type: string
              enum: [remove, hide]
            - type: "null"
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentLifecycleEventListResponse:
