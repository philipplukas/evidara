openapi: 3.1.0
info:
  title: Platform Control API
  description: |
    API for managing sources, source versions, runs, approvals, and provider webhooks
    in the Evidara platform control plane.
  version: 0.2.0
  contact:
    name: Evidara Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://platform-control.evidara.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: sources
  - name: source-versions
  - name: runs
  - name: firecrawl
  - name: health

paths:
  /v1/sources:
    get:
      operationId: listSources
      summary: List all sources
      tags: [sources]
      responses:
        "200":
          description: List of sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceListResponse"
    post:
      operationId: createSource
      summary: Create a new source
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Reference data not found

  /v1/sources/{source_id}:
    get:
      operationId: getSource
      summary: Get a source by ID
      tags: [sources]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Source not found

  /v1/sources/{source_id}/versions:
    get:
      operationId: listSourceVersions
      summary: List versions of a source
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: List of source versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersionListResponse"
        "404":
          description: Source not found
    post:
      operationId: createSourceVersion
      summary: Create a new source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceVersionRequest"
      responses:
        "201":
          description: Source version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source or extractor profile not found

  /v1/versions/{source_version_id}/approve:
    post:
      operationId: approveSourceVersion
      summary: Approve a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/versions/{source_version_id}/reject:
    post:
      operationId: rejectSourceVersion
      summary: Reject a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/runs:
    post:
      operationId: createRun
      summary: Trigger a new preview or production run
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Source or source version not found
        "409":
          description: Invalid run request for the current source version state

  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Get run status
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found

  /v1/firecrawl/webhooks:
    post:
      operationId: receiveFirecrawlWebhook
      summary: Receive Firecrawl provider callbacks
      tags: [firecrawl]
      security: []
      parameters:
        - name: X-Firecrawl-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature for the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirecrawlWebhookEvent"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcceptedResponse"
        "401":
          description: Signature verification failed

  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the identity provider.

  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^src_[a-z0-9]+$"
    SourceVersionId:
      name: source_version_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^sv_[a-z0-9]+$"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^run_[a-z0-9]+$"

  schemas:
    Source:
      type: object
      required:
        - source_id
        - name
        - jurisdiction_id
        - authority_id
        - source_type
        - status
        - created_at
        - updated_at
      properties:
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
          example: src_01hzxk7v3qmjy4t5n2p8r6w9
        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website]
        document_family:
          type: string
        status:
          type: string
          enum: [active, inactive, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    CreateSourceRequest:
      type: object
      required: [name, jurisdiction_id, authority_id]
      properties:
        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website]
          default: website
        document_family:
          type: string

    FirecrawlAcquisitionSpec:
      type: object
      additionalProperties: false
      properties:
        seed_url:
          type: string
          format: uri
        seed_urls:
          type: array
          items:
            type: string
            format: uri
        mode:
          type: string
          enum: [crawl, batch_scrape]
          default: crawl
        include_paths:
          type: array
          items:
            type: string
        exclude_paths:
          type: array
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 20
        max_discovery_depth:
          type: integer
          minimum: 0
          maximum: 10
          default: 2
        scrape_formats:
          type: array
          items:
            type: string
          default: [markdown, html]
        zero_data_retention:
          type: boolean
          default: false

    SourceVersion:
      type: object
      required:
        - source_version_id
        - source_id
        - version_label
        - status
        - acquisition_spec
        - created_at
        - updated_at
      properties:
        source_version_id:
          type: string
          pattern: "^sv_[a-z0-9]+$"
          example: sv_01hzxk8a2bmne6g4r7j3k9l5
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
        extractor_profile_id:
          type: string
          pattern: "^exp_[a-z0-9]+$"
        version_label:
          type: string
        status:
          type: string
          enum: [draft, pending_approval, approved, rejected, superseded]
        acquisition_spec:
          $ref: "#/components/schemas/FirecrawlAcquisitionSpec"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceVersionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SourceVersion"

    CreateSourceVersionRequest:
      type: object
      required: [version_label, acquisition_spec]
      properties:
        version_label:
          type: string
        extractor_profile_id:
          type: string
          pattern: "^exp_[a-z0-9]+$"
        acquisition_spec:
          $ref: "#/components/schemas/FirecrawlAcquisitionSpec"

    Run:
      type: object
      required:
        - run_id
        - source_id
        - source_version_id
        - mode
        - status
        - artifacts_count
        - captured_resources_count
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          pattern: "^run_[a-z0-9]+$"
          example: run_01hzxk9c4dnpf8h6t2m5q7w3
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
        source_version_id:
          type: string
          pattern: "^sv_[a-z0-9]+$"
        mode:
          type: string
          enum: [preview, production]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        artifacts_count:
          type: integer
        captured_resources_count:
          type: integer
        failure_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRunRequest:
      type: object
      required: [source_id, source_version_id]
      properties:
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
        source_version_id:
          type: string
          pattern: "^sv_[a-z0-9]+$"
        mode:
          type: string
          enum: [preview, production]
          default: preview

    FirecrawlWebhookEvent:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          examples: [crawl.started, crawl.page, crawl.completed, crawl.failed]
        id:
          type: string
          description: Provider job identifier.
        data:
          oneOf:
            - type: object
            - type: array
              items:
                type: object
        metadata:
          type: object
          additionalProperties: true
        error:
          type: string
      additionalProperties: true

    WebhookAcceptedResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]

    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
