      type: object
      required:
        - processing_manifest_id
        - provenance
        - processing_version
        - status
      properties:
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        provenance:
          $ref: "#/components/schemas/ProcessingStatusProvenance"
        processing_version:
          type: string
        status:
          type: string
          enum:
            - accepted
            - processing
            - canonical_ready
            - failed
            - withdrawn
            - skipped_duplicate
        error_code:
          oneOf:
            - type: string
            - type: "null"
        error_summary:
          oneOf:
            - type: string
            - type: "null"
      allOf:
        - if:
            properties:
              status:
                const: failed
            required: [status]
          then:
            required: [error_code, error_summary]
            properties:
              error_code:
                type: string
                minLength: 1
              error_summary:
                type: string
                minLength: 1
          else:
            properties:
