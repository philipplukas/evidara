openapi: 3.1.0
info:
  title: Platform Control API
  description: |
    API for managing sources, source versions, runs, approvals, and provider webhooks
    in the Evidara platform control plane.
  version: 0.2.0
  contact:
    name: Evidara Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://platform-control.evidara.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: sources
  - name: source-versions
  - name: runs
  - name: di-events
  - name: firecrawl
  - name: health

paths:
  /v1/sources:
    get:
      operationId: listSources
      summary: List all sources
      tags: [sources]
      responses:
        "200":
          description: List of sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceListResponse"
    post:
      operationId: createSource
      summary: Create a new source
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Reference data not found

  /v1/sources/{source_id}:
    get:
      operationId: getSource
      summary: Get a source by ID
      tags: [sources]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Source not found

  /v1/sources/{source_id}/versions:
    get:
      operationId: listSourceVersions
      summary: List versions of a source
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: List of source versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersionListResponse"
        "404":
          description: Source not found
    post:
      operationId: createSourceVersion
      summary: Create a new source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceVersionRequest"
      responses:
        "201":
          description: Source version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source or extractor profile not found

  /v1/versions/{source_version_id}/approve:
    post:
      operationId: approveSourceVersion
      summary: Approve a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/versions/{source_version_id}/reject:
    post:
      operationId: rejectSourceVersion
      summary: Reject a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/runs:
    post:
      operationId: createRun
      summary: Trigger a new preview or production run
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Source or source version not found
        "409":
          description: Invalid run request for the current source version state

  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Get run status
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found

  /v1/runs/{run_id}/processing-status:
    get:
      operationId: listRunProcessingStatus
      summary: List DI processing status updates for a run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Processing status updates for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStatusUpdateListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/document-lifecycle:
    get:
      operationId: listRunDocumentLifecycle
      summary: List document processed/withdrawn lifecycle events for a run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Document lifecycle events for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLifecycleEventListResponse"
        "404":
          description: Run not found

  /v1/di/events/document-processing-status-updated:
    post:
      operationId: receiveDocumentProcessingStatusUpdated
      summary: Ingest processing status events emitted by document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentProcessingStatusUpdatedEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/di/events/document-processed:
    post:
      operationId: receiveDocumentProcessed
      summary: Ingest canonical-ready document publication events from document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentProcessedEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/di/events/document-withdrawn:
    post:
      operationId: receiveDocumentWithdrawn
      summary: Ingest document withdrawal events from document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentWithdrawnEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/firecrawl/webhooks:
    post:
      operationId: receiveFirecrawlWebhook
      summary: Receive Firecrawl provider callbacks
      tags: [firecrawl]
      security: []
      parameters:
        - name: X-Firecrawl-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature for the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirecrawlWebhookEvent"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcceptedResponse"
        "401":
          description: Signature verification failed

  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the identity provider.

  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^src_[a-z0-9]+$"
    SourceVersionId:
      name: source_version_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^sv_[a-z0-9]+$"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^run_[a-z0-9]+$"

  schemas:
    Source:
      type: object
      required:
        - source_id
        - name
        - jurisdiction_id
        - authority_id
        - source_type
        - status
        - created_at
        - updated_at
      properties:
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
          example: src_01hzxk7v3qmjy4t5n2p8r6w9
        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website]
        document_family:
          type: string
        status:
          type: string
          enum: [active, inactive, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    CreateSourceRequest:
      type: object
      required: [name, jurisdiction_id, authority_id]
      properties:
        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website]
          default: website
        document_family:
          type: string

    FirecrawlAcquisitionSpec:
      type: object
      additionalProperties: false
      properties:
        seed_url:
          type: string
          format: uri
        seed_urls:
          type: array
          items:
            type: string
            format: uri
        mode:
          type: string
          enum: [crawl, batch_scrape]
          default: crawl
        include_paths:
          type: array
          items:
            type: string
        exclude_paths:
          type: array
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 20
        max_discovery_depth:
          type: integer
          minimum: 0
          maximum: 10
          default: 2
        scrape_formats:
          type: array
          items:
            type: string
          default: [markdown, html]
        zero_data_retention:
          type: boolean
          default: false

    SourceVersion:
      type: object
      required:
        - source_version_id
        - source_id
        - version_label
        - status
        - acquisition_spec
        - created_at
        - updated_at
      properties:
        source_version_id:
          type: string
          pattern: "^sv_[a-z0-9]+$"
          example: sv_01hzxk8a2bmne6g4r7j3k9l5
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
        extractor_profile_id:
          type: string
          pattern: "^exp_[a-z0-9]+$"
        version_label:
          type: string
        status:
          type: string
          enum: [draft, pending_approval, approved, rejected, superseded]
        acquisition_spec:
          $ref: "#/components/schemas/FirecrawlAcquisitionSpec"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceVersionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SourceVersion"

    CreateSourceVersionRequest:
      type: object
      required: [version_label, acquisition_spec]
      properties:
        version_label:
          type: string
        extractor_profile_id:
          type: string
          pattern: "^exp_[a-z0-9]+$"
        acquisition_spec:
          $ref: "#/components/schemas/FirecrawlAcquisitionSpec"

    Run:
      type: object
      required:
        - run_id
        - source_id
        - source_version_id
        - mode
        - status
        - artifacts_count
        - captured_resources_count
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          pattern: "^run_[a-z0-9]+$"
          example: run_01hzxk9c4dnpf8h6t2m5q7w3
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
        source_version_id:
          type: string
          pattern: "^sv_[a-z0-9]+$"
        mode:
          type: string
          enum: [preview, production]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        artifacts_count:
          type: integer
        captured_resources_count:
          type: integer
        failure_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRunRequest:
      type: object
      required: [source_id, source_version_id]
      properties:
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
        source_version_id:
          type: string
          pattern: "^sv_[a-z0-9]+$"
        mode:
          type: string
          enum: [preview, production]
          default: preview

    ProcessingStatusUpdate:
      type: object
      required:
        - event_id
        - processing_manifest_id
        - processing_version
        - status
        - occurred_at
        - created_at
        - updated_at
      properties:
        event_id:
          type: string
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        processing_version:
          type: string
        status:
          type: string
          enum:
            - accepted
            - processing
            - canonical_ready
            - failed
            - withdrawn
            - skipped_duplicate
        occurred_at:
          type: string
          format: date-time
        source_snapshot_id:
          oneOf:
            - type: string
              pattern: "^snap_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        bundle_manifest_id:
          oneOf:
            - type: string
              pattern: "^abm_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        document_id:
          oneOf:
            - type: string
              pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        document_revision:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
        error_code:
          oneOf:
            - type: string
            - type: "null"
        error_summary:
          oneOf:
            - type: string
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProcessingStatusUpdateListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingStatusUpdate"

    ProcessingStatusProvenance:
      type: object
      required:
        - tenant_id
        - corpus_id
        - scope_type
        - source_id
        - source_version_id
        - run_id
      properties:
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
        corpus_id:
          type: string
          pattern: "^corpus_[a-z0-9_]+$"
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
        source_id:
          type: string
          pattern: "^src_[0-9a-hjkmnp-tv-z]{26}$"
        source_version_id:
          type: string
          pattern: "^sv_[0-9a-hjkmnp-tv-z]{26}$"
        run_id:
          type: string
          pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
        source_snapshot_id:
          oneOf:
            - type: string
              pattern: "^snap_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        bundle_manifest_id:
          oneOf:
            - type: string
              pattern: "^abm_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        artifact_id:
          oneOf:
            - type: string
              pattern: "^art_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        document_id:
          oneOf:
            - type: string
              pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        document_revision:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
        processing_manifest_id:
          oneOf:
            - type: string
              pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
      additionalProperties: false

    DocumentProcessingStatusPayload:
      type: object
      required:
        - processing_manifest_id
        - provenance
        - processing_version
        - status
      properties:
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        provenance:
          $ref: "#/components/schemas/ProcessingStatusProvenance"
        processing_version:
          type: string
        status:
          type: string
          enum:
            - accepted
            - processing
            - canonical_ready
            - failed
            - withdrawn
            - skipped_duplicate
        error_code:
          oneOf:
            - type: string
            - type: "null"
        error_summary:
          oneOf:
            - type: string
            - type: "null"
      allOf:
        - if:
            properties:
              status:
                const: failed
            required: [status]
          then:
            required: [error_code, error_summary]
            properties:
              error_code:
                type: string
                minLength: 1
              error_summary:
                type: string
                minLength: 1
          else:
            properties:
              error_code:
                type: "null"
              error_summary:
                type: "null"
      additionalProperties: false

    DocumentProcessingStatusUpdatedEvent:
      type: object
      required:
        - event_type
        - event_version
        - event_id
        - occurred_at
        - producer
        - payload
      properties:
        event_type:
          type: string
          const: document.processing_status.updated
        event_version:
          type: integer
          const: 1
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
          const: document-intelligence
        correlation_id:
          type: string
        causation_id:
          type: string
        payload:
          $ref: "#/components/schemas/DocumentProcessingStatusPayload"
      additionalProperties: false

    DatasetRef:
      type: object
      required: [surface_name, surface_version]
      properties:
        surface_name:
          type: string
        surface_version:
          type: integer
          minimum: 1
        record_key:
          type: object
          additionalProperties: true
        record_filter:
          type: object
          additionalProperties: true
      additionalProperties: false

    ManifestRef:
      type: object
      required: [manifest_id, manifest_type, manifest_version, dataset_ref]
      properties:
        manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        manifest_type:
          type: string
        manifest_version:
          type: integer
          minimum: 1
        dataset_ref:
          $ref: "#/components/schemas/DatasetRef"
      additionalProperties: false

    DocumentProcessedPayload:
      type: object
      required:
        - document_id
        - document_revision
        - processing_manifest_id
        - processing_version
        - provenance
        - lifecycle_status
        - published_document_ref
        - published_sections_ref
        - processing_manifest_ref
      properties:
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        processing_version:
          type: string
        provenance:
          $ref: "#/components/schemas/ProcessingStatusProvenance"
        lifecycle_status:
          type: string
          enum: [active, superseded, repealed, withdrawn]
        published_document_ref:
          $ref: "#/components/schemas/DatasetRef"
        published_sections_ref:
          $ref: "#/components/schemas/DatasetRef"
        processing_manifest_ref:
          $ref: "#/components/schemas/ManifestRef"
        supersedes_processing_manifest_id:
          oneOf:
            - type: string
              pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
      additionalProperties: false

    DocumentProcessedEvent:
      type: object
      required:
        - event_type
        - event_version
        - event_id
        - occurred_at
        - producer
        - payload
      properties:
        event_type:
          type: string
          const: document.processed
        event_version:
          type: integer
          const: 1
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
          const: document-intelligence
        correlation_id:
          type: string
          pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
        causation_id:
          type: string
        payload:
          $ref: "#/components/schemas/DocumentProcessedPayload"
      additionalProperties: false

    DocumentWithdrawnPayload:
      type: object
      required:
        - document_id
        - document_revision
        - processing_manifest_id
        - provenance
        - reason_code
        - search_disposition
      properties:
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        provenance:
          $ref: "#/components/schemas/ProcessingStatusProvenance"
        reason_code:
          type: string
          enum: [duplicate, invalid_source, rights_restricted, operator_withdrawn]
        reason_summary:
          oneOf:
            - type: string
            - type: "null"
        search_disposition:
          type: string
          enum: [remove, hide]
      additionalProperties: false

    DocumentWithdrawnEvent:
      type: object
      required:
        - event_type
        - event_version
        - event_id
        - occurred_at
        - producer
        - payload
      properties:
        event_type:
          type: string
          const: document.withdrawn
        event_version:
          type: integer
          const: 1
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
          const: document-intelligence
        correlation_id:
          type: string
          pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
        causation_id:
          type: string
        payload:
          $ref: "#/components/schemas/DocumentWithdrawnPayload"
      additionalProperties: false

    DocumentLifecycleEvent:
      type: object
      required:
        - event_id
        - event_type
        - run_id
        - document_id
        - document_revision
        - processing_manifest_id
        - occurred_at
        - created_at
        - updated_at
      properties:
        event_id:
          type: string
        event_type:
          type: string
          enum: [document.processed, document.withdrawn]
        run_id:
          type: string
          pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        processing_version:
          oneOf:
            - type: string
            - type: "null"
        lifecycle_status:
          oneOf:
            - type: string
              enum: [active, superseded, repealed, withdrawn]
            - type: "null"
        reason_code:
          oneOf:
            - type: string
              enum: [duplicate, invalid_source, rights_restricted, operator_withdrawn]
            - type: "null"
        reason_summary:
          oneOf:
            - type: string
            - type: "null"
        search_disposition:
          oneOf:
            - type: string
              enum: [remove, hide]
            - type: "null"
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

