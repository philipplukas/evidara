    # ─── Commentary insights (HITL Foundation, see #420 / #423) ───
    # The wire shape mirrors contracts/schemas/commentary-insight.schema.json.
    # Keep the two in sync; the JSON Schema is the source of truth for downstream
    # producers (document-intelligence) while this OpenAPI shape is what the
    # platform-control admin UI consumes.
    CommentaryInsight:
      type: object
      required:
        - insight_id
        - document_id
        - document_revision
        - processing_manifest_id
        - insight_type
        - claim
        - display_text
        - support
        - referenced_authorities
        - confidence
        - review_state
        - generator
        - scores
      properties:
        insight_id:
          type: string
          pattern: "^ins_[0-9a-hjkmnp-tv-z]{26}$"
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        section_id:
          oneOf:
            - type: string
              pattern: "^sec_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        citation_id:
          oneOf:
            - type: string
              pattern: "^cit_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        insight_type:
          type: string
          enum: [commentary_anchor, referenced_provision, authority_link]
        claim:
          type: string
          minLength: 1
        display_text:
          type: string
          minLength: 1
          description: Source passage snippet only. Never generated legal prose.
        support:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CommentaryInsightEvidenceRef"
        referenced_authorities:
          type: array
          items:
            $ref: "#/components/schemas/CommentaryInsightReferencedAuthority"
        language:
          oneOf:
            - type: string
              pattern: "^[a-z]{2}$"
            - type: "null"
        jurisdiction_id:
          oneOf:
            - type: string
              pattern: "^jur_[a-z0-9_]+$"
            - type: "null"
        jurisdiction_ids:
          type: array
          items:
            type: string
            pattern: "^jur_[a-z0-9_]+$"
          default: []
        authority_ids:
          type: array
          items:
            type: string
            pattern: "^auth_[a-z0-9_]+$"
          default: []
        source_document_ids:
          type: array
          items:
            type: string
            pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
          default: []
        last_correction_id:
          oneOf:
            - type: string
              pattern: "^cor_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        review_state:
          type: string
          enum:
            - machine_generated_unreviewed
            - machine_verified
            - editor_approved
            - rejected
            - stale
        generator:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              minLength: 1
            version:
              type: string
              minLength: 1
            model:
              oneOf:
                - type: string
                - type: "null"
            prompt_version:
              oneOf:
                - type: string
                - type: "null"
        scores:
          type: object
          required:
            - passage_present
            - citation_parseable
            - section_anchor_resolved
          properties:
            passage_present:
              type: number
              minimum: 0.0
              maximum: 1.0
            citation_parseable:
              type: number
              minimum: 0.0
              maximum: 1.0
            section_anchor_resolved:
              type: number
              minimum: 0.0
              maximum: 1.0
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    CommentaryInsightEvidenceRef:
      type: object
      description: Mirrors `contracts/schemas/evidence-ref.schema.json`. Inlined here because the OpenAPI surface is self-contained.
      required: [document_id, ref_type]
      properties:
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        section_id:
          oneOf:
            - type: string
              pattern: "^sec_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        citation_id:
          oneOf:
            - type: string
              pattern: "^cit_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        ref_type:
          type: string
          enum: [passage, citation, section, authority]
        passage:
          type: string
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        metadata:
          type: object
          additionalProperties: true

    CommentaryInsightReferencedAuthority:
      type: object
      required: [text, citation_type]
      properties:
        text:
          type: string
          minLength: 1
        citation_type:
          type: string
          minLength: 1
        normalized_reference:
          type: string
        metadata:
          type: object
          additionalProperties: true

    CommentaryInsightListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CommentaryInsight"
        total:
          type: integer
          nullable: true
        limit:
          type: integer
          nullable: true
        offset:
          type: integer
          nullable: true

    EditCommentaryInsightRequest:
      type: object
      required: [payload, rationale]
      description: |
        Request body for `PATCH /v1/commentary-insights/{insight_id}`. The server constructs a
        `field_edit` correction envelope from these fields plus the resolved operator identity,
        and returns the post-overlay insight together with the persisted correction.
      properties:
        payload:
          type: object
          description: |
            Map of `field_path: new_value` representing the operator's edits. Only fields whitelisted
            for operator overlay (e.g. `claim`, `display_text`, `review_state`, `referenced_authorities`)
            are accepted; submissions targeting other fields return 400.
          additionalProperties: true
        original_snapshot:
          type: object
          description: Pre-edit values for the same field paths. Required for diff display and revert.
          additionalProperties: true
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
        pipeline_run_id:
          oneOf:
            - type: string
              pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"

    EditCommentaryInsightResponse:
      type: object
      required: [insight, correction]
      properties:
        insight:
          $ref: "#/components/schemas/CommentaryInsight"
        correction:
          $ref: "#/components/schemas/Correction"

    # ─── Correction envelope (HITL Foundation, see #420 / #423) ───
    # Mirrors contracts/schemas/corrections.json. The JSON Schema is the source of truth.
    Correction:
      type: object
      required:
        - correction_id
        - target_entity_type
        - target_entity_id
        - correction_type
        - payload
        - operator_id
        - rationale
        - status
        - created_at
      properties:
        correction_id:
          type: string
          pattern: "^cor_[0-9a-hjkmnp-tv-z]{26}$"
        target_entity_type:
          type: string
          enum: [commentary_insight, search_projection, document, section, citation]
        target_entity_id:
          type: string
          minLength: 1
        correction_type:
          type: string
          enum: [field_edit, annotation, reject, rescore_request]
        payload:
          type: object
          additionalProperties: true
        original_snapshot:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        operator_id:
          type: string
          minLength: 1
        pipeline_run_id:
          oneOf:
            - type: string
              pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
            - type: "null"
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          type: string
          enum: [pending, applied, rejected, superseded]
        created_at:
          type: string
          format: date-time
        applied_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    CorrectionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Correction"
        total:
          type: integer
          nullable: true
        limit:
          type: integer
          nullable: true
        offset:
          type: integer
          nullable: true
