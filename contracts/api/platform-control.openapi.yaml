      type: object
      required:
        - processing_manifest_id
        - provenance
        - processing_version
        - status
      properties:
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        provenance:
          $ref: "#/components/schemas/ProcessingStatusProvenance"
        processing_version:
          type: string
        status:
          type: string
          enum:
            - accepted
