openapi: 3.1.0
info:
  title: Platform Control API
  description: |
    API for managing sources, source versions, runs, approvals, and provider webhooks
    in the Evidara platform control plane.
  version: 0.5.0
  contact:
    name: Evidara Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://platform-control.evidara.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: reference-data
  - name: sources
  - name: source-versions
  - name: runs
  - name: wizard
  - name: reviews
  - name: corpora
    description: |
      First-class corpus and tenant/scope management.  A corpus groups source versions
      under a shared ``tenant_id`` and ``scope_type`` identity.  Operators create corpora
      here and reference them by ``corpus_id`` in acquisition configs.
  - name: di-events
  - name: firecrawl
  - name: commentary-insights
    description: |
      Operator read/write surface for non-canonical commentary insights produced by document-intelligence.
      Edits are persisted as `field_edit` corrections (see `corrections`) and applied as overlays on top of
      the immutable DI output. See HITL Foundation milestone (#420) and Sprint 0 contract gate (#423).
  - name: corrections
    description: |
      Operator queue and detail surface for the correction envelope. Corrections are append-only;
      mutating operations live behind tag `commentary-insights` (and downstream entity-specific tags)
      so the queue here stays a read-only worklist.
  - name: health
  - name: agent-discovery
    description: |
      Read-only operations commonly used by operators and agents for discovery and evidence
      (`evidara openapi tags`, MVP acceptance, smoke matrices). Does not imply mutating workflow APIs.

paths:
  /v1/reference-data/jurisdictions:
    get:
      operationId: listJurisdictions
      summary: List jurisdictions for operator setup flows
      tags: [reference-data]
      responses:
        "200":
          description: List of jurisdictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionListResponse"
    post:
      operationId: createJurisdiction
      summary: Create a jurisdiction
      tags: [reference-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJurisdictionRequest"
      responses:
        "201":
          description: Jurisdiction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"

  /v1/reference-data/jurisdictions/{jurisdiction_id}:
    patch:
      operationId: updateJurisdiction
      summary: Update a jurisdiction
      tags: [reference-data]
      parameters:
        - name: jurisdiction_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^jur_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJurisdictionRequest"
      responses:
        "200":
          description: Jurisdiction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"
        "404":
          description: Jurisdiction not found

  /v1/reference-data/authorities:
    get:
      operationId: listAuthorities
      summary: List authorities for operator setup flows
      tags: [reference-data]
      responses:
        "200":
          description: List of authorities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityListResponse"
    post:
      operationId: createAuthority
      summary: Create an authority
      tags: [reference-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthorityRequest"
      responses:
        "201":
          description: Authority created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authority"
        "404":
          description: Jurisdiction not found

  /v1/reference-data/authorities/{authority_id}:
    patch:
      operationId: updateAuthority
      summary: Update an authority
      tags: [reference-data]
      parameters:
        - name: authority_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^auth_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthorityRequest"
      responses:
        "200":
          description: Authority updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authority"
        "404":
          description: Authority or jurisdiction not found

  /v1/sources:
    get:
      operationId: listSources
      summary: List all sources
      tags: [sources, agent-discovery]
      responses:
        "200":
          description: List of sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceListResponse"
    post:
      operationId: createSource
      summary: Create a new source
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Reference data not found

  /v1/sources/with-version:
    post:
      operationId: createSourceWithInitialVersion
      summary: Create source and initial version in one transaction
      tags: [sources, source-versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceWithVersionRequest"
      responses:
        "201":
          description: Source and initial version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSourceWithVersionResponse"
        "404":
          description: Reference data, extractor profile, or blueprint key not found
        "422":
          description: Invalid request payload

  /v1/sources/blueprint-preview:
    post:
      operationId: previewSourceBlueprint
      summary: Expand overlay/template into validated acquisition spec
      tags: [sources, source-versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceBlueprintPreviewRequest"
      responses:
        "200":
          description: Expanded acquisition spec preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBlueprintPreviewResponse"
        "404":
          description: Unknown overlay or provider template
        "422":
          description: Invalid request payload

  /v1/sources/blueprint-templates:
    get:
      operationId: listSourceBlueprintTemplates
      summary: List available overlay/template combinations for source wizard
      tags: [sources, source-versions]
      responses:
        "200":
          description: Available blueprint templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBlueprintTemplateListResponse"

  /v1/sources/{source_id}:
    get:
      operationId: getSource
      summary: Get a source by ID
      tags: [sources]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Source not found

  /v1/sources/{source_id}/versions:
    get:
      operationId: listSourceVersions
      summary: List versions of a source
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: List of source versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersionListResponse"
        "404":
          description: Source not found
    post:
      operationId: createSourceVersion
      summary: Create a new source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceVersionRequest"
      responses:
        "201":
          description: Source version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source or extractor profile not found
        "422":
          description: Invalid request payload

  /v1/versions/{source_version_id}/approve:
    post:
      operationId: approveSourceVersion
      summary: Approve a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/versions/{source_version_id}:
    patch:
      operationId: updateSourceVersion
      summary: Update a draft or rejected source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceVersionRequest"
      responses:
        "200":
          description: Source version updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version or extractor profile not found
        "409":
          description: Invalid source version state transition

  /v1/versions/{source_version_id}/reject:
    post:
      operationId: rejectSourceVersion
      summary: Reject a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/runs:
    get:
      operationId: listRuns
      summary: List preview and production runs for operator review
      tags: [runs, agent-discovery]
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [preview, production]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
      responses:
        "200":
          description: Runs matching the requested filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
    post:
      operationId: createRun
      summary: Trigger a new preview or production run
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Source or source version not found
        "409":
          description: Invalid run request for the current source version state

  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Get run status
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found

  /v1/runs/{run_id}/captured-resources:
    get:
      operationId: listRunCapturedResources
      summary: List captured resources recorded for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Captured resources for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturedResourceListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/raw-artifacts:
    get:
      operationId: listRunRawArtifacts
      summary: List raw artifacts captured for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Raw artifacts for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawArtifactListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/provider-jobs:
    get:
      operationId: listRunProviderJobs
      summary: List provider job diagnostics for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Provider jobs for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderJobListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel a pending or running run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found
        "409":
          description: Invalid run state transition

  /v1/runs/{run_id}/preview-summary:
    get:
      operationId: getRunPreviewSummary
      summary: Summarize captured preview output for operator review
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Preview summary for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPreviewSummary"
        "404":
          description: Run not found

  /v1/runs/{run_id}/processing-status:
    get:
      operationId: listRunProcessingStatus
      summary: List DI processing status updates for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Processing status updates for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStatusUpdateListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/document-lifecycle:
    get:
      operationId: listRunDocumentLifecycle
      summary: List document processed/withdrawn lifecycle events for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Document lifecycle events for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLifecycleEventListResponse"
        "404":
          description: Run not found

  /v1/wizard/projects:
    post:
      operationId: createWizardProject
      summary: Create a wizard project
      tags: [wizard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWizardProjectRequest"
      responses:
        "201":
          description: Wizard project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProject"

  /v1/wizard/projects/{project_id}:
    get:
      operationId: getWizardProject
      summary: Get wizard project details
      tags: [wizard, agent-discovery]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wpr_[a-z0-9]+$"
      responses:
        "200":
          description: Wizard project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProject"
        "404":
          description: Wizard project not found

  /v1/wizard/projects/{project_id}/scope:
    post:
      operationId: saveWizardScope
      summary: Save wizard scope and advance to discovery planning
      tags: [wizard]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wpr_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWizardScopeRequest"
      responses:
        "200":
          description: Wizard project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProject"
        "409":
          description: Invalid wizard state transition

  /v1/wizard/projects/{project_id}/discovery-plan:
    post:
      operationId: saveWizardDiscoveryPlan
      summary: Save or update wizard discovery plan
      tags: [wizard]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wpr_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWizardDiscoveryPlanRequest"
      responses:
        "200":
          description: Wizard project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProject"

  /v1/wizard/projects/{project_id}/pilot-run:
    post:
      operationId: startWizardPilotRun
      summary: Start wizard pilot run
      tags: [wizard]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wpr_[a-z0-9]+$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartWizardPilotRunRequest"
      responses:
        "200":
          description: Wizard run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardRunStatus"
        "409":
          description: Invalid wizard state transition

  /v1/wizard/runs/{run_id}:
    get:
      operationId: getWizardRun
      summary: Get wizard run status
      tags: [wizard]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wrn_[a-z0-9]+$"
      responses:
        "200":
          description: Wizard run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardRunStatus"
        "404":
          description: Wizard run not found

  /v1/wizard/runs/{run_id}/approve:
    post:
      operationId: approveWizardRun
      summary: Approve wizard gate transition
      tags: [wizard]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wrn_[a-z0-9]+$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WizardRunDecisionRequest"
      responses:
        "200":
          description: Wizard run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardRunStatus"
        "409":
          description: Invalid wizard state transition

  /v1/wizard/runs/{run_id}/reject:
    post:
      operationId: rejectWizardRun
      summary: Reject wizard gate transition and return to discovery planning
      tags: [wizard]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wrn_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WizardRunDecisionRequest"
      responses:
        "200":
          description: Wizard run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardRunStatus"
        "409":
          description: Invalid wizard state transition

  /v1/reviews/sync-from-argilla:
    post:
      operationId: syncReviewsFromArgilla
      summary: Ingest Argilla review outcomes
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArgillaReviewSyncRequest"
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArgillaReviewSyncResponse"

  /v1/reviews/tasks:
    post:
      operationId: createReviewTask
      summary: Create a review task and enqueue it to Argilla when configured
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewTaskRequest"
      responses:
        "201":
          description: Review task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewTaskResponse"
        "404":
          description: Wizard run not found
        "409":
          description: Duplicate Argilla external_id

  /v1/reviews/tasks/{task_id}:
    get:
      operationId: getReviewTask
      summary: Get a synced review task
      tags: [reviews]
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wrt_[a-z0-9]+$"
      responses:
        "200":
          description: Review task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTask"
        "404":
          description: Review task not found

  /v1/di/events/document-processing-status-updated:
    post:
      operationId: receiveDocumentProcessingStatusUpdated
      summary: Ingest processing status events emitted by document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentProcessingStatusUpdatedEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/di/events/document-processed:
    post:
      operationId: receiveDocumentProcessed
      summary: Ingest canonical-ready document publication events from document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentProcessedEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/di/events/document-withdrawn:
    post:
      operationId: receiveDocumentWithdrawn
      summary: Ingest document withdrawal events from document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentWithdrawnEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/firecrawl/webhooks:
    post:
      operationId: receiveFirecrawlWebhook
      summary: Receive Firecrawl provider callbacks
      tags: [firecrawl]
      security: []
      parameters:
        - name: X-Firecrawl-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature for the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirecrawlWebhookEvent"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcceptedResponse"
        "401":
          description: Signature verification failed

  /v1/corpora:
    get:
      operationId: listCorpora
      summary: List corpora
      tags: [corpora]
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of corpora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusListResponse"
    post:
      operationId: createCorpus
      summary: Create a corpus
      tags: [corpora]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCorpusRequest"
      responses:
        "201":
          description: Corpus created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusResponse"
        "409":
          description: Active corpus with this name already exists for the tenant

  /v1/corpora/{corpus_id}:
    get:
      operationId: getCorpus
      summary: Get a corpus by ID
      tags: [corpora]
      parameters:
        - name: corpus_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^cps_[a-z0-9]+$"
      responses:
        "200":
          description: Corpus details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusResponse"
        "404":
          description: Corpus not found
    patch:
      operationId: updateCorpus
      summary: Update corpus name, description, or scope_type
      tags: [corpora]
      parameters:
        - name: corpus_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^cps_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCorpusRequest"
      responses:
        "200":
          description: Corpus updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusResponse"
        "404":
          description: Corpus not found
        "409":
