openapi: 3.1.0
info:
  title: Platform Control API
  description: |
    API for managing sources, source versions, runs, approvals, and provider webhooks
    in the Evidara platform control plane.
  version: 0.3.1
  contact:
    name: Evidara Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://platform-control.evidara.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: reference-data
  - name: sources
  - name: source-versions
  - name: runs
  - name: di-events
  - name: firecrawl
  - name: health

paths:
  /v1/reference-data/jurisdictions:
    get:
      operationId: listJurisdictions
      summary: List jurisdictions for operator setup flows
      tags: [reference-data]
      responses:
        "200":
          description: List of jurisdictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionListResponse"
    post:
      operationId: createJurisdiction
      summary: Create a jurisdiction
      tags: [reference-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJurisdictionRequest"
      responses:
        "201":
          description: Jurisdiction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"

  /v1/reference-data/jurisdictions/{jurisdiction_id}:
    patch:
      operationId: updateJurisdiction
      summary: Update a jurisdiction
      tags: [reference-data]
      parameters:
        - name: jurisdiction_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^jur_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJurisdictionRequest"
      responses:
        "200":
          description: Jurisdiction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"
        "404":
          description: Jurisdiction not found

  /v1/reference-data/authorities:
    get:
      operationId: listAuthorities
      summary: List authorities for operator setup flows
      tags: [reference-data]
      responses:
        "200":
          description: List of authorities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityListResponse"
    post:
      operationId: createAuthority
      summary: Create an authority
      tags: [reference-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthorityRequest"
      responses:
        "201":
          description: Authority created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authority"
        "404":
          description: Jurisdiction not found

  /v1/reference-data/authorities/{authority_id}:
    patch:
      operationId: updateAuthority
      summary: Update an authority
      tags: [reference-data]
      parameters:
        - name: authority_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^auth_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthorityRequest"
      responses:
        "200":
          description: Authority updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authority"
        "404":
          description: Authority or jurisdiction not found

  /v1/sources:
    get:
      operationId: listSources
      summary: List all sources
      tags: [sources]
      responses:
        "200":
          description: List of sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceListResponse"
    post:
      operationId: createSource
      summary: Create a new source
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Reference data not found

  /v1/sources/with-version:
    post:
      operationId: createSourceWithInitialVersion
      summary: Create source and initial version in one transaction
      tags: [sources, source-versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceWithVersionRequest"
      responses:
        "201":
          description: Source and initial version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSourceWithVersionResponse"
        "404":
          description: Reference data, extractor profile, or blueprint key not found
        "422":
          description: Invalid request payload

  /v1/sources/blueprint-preview:
    post:
      operationId: previewSourceBlueprint
      summary: Expand overlay/template into validated acquisition spec
      tags: [sources, source-versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceBlueprintPreviewRequest"
      responses:
        "200":
          description: Expanded acquisition spec preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBlueprintPreviewResponse"
        "404":
          description: Unknown overlay or provider template
        "422":
          description: Invalid request payload

  /v1/sources/blueprint-templates:
    get:
      operationId: listSourceBlueprintTemplates
      summary: List available overlay/template combinations for source wizard
      tags: [sources, source-versions]
      responses:
        "200":
          description: Available blueprint templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBlueprintTemplateListResponse"

  /v1/sources/{source_id}:
    get:
      operationId: getSource
      summary: Get a source by ID
      tags: [sources]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Source not found

  /v1/sources/{source_id}/versions:
    get:
      operationId: listSourceVersions
      summary: List versions of a source
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: List of source versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersionListResponse"
        "404":
          description: Source not found
    post:
      operationId: createSourceVersion
      summary: Create a new source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceVersionRequest"
      responses:
        "201":
          description: Source version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source or extractor profile not found
        "422":
          description: Invalid request payload

  /v1/versions/{source_version_id}/approve:
    post:
      operationId: approveSourceVersion
      summary: Approve a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/versions/{source_version_id}:
    patch:
      operationId: updateSourceVersion
      summary: Update a draft or rejected source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceVersionRequest"
      responses:
        "200":
          description: Source version updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version or extractor profile not found
        "409":
          description: Invalid source version state transition

  /v1/versions/{source_version_id}/reject:
    post:
      operationId: rejectSourceVersion
      summary: Reject a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/runs:
    get:
      operationId: listRuns
      summary: List preview and production runs for operator review
      tags: [runs]
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [preview, production]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
      responses:
        "200":
          description: Runs matching the requested filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
    post:
      operationId: createRun
      summary: Trigger a new preview or production run
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Source or source version not found
        "409":
          description: Invalid run request for the current source version state

  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Get run status
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found

  /v1/runs/{run_id}/captured-resources:
    get:
      operationId: listRunCapturedResources
      summary: List captured resources recorded for a run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Captured resources for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturedResourceListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/raw-artifacts:
    get:
      operationId: listRunRawArtifacts
      summary: List raw artifacts captured for a run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Raw artifacts for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawArtifactListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/provider-jobs:
    get:
      operationId: listRunProviderJobs
      summary: List provider job diagnostics for a run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Provider jobs for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderJobListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel a pending or running run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found
        "409":
          description: Invalid run state transition

  /v1/runs/{run_id}/preview-summary:
    get:
      operationId: getRunPreviewSummary
      summary: Summarize captured preview output for operator review
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Preview summary for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPreviewSummary"
        "404":
          description: Run not found

  /v1/runs/{run_id}/processing-status:
    get:
      operationId: listRunProcessingStatus
      summary: List DI processing status updates for a run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Processing status updates for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStatusUpdateListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/document-lifecycle:
    get:
      operationId: listRunDocumentLifecycle
      summary: List document processed/withdrawn lifecycle events for a run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Document lifecycle events for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLifecycleEventListResponse"
        "404":
          description: Run not found

  /v1/di/events/document-processing-status-updated:
    post:
      operationId: receiveDocumentProcessingStatusUpdated
      summary: Ingest processing status events emitted by document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentProcessingStatusUpdatedEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/di/events/document-processed:
    post:
      operationId: receiveDocumentProcessed
      summary: Ingest canonical-ready document publication events from document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentProcessedEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/di/events/document-withdrawn:
    post:
      operationId: receiveDocumentWithdrawn
      summary: Ingest document withdrawal events from document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentWithdrawnEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/firecrawl/webhooks:
    post:
      operationId: receiveFirecrawlWebhook
      summary: Receive Firecrawl provider callbacks
      tags: [firecrawl]
      security: []
      parameters:
        - name: X-Firecrawl-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature for the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirecrawlWebhookEvent"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcceptedResponse"
        "401":
          description: Signature verification failed

  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReadiness
      summary: Deep readiness check
      tags: [health]
      security: []
      responses:
        "200":
          description: All critical dependencies are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one critical dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the identity provider.

  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^src_[a-z0-9]+$"
    SourceVersionId:
      name: source_version_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^sv_[a-z0-9]+$"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^run_[a-z0-9]+$"
    RunScopedListLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return for this run-scoped list.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    RunScopedListOffset:
      name: offset
      in: query
      required: false
      description: Number of items to skip before returning results.
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    Jurisdiction:
      type: object
      required: [jurisdiction_id, name, slug, created_at, updated_at]
      properties:
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JurisdictionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Jurisdiction"

    CreateJurisdictionRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string

    UpdateJurisdictionRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        slug:
          type: string

    Authority:
      type: object
      required: [authority_id, name, slug, created_at, updated_at]
      properties:
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        jurisdiction_id:
          oneOf:
            - type: string
              pattern: "^jur_[a-z0-9]+$"
            - type: "null"
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthorityListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Authority"

    CreateAuthorityRequest:
      type: object
      required: [name, slug]
      properties:
        jurisdiction_id:
          oneOf:
            - type: string
              pattern: "^jur_[a-z0-9]+$"
            - type: "null"
        name:
          type: string
        slug:
          type: string

    UpdateAuthorityRequest:
      type: object
      minProperties: 1
      properties:
        jurisdiction_id:
          oneOf:
            - type: string
              pattern: "^jur_[a-z0-9]+$"
            - type: "null"
        name:
          type: string
        slug:
          type: string

    Source:
      type: object
      required:
        - source_id
        - name
        - jurisdiction_id
        - authority_id
        - source_type
        - status
        - created_at
        - updated_at
      properties:
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
          example: src_01hzxk7v3qmjy4t5n2p8r6w9
        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website, api]
        document_family:
          type: string
        status:
          type: string
          enum: [active, inactive, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    CreateSourceRequest:
      type: object
      required: [name, jurisdiction_id, authority_id]
      properties:
        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website, api]
          default: website
        document_family:
          type: string

    FirecrawlAcquisitionSpec:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [firecrawl]
        seed_url:
          type: string
          format: uri
        seed_urls:
          type: array
          items:
            type: string
            format: uri
        mode:
          type: string
          enum: [crawl, batch_scrape]
          default: crawl
        include_paths:
          type: array
          items:
            type: string
        exclude_paths:
          type: array
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 20
        max_discovery_depth:
          type: integer
          minimum: 0
          maximum: 10
          default: 2
        scrape_formats:
          type: array
          items:
            type: string
          default: [markdown, html]
        zero_data_retention:
          type: boolean
          default: false
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
          default: tenant_public
        corpus_id:
          type: string
          pattern: "^corpus_[a-z0-9_]+$"
          default: corpus_public_default
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          default: global_public
        source_origin_kind:
          type: string
          enum:
            [
              official_primary,
              official_mirror,
              licensed_provider,
              community_curated,
              tenant_internal,
            ]
          default: official_primary
        trust_tier:
          type: string
          enum: [authoritative, preferred, supplemental, untrusted]
          default: authoritative
        language_codes:
          type: array
          items:
            type: string
            pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
          default: []
        document_type_hint:
          type: string

    DeterministicHttpAcquisitionSpec:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [deterministic_http]
        seed_url:
          oneOf:
            - type: string
              format: uri
            - type: "null"
        seed_urls:
          type: array
          items:
            type: string
            format: uri
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
          default: tenant_public
        corpus_id:
          type: string
          pattern: "^corpus_[a-z0-9_]+$"
          default: corpus_public_default
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          default: global_public
        source_origin_kind:
          type: string
          enum:
            [
              official_primary,
              official_mirror,
              licensed_provider,
              community_curated,
              tenant_internal,
            ]
          default: official_primary
        trust_tier:
          type: string
          enum: [authoritative, preferred, supplemental, untrusted]
          default: authoritative
        language_codes:
          type: array
          items:
            type: string
            pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
          default: []
        document_type_hint:
          type: string

    RisOgdAcquisitionSpec:
      type: object
      additionalProperties: false
