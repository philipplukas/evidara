    ReadinessResponse:
      type: object
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DependencyCheck"

    Correction:
      type: object
      description: |
        HITL correction record. Mirrors `contracts/schemas/corrections.json`.
        See that schema for the canonical wire shape; this OpenAPI definition is
        kept in sync for code-generation and Swagger UI rendering.
      required:
        - correction_id
        - target_entity_type
        - target_entity_id
        - correction_type
        - payload
        - status
        - operator_id
        - rationale
        - original_snapshot
        - pipeline_run_id
        - applied_at
        - created_at
      properties:
        correction_id:
          type: string
          pattern: "^cor_[a-z0-9]+$"
        target_entity_type:
          type: string
          enum: [source, document, commentary_insight]
        target_entity_id:
          type: string
          minLength: 1
        correction_type:
          type: string
          enum: [field_edit, annotation, reject, rescore_request]
        payload:
          type: object
          additionalProperties: true
        original_snapshot:
          type: object
          nullable: true
          additionalProperties: true
        operator_id:
          type: string
          pattern: "^op_[a-z0-9]+$"
        pipeline_run_id:
          type: string
          nullable: true
          pattern: "^run_[a-z0-9]+$"
        rationale:
          type: string
          nullable: true
          maxLength: 2000
        status:
          type: string
          enum: [pending, applied, rejected, superseded]
        created_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true

    CreateCorrectionRequest:
      type: object
      required:
        - target_entity_type
        - target_entity_id
        - correction_type
        - payload
      properties:
        target_entity_type:
          type: string
          enum: [source, document, commentary_insight]
        target_entity_id:
          type: string
          minLength: 1
        correction_type:
          type: string
          enum: [field_edit, annotation, reject, rescore_request]
        payload:
          type: object
          additionalProperties: true
        original_snapshot:
          type: object
          nullable: true
          additionalProperties: true
        pipeline_run_id:
          type: string
          nullable: true
          pattern: "^run_[a-z0-9]+$"
        rationale:
          type: string
          nullable: true
          maxLength: 2000

    UpdateCorrectionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [applied, rejected, superseded]
          description: Target status. The server enforces legal transitions from the current status.
        rationale:
          type: string
          nullable: true
          maxLength: 2000
          description: Operator rationale for the transition. Required by application policy when rejecting.

    CorrectionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Correction"
        total:
          type: integer
          nullable: true
        limit:
          type: integer
          nullable: true
        offset:
          type: integer
          nullable: true

    CommentaryInsight:
      type: object
      description: |
        Operator-facing commentary insight overlay. Mirrors
        `contracts/schemas/commentary-insight.schema.json` plus the
        overlay fields (`overlay_revision`, `last_correction_id`).
        See PR #441 for the projection-side counterpart and PR #440
        for the platform-control overlay table.
      required:
        - insight_id
        - document_id
        - document_revision
        - processing_manifest_id
        - record_kind
        - insight_type
        - claim
        - display_text
        - support
        - referenced_authorities
        - jurisdiction_ids
        - authority_ids
        - source_document_ids
        - confidence
        - review_state
        - generator
        - scores
        - overlay_revision
        - created_at
        - updated_at
      properties:
        insight_id:
          type: string
          pattern: "^ins_[0-9a-hjkmnp-tv-z]{26}$"
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        processing_manifest_id:
          type: string
          pattern: "^pm_[0-9a-hjkmnp-tv-z]{26}$"
        section_id:
          type: string
          nullable: true
        citation_id:
          type: string
          nullable: true
        record_kind:
          type: string
          enum: [commentary_insight]
        insight_type:
          type: string
        claim:
          type: string
        display_text:
          type: string
        support:
          type: array
          items:
            type: object
            additionalProperties: true
        referenced_authorities:
          type: array
          items:
            type: object
            additionalProperties: true
        language:
          type: string
          nullable: true
        jurisdiction_id:
          type: string
          nullable: true
        jurisdiction_ids:
          type: array
          items:
            type: string
            pattern: "^jur_[a-z0-9_]+$"
          minItems: 1
        authority_ids:
          type: array
          items:
            type: string
            pattern: "^auth_[a-z0-9_]+$"
          minItems: 1
        source_document_ids:
          type: array
          items:
            type: string
            pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
          minItems: 1
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        review_state:
          type: string
        generator:
          type: object
          additionalProperties: true
        scores:
          type: object
          additionalProperties: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        overlay_revision:
          type: integer
          minimum: 1
        last_correction_id:
          type: string
          nullable: true
          pattern: "^cor_[a-z0-9]+$"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommentaryInsightListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CommentaryInsight"
        total:
          type: integer
          nullable: true
        limit:
          type: integer
          nullable: true
        offset:
          type: integer
          nullable: true

    CommentaryInsightHistoryEntry:
      type: object
      description: |
        One correction in the history of a commentary insight. Lighter
        than `Correction` — drops the bidirectional fields since the
        history is scoped to a known insight.
      required:
        - correction_id
        - correction_type
        - payload
        - operator_id
        - status
        - created_at
      properties:
        correction_id:
          type: string
          pattern: "^cor_[a-z0-9]+$"
        correction_type:
          type: string
          enum: [field_edit, annotation, reject, rescore_request]
        payload:
          type: object
          additionalProperties: true
        original_snapshot:
          type: object
          nullable: true
          additionalProperties: true
        operator_id:
          type: string
          pattern: "^op_[a-z0-9]+$"
        pipeline_run_id:
          type: string
          nullable: true
        rationale:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, applied, rejected, superseded]
        created_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true

    CommentaryInsightHistoryResponse:
      type: object
      required: [insight_id, overlay_revision, history]
      properties:
        insight_id:
          type: string
          pattern: "^ins_[0-9a-hjkmnp-tv-z]{26}$"
        overlay_revision:
          type: integer
          minimum: 1
        history:
          type: array
          items:
            $ref: "#/components/schemas/CommentaryInsightHistoryEntry"
