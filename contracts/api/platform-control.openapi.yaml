    Run:
      type: object
      required:
        - run_id
        - source_id
        - source_version_id
        - mode
        - scope
        - status
        - artifacts_count
        - captured_resources_count
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          pattern: "^run_[a-z0-9]+$"
          example: run_01hzxk9c4dnpf8h6t2m5q7w3
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
        source_version_id:
          type: string
          pattern: "^sv_[a-z0-9]+$"
        mode:
          type: string
          enum: [preview, production]
        scope:
          $ref: "#/components/schemas/RunScope"
        replay:
          oneOf:
            - $ref: "#/components/schemas/RunReplay"
            - type: "null"
        replay_checkpoint:
          oneOf:
            - $ref: "#/components/schemas/RunReplayCheckpoint"
            - type: "null"
          description: >
            Optional monotonic acquisition progress snapshot. Populated from provider webhooks
            (for example Firecrawl) and seeded from the parent run when ``replay.parent_run_id``
            is set so partial reruns can resume from the last known frontier.
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        artifacts_count:
          type: integer
        captured_resources_count:
          type: integer
        failure_reason:
          oneOf:
            - type: string
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RunScope:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [full_source, discovered_subset, source_snapshot, time_window]
          default: full_source
        source_snapshot_id:
          oneOf:
            - type: string
              pattern: "^snap_[a-z0-9]+$"
            - type: "null"
        captured_resource_ids:
          type: array
          items:
            type: string
        include_urls:
          type: array
          items:
            type: string
            format: uri
        since:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        until:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        max_resources:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 10000
            - type: "null"

    RunReplay:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [partial_rerun, backfill, full_refresh]
        parent_run_id:
          oneOf:
            - type: string
              pattern: "^run_[a-z0-9]+$"
            - type: "null"
        reason:
          oneOf:
            - type: string
            - type: "null"

    RunReplayCheckpoint:
      type: object
      description: >
