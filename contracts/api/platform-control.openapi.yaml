openapi: 3.1.0
info:
  title: Platform Control API
  description: |
    API for managing sources, source versions, runs, approvals, and provider webhooks
    in the Evidara platform control plane.
  version: 0.5.1
  contact:
    name: Evidara Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://platform-control.evidara.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: reference-data
  - name: sources
  - name: source-versions
  - name: runs
  - name: wizard
  - name: reviews
  - name: corpora
    description: |
      First-class corpus and tenant/scope management.  A corpus groups source versions
      under a shared ``tenant_id`` and ``scope_type`` identity.  Operators create corpora
      here and reference them by ``corpus_id`` in acquisition configs.
  - name: di-events
  - name: firecrawl
  - name: corrections
    description: |
      Human-in-the-loop corrections raised against upstream domain entities (source,
      canonical document, commentary insight). Corrections are the durable audit trail
      for HITL field edits, annotations, rejections, and rescore requests.
  - name: commentary-insights
    description: |
      Operator-facing read surface for commentary insights. Reads are
      backed by the `commentary_insights` overlay populated by
      document-intelligence runs and amended by applied corrections;
      writes flow through `POST /v1/corrections` (no PATCH on
      commentary-insights — see PR #440 design).
  - name: health
  - name: agent-discovery
    description: |
      Read-only operations commonly used by operators and agents for discovery and evidence
      (`evidara openapi tags`, MVP acceptance, smoke matrices). Does not imply mutating workflow APIs.

paths:
  /v1/reference-data/jurisdictions:
    get:
      operationId: listJurisdictions
      summary: List jurisdictions for operator setup flows
      tags: [reference-data]
      responses:
        "200":
          description: List of jurisdictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionListResponse"
    post:
      operationId: createJurisdiction
      summary: Create a jurisdiction
      tags: [reference-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJurisdictionRequest"
      responses:
        "201":
          description: Jurisdiction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"

  /v1/reference-data/jurisdictions/{jurisdiction_id}:
    patch:
      operationId: updateJurisdiction
      summary: Update a jurisdiction
      tags: [reference-data]
      parameters:
        - name: jurisdiction_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^jur_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJurisdictionRequest"
      responses:
        "200":
          description: Jurisdiction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"
        "404":
          description: Jurisdiction not found

  /v1/reference-data/authorities:
    get:
      operationId: listAuthorities
      summary: List authorities for operator setup flows
      tags: [reference-data]
      responses:
        "200":
          description: List of authorities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityListResponse"
    post:
      operationId: createAuthority
      summary: Create an authority
      tags: [reference-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthorityRequest"
      responses:
        "201":
          description: Authority created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authority"
        "404":
          description: Jurisdiction not found

  /v1/reference-data/authorities/{authority_id}:
    patch:
      operationId: updateAuthority
      summary: Update an authority
      tags: [reference-data]
      parameters:
        - name: authority_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^auth_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthorityRequest"
      responses:
        "200":
          description: Authority updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authority"
        "404":
          description: Authority or jurisdiction not found

  /v1/sources:
    get:
      operationId: listSources
      summary: List all sources
      tags: [sources, agent-discovery]
      responses:
        "200":
          description: List of sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceListResponse"
    post:
      operationId: createSource
      summary: Create a new source
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Reference data not found

  /v1/sources/with-version:
    post:
      operationId: createSourceWithInitialVersion
      summary: Create source and initial version in one transaction
      tags: [sources, source-versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceWithVersionRequest"
      responses:
        "201":
          description: Source and initial version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSourceWithVersionResponse"
        "404":
          description: Reference data, extractor profile, or blueprint key not found
        "422":
          description: Invalid request payload

  /v1/sources/blueprint-preview:
    post:
      operationId: previewSourceBlueprint
      summary: Expand overlay/template into validated acquisition spec
      tags: [sources, source-versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceBlueprintPreviewRequest"
      responses:
        "200":
          description: Expanded acquisition spec preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBlueprintPreviewResponse"
        "404":
          description: Unknown overlay or provider template
        "422":
          description: Invalid request payload

  /v1/sources/blueprint-templates:
    get:
      operationId: listSourceBlueprintTemplates
      summary: List available overlay/template combinations for source wizard
      tags: [sources, source-versions]
      responses:
        "200":
          description: Available blueprint templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBlueprintTemplateListResponse"

  /v1/sources/{source_id}:
    get:
      operationId: getSource
      summary: Get a source by ID
      tags: [sources]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Source not found

  /v1/sources/{source_id}/versions:
    get:
      operationId: listSourceVersions
      summary: List versions of a source
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: List of source versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersionListResponse"
        "404":
          description: Source not found
    post:
      operationId: createSourceVersion
      summary: Create a new source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceVersionRequest"
      responses:
        "201":
          description: Source version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source or extractor profile not found
        "422":
          description: Invalid request payload

  /v1/versions/{source_version_id}/approve:
    post:
      operationId: approveSourceVersion
      summary: Approve a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/versions/{source_version_id}:
    patch:
      operationId: updateSourceVersion
      summary: Update a draft or rejected source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceVersionRequest"
      responses:
        "200":
          description: Source version updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version or extractor profile not found
        "409":
          description: Invalid source version state transition

  /v1/versions/{source_version_id}/reject:
    post:
      operationId: rejectSourceVersion
      summary: Reject a source version
      tags: [source-versions]
      parameters:
        - $ref: "#/components/parameters/SourceVersionId"
      responses:
        "200":
          description: Source version rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersion"
        "404":
          description: Source version not found
        "409":
          description: Invalid source version state transition

  /v1/runs:
    get:
      operationId: listRuns
      summary: List preview and production runs for operator review
      tags: [runs, agent-discovery]
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [preview, production]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
      responses:
        "200":
          description: Runs matching the requested filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
    post:
      operationId: createRun
      summary: Trigger a new preview or production run
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Source or source version not found
        "409":
          description: Invalid run request for the current source version state

  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Get run status
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found

  /v1/runs/{run_id}/captured-resources:
    get:
      operationId: listRunCapturedResources
      summary: List captured resources recorded for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Captured resources for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturedResourceListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/raw-artifacts:
    get:
      operationId: listRunRawArtifacts
      summary: List raw artifacts captured for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Raw artifacts for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawArtifactListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/provider-jobs:
    get:
      operationId: listRunProviderJobs
      summary: List provider job diagnostics for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Provider jobs for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderJobListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel a pending or running run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Run not found
        "409":
          description: Invalid run state transition

  /v1/runs/{run_id}/preview-summary:
    get:
      operationId: getRunPreviewSummary
      summary: Summarize captured preview output for operator review
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Preview summary for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPreviewSummary"
        "404":
          description: Run not found

  /v1/runs/{run_id}/processing-status:
    get:
      operationId: listRunProcessingStatus
      summary: List DI processing status updates for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Processing status updates for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStatusUpdateListResponse"
        "404":
          description: Run not found

  /v1/runs/{run_id}/document-lifecycle:
    get:
      operationId: listRunDocumentLifecycle
      summary: List document processed/withdrawn lifecycle events for a run
      tags: [runs, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Document lifecycle events for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentLifecycleEventListResponse"
        "404":
          description: Run not found

  /v1/wizard/projects:
    post:
      operationId: createWizardProject
      summary: Create a wizard project
      tags: [wizard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWizardProjectRequest"
      responses:
        "201":
          description: Wizard project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProject"

  /v1/wizard/projects/{project_id}:
    get:
      operationId: getWizardProject
      summary: Get wizard project details
      tags: [wizard, agent-discovery]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wpr_[a-z0-9]+$"
      responses:
        "200":
          description: Wizard project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProject"
        "404":
          description: Wizard project not found

  /v1/wizard/projects/{project_id}/scope:
    post:
      operationId: saveWizardScope
      summary: Save wizard scope and advance to discovery planning
      tags: [wizard]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wpr_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWizardScopeRequest"
      responses:
        "200":
          description: Wizard project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProject"
        "409":
          description: Invalid wizard state transition

  /v1/wizard/projects/{project_id}/discovery-plan:
    post:
      operationId: saveWizardDiscoveryPlan
      summary: Save or update wizard discovery plan
      tags: [wizard]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wpr_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWizardDiscoveryPlanRequest"
      responses:
        "200":
          description: Wizard project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProject"

  /v1/wizard/projects/{project_id}/pilot-run:
    post:
      operationId: startWizardPilotRun
      summary: Start wizard pilot run
      tags: [wizard]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wpr_[a-z0-9]+$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartWizardPilotRunRequest"
      responses:
        "200":
          description: Wizard run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardRunStatus"
        "409":
          description: Invalid wizard state transition

  /v1/wizard/runs/{run_id}:
    get:
      operationId: getWizardRun
      summary: Get wizard run status
      tags: [wizard]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wrn_[a-z0-9]+$"
      responses:
        "200":
          description: Wizard run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardRunStatus"
        "404":
          description: Wizard run not found

  /v1/wizard/runs/{run_id}/approve:
    post:
      operationId: approveWizardRun
      summary: Approve wizard gate transition
      tags: [wizard]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wrn_[a-z0-9]+$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WizardRunDecisionRequest"
      responses:
        "200":
          description: Wizard run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardRunStatus"
        "409":
          description: Invalid wizard state transition

  /v1/wizard/runs/{run_id}/reject:
    post:
      operationId: rejectWizardRun
      summary: Reject wizard gate transition and return to discovery planning
      tags: [wizard]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wrn_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WizardRunDecisionRequest"
      responses:
        "200":
          description: Wizard run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardRunStatus"
        "409":
          description: Invalid wizard state transition

  /v1/reviews/sync-from-argilla:
    post:
      operationId: syncReviewsFromArgilla
      summary: Ingest Argilla review outcomes
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArgillaReviewSyncRequest"
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArgillaReviewSyncResponse"

  /v1/reviews/tasks:
    post:
      operationId: createReviewTask
      summary: Create a review task and enqueue it to Argilla when configured
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewTaskRequest"
      responses:
        "201":
          description: Review task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewTaskResponse"
        "404":
          description: Wizard run not found
        "409":
          description: Duplicate Argilla external_id

  /v1/reviews/tasks/{task_id}:
    get:
      operationId: getReviewTask
      summary: Get a synced review task
      tags: [reviews]
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^wrt_[a-z0-9]+$"
      responses:
        "200":
          description: Review task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTask"
        "404":
          description: Review task not found

  /v1/di/events/document-processing-status-updated:
    post:
      operationId: receiveDocumentProcessingStatusUpdated
      summary: Ingest processing status events emitted by document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentProcessingStatusUpdatedEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/di/events/document-processed:
    post:
      operationId: receiveDocumentProcessed
      summary: Ingest canonical-ready document publication events from document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentProcessedEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/di/events/document-withdrawn:
    post:
      operationId: receiveDocumentWithdrawn
      summary: Ingest document withdrawal events from document-intelligence
      tags: [di-events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentWithdrawnEvent"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "422":
          description: Event validation failed

  /v1/firecrawl/webhooks:
    post:
      operationId: receiveFirecrawlWebhook
      summary: Receive Firecrawl provider callbacks
      tags: [firecrawl]
      security: []
      parameters:
        - name: X-Firecrawl-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature for the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirecrawlWebhookEvent"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcceptedResponse"
        "401":
          description: Signature verification failed

  /v1/corrections:
    get:
      operationId: listCorrections
      summary: List corrections raised against upstream domain entities
      tags: [corrections, agent-discovery]
      parameters:
        - name: target_entity_type
          in: query
          required: false
          schema:
            type: string
            enum: [source, document, commentary_insight]
        - name: target_entity_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
            pattern: "^op_[a-z0-9]+$"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, applied, rejected, superseded]
        - name: correction_type
          in: query
          required: false
          schema:
            type: string
            enum: [field_edit, annotation, reject, rescore_request]
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Corrections matching the requested filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectionListResponse"
    post:
      operationId: createCorrection
      summary: Raise a correction against an upstream entity
      tags: [corrections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCorrectionRequest"
            examples:
              commentary_insight_field_edit:
                summary: Field edit on a commentary insight
                value:
                  target_entity_type: commentary_insight
                  target_entity_id: ins_01jq7c1ny0ffv8qdr1xwbejqb6
                  correction_type: field_edit
                  payload:
                    field: claim
                    value: "Article 754 OR establishes director liability toward the company."
                  original_snapshot:
                    claim: "References Art. 754 OR"
                  rationale: "Editor sharpened the extracted claim to match the supporting passage."
              document_rescore_request:
                summary: Rescore request raised by a quality gate
                value:
                  target_entity_type: document
                  target_entity_id: doc_01jq7bdptzqv3xs0c41xpw1ybg
                  correction_type: rescore_request
                  payload:
                    reason_code: low_quality_extractions
                    requested_priority: normal
                  pipeline_run_id: run_01jq7a3s9b7j4dndd9sgv6pb9d
                  rationale: "QA gate flagged citation parse-rate below threshold; requesting re-process."
      responses:
        "201":
          description: Correction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Correction"
        "404":
          description: Target entity not found
        "409":
          description: Target entity is not in a state that accepts this correction

  /v1/corrections/{correction_id}:
    get:
      operationId: getCorrection
      summary: Get a correction
      tags: [corrections, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/CorrectionId"
      responses:
        "200":
          description: Correction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Correction"
        "404":
          description: Correction not found
    patch:
      operationId: updateCorrectionStatus
      summary: Transition a correction's lifecycle state
      description: |
        Transitions the correction status. The server enforces legal transitions
        (`pending` → `applied` | `rejected`; `applied` → `superseded`) and returns
        409 on illegal transitions. `applied_at` is server-stamped on `applied`.
      tags: [corrections]
      parameters:
        - $ref: "#/components/parameters/CorrectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCorrectionStatusRequest"
      responses:
        "200":
          description: Correction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Correction"
        "404":
          description: Correction not found
        "409":
          description: Illegal lifecycle transition for current status

  /v1/commentary-insights:
    get:
      operationId: listCommentaryInsights
      summary: List commentary insight overlay rows
      tags: [commentary-insights, agent-discovery]
      parameters:
        - name: document_id
          in: query
          required: false
          schema:
            type: string
            pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        - name: review_state
          in: query
          required: false
          schema:
            type: string
            enum:
              - machine_generated_unreviewed
              - machine_verified
              - editor_approved
              - rejected
              - stale
        - $ref: "#/components/parameters/RunScopedListLimit"
        - $ref: "#/components/parameters/RunScopedListOffset"
      responses:
        "200":
          description: Commentary insights matching the requested filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentaryInsightListResponse"

  /v1/commentary-insights/{insight_id}:
    get:
      operationId: getCommentaryInsight
      summary: Get a commentary insight by id
      tags: [commentary-insights, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/InsightId"
      responses:
        "200":
          description: Commentary insight detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentaryInsight"
        "404":
          description: Commentary insight not found

  /v1/commentary-insights/{insight_id}/history:
    get:
      operationId: getCommentaryInsightHistory
      summary: Get the correction history for a commentary insight
      description: |
        Returns the corrections that have targeted this insight, ordered
        oldest-first so the UI renders a forward-in-time timeline. Used
        by the admin commentary insight detail page for provenance.
      tags: [commentary-insights, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/InsightId"
      responses:
        "200":
          description: Insight history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentaryInsightHistoryResponse"
        "404":
          description: Commentary insight not found

  /v1/corpora:
    get:
      operationId: listCorpora
      summary: List corpora
      tags: [corpora]
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of corpora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusListResponse"
    post:
      operationId: createCorpus
      summary: Create a corpus
      tags: [corpora]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCorpusRequest"
      responses:
        "201":
          description: Corpus created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusResponse"
        "409":
          description: Active corpus with this name already exists for the tenant

  /v1/corpora/{corpus_id}:
    get:
      operationId: getCorpus
      summary: Get a corpus by ID
      tags: [corpora]
      parameters:
        - name: corpus_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^cps_[a-z0-9]+$"
      responses:
        "200":
          description: Corpus details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusResponse"
        "404":
          description: Corpus not found
    patch:
      operationId: updateCorpus
      summary: Update corpus name, description, or scope_type
      tags: [corpora]
      parameters:
        - name: corpus_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^cps_[a-z0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCorpusRequest"
      responses:
        "200":
          description: Corpus updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusResponse"
        "404":
          description: Corpus not found
        "409":
          description: Corpus is archived and cannot be updated

  /v1/corpora/{corpus_id}/archive:
    post:
      operationId: archiveCorpus
      summary: Archive a corpus (soft-delete)
      tags: [corpora]
      parameters:
        - name: corpus_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^cps_[a-z0-9]+$"
      responses:
        "200":
          description: Corpus archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusResponse"
        "404":
          description: Corpus not found

  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReadiness
      summary: Deep readiness check
      tags: [health]
      security: []
      responses:
        "200":
          description: All critical dependencies are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one critical dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the identity provider.

  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^src_[a-z0-9]+$"
    SourceVersionId:
      name: source_version_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^sv_[a-z0-9]+$"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^run_[a-z0-9]+$"
    CorrectionId:
      name: correction_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^cor_[a-z0-9]+$"
    InsightId:
      name: insight_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ins_[0-9a-hjkmnp-tv-z]{26}$"
    RunScopedListLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return for this run-scoped list.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    RunScopedListOffset:
      name: offset
      in: query
      required: false
      description: Number of items to skip before returning results.
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    CorpusResponse:
      type: object
      required: [corpus_id, name, tenant_id, scope_type, status, created_at, updated_at]
      properties:
        corpus_id:
          type: string
          pattern: "^cps_[a-z0-9]+$"
        name:
          type: string
        description:
          type: string
          nullable: true
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CorpusListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CorpusResponse"
        total:
          type: integer
          nullable: true
        limit:
          type: integer
          nullable: true
        offset:
          type: integer
          nullable: true

    CreateCorpusRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
          default: tenant_public
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          default: global_public

    UpdateCorpusRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
        description:
          type: string
          nullable: true
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          nullable: true

    Jurisdiction:
      type: object
      required: [jurisdiction_id, name, slug, created_at, updated_at]
      properties:
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JurisdictionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Jurisdiction"

    CreateJurisdictionRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string

    UpdateJurisdictionRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        slug:
          type: string

    Authority:
      type: object
      required: [authority_id, name, slug, created_at, updated_at]
      properties:
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        jurisdiction_id:
          oneOf:
            - type: string
              pattern: "^jur_[a-z0-9]+$"
            - type: "null"
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthorityListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Authority"

    CreateAuthorityRequest:
      type: object
      required: [name, slug]
      properties:
        jurisdiction_id:
          oneOf:
            - type: string
              pattern: "^jur_[a-z0-9]+$"
            - type: "null"
        name:
          type: string
        slug:
          type: string

    UpdateAuthorityRequest:
      type: object
      minProperties: 1
      properties:
        jurisdiction_id:
          oneOf:
            - type: string
              pattern: "^jur_[a-z0-9]+$"
            - type: "null"
        name:
          type: string
        slug:
          type: string

    Source:
      type: object
      required:
        - source_id
        - name
        - jurisdiction_id
        - authority_id
        - source_type
        - status
        - created_at
        - updated_at
      properties:
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
          example: src_01hzxk7v3qmjy4t5n2p8r6w9
        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website, api]
        document_family:
          type: string
        status:
          type: string
          enum: [active, inactive, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    CreateSourceRequest:
      type: object
      required: [name, jurisdiction_id, authority_id]
      properties:
        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website, api]
          default: website
        document_family:
          type: string

    FirecrawlAcquisitionSpec:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [firecrawl]
        seed_url:
          type: string
          format: uri
        seed_urls:
          type: array
          items:
            type: string
            format: uri
        mode:
          type: string
          enum: [crawl, batch_scrape]
          default: crawl
        include_paths:
          type: array
          items:
            type: string
        exclude_paths:
          type: array
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 20
        max_discovery_depth:
          type: integer
          minimum: 0
          maximum: 10
          default: 2
        scrape_formats:
          type: array
          items:
            type: string
          default: [markdown, html]
        zero_data_retention:
          type: boolean
          default: false
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
          default: tenant_public
        corpus_id:
          type: string
          pattern: "^corpus_[a-z0-9_]+$"
          default: corpus_public_default
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          default: global_public
        source_origin_kind:
          type: string
          enum:
            [
              official_primary,
              official_mirror,
              licensed_provider,
              community_curated,
              tenant_internal,
            ]
          default: official_primary
        trust_tier:
          type: string
          enum: [authoritative, preferred, supplemental, untrusted]
          default: authoritative
        language_codes:
          type: array
          items:
            type: string
            pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
          default: []
        document_type_hint:
          type: string

    DeterministicHttpAcquisitionSpec:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [deterministic_http]
        seed_url:
          oneOf:
            - type: string
              format: uri
            - type: "null"
        seed_urls:
          type: array
          items:
            type: string
            format: uri
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
          default: tenant_public
        corpus_id:
          type: string
          pattern: "^corpus_[a-z0-9_]+$"
          default: corpus_public_default
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          default: global_public
        source_origin_kind:
          type: string
          enum:
            [
              official_primary,
              official_mirror,
              licensed_provider,
              community_curated,
              tenant_internal,
            ]
          default: official_primary
        trust_tier:
          type: string
          enum: [authoritative, preferred, supplemental, untrusted]
          default: authoritative
        language_codes:
          type: array
          items:
            type: string
            pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
          default: []
        document_type_hint:
          type: string

    FedlexSparqlAcquisitionSpec:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [fedlex_sparql]
        seed_url:
          oneOf:
            - type: string
              format: uri
            - type: "null"
        seed_urls:
          type: array
          items:
            type: string
            format: uri
        sparql_endpoint:
          type: string
          format: uri
          default: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages:
          type: array
          items:
            type: string
            pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
          default: []
        query_mode:
          type: string
          enum: [work_to_expression]
          default: work_to_expression
        max_expressions:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
          default: tenant_public
        corpus_id:
          type: string
          pattern: "^corpus_[a-z0-9_]+$"
          default: corpus_public_default
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          default: global_public
        source_origin_kind:
          type: string
          enum:
            [
              official_primary,
              official_mirror,
              licensed_provider,
              community_curated,
              tenant_internal,
            ]
          default: official_primary
        trust_tier:
          type: string
          enum: [authoritative, preferred, supplemental, untrusted]
          default: authoritative
        language_codes:
          type: array
          items:
            type: string
            pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
          default: []
        document_type_hint:
          type: string

    RisOgdAcquisitionSpec:
      type: object
      additionalProperties: false
      required: [provider, base_url]
      properties:
        provider:
          type: string
          enum: [ris_ogd]
        base_url:
          type: string
          format: uri
        applikation:
          oneOf:
            - type: string
            - type: "null"
        preferred_formats:
          type: array
          items:
            type: string
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        max_pages:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
          default: tenant_public
        corpus_id:
          type: string
          pattern: "^corpus_[a-z0-9_]+$"
          default: corpus_public_default
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          default: global_public
        source_origin_kind:
          type: string
          enum:
            [
              official_primary,
              official_mirror,
              licensed_provider,
              community_curated,
              tenant_internal,
            ]
          default: official_primary
        trust_tier:
          type: string
          enum: [authoritative, preferred, supplemental, untrusted]
          default: authoritative
        language_codes:
          type: array
          items:
            type: string
            pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
          default: []
        document_type_hint:
          type: string

    AcquisitionSpec:
      oneOf:
        - $ref: "#/components/schemas/FirecrawlAcquisitionSpec"
        - $ref: "#/components/schemas/DeterministicHttpAcquisitionSpec"
        - $ref: "#/components/schemas/FedlexSparqlAcquisitionSpec"
        - $ref: "#/components/schemas/RisOgdAcquisitionSpec"
      discriminator:
        propertyName: provider

    SourceVersion:
      type: object
      required:
        - source_version_id
        - source_id
        - version_label
        - status
        - acquisition_spec
        - created_at
        - updated_at
      properties:
        source_version_id:
          type: string
          pattern: "^sv_[a-z0-9]+$"
          example: sv_01hzxk8a2bmne6g4r7j3k9l5
        source_id:
          type: string
          pattern: "^src_[a-z0-9]+$"
        extractor_profile_id:
          type: string
          pattern: "^exp_[a-z0-9]+$"
        version_label:
          type: string
        status:
          type: string
          enum: [draft, pending_approval, approved, rejected, superseded]
        acquisition_spec:
          $ref: "#/components/schemas/AcquisitionSpec"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceVersionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SourceVersion"

    CreateSourceVersionRequest:
      type: object
      required: [version_label]
      properties:
        version_label:
          type: string
        extractor_profile_id:
          type: string
          pattern: "^exp_[a-z0-9]+$"
        acquisition_spec:
          $ref: "#/components/schemas/AcquisitionSpec"
        overlay_id:
          type: string
        provider_template_id:
          type: string

    UpdateSourceVersionRequest:
      type: object
      minProperties: 1
      properties:
        version_label:
          type: string
        extractor_profile_id:
          oneOf:
            - type: string
              pattern: "^exp_[a-z0-9]+$"
            - type: "null"
        acquisition_spec:
          $ref: "#/components/schemas/AcquisitionSpec"
        overlay_id:
          type: string
        provider_template_id:
          type: string

    CreateSourceWithVersionRequest:
      type: object
      required: [source, source_version]
      properties:
        source:
          $ref: "#/components/schemas/CreateSourceRequest"
        source_version:
          $ref: "#/components/schemas/CreateSourceVersionRequest"

    CreateSourceWithVersionResponse:
      type: object
      required: [source, source_version]
      properties:
        source:
          $ref: "#/components/schemas/Source"
        source_version:
          $ref: "#/components/schemas/SourceVersion"

    SourceBlueprintPreviewRequest:
      type: object
      required: [overlay_id, provider_template_id]
      properties:
        overlay_id:
          type: string
        provider_template_id:
          type: string

    SourceBlueprintPreviewResponse:
      type: object
