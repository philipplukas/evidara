components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the identity provider.

  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^src_[a-z0-9]+$"
    SourceVersionId:
      name: source_version_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^sv_[a-z0-9]+$"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^run_[a-z0-9]+$"
    RunScopedListLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return for this run-scoped list.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    RunScopedListOffset:
      name: offset
      in: query
      required: false
      description: Number of items to skip before returning results.
      schema:
        type: integer
        minimum: 0
        default: 0
    InsightId:
      name: insight_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ins_[0-9a-hjkmnp-tv-z]{26}$"
      description: Stable commentary insight identifier (`ins_*`).

  schemas:
    CorpusResponse:
      type: object
      required: [corpus_id, name, tenant_id, scope_type, status, created_at, updated_at]
      properties:
        corpus_id:
          type: string
          pattern: "^cps_[a-z0-9]+$"
        name:
          type: string
        description:
          type: string
          nullable: true
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CorpusListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CorpusResponse"
        total:
          type: integer
          nullable: true
        limit:
          type: integer
          nullable: true
        offset:
          type: integer
          nullable: true

    CreateCorpusRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        tenant_id:
          type: string
          pattern: "^tenant_[a-z0-9_]+$"
          default: tenant_public
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          default: global_public

    UpdateCorpusRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
        description:
          type: string
          nullable: true
        scope_type:
          type: string
          enum: [global_public, tenant_private, tenant_shared]
          nullable: true

    Jurisdiction:
      type: object
      required: [jurisdiction_id, name, slug, created_at, updated_at]
      properties:
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JurisdictionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Jurisdiction"

    CreateJurisdictionRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string

    UpdateJurisdictionRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        slug:
          type: string

    Authority:
      type: object
      required: [authority_id, name, slug, created_at, updated_at]
      properties:
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        jurisdiction_id:
          oneOf:
            - type: string
              pattern: "^jur_[a-z0-9]+$"
            - type: "null"
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthorityListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Authority"

    CreateAuthorityRequest:
      type: object
      required: [name, slug]
      properties:
        jurisdiction_id:
          oneOf:
            - type: string
