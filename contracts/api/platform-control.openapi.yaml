                        target_entity_id: "ins_01jq7c1ny0ffv8qdr1xwbejqb6"
                        correction_type: "rescore_request"
                        payload:
                          requested_pipeline: "commentary-insight-extractor"
                          parameters:
                            min_confidence: 0.85
                            include_german_subdivisions: true
                        original_snapshot: null
                        operator_id: "op_lukas.frei@evidara.dev"
                        pipeline_run_id: "run_01jsg5xyab8c4dnpf8h6t2m5q7"
                        rationale: "Confidence dropped below 0.7 across the run; request re-extraction with stricter threshold."
                        status: "pending"
                        created_at: "2026-04-25T08:42:11Z"
                        applied_at: null
                    total: 1
                    limit: 50
                    offset: 0

