        name:
          type: string
        description:
          type: string
        jurisdiction_id:
          type: string
          pattern: "^jur_[a-z0-9]+$"
        authority_id:
          type: string
          pattern: "^auth_[a-z0-9]+$"
        source_type:
          type: string
          enum: [website, api]
        document_family:
          type: string
        status:
          type: string
          enum: [active, inactive, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
