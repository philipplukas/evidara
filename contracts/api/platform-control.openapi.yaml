  /v1/corpora/{corpus_id}/archive:
    post:
      operationId: archiveCorpus
      summary: Archive a corpus (soft-delete)
      tags: [corpora]
      parameters:
        - name: corpus_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^cps_[a-z0-9]+$"
      responses:
        "200":
          description: Corpus archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusResponse"
        "404":
          description: Corpus not found

  /v1/commentary-insights:
    get:
      operationId: listCommentaryInsights
      summary: List commentary insights for operator review
      description: |
        Returns commentary insights produced by document-intelligence with operator overlays applied.
        Supports paging and the most common review filters. See ADR-0011 for envelope conventions and
        `contracts/schemas/commentary-insight.schema.json` for the canonical entity shape.
      tags: [commentary-insights, agent-discovery]
      parameters:
        - name: document_id
          in: query
          required: false
          schema:
            type: string
            pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
          description: Filter to insights anchored to a specific primary document.
        - name: jurisdiction_id
          in: query
          required: false
          schema:
            type: string
            pattern: "^jur_[a-z0-9_]+$"
          description: Filter to insights resolved to a canonical jurisdiction.
        - name: review_state
          in: query
          required: false
          schema:
            type: string
            enum:
              - machine_generated_unreviewed
              - machine_verified
              - editor_approved
              - rejected
              - stale
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Page of commentary insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentaryInsightListResponse"

  /v1/commentary-insights/{insight_id}:
    get:
      operationId: getCommentaryInsight
      summary: Get a single commentary insight
      tags: [commentary-insights, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/InsightId"
      responses:
        "200":
          description: Commentary insight detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentaryInsight"
        "404":
          description: Commentary insight not found
    patch:
      operationId: editCommentaryInsight
      summary: Apply an operator field edit to a commentary insight
      description: |
        Persists the operator's field changes as a `field_edit` correction (see
        `contracts/schemas/corrections.json`) and updates the read-side overlay so the next
        list/get reflects the edit. The full envelope is appended to the insight's history; this
        endpoint never mutates the underlying DI output. Returns the post-overlay insight plus the
        correction envelope that was created.
      tags: [commentary-insights]
      parameters:
        - $ref: "#/components/parameters/InsightId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditCommentaryInsightRequest"
            examples:
              fieldEditClaim:
                summary: Operator narrows the claim wording
                value:
                  rationale: "Tightened claim wording per editorial review."
                  payload:
                    claim: "References Art. 754 OR (board liability)"
                    review_state: "editor_approved"
                  original_snapshot:
                    claim: "References Art. 754 OR"
                    review_state: "machine_verified"
      responses:
        "200":
          description: Edit accepted; overlay updated and correction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditCommentaryInsightResponse"
              examples:
                fieldEditApplied:
                  summary: Successful field_edit correction applied
                  value:
                    insight:
                      insight_id: "ins_01jq7c1ny0ffv8qdr1xwbejqb6"
                      document_id: "doc_01jq7bdptzqv3xs0c41xpw1ybg"
                      document_revision: 3
                      processing_manifest_id: "pm_01jq7bhgy7g0pkj4f1d03f8f8c"
                      insight_type: "referenced_provision"
                      claim: "References Art. 754 OR (board liability)"
                      display_text: "Art. 754 OR wird in der Lehre als Haftungsnorm fuer Organe erlaeutert."
                      support: []
                      referenced_authorities: []
                      review_state: "editor_approved"
                      jurisdiction_id: "jur_ch_federal"
                      jurisdiction_ids: ["jur_ch_federal"]
                      authority_ids: ["auth_fedlex"]
                      source_document_ids: ["doc_01jq7bdptzqv3xs0c41xpw1ybg"]
                      last_correction_id: "cor_01jsg6n7r5kv1m3d8z9pqx2tba"
                      confidence: 0.78
                      generator:
                        name: "commentary-insight-extractor"
                        version: "v1"
                      scores:
                        passage_present: 1.0
                        citation_parseable: 1.0
                        section_anchor_resolved: 1.0
                    correction:
                      correction_id: "cor_01jsg6n7r5kv1m3d8z9pqx2tba"
                      target_entity_type: "commentary_insight"
                      target_entity_id: "ins_01jq7c1ny0ffv8qdr1xwbejqb6"
                      correction_type: "field_edit"
                      payload:
                        claim: "References Art. 754 OR (board liability)"
                        review_state: "editor_approved"
                      original_snapshot:
                        claim: "References Art. 754 OR"
                        review_state: "machine_verified"
                      operator_id: "op_anna.steiner@evidara.dev"
                      pipeline_run_id: null
                      rationale: "Tightened claim wording per editorial review."
                      status: "applied"
                      created_at: "2026-04-25T09:14:02Z"
                      applied_at: "2026-04-25T09:14:02Z"
        "400":
          description: Payload shape does not match correction_type semantics
        "404":
          description: Commentary insight not found

  /v1/commentary-insights/{insight_id}/history:
    get:
      operationId: getCommentaryInsightHistory
      summary: List corrections applied to a commentary insight
      description: |
        Returns the ordered correction envelopes for the insight (oldest first).
        Includes pending, applied, rejected, and superseded corrections.
      tags: [commentary-insights, agent-discovery]
      parameters:
        - $ref: "#/components/parameters/InsightId"
      responses:
        "200":
          description: Ordered correction envelopes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectionListResponse"
        "404":
          description: Commentary insight not found

  /v1/corrections/queue:
    get:
      operationId: listCorrectionQueue
      summary: List pending corrections for the operator queue
      description: |
        Returns the operator worklist of corrections — by default `status = pending`. Used by the
        `platform-control/admin` review dashboards. Read-only; mutating operations are scoped to the
        target entity tag (e.g. PATCH `/v1/commentary-insights/{id}`).
      tags: [corrections, agent-discovery]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, applied, rejected, superseded]
            default: pending
        - name: target_entity_type
          in: query
          required: false
          schema:
            type: string
            enum: [commentary_insight, search_projection, document, section, citation]
        - name: correction_type
          in: query
          required: false
          schema:
            type: string
            enum: [field_edit, annotation, reject, rescore_request]
        - name: pipeline_run_id
          in: query
          required: false
          schema:
            type: string
            pattern: "^run_[0-9a-hjkmnp-tv-z]{26}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Page of corrections matching the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectionListResponse"
              examples:
                rescoreRequestPending:
                  summary: Pending rescore_request raised from a failed run
                  value:
                    data:
                      - correction_id: "cor_01jsg7p3q2rm5tx0w4kdb9hf2y"
