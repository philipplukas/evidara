openapi: 3.1.0
info:
  title: Legal Search API
  description: |
    BFF API for the Evidara legal search experience.

    This API returns ViewModel shapes ready for frontend rendering.
    The frontend is a pure rendering layer — all composition logic
    (badges, actions, metadata, facets) lives in this API.

    See ADR-0011 for contract conventions.
    See ADR-0012 for layered contract governance.
    See ADR-0013 for internationalization strategy.
    Document body reads fall back to the Document Service
    (`contracts/api/document-intelligence.openapi.yaml`) when the projection carries no body.
    See ADR-0033 for the norm-hierarchy surface (`/v1/norm-hierarchy`).
    See ADR-0042 for the corpus-coverage surface (`/v1/coverage`) and, in
    particular, for what a coverage answer may and may not be read to mean.
  version: 0.9.0
  contact:
    name: Evidara Team
  license:
    name: Proprietary
    identifier: UNLICENSED

servers:
  - url: http://localhost:3102
    description: Local development
  - url: https://legal-search.evidara.dev
    description: Production

security:
  - bearerAuth: []

tags:
  - name: citations
    description: Citation-graph traversal — resolve references to norms and walk inbound edges.
  - name: search
    description: Search listing and global search context.
  - name: documents
    description: Document detail and section reads.
  - name: projections
    description: |
      Operator/pipeline surface for the derived search index. Only the read side is
      specified here — the `document.processed` / `document.withdrawn` intake routes
      under `/v1/projections/events` are internal event delivery, contracted by
      `contracts/events/*.schema.json` rather than by this API spec.
  - name: coverage
    description: |
      What the corpus holds, for a scope the caller names — the surface ADR-0033 §2's
      refusal capability needs. Every statement here is about **our holdings**. Nothing
      in this tag is, or can become, evidence about what the law contains.
  - name: agent-discovery
    description: |
      Read-only search and document reads commonly used by operators, agents, and smoke flows
      (`evidara openapi tags`, MVP acceptance). Does not cover projection mutation endpoints.

paths:
  /v1/search:
    get:
      operationId: searchDocuments
      summary: Search documents
      description: |
        Returns search results as composed ViewModels with embedded facets.
        Facet counts are live (computed from the same query via OpenSearch aggs).
      tags: [search, agent-discovery]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query text
        - name: jurisdiction
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{2}(-[A-Z0-9]{1,3})?$'
          description: |
            Filter by jurisdiction. Accepts either:
            - ISO 3166-1 alpha-2 country code (e.g. `CH`, `DE`, `EU`)
            - ISO 3166-2 subdivision code (e.g. `CH-ZH`, `DE-BY`, `IT-25`)

            The BFF normalizes both forms and filters against country +
            subdivision columns. See
            `contracts/vocabularies/subdivisions.json` for the full
            subdivision registry.
        - name: jurisdictions
          in: query
          schema:
            type: string
          description: |
            Comma-separated list of jurisdiction filters. Each element
            follows the same shape as `jurisdiction` — country code,
            subdivision code, or a mix.
        - name: jurisdiction_id
          in: query
          schema:
            type: string
            pattern: '^jur_[a-z0-9_]+$'
          description: |
            Canonical jurisdiction ID filter (e.g. `jur_ch_federal`).
            Filters against the search-projection `jurisdiction_ids` array.
            ANDed with the legacy ISO `jurisdiction`/`jurisdictions` parameters
            when both are supplied.
        - name: jurisdiction_ids
          in: query
          schema:
            type: string
          description: |
            Comma-separated list of canonical jurisdiction IDs
            (each item must match `^jur_[a-z0-9_]+$`).
        - name: authority_id
          in: query
          schema:
            type: string
            pattern: '^auth_[a-z0-9_]+$'
          description: |
            Canonical authority ID filter (e.g. `auth_fedlex`).
            Filters against the search-projection `authority_ids` array.
        - name: authority_ids
          in: query
          schema:
            type: string
          description: |
            Comma-separated list of canonical authority IDs
            (each item must match `^auth_[a-z0-9_]+$`).
        - name: languages
          in: query
          schema:
            type: string
          description: Comma-separated list of language filters
        - name: document_type
          in: query
          schema:
            type: string
          description: Filter by document type
        - name: document_types
          in: query
          schema:
            type: string
          description: Comma-separated list of document type filters
        - name: official_only
          in: query
          schema:
            type: boolean
          description: Limit results to official sources only
        - name: refinements
          in: query
          schema:
            type: string
          description: JSON-encoded refinement filter array
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Search results with embedded facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponseView"
        "400":
          description: Invalid query parameters
        "503":
          description: |
            The search backend could not execute the query (missing index/alias,
            connection failure, timeout). Distinct from a query that executed and
            matched nothing — that is a 200 with an empty `results` array.

  /v1/search/context:
    get:
      operationId: getSearchContext
      summary: Get search context
      description: |
        Returns global search context (jurisdictions, languages, source types).
        Query-independent and cacheable. Changes rarely.
      tags: [search, agent-discovery]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        "200":
          description: Search context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchContextView"
        "400":
          description: Invalid request
        "503":
          description: The search backend could not execute the aggregation query

  /v1/documents/{document_id}:
    get:
      operationId: getDocument
      summary: Get document detail
      tags: [documents, agent-discovery]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CorrelationId'
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail as composed ViewModel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailView"
        "404":
          description: Document not found

  /v1/documents/{document_id}/sections:
    get:
      operationId: getDocumentSections
      summary: Get sections of a document
      tags: [documents, agent-discovery]
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document sections
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SectionSummary"
        "404":
          description: Document not found

  /v1/documents/{document_id}/cited_by:
    get:
      operationId: getDocumentCitedBy
      summary: Get reverse citations for a document
      tags: [documents, agent-discovery]
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Citations from other documents that resolve to this document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitedByResponse"
        "404":
          description: Document not found

  /v1/norm-hierarchy/{jurisdiction_id}:
    get:
      operationId: getNormHierarchy
      summary: What governs this place, at each level of the hierarchy of norms
      description: |
        Returns the legal orders that bind a jurisdiction — constitutional,
        federal, cantonal, municipal — ordered most authoritative first, with the
        norms the corpus actually holds at each level. See ADR-0033.

        This is a **traversal, not a search**. The governing chain is derived
        from the jurisdiction tree
        (`contracts/vocabularies/jurisdiction-hierarchy.json`), not from text
        similarity: a communal ordinance is subordinate to its canton's law and
        to federal law because of where the commune sits, not because the
        documents resemble each other.

        `coverage.missing_levels` lists the levels that bind this place but for
        which the corpus holds nothing. It is load-bearing: an agent that
        reasons past a missing level is fabricating, and "I do not have the
        communal ordinance for this place" is a correct answer.
      tags: [norm-hierarchy, agent-discovery]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: jurisdiction_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^jur_[a-z0-9_]+$'
          description: Canonical jurisdiction ID (e.g. `jur_ch_gemeinde_261` — the City of Zurich).
        - name: in_force_at
          in: query
          schema:
            type: string
            format: date
          description: |
            ISO date. Judges the hierarchy against the law in force on that date —
            a ban enacted in 2019 must be measured against 2019 law.

            Norms **known** to be repealed by, or not yet in force on, this date
            are excluded. Norms whose dates are unknown are KEPT and reported
            with `in_force_state: unknown`; dropping them would hide law from the
            caller, and silence is indistinguishable from absence.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Norms returned per level. `total` reports the full count regardless.
      responses:
        "200":
          description: The hierarchy of norms governing this jurisdiction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormHierarchyView"
        "400":
          description: Invalid request
        "404":
          description: Jurisdiction not found in the hierarchy

  /v1/citations/resolve:
    get:
      operationId: resolveCitation
      summary: Resolve a citation string to the norm it points at
      description: |
        Citation-graph traversal, forward direction (ADR-0033 step 3, "walk up").
        Backs the `resolve_citation` MCP tool.

        Accepts either a raw citation string ("SR 210") or a canonical key
        ("sr:210") and returns the document(s) that ARE that norm.

        Resolution is DETERMINISTIC only: SR numbers, CELEX numbers, ECLIs and
        Austrian BGBl references carry their identifier in the string itself.
        Fuzzy citations ("Art. 36 BV", BGE references) cannot be normalized by
        today's extractor and come back `resolved: false` with
        `unresolved_reason: not_normalizable` — never a similarity-search guess,
        which would return a plausible wrong norm.
      tags: [citations, agent-discovery]
      parameters:
        - name: q
          in: query
          required: true
          description: A citation string ("SR 210") or a canonical key ("sr:210").
          schema:
            type: string
          example: SR 210
      responses:
        "200":
          description: Resolution result — resolved or explicitly, attributably not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveCitationResponse"
        "400":
          description: Missing or empty `q`

  /v1/citations/citing:
    get:
      operationId: findCitingDocuments
      summary: Find the documents that cite a norm
      description: |
        Citation-graph traversal, reverse direction (ADR-0033 step 4, "walk
        out"). Backs the `find_citing` MCP tool — "which decisions interpret
        this provision?".

        `q` is either a document id (`doc_...`) or a citation key / string
        naming the norm ("sr:210", "SR 210"). A document id is first mapped to
        the canonical keys that document IS.

        Traversal joins on the canonical key, NOT on the `target_document_id`
        denormalization written at projection time — that field is only set if
        the cited document already existed when the citing document was
        projected, so relying on it drops every edge whose endpoints arrived in
        the wrong order.
      tags: [citations, agent-discovery]
      parameters:
        - name: q
          in: query
          required: true
          description: A document id (`doc_...`), a canonical key (`sr:210`), or a citation string.
          schema:
            type: string
          example: sr:210
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Citing documents (self-citations from the norm's own masthead excluded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindCitingResponse"
        "400":
          description: Missing or empty `q`

  /v1/citations/stats:
    get:
      operationId: getCitationGraphStats
      summary: Citation graph resolution rate
      description: |
        What share of extracted citations actually resolve to an edge, plus the
        unresolved remainder broken down by cause.

        This is reported as a first-class result rather than buried in logs
        because an unresolved citation is a BROKEN EDGE: consumers read a
        missing edge as "no such relation exists". A graph with silently missing
        edges is worse than no graph (ADR-0032), so the miss rate is part of the
        contract.
      tags: [citations, agent-discovery]
      responses:
        "200":
          description: Corpus-wide citation resolution statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationGraphStats"

  /v1/coverage:
    get:
      operationId: getCorpusCoverage
      summary: What the corpus holds for a named scope — and, explicitly, what that does not mean
      description: |
        ADR-0033 §2 makes explicit coverage "the only real cure for confident
        fabrication": an agent that can check whether the governing norm is in the
        corpus can refuse instead of reaching for the nearest plausible text. This
        endpoint is that check. See ADR-0042.

        Before this path existed, the only signal about absence was
        `totalResults: 0`, which conflates at least four different situations —
        we do not hold the norm, we hold it but the query missed it, a filter bug
        dropped it (#672 did exactly this), or the norm does not exist. An agent
        cannot refuse safely on evidence that ambiguous.

        ## What a `not_held` answer means

        **`not_held` means: the search index contains no document matching this
        scope.** That is a statement about our holdings, in the first person.

        It does **NOT** mean the norm does not exist, that no such law was enacted,
        or that the platform has determined the law to be absent. The corpus is a
        subset of the law by construction, and no endpoint over it can ever be
        evidence of what the law does not contain.

        The `holding` enum is therefore exactly `held | not_held`. There is no
        value meaning "confirmed absent in law", and none will be added — a
        requirement for one is a requirement to revisit ADR-0042.

        The strongest claim this endpoint supports is a refusal: *"I do not hold
        the governing norm for this question, so I will not answer it."* Per
        ADR-0033 §2 that is a **correct** answer.

        ## What it also cannot tell you

        - **Whether the corpus is current.** `last_processed_at` is when the newest
          document in the group entered the corpus — NOT evidence that the source
          was re-checked then. A jurisdiction whose law changed last week and whose
          last acquisition ran a year ago reports a year-old timestamp and no
          indication of staleness. "When did we last check?" is run history, which
          lives in platform-control (ADR-0042 §4/§5).
        - **Completeness within a scope.** "We hold 41 federal acts" is not "we hold
          all federal acts". Nothing in the platform knows the denominator, so no
          percentage or completeness score is reported — inventing one is the single
          most dangerous field this endpoint could carry.
        - **Anything at instrument granularity.** A group reporting `held` may still
          be missing the one act that governs the caller's question — this is the
          measured #709 failure, where the federal level was covered by the
          Bundesverfassung while TSchG/TSchV were absent. Use
          `/v1/citations/resolve` to ask about a specific norm.
      tags: [coverage, agent-discovery]
      parameters:
        - name: group_by
          in: query
          required: false
          description: The dimension coverage is bucketed by.
          schema:
            $ref: "#/components/schemas/CoverageDimension"
        - name: jurisdiction_id
          in: query
          required: false
          description: |
            Comma-separated jurisdiction IDs to scope to. **Naming ids here is what
            makes absence reportable**: a named jurisdiction with nothing indexed comes
            back as a group with `documents: 0, holding: not_held`, whereas an
            unnamed one simply never produces a bucket. Ask about `jur_ch_zh`
            explicitly to be told, positively, that we hold nothing for it.
          schema:
            type: string
          example: jur_ch_federal,jur_ch_zh
        - name: authority_id
          in: query
          required: false
          description: Comma-separated authority IDs to scope to.
          schema:
            type: string
        - name: document_type
          in: query
          required: false
          description: Comma-separated document types to scope to.
          schema:
            type: string
        - name: level
          in: query
          required: false
          description: Comma-separated norm levels to scope to.
          schema:
            type: string
          example: federal,cantonal
        - name: in_force_at
          in: query
          required: false
          description: |
            ISO date. Counts only norms not known to be outside force on that date.

            Follows `/v1/norm-hierarchy`: norms whose dates are unknown are KEPT,
            because dropping them would hide law from the caller and make silence
            indistinguishable from absence. `documents_without_repeal_date` reports
            how much of the count rests on that assumption.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          description: Maximum groups returned. Explicitly requested keys are always returned.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Coverage of the corpus over the requested scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusCoverageView"
        "400":
          description: Invalid `group_by`, `level`, `in_force_at` or `limit`

  /v1/projections/documents:
    get:
      operationId: listIndexedProjectionDocuments
      summary: Enumerate the documents currently in the search index
      description: |
        Index-side enumeration for the ADR-0005 reconcile diff.

        ADR-0005 makes OpenSearch a serving layer only — canonical Delta is the system
        of record and the index is derived from it. Keeping that true needs the diff in
        BOTH directions: `document_intelligence_delta_projection_backfill` re-derives
        index rows from canonical (adding what is missing), and
        `document_intelligence_projection_reconcile` walks this endpoint to find indexed
        documents with no canonical row behind them (removing what should not be there).
        Without this endpoint nothing could list the derived side, so orphaned rows from
        earlier runs stayed user-visible indefinitely.

        Read-only. Rows are returned in `document_id` order and paged with an exclusive
        `after` cursor, so the walk is resumable and unaffected by the deep-paging
        window. `commentary_insight` rows are excluded: they are keyed by an `ins_*`
        insight id and have no `published_documents` row, so a canonical diff would
        classify every one of them as an orphan.

        The provenance ids on each entry are the ones the originating
        `document.processed` event carried; they are echoed back so a caller can build
        the `document.withdrawn` event that de-indexes the row.
      tags: [projections]
      parameters:
        - name: after
          in: query
          required: false
          description: Exclusive cursor — the `document_id` that ended the previous page.
          schema:
            type: string
          example: doc_01jq7bdptzqv3xs0c41xpw1ybg
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: One page of indexed documents, ordered by `document_id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexedProjectionDocumentPage"
        "400":
          description: "`limit` is not an integer"

components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        default: de
        example: fr-CH
      description: |
        Preferred UI locale for composed display labels (badges, facets, tabs,
        metadata). Accepts standard HTTP language tags (e.g. "de", "fr", "fr-CH").
        Falls back to "de" (German) when omitted or unsupported.
        See ADR-0013 for locale resolution rules.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Propagated for tracing across frontend -> legal-search -> document-intelligence.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Search Response ───
    SearchResponseView:
      type: object
      required: [results, facets, totalResults]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultView"
          default: []
        facets:
          type: array
          items:
            $ref: "#/components/schemas/FilterFacetView"
          default: []
        totalResults:
          type: integer

    SearchResultView:
      type: object
      required: [id, type, title, subtitle, snippet, badges, metadataRows, relatedCounts, actions]
      properties:
        id:
          type: string
        type:
          type: string
          description: "Document type (law, decision, commentary, rechtssatz)"
        title:
          type: string
        subtitle:
          type: string
          description: "Composed subtitle (e.g. 'Switzerland · Federal law')"
        snippet:
          type: string
          description: Highlighted text snippet matching the query
        structuralContext:
          type: string
          description: "Breadcrumb-style structural path (e.g. 'OR › Gesellschaftsrecht › Verantwortlichkeit')"
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
          default: []
        metadataRows:
          type: array
          items:
            $ref: "#/components/schemas/MetadataRow"
          default: []
        relatedCounts:
          type: array
          items:
            $ref: "#/components/schemas/RelatedCount"
          default: []
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
          default: []
        contentLanguage:
          $ref: "#/components/schemas/ContentLanguage"
        recordKind:
          type: string
          enum: [legal_document, commentary_insight]
          description: |
            Discriminator from the search projection (PR #441). The
            frontend keys its result-card variant off this OR off
            `type === "commentary"` (back-compat fallback).
        sourceDocumentIds:
          type: array
          items:
            type: string
            pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
          description: |
            Canonical primary documents this commentary references
            (#425). Empty / undefined for `legal_document` rows. The
            frontend renders these as source-document links on
            commentary cards.

    # ─── Shared ViewModel Components ───
    Badge:
      type: object
      required: [label, colorKey]
      properties:
        label:
          type: string
        colorKey:
          type: string
        iconKey:
          type: string

    MetadataRow:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        iconKey:
          type: string
        visibility:
          type: string
          description: |
            Optional UI density hint for the detail MetadataList. When omitted, the client derives
            visibility from document type and label heuristics (`metadata-visibility.ts`).
          enum: [always, default, expanded]

    RelatedCount:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: integer
        href:
          type: string

    Action:
      type: object
      required: [label, icon]
      properties:
        label:
          type: string
        icon:
          type: string
        href:
          type: string

    ContentLanguage:
      type: object
      required: [display, original, isTranslation]
      properties:
        display:
          type: string
        original:
          type: string
        isTranslation:
          type: boolean
        label:
          type: string

    # ─── Filter Facets ───
    FilterFacetView:
      type: object
      required: [key, label, type, options]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [checkbox, chip, dropdown, date, toggle]
        options:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"
          default: []

    FilterOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer
        iconKey:
          type: string

    # ─── Search Context ───
    SearchContextView:
      type: object
      required: [jurisdictions, languages, sourceTypes]
      properties:
        jurisdictions:
          type: array
          items:
            $ref: "#/components/schemas/ContextChip"
          default: []
        languages:
          type: array
          items:
            $ref: "#/components/schemas/ContextChip"
          default: []
        sourceTypes:
          type: array
          items:
            $ref: "#/components/schemas/ContextChip"
          default: []
        exactMatches:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultView"
          default: []

    ContextChip:
      type: object
      required: [key, label, active]
      properties:
        key:
          type: string
        label:
          type: string
        active:
          type: boolean
        iconKey:
          type: string

    # ─── Detail View ───
    DetailView:
      type: object
      required: [id, type, title, subtitle, metadata, tabs, relatedGroups, references, annotations]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        subtitle:
          type: string
        breadcrumbs:
          type: array
          items:
            type: string
        metadata:
          type: array
          items:
            $ref: "#/components/schemas/MetadataRow"
          default: []
        content:
          type: string
          description: |
            The document's body text as plain text: paragraphs are separated by
            blank lines and the string carries no markup. Absent when the
            document has no body, in which case the `content` tab is also
            omitted from `tabs`.

            This is what document-intelligence actually produces:
            `NormalizedDocumentIR.body_text` (`normalize/ir.py`) joins the
            parsed blocks with `\n\n` after stripping tags, the canonical row
            carries it as a `str` (`canonical/models.py`), and the projection
            indexes it verbatim into the `text`-mapped `content` field.

            ADR-0010 proposes DoclingDocument JSON here instead, and this field
            was previously typed `object` on that basis. That ADR is still
            `Proposed` and unimplemented — no code path emits a DoclingDocument,
            and the Document Service's `/lean` endpoint returns a canonical row
            despite its own spec. Revisit this type if ADR-0010 is accepted and
            actually built; until then `string` is what the BFF can honestly
            promise.
        contentLanguage:
          $ref: "#/components/schemas/ContentLanguage"
        tabs:
          type: array
          items:
            $ref: "#/components/schemas/TabView"
          default: []
        relatedGroups:
          type: array
          items:
            $ref: "#/components/schemas/RelatedGroup"
          default: []
        references:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceGroup"
          default: []
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/Annotation"
          default: []
        localStructure:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LocalStructureItem"

    TabView:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer

    RelatedGroup:
      type: object
      required: [label, items]
      properties:
        label:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelatedItem"
          default: []

    RelatedItem:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        badge:
          $ref: "#/components/schemas/Badge"
        href:
          type: string

    ReferenceGroup:
      type: object
      required: [label, items]
      properties:
        label:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceItem"
          default: []

    ReferenceItem:
      type: object
      required: [id, title, citation]
      properties:
        id:
          type: string
        title:
          type: string
        citation:
          type: string
        href:
          type: string

    CitedByResponse:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CitationLink"
          default: []
        total:
          type: integer

    CitationLink:
      type: object
      required: [citation_id, source_document_id, citation_text, resolved]
      properties:
        citation_id:
          type: string
        source_document_id:
          type: string
        source_section_id:
          type: string
        target_document_id:
          type: string
        target_title:
          type: string
        target_subtitle:
          type: string
        target_document_type:
          type: string
        citation_text:
          type: string
        citation_type:
          type: string
        resolved:
          type: boolean

    NormLevel:
      type: string
      description: |
        Rank in the hierarchy of norms. Ordering is authoritative and lives in
        `contracts/vocabularies/norm-level.json` — lower `rank` = higher
        authority. `constitutional` is the one level a document declares for
        itself: the constitution is enacted by the same federal jurisdiction as
        an ordinary statute, so it cannot be derived from the jurisdiction.
      enum:
        - constitutional
        - international
        - federal
        - cantonal
        - municipal

    InForceState:
      type: string
      description: |
        Temporal validity of a norm on the requested `in_force_at` date.
        Deliberately four-valued: `unknown` ("marked repealed, but we do not hold
        the date", or "we hold no start date") is a correct answer, and inventing
        `in_force` from a missing field is the confident fabrication the platform
        exists to prevent.
      enum:
        - in_force
        - not_yet_in_force
        - repealed
        - unknown

    NormHierarchyView:
      type: object
      required: [jurisdiction, levels, coverage]
      properties:
        jurisdiction:
          $ref: "#/components/schemas/NormHierarchyJurisdiction"
        in_force_at:
          type: string
          format: date
          description: Echoes the requested as-of date when one was given.
        levels:
          type: array
          description: Ordered most authoritative first (ascending `rank`).
          items:
            $ref: "#/components/schemas/NormHierarchyLevel"
        coverage:
          $ref: "#/components/schemas/NormHierarchyCoverage"

    NormHierarchyJurisdiction:
      type: object
      required: [jurisdiction_id, name, slug, level]
      properties:
        jurisdiction_id:
          type: string
          pattern: '^jur_[a-z0-9_]+$'
        name:
          type: string
        slug:
          type: string
        level:
          $ref: "#/components/schemas/NormLevel"

    NormHierarchyLevel:
      type: object
      required: [level, rank, label, jurisdiction_ids, total, documents]
      properties:
        level:
          $ref: "#/components/schemas/NormLevel"
        rank:
          type: integer
          description: Lower = higher authority.
        label:
          type: string
          description: Localized label for the level (Accept-Language).
        jurisdiction_ids:
          type: array
          description: The jurisdictions whose law sits at this level for this place.
          items:
            type: string
            pattern: '^jur_[a-z0-9_]+$'
        total:
          type: integer
          description: Norms held at this level, BEFORE `documents` was capped by `limit`.
        documents:
          type: array
          items:
            $ref: "#/components/schemas/NormSummary"

    CoverageDimension:
      type: string
      description: |
        The dimension coverage is bucketed by. `authority` is backed by
        `authority_ids`, which is sparse on legal documents — see
        `documents_without_group_key`.
      enum: [jurisdiction, authority, document_type, level]
      default: jurisdiction

    CoverageHolding:
      type: string
      description: |
        Whether the corpus holds anything for the group.

        `not_held` means **the search index contains no document matching this
        scope** — a claim about our holdings and nothing more. It is NOT a claim
        that the norm does not exist or that no such law was enacted (ADR-0042).

        This enum has exactly two values by design. No value meaning "confirmed
        absent in law" exists, and adding one requires revisiting ADR-0042.
      enum: [held, not_held]

    CorpusCoverageView:
      type: object
      required:
        [basis, as_of, group_by, scope, total_documents, groups, documents_without_group_key]
      properties:
        basis:
          type: string
          enum: [index]
          description: |
            The evidentiary base of this answer. `index` = derived solely from the
            search index — what we hold. It does not incorporate acquisition intent,
            source configuration or run history, which are platform-control's
            (ADR-0042 §4). Present as a field, not only as prose, so a caller can
            check the basis without reading documentation.
        as_of:
          type: string
          format: date-time
          description: When this answer was computed. The index may have changed since.
        group_by:
          $ref: "#/components/schemas/CoverageDimension"
        scope:
          $ref: "#/components/schemas/CoverageScope"
        total_documents:
          type: integer
          description: |
            Documents in the index matching the scope. This is NOT the sum of the
            groups' counts: `jurisdiction_ids` and `authority_ids` are multi-valued,
            so one document can land in several groups, and a document missing the
            grouping field lands in none.
        documents_without_group_key:
          type: integer
          description: |
            Documents matching the scope that carry no value for `group_by` and so
            appear in no group. Reported rather than dropped: `authority_ids` is
            optional on legal documents, so grouping by `authority` can silently
            omit a large share of the corpus, and a caller summing groups would
            otherwise under-count without being told.
        unrecognized_jurisdiction_ids:
          type: array
          description: |
            Requested `jurisdiction_id`s the platform does not recognize. They
            produce **no group** — returning `not_held` for them would answer a
            coverage question that was never asked, when the truth is that the id
            is unknown (a typo, or a jurisdiction we do not model). "We hold
            nothing for `jur_ch_zurich`" reads as a coverage fact; it is not one.
          items:
            type: string
        groups:
          type: array
          description: |
            One entry per explicitly requested key (even when empty — that is the
            refusal signal) plus one per non-empty bucket. Ordered by `documents`
            descending, then by `key`.
          items:
            $ref: "#/components/schemas/CoverageGroup"

    CoverageScope:
      type: object
      description: Echoes the filters this answer was computed under.
      properties:
        jurisdiction_ids:
          type: array
          items: { type: string }
        authority_ids:
          type: array
          items: { type: string }
        document_types:
          type: array
          items: { type: string }
        levels:
          type: array
          items:
            $ref: "#/components/schemas/NormLevel"
        in_force_at:
          type: string
          format: date

    CoverageGroup:
      type: object
      required: [key, documents, holding, documents_without_repeal_date]
      properties:
        key:
          type: string
          description: The bucket value — a jurisdiction id, authority id, document type, or norm level.
        label:
          type: string
          description: |
            Human-readable name, when the platform has one (jurisdictions and levels
            resolve against the vocabularies; authorities and document types do not).
            Absent means no label is known — never a fallback to `key` dressed up as one.
        documents:
          type: integer
          description: Documents held in this group under the scope. `0` when `holding` is `not_held`.
        holding:
          $ref: "#/components/schemas/CoverageHolding"
        last_processed_at:
          type: string
          format: date-time
          description: |
            When the newest document in this group entered the corpus
            (`max(processed_at)`).

            **This is not a currency guarantee.** It says when we last ingested
            something here, not when we last checked the source, and therefore not
            whether newer law exists that we have missed. Absent when the group holds
            nothing. Named `last_processed_at` rather than `last_updated_at` because
            the field is exactly as strong as its name (ADR-0042 §3).
        documents_without_repeal_date:
          type: integer
          description: |
            Documents in this group with no `in_force_until`. Absence of that date
            means "not known to be repealed", which is not the same as "never
            repealed" — so this number is how much of the group's in-force standing
            is assumed rather than known. Under `in_force_at` it is the size of the
            benefit of the doubt.
        source_version_ids:
          type: array
          description: |
            Source versions that produced the documents in this group — the
            provenance half of #709's "as of when, from which source version".
            Capped at 25; `source_version_count` reports the true total.
          items:
            type: string
        source_version_count:
          type: integer
          description: Distinct source versions behind this group, before `source_version_ids` was capped.

    NormHierarchyCoverage:
      type: object
      required: [covered_levels, missing_levels]
      properties:
        covered_levels:
          type: array
          items:
            $ref: "#/components/schemas/NormLevel"
        missing_levels:
          type: array
          description: |
            Levels that bind this place but for which the corpus holds nothing.
            An agent must refuse rather than reason past one of these.
          items:
            $ref: "#/components/schemas/NormLevel"

    NormSummary:
      type: object
      required: [document_id, title, jurisdiction_ids]
      properties:
        document_id:
          type: string
        title:
          type: string
        document_type:
          type: string
        official_citation:
          type: string
        jurisdiction_ids:
          type: array
          items:
            type: string
        effective_date:
          type: string
          format: date
        in_force_from:
          type: string
          format: date
          description: First date the norm was in force. Falls back to `effective_date`.
        in_force_until:
          type: string
          format: date
          description: |
            Last date the norm WAS in force (inclusive). Absent means "not known
            to be repealed" — which is not the same as "never repealed".
        in_force_state:
          $ref: "#/components/schemas/InForceState"

    Annotation:
      type: object
      required: [id, label, text]
      properties:
        id:
          type: string
        label:
          type: string
        text:
          type: string
        type:
          type: string

    LocalStructureItem:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        depth:
          type: integer
        active:
          type: boolean

    SectionSummary:
      type: object
      properties:
        section_id:
          type: string
        title:
          type: string
        ordinal:
          type: integer
        depth:
          type: integer
        content_preview:
          type: string
          description: First 200 characters of section content

    CitationTarget:
      description: |
        A norm that citations can address — one row of the `citation-targets`
        index. `{identifier_type}:{identifier_value}` is the canonical key that
        document-intelligence's `normalize_citation()` emits, so it is the join
        key of the whole citation graph.
      type: object
      required: [document_id, identifier_type, identifier_value]
      properties:
        document_id:
          description: The document that IS this norm.
          type: string
        identifier_type:
          type: string
          example: sr
        identifier_value:
          type: string
          example: "210"
        title:
          type: string
        document_type:
          type: string
        jurisdiction:
          type: string

    CitationEdge:
      description: A citation edge — a citing document, and the reference it carries.
      type: object
      required: [citation_id, source_document_id, citation_text]
      properties:
        citation_id:
          type: string
        source_document_id:
          description: The document doing the citing.
          type: string
        source_section_id:
          type: string
        citation_text:
          type: string
          example: SR 210
        citation_type:
          type: string
        normalized_reference:
          description: The canonical key this citation resolves to, if it is a deterministic type.
          type: [string, "null"]
          example: sr:210
        target_document_id:
          type: string
        target_title:
          type: string

    ResolveCitationResponse:
      type: object
      required: [query, normalized_reference, resolved, unresolved_reason, targets]
      properties:
        query:
          type: string
        normalized_reference:
          description: The canonical key `query` normalizes to; null for a fuzzy citation.
          type: [string, "null"]
        resolved:
          type: boolean
        unresolved_reason:
          description: |
            Why an unresolved citation is unresolved. The distinction is load-bearing:
            `not_normalizable` is an EXTRACTOR gap (the citation form is fuzzy),
            `no_target_in_corpus` is a COVERAGE gap (the key is valid, the norm is
            simply not ingested). Collapsing both into a bare `resolved: false` is how
            a citation graph ends up with silently missing edges.
          type: [string, "null"]
          enum: [not_normalizable, no_target_in_corpus, null]
        targets:
          type: array
          items:
            $ref: "#/components/schemas/CitationTarget"
          default: []

    FindCitingResponse:
      type: object
      required: [query, normalized_references, citing, total]
      properties:
        query:
          type: string
        normalized_references:
          description: The canonical keys the queried norm is addressable by.
          type: array
          items:
            type: string
          default: []
        citing:
          type: array
          items:
            $ref: "#/components/schemas/CitationEdge"
          default: []
        total:
          type: integer

    IndexedProjectionDocument:
      type: object
      required:
        - document_id
      properties:
        document_id:
          type: string
          pattern: "^doc_[0-9a-hjkmnp-tv-z]{26}$"
        document_revision:
          type: integer
          minimum: 1
        processing_manifest_id:
          type: string
        source_id:
          type: string
        source_version_id:
          type: string
        run_id:
          type: string
        title:
          description: Indexed title, so a dry-run reconcile report names the document a human would recognize.
          type: string

    IndexedProjectionDocumentPage:
      type: object
      required:
        - data
        - limit
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IndexedProjectionDocument"
        limit:
          type: integer
        next_after:
          description: Cursor to pass as `after` for the next page. Absent when the walk is complete.
          type: string

    CitationGraphStats:
      type: object
      required:
        - citations_total
        - citations_with_key
        - citations_resolved
        - resolution_rate
        - unresolved_by_type
      properties:
        citations_total:
          description: Every citation extracted into the citations index.
          type: integer
        citations_with_key:
          description: Citations DI could normalize to a canonical key — the edge candidates.
          type: integer
        citations_resolved:
          description: Citations whose key addresses a norm actually in the corpus — real edges.
          type: integer
        resolution_rate:
          description: citations_resolved / citations_total (0..1). The graph's edge coverage.
          type: number
          format: float
        unresolved_by_type:
          description: |
            The unresolved remainder, attributed. Keys are `citation_type` values for
            citations DI could not normalize, plus `unresolved_target` for citations
            that carry a valid key addressing a norm not in the corpus.
          type: object
          additionalProperties:
            type: integer
