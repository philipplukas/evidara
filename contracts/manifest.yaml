version: "2.21.0"
last_reviewed: "2026-07-20"
owner: "Platform Team"

mvp_flow:
  name: "ingest_to_searchable_detail"
  description: "source create -> version approve -> run -> DI outputs -> searchable document detail"
  sequence:
    - platform_control.create_source
    - platform_control.create_version
    - platform_control.approve_version
    - platform_control.create_run
    - document_intelligence.publish_status
    - document_intelligence.publish_processed
    - legal_search.project_document
    - legal_search.search_document_detail

apis:
  platform_control:
    # GENERATED from the FastAPI app by scripts/generate_platform_control_contract.py
    # (#618) — do not hand-edit the file. `version` must equal
    # platform_control.openapi.API_VERSION, which is what the app serves as
    # info.version; check_contract_manifest.py compares the two.
    file: "contracts/api/platform-control.openapi.yaml"
    version: "0.16.0"
    locked_paths:
      - "/v1/sources"
      - "/v1/sources/{source_id}/versions"
      - "/v1/versions/{source_version_id}/approve"
      - "/v1/runs"
      - "/v1/runs/{run_id}"
      - "/v1/runs/{run_id}/processing-status"
      - "/v1/runs/{run_id}/document-lifecycle"
      - "/v1/corpora"
      - "/v1/corpora/{corpus_id}"
      - "/v1/corpora/{corpus_id}/archive"
  document_intelligence:
    file: "contracts/api/document-intelligence-runtime.openapi.yaml"
    version: "0.1.0"
  legal_search:
    file: "contracts/api/legal-search.openapi.yaml"
    # 0.7.0: `DetailView.content` on the locked `/v1/documents/{id}` path
    # changed from object (DoclingDocument JSON, ADR-0010) to string (the
    # document body as plain text). Breaking, and on a 0.x line a breaking
    # change takes the minor.
    # 0.9.0: adds `/v1/coverage` (ADR-0042) — the corpus-coverage read model
    # ADR-0033 §2's refusal capability needs. Additive, so a minor. Deliberately
    # NOT locked while its shape is validated against real agent use; lock it
    # once an MCP tool (ADR-0033 §3) depends on it.
    version: "0.9.0"
    locked_paths:
      - "/v1/search"
      - "/v1/documents/{id}"
      - "/v1/documents/{document_id}/cited_by"
      - "/v1/norm-hierarchy/{jurisdiction_id}"
      - "/v1/projections/events/history"

events:
  - name: "artifact_bundle.available"
    schema: "contracts/events/artifact-bundle-available.schema.json"
    event_version: "1.0.0"
    producer: "platform-control"
    consumers:
      - "document-intelligence"
  - name: "document.processing_status.updated"
    schema: "contracts/events/document-processing-status-updated.schema.json"
    event_version: "1.0.0"
    producer: "document-intelligence"
    consumers:
      - "platform-control"
  - name: "document.processed"
    schema: "contracts/events/document-processed.schema.json"
    event_version: "1.0.0"
    producer: "document-intelligence"
    consumers:
      - "platform-control"
      - "legal-search"

compatibility_policy:
  additive_change: "minor"
  breaking_change: "major"
  enforcement: "fail-ci-on-breaking-without-version-bump"
