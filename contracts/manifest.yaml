# 2.32.0: drops `info.license.identifier: UNLICENSED` from the three
# hand-authored contracts. `UNLICENSED` is npm vocabulary with no SPDX
# registration, and OpenAPI 3.1 requires `info.license.identifier` to be a
# valid SPDX expression when present — so the field was non-conformant
# regardless of which licence the project eventually adopts. `name:
# Proprietary` is kept and is conformant on its own. No API shape changed, so
# no `apis.*.version` moved.
# 2.34.0: platform-control 0.23.0 — the wizard human gate expires into a terminal
# state (#560). Additive; no locked path changed shape.
# 2.35.0: platform-control 0.24.0 — the enablement guard moves server-side (#854).
# 2.36.0: platform-control 0.25.0 — `/health` reports the commit the process was
# built from. Additive and unauthenticated; a reader that ignores `build` sees
# exactly what it saw before.
# 2.37.0: `document.processed` carries `payload.stages` — per-stage timings and
# counts for the document, denormalised from the processing manifest so the
# control plane can render them without reading the lakehouse. Additive and
# optional: a consumer that ignores it is unaffected, and an absent array means
# "not recorded", never "no stages ran".
# 2.38.0: platform-control 0.27.0 — the coverage ledger gains refusal counts, and
# a work-queue read on top of it (#907). Additive throughout; no locked path
# changed shape.
# 2.39.0: platform-control 0.28.0 — run decision support moves out of the admin's
# TypeScript and into the contract (#908), and pipeline stages gain
# `not_applicable`. See the API note below: the stage-status change is a
# CORRECTION, not merely an addition.
# 2.40.0: platform-control 0.29.0 — the coverage work queue reads the whole
# estate instead of one 500-row page, and reports sourceless jurisdictions as a
# count rather than as rows (#928). Additive on the response; a consumer that
# ignores the new field sees a SHORTER and more useful `data`.
# 2.41.0: platform-control 0.30.0 — REMOVES `POST /webhooks/slack/interactions`
# and the `slack` tag (#852). The route was mounted unauthenticated and never
# signature-verified; it signalled approve/reject to a `workflow_id` taken from the
# request body, bypassing `WizardService`. It had no sender and, with the in-memory
# orchestrator, no effect. A removal, so not additive — but no client existed.
# 2.42.0: platform-control 0.31.0 — the coverage work queue states `proposed_action`
# and `actor` per item (#964). The reason->action mapping and the agent/human split
# lived only in `tools/evidara-cli`, so a second client had to copy or re-derive
# them — and derived from the queue's own SORT order, `refusals_outstanding` +
# `never_acquired` (the normal shape of a refusal) classified as agent-actionable.
# Additive: a consumer ignoring both fields behaves exactly as before.
version: "2.42.0"
last_reviewed: "2026-07-20"
owner: "Platform Team"

mvp_flow:
  name: "ingest_to_searchable_detail"
  description: "source create -> version approve -> run -> DI outputs -> searchable document detail"
  sequence:
    - platform_control.create_source
    - platform_control.create_version
    - platform_control.approve_version
    - platform_control.create_run
    - document_intelligence.publish_status
    - document_intelligence.publish_processed
    - legal_search.project_document
    - legal_search.search_document_detail

apis:
  platform_control:
    # GENERATED from the FastAPI app by scripts/generate_platform_control_contract.py
    # (#618) — do not hand-edit the file. `version` must equal
    # platform_control.openapi.API_VERSION, which is what the app serves as
    # info.version; check_contract_manifest.py compares the two.
    file: "contracts/api/platform-control.openapi.yaml"
    # 0.21.0: adds `published_artifacts_count` and `publication_withheld` to the run
    # responses on the locked `/v1/runs` and `/v1/runs/{run_id}` paths (#853).
    # Additive: both fields have defaults and a reader that ignores them sees exactly
    # what it saw before.
    # 0.22.0: adds `quarantined` to the processing-status enum on the locked
    # `/v1/runs/{run_id}/processing-status` path (#731, ADR-0047). Additive: a
    # reader that does not know the value only sees a status it never sent.
    # 0.23.0: adds the wizard human gate's terminal states, so an expired gate
    # resolves instead of hanging forever (#560). Additive: existing gate
    # outcomes are unchanged.
    # 0.24.0: the ADR-0030 config-key flip guard moves server-side (#854). The
    # enablement PUT now takes `evidence_run_id` and the two acknowledgements,
    # answers 409 with machine-readable `refusals[].code`, and reports `applied` /
    # `needs_human` / `evidence_binding`. Additive on the wire — but `{enabled, note}`
    # alone can no longer arm a key, which is the point.
    # 0.25.0: `/health` gains `build` (`git_sha`, `build_date`), baked at image
    # build from the same `github.sha` the image is tagged with. Additive — the
    # field is always present and reports `"unknown"` outside a released image
    # rather than being omitted, so consumers never have to distinguish "no
    # version" from "old server".
    # 0.26.0: adds the optional `stages` to the lifecycle-event response on the
    # locked `/v1/runs/{run_id}/document-lifecycle` path (#905) — per-stage DI
    # timings and counts. Additive: `null` is the value for every row written
    # before this, and it means "document-intelligence recorded no ledger", NOT
    # "the pipeline ran no stages". A reader that ignores the field is unaffected;
    # a reader that renders it must render `null` as unrecorded, never as zero.
    # 0.27.0: the acquisition-coverage ledger states what a jurisdiction REFUSED
    # alongside what it holds, and a new `GET /v1/acquisition-coverage/queue`
    # turns the ledger into a worklist (#907). Additive on an unlocked path.
    #
    # `refused_runs` and `quarantined_documents` are two fields in two units and
    # must never be summed or netted off coverage: a refused run and a
    # quarantined document are different things, and this contract already
    # refuses to subtract a unit count from a document count. A refusal is a
    # decision the platform made, not a hole in the numerator.
    #
    # The queue carries NO score and no chosen "primary" reason. Position is
    # ordered by a stated convention returned as `ordering`, because a priority
    # number needs a denominator exactly as much as the completeness percentage
    # ADR-0042 rejected. A consumer that wants a ranking applies its own.
    # 0.33.0: `register_source` splits in the coverage queue — a new
    # `no_source_template_available` reason and `register_source_from_template`
    # action, for a sourceless jurisdiction a blueprint template already names
    # (#736 said registering needs a deploy; that is true only without a template).
    # Additive on both enums: a reader that does not know the values only sees
    # ones it never sent. 0.33.0 and not 0.32.0 because that number was already
    # taken by the fedlex-enumeration change in the same batch — two PRs picking
    # the same successor merge cleanly and then describe two different surfaces
    # under one version, which is the #913 failure seen from the API-version side.
    version: "0.35.0"
    locked_paths:
      - "/v1/sources"
      - "/v1/sources/{source_id}/versions"
      - "/v1/versions/{source_version_id}/approve"
      - "/v1/runs"
      - "/v1/runs/{run_id}"
      - "/v1/runs/{run_id}/processing-status"
      - "/v1/runs/{run_id}/document-lifecycle"
      - "/v1/corpora"
      - "/v1/corpora/{corpus_id}"
      - "/v1/corpora/{corpus_id}/archive"
  document_intelligence:
    file: "contracts/api/document-intelligence-runtime.openapi.yaml"
    version: "0.1.0"
  legal_search:
    file: "contracts/api/legal-search.openapi.yaml"
    # 0.7.0: `DetailView.content` on the locked `/v1/documents/{id}` path
    # changed from object (DoclingDocument JSON, ADR-0010) to string (the
    # document body as plain text). Breaking, and on a 0.x line a breaking
    # change takes the minor.
    # 0.9.0: adds `/v1/coverage` (ADR-0042) — the corpus-coverage read model
    # ADR-0033 §2's refusal capability needs. Additive, so a minor. Deliberately
    # NOT locked while its shape is validated against real agent use; lock it
    # once an MCP tool (ADR-0033 §3) depends on it.
    # 0.10.0: splits `DetailMetadataRow` out of `MetadataRow` and makes
    # `visibility` required on it (#787). Touches the locked
    # `/v1/documents/{id}` response. Not breaking for readers — a response
    # field going from optional to required only strengthens what a client can
    # rely on, and the BFF already set it on every row. The search-card
    # `MetadataRow` drops the optional `visibility` it never populated.
    # 0.11.0: adds the optional `DetailView.regeste` — the official headnote of
    # a court decision (#760). Additive and optional on the locked
    # `/v1/documents/{id}` path: no producer outside the seed scripts emits the
    # underlying index field, so every reader must keep handling its absence.
    # 0.12.0: makes the document reader's structure real (#1040), on the locked
    # `/v1/documents/{id}` path. `LocalStructureItem.text` carries the section
    # text the mapper was dropping; `ReferenceItem` gains `targetDocumentId`,
    # `unresolvedReason` and a REQUIRED `resolved`. Required rather than
    # optional because an absent boolean reads as "not unresolved", which is
    # the exact defect the field exists to close (ADR-0052) — and, as with
    # 0.10.0's `visibility`, a response field becoming required only
    # strengthens what a reader may rely on.
    version: "0.12.0"
    locked_paths:
      - "/v1/search"
      - "/v1/documents/{id}"
      - "/v1/documents/{document_id}/cited_by"
      - "/v1/norm-hierarchy/{jurisdiction_id}"
      - "/v1/projections/events/history"

events:
  - name: "artifact_bundle.available"
    schema: "contracts/events/artifact-bundle-available.schema.json"
    event_version: "1.0.0"
    producer: "platform-control"
    consumers:
      - "document-intelligence"
  - name: "document.processing_status.updated"
    schema: "contracts/events/document-processing-status-updated.schema.json"
    # Stays 1.0.0: this must mirror the schema's `event_version` const, which is
    # the *wire* major (check_contract_manifest.py). `quarantined` was added to
    # the status enum for ADR-0047 (#731) — additive, so the top-level manifest
    # version took the minor bump per compatibility_policy below.
    event_version: "1.0.0"
    producer: "document-intelligence"
    consumers:
      - "platform-control"
  - name: "document.processed"
    schema: "contracts/events/document-processed.schema.json"
    event_version: "1.0.0"
    producer: "document-intelligence"
    consumers:
      - "platform-control"
      - "legal-search"

compatibility_policy:
  additive_change: "minor"
  breaking_change: "major"
  enforcement: "fail-ci-on-breaking-without-version-bump"
