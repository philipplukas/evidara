# Base product workloads (ADR-0029 Slice 5). Environment overlays under
# k8s/gitops/<env> set the namespace, image tags, config, and ingress hosts.
#
# Only contract-allowed kinds appear here (Deployment, Service, Ingress, ExternalSecret;
# see vendor/platform-contract.yaml). The stateful backing services — Postgres,
# OpenSearch, NATS JetStream, MinIO — are platform-owned (MacConfig) or external
# (OpenStack) and are consumed via evidara-config + Vault-backed ExternalSecrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - platform-control-api.yaml
  - platform-control-admin.yaml
  - platform-control-worker.yaml
  - legal-search-api.yaml
  - legal-search-frontend.yaml
  - document-service.yaml
  - di-nats-consumer.yaml
  - projection-bridge.yaml
