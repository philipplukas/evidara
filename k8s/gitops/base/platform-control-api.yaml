apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-control-api
  labels:
    app.kubernetes.io/name: platform-control-api
    app.kubernetes.io/part-of: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-control-api
  template:
    metadata:
      labels:
        app: platform-control-api
        app.kubernetes.io/name: platform-control-api
        app.kubernetes.io/part-of: evidara
    spec:
      containers:
        - name: platform-control-api
          # Tag is set per-environment by the overlay `images:` transformer.
          image: ghcr.io/philipplukas/evidara-platform-control:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidara-config
            - secretRef:
                name: platform-control-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-control-api
  labels:
    app.kubernetes.io/name: platform-control-api
    app.kubernetes.io/part-of: evidara
spec:
  selector:
    app: platform-control-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-control-api
  labels:
    app.kubernetes.io/name: platform-control-api
    app.kubernetes.io/part-of: evidara
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # TODO: real hostname is set per-environment by the overlay host patch.
        - control-api.REPLACE_ME.example
      secretName: platform-control-api-tls
  rules:
    - host: control-api.REPLACE_ME.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-control-api
                port:
                  number: 80
---
# Vault-backed secrets (ADR-0029). The shared-vault ClusterSecretStore and the Vault
# paths/policies are platform-owned (MacConfig); these keys are placeholders to wire.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-control-secrets
  labels:
    app.kubernetes.io/part-of: evidara
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shared-vault
    kind: ClusterSecretStore
  target:
    name: platform-control-secrets
    creationPolicy: Owner
  data:
    - secretKey: PLATFORM_CONTROL_DATABASE_URL
      remoteRef:
        key: evidara/platform-control
        property: database_url
    - secretKey: PLATFORM_CONTROL_S3_ACCESS_KEY_ID
      remoteRef:
        key: evidara/object-storage
        property: access_key_id
    - secretKey: PLATFORM_CONTROL_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: evidara/object-storage
        property: secret_access_key
