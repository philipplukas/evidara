apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-search-frontend
  labels:
    app.kubernetes.io/name: legal-search-frontend
    app.kubernetes.io/part-of: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legal-search-frontend
  template:
    metadata:
      labels:
        app: legal-search-frontend
        app.kubernetes.io/name: legal-search-frontend
        app.kubernetes.io/part-of: evidara
    spec:
      containers:
        - name: legal-search-frontend
          image: ghcr.io/philipplukas/evidara-legal-search-frontend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidara-config
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: legal-search-frontend
  labels:
    app.kubernetes.io/name: legal-search-frontend
    app.kubernetes.io/part-of: evidara
spec:
  selector:
    app: legal-search-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legal-search-frontend
  labels:
    app.kubernetes.io/name: legal-search-frontend
    app.kubernetes.io/part-of: evidara
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - search.REPLACE_ME.example
      secretName: legal-search-frontend-tls
  rules:
    - host: search.REPLACE_ME.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legal-search-frontend
                port:
                  number: 80
