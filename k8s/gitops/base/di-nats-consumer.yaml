apiVersion: apps/v1
kind: Deployment
metadata:
  name: di-nats-consumer
  labels:
    app.kubernetes.io/name: di-nats-consumer
    app.kubernetes.io/part-of: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: di-nats-consumer
  template:
    metadata:
      labels:
        app: di-nats-consumer
        app.kubernetes.io/name: di-nats-consumer
        app.kubernetes.io/part-of: evidara
    spec:
      containers:
        - name: di-nats-consumer
          image: ghcr.io/philipplukas/evidara-document-intelligence-consumer:latest
          # NATS server address comes from evidara-config ($NATS_SERVERS); the rest use
          # consumer defaults (subjects, stream EVIDARA, DLQ). See jobs/nats_consumer.py.
          command: ["sh", "-c", "document_intelligence_nats_consumer --servers \"$NATS_SERVERS\""]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidara-config
            - secretRef:
                name: document-intelligence-secrets
          # liveness = process alive (stays green while retrying a downed broker);
          # readiness = broker reachable, so a waiting consumer is visibly not working (#722).
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: document-intelligence-secrets
  labels:
    app.kubernetes.io/part-of: evidara
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shared-vault
    kind: ClusterSecretStore
  target:
    name: document-intelligence-secrets
    creationPolicy: Owner
  data:
    - secretKey: DI_S3_ACCESS_KEY_ID
      remoteRef:
        key: evidara/object-storage
        property: access_key_id
    - secretKey: DI_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: evidara/object-storage
        property: secret_access_key
