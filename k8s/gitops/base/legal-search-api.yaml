apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-search-api
  labels:
    app.kubernetes.io/name: legal-search-api
    app.kubernetes.io/part-of: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legal-search-api
  template:
    metadata:
      labels:
        app: legal-search-api
        app.kubernetes.io/name: legal-search-api
        app.kubernetes.io/part-of: evidara
    spec:
      containers:
        - name: legal-search-api
          image: ghcr.io/philipplukas/evidara-legal-search-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: evidara-config
            - secretRef:
                name: legal-search-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: legal-search-api
  labels:
    app.kubernetes.io/name: legal-search-api
    app.kubernetes.io/part-of: evidara
spec:
  selector:
    app: legal-search-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legal-search-api
  labels:
    app.kubernetes.io/name: legal-search-api
    app.kubernetes.io/part-of: evidara
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - search-api.REPLACE_ME.example
      secretName: legal-search-api-tls
  rules:
    - host: search-api.REPLACE_ME.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legal-search-api
                port:
                  number: 80
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: legal-search-secrets
  labels:
    app.kubernetes.io/part-of: evidara
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shared-vault
    kind: ClusterSecretStore
  target:
    name: legal-search-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENSEARCH_USERNAME
      remoteRef:
        key: evidara/opensearch
        property: username
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef:
        key: evidara/opensearch
        property: password
