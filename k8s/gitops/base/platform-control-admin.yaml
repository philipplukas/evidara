apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-control-admin
  labels:
    app.kubernetes.io/name: platform-control-admin
    app.kubernetes.io/part-of: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-control-admin
  template:
    metadata:
      labels:
        app: platform-control-admin
        app.kubernetes.io/name: platform-control-admin
        app.kubernetes.io/part-of: evidara
    spec:
      containers:
        - name: platform-control-admin
          image: ghcr.io/philipplukas/evidara-platform-control-admin:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidara-config
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-control-admin
  labels:
    app.kubernetes.io/name: platform-control-admin
    app.kubernetes.io/part-of: evidara
spec:
  selector:
    app: platform-control-admin
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-control-admin
  labels:
    app.kubernetes.io/name: platform-control-admin
    app.kubernetes.io/part-of: evidara
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.REPLACE_ME.example
      secretName: platform-control-admin-tls
  rules:
    - host: admin.REPLACE_ME.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-control-admin
                port:
                  number: 80
