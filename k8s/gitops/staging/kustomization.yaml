# Product workloads for staging (Argo CD path: k8s/gitops/staging). ADR-0029 Slice 5.
# Per docs/migration: staging is the preferred-first environment for real manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evidare-staging

resources:
  - ../base

images:
  - name: ghcr.io/philipplukas/evidara-platform-control
    newTag: staging
  - name: ghcr.io/philipplukas/evidara-platform-control-admin
    newTag: staging
  - name: ghcr.io/philipplukas/evidara-platform-control-worker
    newTag: staging
  - name: ghcr.io/philipplukas/evidara-legal-search-api
    newTag: staging
  - name: ghcr.io/philipplukas/evidara-legal-search-frontend
    newTag: staging
  - name: ghcr.io/philipplukas/evidara-document-intelligence-document-service
    newTag: staging
  - name: ghcr.io/philipplukas/evidara-document-intelligence-consumer
    newTag: staging

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: evidara-config
    literals:
      - PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND=s3
      - PLATFORM_CONTROL_S3_ENDPOINT_URL=http://minio.evidara-platform.svc:9000
      - PLATFORM_CONTROL_S3_REGION=us-east-1
      - PLATFORM_CONTROL_RAW_ARTIFACT_BUCKET=evidara-raw-artifacts-staging
      - DI_S3_ENDPOINT_URL=http://minio.evidara-platform.svc:9000
      - DI_S3_REGION=us-east-1
      - PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND=nats
      - PLATFORM_CONTROL_NATS_SERVERS=nats://nats.evidara-platform.svc:4222
      - PLATFORM_CONTROL_RUN_DISPATCH_BACKEND=worker
      - NATS_SERVERS=nats://nats.evidara-platform.svc:4222
      - OPENSEARCH_NODE=http://opensearch.evidara-platform.svc:9200
      - NEXT_PUBLIC_API_URL=https://search-api.staging.evidara.example
      - NEXT_PUBLIC_CONTROL_PANEL_URL=https://admin.staging.evidara.example

patches:
  - target: { kind: Ingress, name: platform-control-api }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: control-api.staging.evidara.example
      - op: replace
        path: /spec/tls/0/hosts/0
        value: control-api.staging.evidara.example
  - target: { kind: Ingress, name: platform-control-admin }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: admin.staging.evidara.example
      - op: replace
        path: /spec/tls/0/hosts/0
        value: admin.staging.evidara.example
  - target: { kind: Ingress, name: legal-search-api }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: search-api.staging.evidara.example
      - op: replace
        path: /spec/tls/0/hosts/0
        value: search-api.staging.evidara.example
  - target: { kind: Ingress, name: legal-search-frontend }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: search.staging.evidara.example
      - op: replace
        path: /spec/tls/0/hosts/0
        value: search.staging.evidara.example
