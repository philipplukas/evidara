# Swiss communal (Gemeinde) legal-collection portals — the gemeinde_http host
# allow-list, as config rather than code (#632).
#
# BFS/OFS Gemeindenummer -> the commune's legal-collection portal. A blueprint
# template's seed_urls must resolve to the registered `host` (or a subdomain);
# `canton_jurisdiction_id` is the commune's parent canton, which the ADR-0033
# norm-hierarchy walk links municipal documents up to ("which cantonal law
# delegates this competence?"). It varies per commune, so it is registered here.
#
# Registering commune #2's HOST is an edit to this data file — not a Python
# change. That is the half of "adding a commune is a config change, not code"
# which is true. The other half is not: gemeinde_http parses Stadt Zürich's
# Amtliche Sammlung page schema, so a commune on a differently-shaped portal
# needs a parser as well as a row here. See #736 and #784.
#
# It is NOT, however, operator-reachable the way blueprint enablement became in
# #632/ADR-0035: this file ships inside the Python package, so editing it is
# still a repo edit and a deploy. Moving *this* file to the database would not
# by itself change that, because a commune also needs a `source_blueprints.yaml`
# provider template (`bfs_number`, `seed_urls`, `corpus_id`) and a seeded corpus
# — both also in-repo. The blueprint template is the binding constraint, so
# operator-reachable commune registration is a larger move than this file. No
# issue tracks it yet; do not assume one does.
portals:
  261:
    host: www.stadt-zuerich.ch # Stadt Zürich — Amtliche Sammlung (verified)
    canton_jurisdiction_id: jur_ch_zh
