overlays:
  at:
    provider_templates:
      ris_ogd_bundesrecht:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        preferred_formats: [Xml, Html]
        page_size: 20
        max_pages: 50
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
      ris_ogd_bundesrecht_narrow_html:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        applikation: BrKons
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 1
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht_narrow
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
      ris_ogd_bundesrecht_small_batch_html:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        applikation: BrKons
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht_small_batch
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
      firecrawl_justice_portal:
        provider: firecrawl
        mode: crawl
        seed_url: https://www.ris.bka.gv.at/
        include_paths: [/]
        exclude_paths: [/Suche/]
        limit: 100
        max_discovery_depth: 2
        scrape_formats: [markdown, html]
        zero_data_retention: false
        tenant_id: tenant_public
        corpus_id: corpus_public_at_justice_portal
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
  de:
    provider_templates:
      deterministic_http_bundesrecht:
        provider: deterministic_http
        seed_urls:
          - https://www.gesetze-im-internet.de/
        tenant_id: tenant_public
        corpus_id: corpus_public_de_bundesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
  ch:
