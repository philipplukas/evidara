# Blueprint templates for source creation.
#
# `enabled` is the config-owner key of the ADR-0030 two-key lock: the
# run-launch path refuses to dispatch a run for a source version created from a
# template that is not `enabled: true` (the other key is the provider's
# `live_ready` flag in code). The flag FAILS CLOSED — a template that omits it
# is treated as disabled, so a new template is inert until an operator captures
# acceptance-run evidence and turns it on. Every template therefore states its
# value explicitly (enforced by tests/unit/test_blueprint_provider_parity.py).
overlays:
  at:
    provider_templates:
      ris_ogd_bundesrecht:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        preferred_formats: [Xml, Html]
        page_size: 20
        max_pages: 50
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
        enabled: true
      ris_ogd_bundesrecht_narrow_html:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        applikation: BrKons
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 1
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht_narrow
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      ris_ogd_bundesrecht_small_batch_html:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        applikation: BrKons
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht_small_batch
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      firecrawl_justice_portal:
        provider: firecrawl
        mode: crawl
        seed_url: https://www.ris.bka.gv.at/
        include_paths: [/]
        exclude_paths: [/Suche/]
        limit: 100
        max_discovery_depth: 2
        scrape_formats: [markdown, html]
        zero_data_retention: false
        tenant_id: tenant_public
        corpus_id: corpus_public_at_justice_portal
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
        enabled: true
      # Sub-federal: Bundesländer LGBl templates. Reuse the existing RIS OGD
      # provider with per-LGBl applikation codes. Live RIS exposes LGBl per
      # Bundesland via the same API shape as Bundesrecht.
      ris_ogd_lgbl_wien:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/LgblAuth
        applikation: LgblAuthW
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_w_lgbl
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      ris_ogd_lgbl_noe:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/LgblAuth
        applikation: LgblAuthNO
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_noe_lgbl
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
  de:
    provider_templates:
      deterministic_http_bundesrecht:
        provider: deterministic_http
        seed_urls:
          - https://www.gesetze-im-internet.de/
        tenant_id: tenant_public
        corpus_id: corpus_public_de_bundesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      # Major German federal codes — full-text BJNR URLs for proper titles.
      # Index pages give abbreviated titles ("StGB - nichtamtliches
      # Inhaltsverzeichnis"); BJNR pages give full law names.
      deterministic_http_bundesrecht_codes:
        provider: deterministic_http
        seed_urls:
          - https://www.gesetze-im-internet.de/gg/BJNR000010949.html      # Grundgesetz
          - https://www.gesetze-im-internet.de/bgb/BJNR001950896.html     # BGB
          - https://www.gesetze-im-internet.de/stgb/BJNR001270871.html    # StGB
          - https://www.gesetze-im-internet.de/hgb/BJNR002190897.html     # HGB
          - https://www.gesetze-im-internet.de/zpo/BJNR005330950.html     # ZPO
          - https://www.gesetze-im-internet.de/stpo/BJNR006290950.html    # StPO
          - https://www.gesetze-im-internet.de/vwvfg/BJNR012530976.html   # VwVfG
          - https://www.gesetze-im-internet.de/vwgo/BJNR000170960.html    # VwGO
          - https://www.gesetze-im-internet.de/gvg/BJNR005130950.html     # GVG
          - https://www.gesetze-im-internet.de/ao_1977/BJNR006130976.html # AO
          - https://www.gesetze-im-internet.de/bverfgg/BJNR002430951.html # BVerfGG
          - https://www.gesetze-im-internet.de/arbgg/BJNR012670953.html   # ArbGG
          - https://www.gesetze-im-internet.de/inso/BJNR286600994.html    # InsO
          - https://www.gesetze-im-internet.de/betrvg/BJNR000130972.html  # BetrVG
          - https://www.gesetze-im-internet.de/gwb/BJNR252110998.html     # GWB
          - https://www.gesetze-im-internet.de/stvg/BJNR004370909.html    # StVG
          - https://www.gesetze-im-internet.de/sgb_1/BJNR030150975.html   # SGB I
          - https://www.gesetze-im-internet.de/sgb_2/BJNR295500003.html   # SGB II
          - https://www.gesetze-im-internet.de/sgb_3/BJNR059500997.html   # SGB III
          - https://www.gesetze-im-internet.de/sgb_5/BJNR024820988.html   # SGB V
        tenant_id: tenant_public
        corpus_id: corpus_public_de_bundesrecht_codes
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      # Sub-federal: Länder template. Provider scaffold; live adapter
      # lands per-state alongside its first acceptance run.
      bundesland_http_bayern:
        provider: bundesland_http
        bundesland: DE-BY
        seed_url: https://www.gesetze-bayern.de/
        tenant_id: tenant_public
        corpus_id: corpus_public_de_by_landesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: false
  ch:
    provider_templates:
      deterministic_http_fedlex_legislation:
        provider: deterministic_http
        seed_urls:
          - https://www.fedlex.admin.ch/
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_legislation
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de, fr, it]
        document_type_hint: legislation
        enabled: true
      fedlex_sparql_constitution_de:
        provider: fedlex_sparql
        seed_url: https://fedlex.data.admin.ch/eli/cc/1999/404
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_constitution
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      fedlex_sparql_vwvg_de:
        provider: fedlex_sparql
        seed_url: https://fedlex.data.admin.ch/eli/cc/1969/737_757_755
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_vwvg
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      fedlex_sparql_federal_law_batch_de:
        provider: fedlex_sparql
        seed_urls:
          - https://fedlex.data.admin.ch/eli/cc/1999/404
          - https://fedlex.data.admin.ch/eli/cc/1969/737_757_755
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_small_batch
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      # Broad Swiss federal law corpus — major codes and statutes.
      # ELI URIs verified against fedlex.data.admin.ch SPARQL ASK (2026-04-21).
      fedlex_sparql_federal_codes_de:
        provider: fedlex_sparql
        seed_urls:
          - https://fedlex.data.admin.ch/eli/cc/1999/404              # BV (Bundesverfassung)
          - https://fedlex.data.admin.ch/eli/cc/1969/737_757_755      # VwVG
          - https://fedlex.data.admin.ch/eli/cc/24/233_245_233        # ZGB
          - https://fedlex.data.admin.ch/eli/cc/27/317_321_377        # OR
          - https://fedlex.data.admin.ch/eli/cc/54/757_781_799        # SchKG
          - https://fedlex.data.admin.ch/eli/cc/2006/352              # BGG (Bundesgerichtsgesetz)
          - https://fedlex.data.admin.ch/eli/cc/1997/2022_2022_2022   # KVG
          - https://fedlex.data.admin.ch/eli/cc/1995/4093_4093_4093   # AHVG
          - https://fedlex.data.admin.ch/eli/cc/1983/797_797_797      # RPG
          - https://fedlex.data.admin.ch/eli/cc/1984/1122_1122_1122   # USG
          - https://fedlex.data.admin.ch/eli/cc/1993/1945_1945_1945   # URG
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_federal_codes
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      # Federal animal-protection layer — the middle rung of ADR-0033's dog axis.
      # The corpus previously held the constitutional layer (BV) and the Zürich
      # municipal ordinance with nothing between them, so the delegation chain
      # `BV -> TSchG/TSchV -> cantonal Hundegesetz -> communal Vollzugsvorschriften`
      # could not be walked and the question could only be refused.
      #
      # ELI URIs verified against the fedlex SPARQL endpoint (2026-07-21):
      # `jolux:inForceStatus` = enforcement-status/0 (in force) for both, entry
      # into force 2008-09-01. The superseded 1978/1981 acts carry the SAME SR
      # numbers (455 / 455.1) at `/eli/cc/1981/562_562_562` and
      # `/eli/cc/1981/572_572_572` with enforcement-status/3 — selecting by SR
      # number alone picks up repealed law, which is #628's named trap.
      fedlex_sparql_tierschutz_de:
        provider: fedlex_sparql
        seed_urls:
          - https://fedlex.data.admin.ch/eli/cc/2008/414   # TSchG (SR 455), 16.12.2005
          - https://fedlex.data.admin.ch/eli/cc/2008/416   # TSchV (SR 455.1), 23.04.2008
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_tierschutz
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        # Ships shut. The sibling fedlex templates are enabled defaults, but
        # ADR-0030 turns the config key per template *after* that template's own
        # acceptance evidence — an inherited default is not evidence.
        enabled: false
      # ───────────────────────────────────────────────────────────────
      # Swiss federal court decisions (BGer / BVGer) — CH e2e Stream E (#530)
      # Provider `ch_court_decisions` is implemented but has no acceptance
      # evidence (readiness=awaiting_evidence, NOT a scaffold); these templates
      # stay `enabled: false` until an acceptance run captures that evidence and
      # an operator flips both keys (#743).
      # seed_urls are placeholder court landing pages; the real discovery
      # (index_urls) URLs are set at live-enablement. Kept as a trailing block
      # to minimise merge conflict with the cantonal section added by #531.
      # ───────────────────────────────────────────────────────────────
      ch_court_decisions_bger:
        provider: ch_court_decisions
        seed_urls:
          - https://www.bger.ch/
        court: bger
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_bger_decisions
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de, fr, it]
        document_type_hint: decision
        enabled: false
      ch_court_decisions_bvger:
        provider: ch_court_decisions
        seed_urls:
          - https://www.bvger.ch/
        court: bvger
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_bvger_decisions
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de, fr, it]
        document_type_hint: decision
        enabled: false
      # ───────────────────────────────────────────────────────────────
      # Swiss CANTONAL court decisions (ZH / BE / BS) — CH e2e (#531)
      # Reuses the ch_court_decisions provider (no new provider/enum): cantonal
      # rulings are aggregated on entscheidsuche.ch, which is already in the
      # provider's host allow-list. Each template carries a lowercase cantonal
      # `court` hint (zh/be/bs) that flows into the decision metadata, and a
      # cantonal corpus. Provider `ch_court_decisions` is implemented but has no
      # acceptance evidence (readiness=awaiting_evidence, NOT a scaffold); these
      # templates stay `enabled: false` until an operator captures per-canton
      # acceptance-run evidence and flips both keys (#743).
      # The index_urls below are PLACEHOLDER entscheidsuche.ch canton listings
      # and need verification at live-enablement (the exact canton-filter path /
      # or a cantonal court portal host must be confirmed, and a portal host
      # added to the allow-list if used). Kept as a distinct banner section to
      # minimise merge conflict with the federal court block above.
      # ───────────────────────────────────────────────────────────────
      ch_court_decisions_zh:
        provider: ch_court_decisions
        index_urls:
          - https://entscheidsuche.ch/list/ZH
        court: zh
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_zh_court_decisions
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
        enabled: false
      ch_court_decisions_be:
        provider: ch_court_decisions
        index_urls:
          - https://entscheidsuche.ch/list/BE
        court: be
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_be_court_decisions
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de, fr]
        document_type_hint: decision
        enabled: false
      ch_court_decisions_bs:
        provider: ch_court_decisions
        index_urls:
          - https://entscheidsuche.ch/list/BS
        court: bs
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_bs_court_decisions
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
        enabled: false
      # ───────────────────────────────────────────────────────────────
      # Swiss cantonal legislation via each canton's OWN portal (canton_http).
      # Distinct from the Fedlex cantonal-concordat discovery path: this
      # provider scrapes the cantonal systematic collections directly, which
      # surface the bulk of cantonal/"state" legislation. Provider
      # `canton_http` is readiness=scaffold — but note its start_run IS
      # implemented (inherited from PortalHttpProviderBase). It cannot acquire
      # because several cantonal collections are JavaScript SPA portals whose
      # statute text deterministic HTTP never sees (#631); the shared density
      # gate refuses the nav shell rather than reporting success on chrome.
      # The remedy is engineering (SPA rendering or a data endpoint), which is
      # what `scaffold` encodes — so no run of any mode dispatches, not even
      # mode=acceptance (#743). The seed_urls below are placeholder
      # portal URLs and the portal hosts/paths need verification at
      # live-enablement. Kept as a trailing block to minimise merge conflict.
      # ───────────────────────────────────────────────────────────────
      canton_http_zh:
        provider: canton_http
        canton_code: CH-ZH
        seed_urls:
          - https://www.zh.ch/de/politik-staat/gesetze-beschluesse/gesetzessammlung.html
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_zh_legislation
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: false
      canton_http_be:
        provider: canton_http
        canton_code: CH-BE
        seed_urls:
          - https://www.belex.sites.be.ch/
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_be_legislation
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de, fr]
        document_type_hint: legislation
        enabled: false
      canton_http_bs:
        provider: canton_http
        canton_code: CH-BS
        seed_urls:
          - https://www.gesetzessammlung.bs.ch/
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_bs_legislation
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: false
      # ───────────────────────────────────────────────────────────────
      # Swiss CANTONAL legislation via LexFind — #731 / ADR-0033
      #
      # The answer to the `canton_http` scaffolds above, which cannot be made to
      # work: #716 measured that ZH-Lex serves metadata-only pages (`§ = 0` on
      # all 18 sampled, 1879→2026) whose only text link points at
      # `www.notes.zh.ch`, a host that refuses TCP on 443 and 80.
      #
      # LexFind (Schweizerische Staatsschreiberkonferenz) mirrors the same texts
      # of law over an unauthenticated JSON API covering 26 cantons + Bund. The
      # mirror is justified, not assumed: #716 verified the served PDF is
      # md5-identical to the canton's own file, and every record carries
      # `original_url` back to the canton so the citation survives the mirror.
      #
      # DISCOVERY IS A QUERY, NOT AN ENUMERATION. Verified live 2026-07-22:
      # `search_text` must be non-empty, so there is no "list everything" call.
      # A systematic-number prefix is the enumeration strategy — `554` scoped to
      # entity 26 returns the whole ZH animal-protection branch in one request:
      # 554.1 Tierschutzgesetz, 554.11 Tierschutzverordnung, 554.5 Hundegesetz,
      # 554.51 Hundeverordnung. That is exactly ADR-0033's cantonal rung.
      # Broader coverage means more templates with more prefixes, deliberately —
      # each is a scoped, reviewable unit rather than one unbounded sweep.
      #
      # STAYS `enabled: false`. The provider is readiness=awaiting_evidence: the
      # capture path is verified and the search contract is verified, but no
      # operator has captured an ADR-0030 acceptance run. The lock admits
      # `--mode acceptance` precisely so that evidence can be produced without an
      # engineer (#743); flip `enabled` from the admin panel with the evidence
      # attached, not from this file.
      # ───────────────────────────────────────────────────────────────
      lexfind_api_zh_tierschutz:
        provider: lexfind_api
        search_text: "554"
        entity_ids: [26]           # ZH
        language: de
        results_per_page: 100
        max_pages: 5
        min_pdf_bytes: 2000
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_zh_legislation
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: false
      # Second and third cantons on the same provider, and the actual test of
      # #628's metric: the cost of the Nth source. Zero engineering — same
      # provider, same contract, one config act each.
      #
      # NOTE the search shape differs from ZH above, and must. Swiss systematic
      # numbering is PER CANTON, not national: the dog law is 554.5 in ZH,
      # 916.31 in BE and 365.100 in BS. A prefix that enumerates a branch in one
      # canton is meaningless in another, so cross-canton templates search title
      # and keywords instead (both are on in the provider's payload).
      #
      # Both verified live 2026-07-22 against the entity ids below.
      lexfind_api_be_hunde:
        provider: lexfind_api
        search_text: "Hund"
        entity_ids: [4]            # BE — returns 916.31 Hundegesetz,
        language: de               #      916.812 V. über den Tierschutz und die Hunde
        results_per_page: 100
        max_pages: 5
        min_pdf_bytes: 2000
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_be_legislation
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: false
      # Basel-Stadt also carries COMMUNAL law in LexFind — this search returns
      # `BeE 365.100`, a Beschluss der Einwohnergemeindeversammlung, alongside the
      # cantonal acts. That is the municipal rung arriving for free on the
      # cantonal provider, and it does NOT generalise: #716 measured 0 hits for
      # Zürich Gemeindeerlasse. Relevant to #584 as a per-canton opportunity, not
      # a solution.
      lexfind_api_bs_hunde:
        provider: lexfind_api
        search_text: "Hund"
        entity_ids: [6]            # BS — returns 365.100 / 365.110 / 365.101
        language: de               #      and BeE 365.100 (communal)
        results_per_page: 100
        max_pages: 5
        min_pdf_bytes: 2000
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_canton_bs_legislation
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: false
      # ───────────────────────────────────────────────────────────────
      # Swiss COMMUNAL legislation — Stadt Zürich (BFS 261) — #584 / ADR-0033
      # The municipal layer the dog question is decided in. 2,110
      # `jur_ch_gemeinde_*` jurisdictions are seeded; this is the first template
      # that can reach any of them. Deliberately ONE commune: communal law lives
      # on ~2,000 independent sites and national coverage is a separate problem.
      #
      # Unlike the canton_http seed URLs above, this one is VERIFIED (HTTP 200,
      # 2026-07-14): it is the Amtliche Sammlung landing page for AS 554.510,
      # "Vollzugsvorschriften zum Hundegesetz" (Stadtratsbeschluss 31.05.2017,
      # in force 01.09.2017, not repealed). That page carries the metadata; the
      # operative text is a PDF.
      #
      # STAYS `enabled: false`, but the provider's readiness is now `live`: the
      # ADR-0030 acceptance run was captured against live Zürich AS 554.510 on
      # 2026-07-20 with every gate armed and none skipped (#735). The engineering
      # blockers this comment used to give had already landed before that:
      #
      #   - Binary manifestations are carried: `ProviderResource` has `body_bytes`
      #     alongside `body`, with `raw_bytes`/`is_binary` accessors (#590/ADR-0037).
      #   - The layout-aware PDF normaliser exists, and the right-margin Randtitel
      #     splice that made it untrustworthy is fixed (#650, ADR-0041). It is
      #     verified against the real AS 554.510 PDF, not a synthetic fixture —
      #     document-intelligence/tests/test_marginalia.py.
      #
      # What remains is the **config** key, which is the operator's: flip it from
      # the admin panel with the evidence attached
      # (docs/runbooks/evidence/2026-07-20-ch-gemeinde-zuerich-acceptance.md).
      # The code key says the provider works; it does not say this corpus was
      # accepted. See #735 and #628.
      # ───────────────────────────────────────────────────────────────
      gemeinde_http_zh_stadt_hundevorschriften:
        provider: gemeinde_http
        bfs_number: 261
        seed_urls:
          - https://www.stadt-zuerich.ch/de/politik-und-verwaltung/politik-und-recht/amtliche-sammlung/5/554/510.html
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_gemeinde_zuerich_legislation
        extractor_profile_id: exp_legislation_v1
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: false
