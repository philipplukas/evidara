        jurisdiction_id: jur_ch_zh
        provider: lexfind_api
        search_text: "554"
        entity_ids: [26]           # ZH
        language: de
        results_per_page: 100
        max_pages: 5
        min_pdf_bytes: 2000
        tenant_id: tenant_public
