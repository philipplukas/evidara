overlays:
  at:
    provider_templates:
      ris_ogd_bundesrecht:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        preferred_formats: [Xml, Html]
        page_size: 20
        max_pages: 50
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
      ris_ogd_bundesrecht_narrow_html:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        applikation: BrKons
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 1
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht_narrow
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
      ris_ogd_bundesrecht_small_batch_html:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        applikation: BrKons
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht_small_batch
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
      firecrawl_justice_portal:
        provider: firecrawl
        mode: crawl
        seed_url: https://www.ris.bka.gv.at/
        include_paths: [/]
        exclude_paths: [/Suche/]
        limit: 100
        max_discovery_depth: 2
        scrape_formats: [markdown, html]
        zero_data_retention: false
        tenant_id: tenant_public
        corpus_id: corpus_public_at_justice_portal
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
      # Sub-federal: Bundesländer LGBl templates. Reuse the existing RIS OGD
      # provider with per-LGBl applikation codes. Live RIS exposes LGBl per
      # Bundesland via the same API shape as Bundesrecht.
      ris_ogd_lgbl_wien:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/LgblAuth
        applikation: LgblAuthW
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_w_lgbl
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      ris_ogd_lgbl_noe:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/LgblAuth
        applikation: LgblAuthNO
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_noe_lgbl
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
  de:
    provider_templates:
      deterministic_http_bundesrecht:
        provider: deterministic_http
        seed_urls:
          - https://www.gesetze-im-internet.de/
        tenant_id: tenant_public
        corpus_id: corpus_public_de_bundesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
      # Major German federal codes — full-text BJNR URLs for proper titles.
      # Index pages give abbreviated titles ("StGB - nichtamtliches
      # Inhaltsverzeichnis"); BJNR pages give full law names.
      deterministic_http_bundesrecht_codes:
        provider: deterministic_http
        seed_urls:
          - https://www.gesetze-im-internet.de/gg/BJNR000010949.html      # Grundgesetz
          - https://www.gesetze-im-internet.de/bgb/BJNR001950896.html     # BGB
          - https://www.gesetze-im-internet.de/stgb/BJNR001270871.html    # StGB
          - https://www.gesetze-im-internet.de/hgb/BJNR002190897.html     # HGB
          - https://www.gesetze-im-internet.de/zpo/BJNR005330950.html     # ZPO
          - https://www.gesetze-im-internet.de/stpo/BJNR006290950.html    # StPO
          - https://www.gesetze-im-internet.de/vwvfg/BJNR012530976.html   # VwVfG
          - https://www.gesetze-im-internet.de/vwgo/BJNR000170960.html    # VwGO
          - https://www.gesetze-im-internet.de/gvg/BJNR005130950.html     # GVG
          - https://www.gesetze-im-internet.de/ao_1977/BJNR006130976.html # AO
          - https://www.gesetze-im-internet.de/bverfgg/BJNR002430951.html # BVerfGG
          - https://www.gesetze-im-internet.de/arbgg/BJNR012670953.html   # ArbGG
          - https://www.gesetze-im-internet.de/inso/BJNR286600994.html    # InsO
          - https://www.gesetze-im-internet.de/betrvg/BJNR000130972.html  # BetrVG
          - https://www.gesetze-im-internet.de/gwb/BJNR252110998.html     # GWB
          - https://www.gesetze-im-internet.de/stvg/BJNR004370909.html    # StVG
          - https://www.gesetze-im-internet.de/sgb_1/BJNR030150975.html   # SGB I
          - https://www.gesetze-im-internet.de/sgb_2/BJNR295500003.html   # SGB II
          - https://www.gesetze-im-internet.de/sgb_3/BJNR059500997.html   # SGB III
          - https://www.gesetze-im-internet.de/sgb_5/BJNR024820988.html   # SGB V
        tenant_id: tenant_public
        corpus_id: corpus_public_de_bundesrecht_codes
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      # Sub-federal: Länder template. Provider scaffold; live adapter
      # lands per-state alongside its first acceptance run.
      bundesland_http_bayern:
        provider: bundesland_http
        bundesland: DE-BY
        seed_url: https://www.gesetze-bayern.de/
        tenant_id: tenant_public
        corpus_id: corpus_public_de_by_landesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: false
  ch:
    provider_templates:
      deterministic_http_fedlex_legislation:
        provider: deterministic_http
        seed_urls:
          - https://www.fedlex.admin.ch/
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_legislation
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de, fr, it]
        document_type_hint: legislation
      fedlex_sparql_constitution_de:
        provider: fedlex_sparql
        seed_url: https://fedlex.data.admin.ch/eli/cc/1999/404
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_constitution
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
      fedlex_sparql_vwvg_de:
        provider: fedlex_sparql
        seed_url: https://fedlex.data.admin.ch/eli/cc/1969/737_757_755
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_vwvg
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
      fedlex_sparql_federal_law_batch_de:
        provider: fedlex_sparql
        seed_urls:
          - https://fedlex.data.admin.ch/eli/cc/1999/404
          - https://fedlex.data.admin.ch/eli/cc/1969/737_757_755
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_small_batch
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
      # Broad Swiss federal law corpus — major codes and statutes.
      # ELI URIs verified against fedlex.data.admin.ch SPARQL ASK (2026-04-21).
      fedlex_sparql_federal_codes_de:
        provider: fedlex_sparql
        seed_urls:
          - https://fedlex.data.admin.ch/eli/cc/1999/404              # BV (Bundesverfassung)
          - https://fedlex.data.admin.ch/eli/cc/1969/737_757_755      # VwVG
          - https://fedlex.data.admin.ch/eli/cc/24/233_245_233        # ZGB
          - https://fedlex.data.admin.ch/eli/cc/27/317_321_377        # OR
          - https://fedlex.data.admin.ch/eli/cc/54/757_781_799        # SchKG
          - https://fedlex.data.admin.ch/eli/cc/2006/352              # BGG (Bundesgerichtsgesetz)
          - https://fedlex.data.admin.ch/eli/cc/1997/2022_2022_2022   # KVG
          - https://fedlex.data.admin.ch/eli/cc/1995/4093_4093_4093   # AHVG
          - https://fedlex.data.admin.ch/eli/cc/1983/797_797_797      # RPG
          - https://fedlex.data.admin.ch/eli/cc/1984/1122_1122_1122   # USG
          - https://fedlex.data.admin.ch/eli/cc/1993/1945_1945_1945   # URG
        sparql_endpoint: https://fedlex.data.admin.ch/sparqlendpoint
        preferred_languages: [de]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_ch_fedlex_federal_codes
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
  fr:
    provider_templates:
      deterministic_http_legifrance_codes:
        provider: deterministic_http
        seed_urls:
          - https://www.legifrance.gouv.fr/
        tenant_id: tenant_public
        corpus_id: corpus_public_fr_legifrance_codes
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [fr]
        document_type_hint: legislation
  it:
    provider_templates:
      deterministic_http_normattiva_legislation:
        provider: deterministic_http
        seed_urls:
          - https://www.normattiva.it/
        tenant_id: tenant_public
        corpus_id: corpus_public_it_normattiva_legislation
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [it]
        document_type_hint: legislation
      # Sub-federal: regione template. Provider scaffold; live adapter
      # lands per-regione alongside its first acceptance run.
      regione_http_lombardia:
        provider: regione_http
        regione: IT-25
        seed_url: https://normelombardia.consiglio.regione.lombardia.it/
        tenant_id: tenant_public
        corpus_id: corpus_public_it_lombardia_leggi
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [it]
        document_type_hint: legislation
        enabled: false
  eu:
    # EUR-Lex SPARQL provider resolves ELI URIs via the Cellar SPARQL endpoint
    # and fetches HTML manifestations. Provider is live_ready=True; templates
    # are enabled for acceptance-run evidence capture.
    provider_templates:
      eur_lex_sparql_regulation_en:
        provider: eur_lex_sparql
        seed_url: http://data.europa.eu/eli/reg/2016/679/oj
        sparql_endpoint: http://publications.europa.eu/webapi/rdf/sparql
        preferred_languages: [en]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_eu_eurlex_regulation
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [en]
        document_type_hint: legislation
        enabled: true
      eur_lex_sparql_directive_en:
        provider: eur_lex_sparql
        seed_url: http://data.europa.eu/eli/dir/2019/790/oj
        sparql_endpoint: http://publications.europa.eu/webapi/rdf/sparql
        preferred_languages: [en]
        query_mode: work_to_expression
        max_expressions: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_eu_eurlex_directive
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [en]
        document_type_hint: legislation
        enabled: true
