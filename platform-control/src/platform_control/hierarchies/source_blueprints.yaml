      # ───────────────────────────────────────────────────────────────
      # WHOLE-CORPUS enumeration — ZH, the first template that holds a canton
      # rather than a branch (#816).
      #
      # `enumeration: systematic_digit_union` ignores `search_text` and instead
      # runs one query per digit 0-9 over systematic numbers, deduplicated by tol
      # id. Matching is `contains` and every systematic number carries a digit, so
      # the union is the entire entity by construction. Measured on ZH 2026-07-28:
      # 1377 unique records against a published total of 1377, in ~40 requests.
      #
      # The run reconciles ITSELF: it reads `entities/extended` and reports
      # observed/expected/gap. `complete` is true only when they match, and never
      # when a denominator is missing — an unknown denominator must not round up.
      #
      # COST, before anyone flips this on: ~40 discovery requests, then a PDF
      # fetch per act — about 1377 for ZH, including 433 repealed ones. That is a
      # real load on a public-sector API whose terms we have not confirmed, so it
      # is a deliberate operator act, not a nightly default. Set `max_documents`
      # to sample instead, which correctly downgrades `complete` to false.
      #
      # `active_only` is False by design. Point-in-time questions need repealed
      # law, and reconciling against the active count (944) would look right while
      # dropping a third of the corpus.
