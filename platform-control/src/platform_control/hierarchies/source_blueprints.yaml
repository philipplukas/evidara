# Blueprint templates for source creation.
#
# `enabled` is the config-owner key of the ADR-0030 two-key lock: the
# run-launch path refuses to dispatch a run for a source version created from a
# template that is not `enabled: true` (the other key is the provider's
# `live_ready` flag in code). The flag FAILS CLOSED — a template that omits it
# is treated as disabled, so a new template is inert until an operator captures
# acceptance-run evidence and turns it on. Every template therefore states its
# value explicitly (enforced by tests/unit/test_blueprint_provider_parity.py).
#
# `jurisdiction_id` names WHICH jurisdiction a template acquires for. It is
# template metadata, not acquisition config: the provider never reads it, and it is
# stripped before AcquisitionSpec parsing (`_NON_SPEC_TEMPLATE_KEYS`), because
# persisting it onto every source version's spec would state it as a fetch
# parameter. It answers the one question nothing else could — "is there a template
# that could serve jurisdiction X" — which is what separates registering a source as
# an API call from registering it as a repo edit and a deploy.
#
# It is OPTIONAL, and three templates legitimately omit it: `ris_ogd_lgbl_wien`,
# `ris_ogd_lgbl_noe` and `regione_http_lombardia`. The jurisdiction seed carries
# sub-national entries for CH and DE only, so there is no Austrian Land or Italian
# region to point at. Omitted is the honest answer; pointing them at `jur_at` /
# `jur_it` would claim Vienna's Landesrecht is federal Austrian law. A consumer must
# read an absent id as "no", never as "unknown, assume yes".
# `scripts/check_country_overlay.py` rejects a declared id the seed does not have.
overlays:
  at:
    provider_templates:
      ris_ogd_bundesrecht:
        jurisdiction_id: jur_at
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        preferred_formats: [Xml, Html]
        page_size: 20
        max_pages: 50
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
        enabled: true
      ris_ogd_bundesrecht_narrow_html:
        jurisdiction_id: jur_at
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        applikation: BrKons
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 1
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht_narrow
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      ris_ogd_bundesrecht_small_batch_html:
        jurisdiction_id: jur_at
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
        applikation: BrKons
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_bundesrecht_small_batch
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      firecrawl_justice_portal:
        jurisdiction_id: jur_at
        provider: firecrawl
        mode: crawl
        seed_url: https://www.ris.bka.gv.at/
        include_paths: [/]
        exclude_paths: [/Suche/]
        limit: 100
        max_discovery_depth: 2
        scrape_formats: [markdown, html]
        zero_data_retention: false
        tenant_id: tenant_public
        corpus_id: corpus_public_at_justice_portal
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: decision
        enabled: true
      # Sub-federal: Bundesländer LGBl templates. Reuse the existing RIS OGD
      # provider with per-LGBl applikation codes. Live RIS exposes LGBl per
      # Bundesland via the same API shape as Bundesrecht.
      ris_ogd_lgbl_wien:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/LgblAuth
        applikation: LgblAuthW
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_w_lgbl
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
        enabled: true
      ris_ogd_lgbl_noe:
        provider: ris_ogd
        base_url: https://data.bka.gv.at/ris/api/v2.6/LgblAuth
        applikation: LgblAuthNO
        preferred_formats: [Html, Xml]
        request_timeout_seconds: 15.0
        page_size: 5
        max_pages: 1
        tenant_id: tenant_public
        corpus_id: corpus_public_at_noe_lgbl
        scope_type: global_public
        source_origin_kind: official_primary
        trust_tier: authoritative
        language_codes: [de]
        document_type_hint: legislation
