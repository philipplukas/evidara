  # city is queryable as a first-class jurisdiction. Scope is intentionally
  # 10 publishing cities — not the ~11,000-entry Destatis Gemeindeverzeichnis
  # and not the ~400 Landkreise (districts) tier. Full coverage will arrive
  # via a Destatis ingestion job; this seed deliberately does not pretend
  # to it. Slug is `de-gemeinde-<ags>` to mirror the cantonal/Land kebab-
