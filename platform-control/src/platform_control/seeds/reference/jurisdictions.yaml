items:
  - jurisdiction_id: jur_ch
    slug: ch
    name: Switzerland
    compliance_policy_id: cp_ch_fedlex_open_data
    level: federal
  # Federal scope is a separate jurisdiction from the country-level
  # identifier. Federal Swiss authorities (Fedlex, BGer, BVGer) bind here,
  # not to jur_ch. ~15 downstream consumers already use jur_ch_federal
  # (DI jurisdiction resolver, canary workflow, golden datasets, fast-loop
  # script) — it was dropped in error and is being restored (see #264).
  - jurisdiction_id: jur_ch_federal
    slug: ch-federal
    name: Swiss Confederation
    parent_id: jur_ch
    compliance_policy_id: cp_ch_fedlex_open_data
    level: federal
  # ─── Swiss cantons (ISO 3166-2:CH, alphabetical by code) ───
  # Every canton binds `cp_ch_lexfind`. Until this line existed, NO cantonal
  # jurisdiction carried a compliance policy at all, and none inherited one —
  # `_resolve_policy_for_source` has no parent fallback, by design (see the
  # policy file's header for the argument). So every LexFind run this repo has
  # ever produced ran with no rate limiter, no robots enforcement and no
  # attribution block, including the acceptance bundles under
  # `docs/evidence/`.
  #
  # It binds at JURISDICTION level, not authority level, on purpose: LexFind
  # serves all 26 cantons from one host, and `RateLimiterRegistry` keys its
  # limiters by `compliance_policy_id` with per-host buckets inside — so one
  # policy id shared by 26 jurisdictions yields ONE shared budget at
  # lexfind.ch, which is the pacing an operator of that host would expect.
  # Twenty-six separate policies would each start with a full bucket.
  #
  # A cantonal source that is NOT LexFind must not inherit this: it would carry
  # an attribution line naming a mirror it never touched. Bind its own policy at
  # the AUTHORITY level, which wins over the jurisdiction (see
  # `authorities.yaml` — `auth_zh_obergericht` already does exactly this with
  # `cp_ch_court_decisions`).
