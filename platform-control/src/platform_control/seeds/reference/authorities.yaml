  # ─── Remaining cantonal chancelleries ──────────────────────
  # The other 20 cantons. Six already had one above (ZH/BE/BS/GE/VD/TI); these
  # complete the set, so every `jur_ch_<iso>` has the authority that publishes
  # its systematic collection. Without a row here `POST /v1/sources` refuses a
  # cantonal source with "Authority does not belong to the requested
  # jurisdiction" — a template that scaffolds cleanly and cannot register.
  #
  # The chancellery is not one office name repeated 26 times: AI runs a
  # Ratskanzlei, AR a Kantonskanzlei, BL a Landeskanzlei, GR and UR a
  # Standeskanzlei. Each name below was read off the canton's own site on
  # 2026-09-18, except BL, UR and VS, whose portals did not serve the name to a
  # plain GET (BL is behind Cloudflare). Those three carry the office name from
  # public record and are the ones to re-check if a name looks wrong.
  #
  # Fribourg is `auth_ch_fr_sk`, not `auth_fr_sk`: the flat scheme (#264) has
  # already spent `auth_fr_*` on France — `auth_fr_ce` is the Conseil d'État.
  # So an authority id is NOT derivable from a jurisdiction id; look it up.
  # Compliance binds through the jurisdiction (`cp_ch_lexfind`), as it does for
  # the six above, so none of these overrides it.
  - authority_id: auth_ag_sk
    jurisdiction_id: jur_ch_ag
    slug: ag-staatskanzlei
    name: Staatskanzlei Kanton Aargau
  - authority_id: auth_ai_sk
    jurisdiction_id: jur_ch_ai
    slug: ai-ratskanzlei
    name: Ratskanzlei Kanton Appenzell Innerrhoden
  - authority_id: auth_ar_sk
    jurisdiction_id: jur_ch_ar
    slug: ar-kantonskanzlei
    name: Kantonskanzlei Appenzell Ausserrhoden
  - authority_id: auth_bl_sk
    jurisdiction_id: jur_ch_bl
    slug: bl-landeskanzlei
    name: Landeskanzlei Kanton Basel-Landschaft
  - authority_id: auth_ch_fr_sk
    jurisdiction_id: jur_ch_fr
    slug: ch-fr-staatskanzlei
    name: Staatskanzlei Kanton Freiburg / Chancellerie d'État du canton de Fribourg
  - authority_id: auth_gl_sk
    jurisdiction_id: jur_ch_gl
    slug: gl-staatskanzlei
    name: Staatskanzlei Kanton Glarus
  - authority_id: auth_gr_sk
    jurisdiction_id: jur_ch_gr
    slug: gr-standeskanzlei
    name: Standeskanzlei Kanton Graubünden
  - authority_id: auth_ju_ce
    jurisdiction_id: jur_ch_ju
