    name: Chancellerie d'État de la République et Canton du Jura
  - authority_id: auth_lu_sk
    jurisdiction_id: jur_ch_lu
    slug: lu-staatskanzlei
    name: Staatskanzlei Kanton Luzern
  - authority_id: auth_ne_ce
    jurisdiction_id: jur_ch_ne
    slug: ne-chancellerie
    name: Chancellerie d'État de la République et Canton de Neuchâtel
  - authority_id: auth_nw_sk
    jurisdiction_id: jur_ch_nw
    slug: nw-staatskanzlei
    name: Staatskanzlei Kanton Nidwalden
  - authority_id: auth_ow_sk
    jurisdiction_id: jur_ch_ow
    slug: ow-staatskanzlei
    name: Staatskanzlei Kanton Obwalden
  - authority_id: auth_sg_sk
    jurisdiction_id: jur_ch_sg
    slug: sg-staatskanzlei
    name: Staatskanzlei Kanton St. Gallen
  - authority_id: auth_sh_sk
    jurisdiction_id: jur_ch_sh
    slug: sh-staatskanzlei
    name: Staatskanzlei Kanton Schaffhausen
  - authority_id: auth_so_sk
