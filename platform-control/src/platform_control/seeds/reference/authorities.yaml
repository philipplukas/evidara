    slug: sz-staatskanzlei
    name: Staatskanzlei Kanton Schwyz
  - authority_id: auth_tg_sk
    jurisdiction_id: jur_ch_tg
    slug: tg-staatskanzlei
    name: Staatskanzlei Kanton Thurgau
  - authority_id: auth_ur_sk
    jurisdiction_id: jur_ch_ur
    slug: ur-standeskanzlei
    name: Standeskanzlei Kanton Uri
  - authority_id: auth_vs_sk
