# Build platform-control API image (Dockerfile.api).
# Repo root: gcloud builds submit . --config=platform-control/cloudbuild.api.yaml --substitutions=_TAG=manual-YYYYMMDD
substitutions:
  _TAG: "manual-latest"
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.api"
      - "-t"
      - "europe-west6-docker.pkg.dev/${PROJECT_ID}/runtime/platform-control:${_TAG}"
      - "."
    dir: platform-control
images:
  - "europe-west6-docker.pkg.dev/${PROJECT_ID}/runtime/platform-control:${_TAG}"
