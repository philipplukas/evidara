# Platform Control worker image — mirrors .github/workflows/runtime-images.yml (platform-control-worker job).
#
# Context is platform-control/ (same as CI).
#
#   export CLOUDSDK_PYTHON=/usr/bin/python3   # if gcloud fails on a missing venv python
#   TAG="$(git rev-parse HEAD)"
#   gcloud builds submit . \
#     --project=YOUR_ARTIFACT_PROJECT \
#     --config=platform-control/cloudbuild.worker.yaml \
#     --substitutions=_TAG="${TAG}"
#
substitutions:
  _TAG: "manual-latest"
  _REGION: "europe-west6"
  _REPOSITORY: "runtime"
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--platform"
      - "linux/amd64"
      - "-f"
      - "Dockerfile.worker"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/platform-control-worker:${_TAG}"
      - "."
    dir: platform-control
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/platform-control-worker:${_TAG}"
