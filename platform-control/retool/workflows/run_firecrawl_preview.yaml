version: 1
name: run_firecrawl_preview
description: Create or reuse a draft source version, trigger a preview run, and fetch the preview summary.
on_error: stop_and_report

steps:
  - id: save_draft_version
    action: updateSourceVersion
    when: source_version_id is set
    on_error: stop_and_report
  - id: create_draft_version
    action: createSourceVersion
    when: source_version_id is not set
    on_error: stop_and_report
  - id: trigger_preview
    action: createRun
    input:
      mode: preview
    on_error: stop_and_report
  - id: fetch_preview_run
    action: getRun
    on_error: stop_and_report
  - id: fetch_preview_summary
    action: getRunPreviewSummary
    on_error: stop_and_report

outputs:
  - run_id
  - status
  - artifacts_count
  - captured_resources_count
  - preview_summary
