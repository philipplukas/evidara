version: 1
items:
  - jurisdiction_id: jur_ch
    slug: ch
    name: Switzerland
    compliance_policy_id: cp_ch_fedlex_open_data
  # Federal scope is a separate jurisdiction from the country-level
  # identifier. Federal Swiss authorities (Fedlex, BGer, BVGer) bind here,
  # not to jur_ch. ~15 downstream consumers already use jur_ch_federal
  # (DI jurisdiction resolver, canary workflow, golden datasets, fast-loop
  # script) — it was dropped in error and is being restored (see #264).
  - jurisdiction_id: jur_ch_federal
    slug: ch-federal
    name: Swiss Confederation
    compliance_policy_id: cp_ch_fedlex_open_data
  - jurisdiction_id: jur_at
    slug: at
    name: Austria
    compliance_policy_id: cp_at_ris_ogd
  # DE/FR/IT/EU stay without a policy until their source terms are reviewed.
  # Absence = unconstrained (no rate limiter, no robots check, no retention),
  # which is the explicit operator signal that policy work is still pending.
  # See #252 for adaptive-limiter defaults, #257 for robots prefetch.
  - jurisdiction_id: jur_de
    slug: de
    name: Germany
  - jurisdiction_id: jur_fr
    slug: fr
    name: France
  - jurisdiction_id: jur_it
    slug: it
    name: Italy
  - jurisdiction_id: jur_eu
    slug: eu
    name: European Union
