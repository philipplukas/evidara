    authority_path: at/federal/vfgh
    enabled: true
    selector:
      source_type: api
      mode: paginate
      provider: ris_ogd
      base_url: https://data.bka.gv.at/ris/api/v2.6/Judikatur
      applikation: Vfgh
      preferred_formats:
        - Xml
        - Html
