version: 1
items:
  - scrape_target_id: stg_ch_fedlex_law
    path: ch/federal/fedlex/law
    authority_path: ch/federal/fedlex
    enabled: true
    selector:
      source_type: website
      mode: crawl
      seed_url: https://www.fedlex.admin.ch
      include_paths:
        - /eli/cc/
  - scrape_target_id: stg_at_ris_law
    path: at/federal/ris/law
    authority_path: at/federal/ris
    enabled: true
    selector:
      source_type: api
      mode: paginate
      provider: ris_ogd
      base_url: https://data.bka.gv.at/ris/api/v2.6/Bundesrecht
      preferred_formats:
        - Xml
        - Html
  - scrape_target_id: stg_at_ris_decision_vfgh
