[project]
name = "platform-control"
version = "0.1.0"
description = "Evidara platform-control service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "alembic>=1.16.0,<2",
  "asyncpg>=0.30.0,<1",
  "boto3>=1.34.0,<2",
  "croniter>=6.2.2",
  "fastapi>=0.116.0,<1",
  "google-cloud-pubsub>=2.31.0,<3",
  "google-cloud-storage>=3.1.0,<4",
  "greenlet>=3.2.0,<4",
  "httpx>=0.28.0,<1",
  "nats-py>=2.9.0,<3",
  "prometheus-client>=0.21.0,<1",
  # RFC 9309 robots.txt parsing. BSD-3-Clause, no runtime dependencies, Scrapy's
  # own parser. Replaces urllib.robotparser, which has no wildcard support and
  # is first-match rather than longest-match — see services/robots.py.
  "protego>=0.5.0,<1",
  "pydantic-settings>=2.10.0,<3",
  "pydantic>=2.11.0,<3",
  "pyyaml>=6.0.2,<7",
  "sqlalchemy>=2.0.41,<3",
  "temporalio>=1.8.0,<2",
  "uvicorn>=0.35.0,<1",
]

[project.scripts]
platform-control-seed-reference-data = "platform_control.seed_reference_data:main"
# LOCAL DEVELOPMENT ONLY. Writes one run per lifecycle state so the admin's run
# queue has pending / running / failed / cancelled rows to render — every run a
# local stack acquires naturally is `completed`, which left the triage UI
# unreviewable. Refuses outside PLATFORM_CONTROL_ENVIRONMENT=development and
# without an explicit flag.
platform-control-seed-demo-runs = "platform_control.seed_demo_runs:main"
platform-control-connector-worker = "platform_control.connector_worker:main"
platform-control-temporal-worker = "platform_control.temporal_worker:main"
# Legal-retention hard delete. Scheduled by the retention-sweep CronJob (ADR-0031),
# NOT by a Temporal schedule — Temporal is deployed nowhere. `pc retention sweep`
# is the manual alias over the same implementation.
platform-control-retention-sweep = "platform_control.retention_sweep:main"
pc = "platform_control.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.25.0,<5",
  "psycopg[binary]>=3.2.0,<4",
  "pytest-asyncio>=1.1.0,<2",
  "pytest>=8.4.0,<9",
  "ruff>=0.12.0,<1",
  "testcontainers>=4.9.0,<5",
  "referencing>=0.36.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_control", "src/acquisition_core"]
artifacts = [
  "src/platform_control/hierarchies/*.yaml",
  "src/platform_control/seeds/reference/*.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "temporal: test drives a real workflow on the temporalio SDK's local time-skipping test server. Runs by default; set PYTEST_SKIP_TEMPORAL=1 to opt out when offline with a cold binary cache (not honoured in CI). See docs/runbooks/pytest-temporal-marker.md.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
