[project]
name = "platform-control"
version = "0.1.0"
description = "Evidara platform-control service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "alembic>=1.16.0,<2",
  "fastapi>=0.116.0,<1",
  "google-cloud-pubsub>=2.31.0,<3",
  "google-cloud-storage>=3.1.0,<4",
  "greenlet>=3.2.0,<4",
  "httpx>=0.28.0,<1",
  "pydantic-settings>=2.10.0,<3",
  "pydantic>=2.11.0,<3",
  "pyyaml>=6.0.2,<7",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn>=0.35.0,<1",
]
[dependency-groups]
dev = [
  "pytest-asyncio>=1.1.0,<2",
  "pytest>=8.4.0,<9",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
