# Vale configuration for Evidara
# See: https://vale.sh/docs/

StylesPath = styles
MinAlertLevel = warning

# Packages to install: vale sync
Packages = Google, write-good

[*.md]
BasedOnStyles = Vale, Google, write-good

# Disable rules that are too noisy for technical docs
Google.Acronyms = NO
Google.We = NO
Google.Will = NO
Google.Passive = NO
write-good.Weasel = warning
write-good.TooWordy = warning
write-good.So = NO

# Ignore code blocks and front matter
TokenIgnores = (\x60[^\n\x60]*\x60)
BlockIgnores = (?s)(\x60{3,}.*?\x60{3,})
