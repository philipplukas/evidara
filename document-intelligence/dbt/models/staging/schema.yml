version: 2

models:
  - name: stg_published_documents
    description: Thin projection of the published_documents source surface.
    columns:
      - name: document_id
        tests:
          - not_null
      - name: processing_manifest_id
        tests:
          - not_null
      - name: lifecycle_status
        tests:
          - accepted_values:
              values: ["draft", "canonical_ready", "superseded", "retracted"]
              config:
                severity: warn

  - name: stg_landing_envelopes
    description: Normalised crawler envelopes filtered to http_status=200 document candidates.
    columns:
      - name: ingestion_id
        tests:
          - not_null
      - name: source_uri
        tests:
          - not_null
      - name: retrieved_at
        tests:
          - not_null
      - name: http_status
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 200
              max_value: 299
              strictly: false

  - name: stg_processing_events
    description: Per-attempt processing lifecycle events.
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: document_version_id
        tests:
          - not_null
      - name: event_timestamp
        tests:
          - not_null
      - name: attempt_number
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              strictly: false

  - name: stg_docling_output
    description: Parsed Docling document JSON with typed STRUCT projection.
    columns:
      - name: document_version_id
        tests:
          - not_null
      - name: processed_at
        tests:
          - not_null
