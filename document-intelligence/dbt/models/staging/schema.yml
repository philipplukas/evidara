version: 2

models:
  - name: stg_published_documents
    columns:
      - name: document_id
        tests:
          - not_null
      - name: processing_manifest_id
        tests:
          - not_null
  - name: stg_landing_envelopes
    columns:
      - name: ingestion_id
        tests:
          - not_null
      - name: source_uri
        tests:
          - not_null
  - name: stg_processing_events
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: document_version_id
        tests:
          - not_null
  - name: stg_docling_output
    columns:
      - name: document_version_id
        tests:
          - not_null
      - name: processed_at
        tests:
          - not_null
