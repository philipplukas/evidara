version: 2

# The `published` source lives in sources_published.generated.yml and is
# rendered from document_intelligence.persist.surfaces. Do not add published
# tables here - edit the Python surface definitions instead.

sources:
  - name: bronze
    database: "{{ env_var('DATABRICKS_CATALOG', 'evidara_document_intelligence_dev') }}"
    schema: bronze
    freshness:
      warn_after: {count: 2, period: hour}
      error_after: {count: 6, period: hour}
    loaded_at_field: ingested_at
    tables:
      - name: landing_envelopes
        loaded_at_field: retrieved_at
      - name: document_processing_events
        loaded_at_field: event_timestamp
      - name: raw_docling_output
      - name: raw_nlp_annotations
      - name: raw_metadata
      - name: raw_documents
