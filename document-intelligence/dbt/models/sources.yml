version: 2

sources:
  - name: published
    database: "{{ env_var('DATABRICKS_CATALOG', 'evidara_document_intelligence_dev') }}"
    schema: published
    tables:
      - name: published_documents
      - name: published_sections
      - name: processing_manifests

  - name: bronze
    database: "{{ env_var('DATABRICKS_CATALOG', 'evidara_document_intelligence_dev') }}"
    schema: bronze
    freshness:
      warn_after: {count: 2, period: hour}
      error_after: {count: 6, period: hour}
    loaded_at_field: ingested_at
    tables:
      - name: landing_envelopes
        loaded_at_field: retrieved_at
      - name: document_processing_events
        loaded_at_field: event_timestamp
      - name: raw_docling_output
      - name: raw_nlp_annotations
      - name: raw_metadata
      - name: raw_documents
