document_intelligence:
  target: dev
  outputs:
    dev:
      type: databricks
      method: token
      host: "{{ env_var('DATABRICKS_HOST', 'https://dbc-0000000000000000.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/placeholder') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'placeholder-token') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'evidara_document_intelligence_dev') }}"
      schema: di_staging
      threads: 4
    prod:
      type: databricks
      method: token
      host: "{{ env_var('DATABRICKS_HOST_PROD', env_var('DATABRICKS_HOST', 'https://dbc-0000000000000000.cloud.databricks.com')) }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH_PROD', env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/placeholder')) }}"
      token: "{{ env_var('DATABRICKS_TOKEN_PROD', env_var('DATABRICKS_TOKEN', 'placeholder-token')) }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG_PROD', env_var('DATABRICKS_CATALOG', 'evidara_document_intelligence_prod')) }}"
      schema: di_staging
      threads: 4
