[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence"
version = "0.1.0"
description = "Initial Evidara document-intelligence scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.0,<2",
  "deltalake>=0.18.0",
  "google-cloud-pubsub>=2.31.0,<3",
  "google-cloud-storage>=2.16.0",
  "jsonschema>=4.14.0",
  "nats-py>=2.9.0,<3",
  # Layout-aware PDF normalisation (#590, #650). Core, not an extra: `application/pdf`
  # is a first-class modality. Pure-Python, MIT, word-level coordinates, no ML models and
  # no network at runtime — which is what makes the marginal-band geometry pass
  # (normalize/marginalia.py) reproducible in CI. Docling was evaluated as a replacement
  # and rejected; see docs/adr/0038 for the measurements.
  "pdfplumber>=0.11.0,<0.12",
  "prometheus-client>=0.21.0,<1",
  "pyarrow>=14.0.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
]
service = [
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "uvicorn>=0.30.0",
]
# Optional parser backend for *text* modalities (HTML/XML/plain), selected by
# DI_PARSER_BACKEND=docling. Never used for PDFs — see docs/adr/0038.
docling = [
  "docling>=2.0.0",
]
nlp = [
  "spacy>=3.7.0",
  "spacy-llm>=0.7.0",
]
llm = [
  "dspy>=2.5.0",
  "google-cloud-aiplatform>=1.60.0",
  "instructor>=1.7.0",
  "openai>=1.30.0",
]
# Learned-sparse embeddings (ADR-0054). An extra, not a core dependency: torch is
# multi-gigabyte and the default DI image must not carry it. The GPU embedding
# worker is the only workload that installs this.
#
# Nothing is pinned to a CUDA wheel index here on purpose — the default PyPI torch
# wheel already carries the CUDA runtime, and pinning an index would break the CPU
# install that CI uses to import the module at all.
embeddings = [
  "FlagEmbedding>=1.3.0",
  "torch>=2.7.0",
  "transformers>=4.44.0",
]
# Pytest + anything eval/CI needs to import the package without the full dev stack.
# Used by: scripts/check-document-intelligence.sh, eval-ris workflow, local `make eval-*`.
# reportlab generates the synthetic multi-column PDF fixture that reproduces the
# marginal-splice failure mode for the anti-corruption regression test (#590).
test = [
  "pytest>=9.0.2",
  "reportlab>=4.0.0",
]
# Integration tests requiring Docker (opt-in via EVIDARA_NATS_IT=1). See
# tests/test_nats_integration.py and ADR-0029.
it = [
  "pytest>=9.0.2",
  "testcontainers>=4.9.0,<5",
]

[project.scripts]
document_intelligence_process_event = "document_intelligence.jobs.process_event:main"
document_intelligence_render_surface_sql = "document_intelligence.bootstrap.register_surfaces:cli"
document_intelligence_render_bronze_sql = "document_intelligence.bootstrap.register_bronze:cli"
document_intelligence_render_source_contracts = "document_intelligence.bootstrap.render_source_contracts:cli"
document_intelligence_render_governance_sql = "document_intelligence.bootstrap.register_governance:cli"
document_intelligence_document_service = "document_intelligence.service.main:main"
document_intelligence_runtime_ingress = "document_intelligence.consumer.main:main"
document_intelligence_nats_consumer = "document_intelligence.jobs.nats_consumer:main"
document_intelligence_projection_bridge = "document_intelligence.jobs.projection_bridge_consumer:main"
document_intelligence_runtime_consumer = "document_intelligence.jobs.runtime_consumer:main"
document_intelligence_replay_local_outbox = "document_intelligence.jobs.local_outbox_replay:main"
document_intelligence_delta_projection_backfill = "document_intelligence.jobs.delta_projection_backfill:main"
document_intelligence_projection_reconcile = "document_intelligence.jobs.projection_reconcile:main"
document_intelligence_embedding_backfill = "document_intelligence.jobs.embedding_backfill:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
