[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence"
version = "0.1.0"
description = "Initial Evidara document-intelligence scaffold"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "deltalake>=0.18.0",
  "google-cloud-storage>=2.16.0",
  "jsonschema>=4.14.0",
  "pyarrow>=14.0.0",
]

[project.optional-dependencies]
service = [
  "docling-core>=2.0.0,<3",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
]

[project.scripts]
document_intelligence_process_event = "document_intelligence.jobs.process_event:main"
document_intelligence_databricks_process_event = "document_intelligence.jobs.databricks_process_event:cli"
databricks_process_event = "document_intelligence.jobs.databricks_process_event:run"
document_intelligence_render_surface_sql = "document_intelligence.bootstrap.register_surfaces:cli"
document_intelligence_document_service = "document_intelligence.service.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
