resources:
  jobs:
    document_intelligence_process_bundle:
      name: document-intelligence-process-bundle
      queue:
        enabled: true
      parameters:
        - name: event_path
          default: ""
        - name: processing_version
          default: ${var.processing_version}
        - name: surfaces_root_uri
          default: ${var.surfaces_root_uri}
        - name: parser_backend
          default: ${var.parser_backend}
        - name: enable_spacy
          default: ${var.enable_spacy}
        - name: spacy_model_name
          default: ${var.spacy_model_name}
        - name: spacy_max_chars_per_section
          default: ${var.spacy_max_chars_per_section}
        - name: spacy_batch_size
          default: ${var.spacy_batch_size}
        - name: use_spark_delta
          default: ${var.use_spark_delta}
      tasks:
        - task_key: process_bundle
          python_wheel_task:
            package_name: document-intelligence
            entry_point: databricks_process_event
            named_parameters:
              event_path: "{{job.parameters.event_path}}"
              processing_version: "{{job.parameters.processing_version}}"
              surfaces_root_uri: "{{job.parameters.surfaces_root_uri}}"
              parser_backend: "{{job.parameters.parser_backend}}"
              enable_spacy: "{{job.parameters.enable_spacy}}"
              spacy_model_name: "{{job.parameters.spacy_model_name}}"
              spacy_max_chars_per_section: "{{job.parameters.spacy_max_chars_per_section}}"
              spacy_batch_size: "{{job.parameters.spacy_batch_size}}"
              use_spark_delta: "{{job.parameters.use_spark_delta}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
