resources:
  jobs:
    document_intelligence_bootstrap_governance:
      name: document-intelligence-bootstrap-governance
      description: >
        Apply Unity Catalog GRANTs and PII column tags. Run after
        document_intelligence_bootstrap_ddl has created catalog + schemas
        and after dbt has created the mart tables.
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: mode
          default: all
      tasks:
        - task_key: governance
          notebook_task:
            notebook_path: ../databricks/notebooks/02_bootstrap_governance.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              mode: "{{job.parameters.mode}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
