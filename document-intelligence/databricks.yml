bundle:
  name: document-intelligence

include:
  - resources/*.yml

artifacts:
  document_intelligence_wheel:
    type: whl
    path: .
    build: python3 -m pip wheel --no-deps --wheel-dir dist .

variables:
  workspace_root_path:
    description: Databricks workspace root path for bundle artifacts.
    default: /Shared/evidara/.bundle/document-intelligence
  catalog:
    description: Unity Catalog catalog containing document-intelligence surfaces.
  gcs_processed_bucket:
    description: GCS bucket URI where processed Docling/NLP outputs are staged.
  spark_version:
    description: Databricks Runtime version for the document-intelligence job cluster.
    default: 15.4.x-scala2.12
  node_type_id:
    description: Cluster node type for the document-intelligence job.
    default: n2-standard-4
  num_workers:
    description: Number of workers for the job cluster.
    default: "1"
  surfaces_root_uri:
    description: Root Delta path or volume path under which published surfaces are written.
  processing_version:
    description: DI processing version to stamp into canonical outputs.
    default: 0.1.0-dev
  parser_backend:
    description: Parser backend to use (legacy or docling).
    default: legacy
  enable_spacy:
    description: Enable optional spaCy enrichment metadata.
    default: "false"
  spacy_model_name:
    description: spaCy model name used for optional enrichment.
    default: xx_sent_ud_sm
  spacy_max_chars_per_section:
    description: Max text chars passed to spaCy enrichment.
    default: "100000"
  spacy_batch_size:
    description: Batch size for spaCy pipeline execution.
    default: "32"
  use_spark_delta:
    description: |
      Use the PySpark DataFrame writer for Delta outputs instead of the Python
      deltalake library. Set to "true" for production Databricks cluster jobs.
    default: "false"
  compute_guardrails_policy_id:
    description: |
      Legacy cluster policy ID retained for compatibility with older classic
      compute bundles. Current dev workspaces are serverless-only and job
      resources intentionally do not attach classic new_cluster definitions.
    lookup:
      cluster_policy: "Evidara compute guardrails"
  vector_endpoint_name:
    description: Mosaic AI Vector Search endpoint name.
    default: document-intelligence
  vector_index_name:
    description: Fully-qualified Vector Search index name.
    default: ""

targets:
  dev:
    default: true
    mode: production
    variables:
      catalog: evidara_document_intelligence_dev
      gcs_processed_bucket: gs://evidara-document-intelligence-surfaces-dev/processed
      surfaces_root_uri: gs://evidara-document-intelligence-surfaces-dev/published
      workspace_root_path: /Shared/evidara/.bundle/document-intelligence/dev
    workspace:
      root_path: ${var.workspace_root_path}
  staging:
    mode: production
    variables:
      catalog: evidara_document_intelligence_staging
      gcs_processed_bucket: gs://evidara-document-intelligence-surfaces-staging/processed
      surfaces_root_uri: gs://evidara-document-intelligence-surfaces-staging/published
      workspace_root_path: /Shared/evidara/.bundle/document-intelligence/staging
    workspace:
      root_path: ${var.workspace_root_path}
  prod:
    mode: production
    variables:
      catalog: evidara_document_intelligence_prod
      gcs_processed_bucket: gs://evidara-document-intelligence-surfaces-prod/processed
      surfaces_root_uri: gs://evidara-document-intelligence-surfaces-prod/published
      workspace_root_path: /Shared/evidara/.bundle/document-intelligence/prod
    workspace:
      root_path: ${var.workspace_root_path}
