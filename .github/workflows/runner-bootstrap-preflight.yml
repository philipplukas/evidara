name: Runner Bootstrap Preflight

on:
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: "JSON array used for runs-on labels"
        required: false
        type: string
        default: '["self-hosted","linux","x64"]'
      node_version:
        description: "Node.js version to validate"
        required: false
        type: string
        default: "22"
      python_version:
        description: "Python version to validate"
        required: false
        type: string
        default: "3.11"
      frontend_playwright_smoke:
        description: "Install legal-search frontend deps and launch Chromium"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      runner_labels_json:
        description: "JSON array used for runs-on labels"
        required: false
        type: string
        default: '["self-hosted","linux","x64"]'
      node_version:
        description: "Node.js version to validate"
        required: false
        type: string
        default: "22"
      python_version:
        description: "Python version to validate"
        required: false
        type: string
        default: "3.11"
      frontend_playwright_smoke:
        description: "Install legal-search frontend deps and launch Chromium"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate self-hosted bootstrap assumptions
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 10

    env:
      NODE_VERSION: ${{ inputs.node_version }}
      PYTHON_VERSION: ${{ inputs.python_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Snapshot runner
        run: |
          set -euo pipefail

          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: ${RUNNER_OS:-unknown}"
          echo "Arch: ${RUNNER_ARCH:-unknown}"
          echo "Temp: ${RUNNER_TEMP:-unknown}"
          echo "Tool cache: ${RUNNER_TOOL_CACHE:-unknown}"

          for cmd in bash git curl; do
            if ! command -v "${cmd}" >/dev/null 2>&1; then
              echo "::error::Required bootstrap command missing: ${cmd}"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Node bootstrap
        id: node
        run: |
          set -euo pipefail
          echo "node_version=$(node --version)" >> "${GITHUB_OUTPUT}"
          npm --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Python bootstrap
        id: python
        run: |
          set -euo pipefail
          echo "python_version=$(python3 --version 2>&1 | awk '{print $2}')" >> "${GITHUB_OUTPUT}"
          python3 --version

      - name: Install legal-search frontend dependencies
        if: ${{ inputs.frontend_playwright_smoke }}
        working-directory: legal-search/frontend
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ inputs.frontend_playwright_smoke }}
        working-directory: legal-search/frontend
        run: npx playwright install chromium

      - name: Verify Playwright browser smoke
        if: ${{ inputs.frontend_playwright_smoke }}
        working-directory: legal-search/frontend
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto("about:blank");
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Write summary
        if: always()
        run: |
          {
            echo "### Runner Bootstrap Preflight"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Runner | ${RUNNER_NAME:-unknown} |"
            echo "| OS | ${RUNNER_OS:-unknown} |"
            echo "| Arch | ${RUNNER_ARCH:-unknown} |"
            echo "| Node | ${{ steps.node.outputs.node_version || 'n/a' }} |"
            echo "| Python | ${{ steps.python.outputs.python_version || 'n/a' }} |"
            echo "| Playwright smoke | ${{ inputs.frontend_playwright_smoke && 'enabled' || 'disabled' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
