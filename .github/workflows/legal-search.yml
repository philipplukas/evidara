# CI for legal-search frontend.
#
# KEY DESIGN DECISION: CI runs `npm run check` — the SAME script
# that pre-commit runs locally. This ensures CI and pre-commit
# never drift apart. If you add a new quality gate, add it to
# the `check` script in package.json and both environments get it.

name: Legal Search

on:
  pull_request:
    paths:
      - 'legal-search/**'
      - 'contracts/api/legal-search.openapi.yaml'
  push:
    branches: [main]
    paths:
      - 'legal-search/**'
      - 'contracts/api/legal-search.openapi.yaml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-search

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Single command — same as pre-commit hook.
      # typecheck → lint → test
      - name: Check (typecheck + lint + test)
        run: npm run check

      # Build separately — catches SSR issues tsc misses.
      # Not in `check` because it's slower and not needed pre-commit.
      - name: Build
        run: npm run build

      # Contract lint — validates the OpenAPI spec.
      # Runs separately from `check` because it touches a file outside
      # the legal-search/ directory (contracts/api/).
      - name: Contract lint
        run: npm run openapi:lint

      # Drift check — re-generates the typed client from the spec and
      # fails if the committed output differs. Catches "spec changed but
      # client not regenerated" before it reaches main.
      - name: Contract drift check
        run: npm run openapi:check
