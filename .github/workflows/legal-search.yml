# CI for legal-search (frontend + API).
#
# KEY DESIGN DECISION: CI runs `npm run check` — the SAME script
# that pre-commit runs locally. This ensures CI and pre-commit
# never drift apart. If you add a new quality gate, add it to
# the `check` script in package.json and both environments get it.

name: Legal Search

on:
  pull_request:
    paths:
      - 'legal-search/**'
      - 'contracts/api/legal-search.openapi.yaml'
      - 'platform-control/admin/**'
      - 'docs/runbooks/interaction-flow-validation.md'
      - 'scripts/run-interaction-flow-local.sh'
  push:
    branches: [main]
    paths:
      - 'legal-search/**'
      - 'contracts/api/legal-search.openapi.yaml'
      - 'platform-control/admin/**'
      - 'docs/runbooks/interaction-flow-validation.md'
      - 'scripts/run-interaction-flow-local.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API quality gate ───
  api:
    # GitHub-hosted: keeps the Node tool bootstrap (actions/setup-node) stable.
    # The self-hosted ARC pools serve the required checks and heavy e2e jobs instead.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-search/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # typecheck → lint → test (unit + smoke + integration)
      - name: Check (typecheck + lint + test)
        run: npm run check

  # ─── Frontend quality gate ───
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-search/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # typecheck → lint → test
      - name: Check (typecheck + lint + test)
        run: npm run check

      # Build separately — catches SSR issues tsc misses.
      - name: Build
        run: npm run build

  # ─── Interaction-flow evidence (Playwright smoke + contract) ───
  interaction-flow-evidence:
    runs-on: ubuntu-latest
    env:
      E2E_SMOKE_STATUS: not_run
      E2E_SMOKE_RETRY_COUNT: "0"
      E2E_CONTRACT_STATUS: not_run
      E2E_CONTRACT_RETRY_COUNT: "0"
      SCREENSHOT_PACK_STATUS: not_run
      SCREENSHOT_PACK_RETRY_COUNT: "0"
      SCREENSHOT_PACK_FAILURE_REASON: "none"
      SCREENSHOT_CHECKLIST_COVERAGE: "unknown"
    defaults:
      run:
        working-directory: legal-search/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install platform-control admin dependencies (Playwright webServer)
        working-directory: platform-control/admin
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('legal-search/frontend/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      - name: Run smoke suite
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npm run e2e:smoke; then
              echo "E2E_SMOKE_STATUS=passed" >> "${GITHUB_ENV}"
              echo "E2E_SMOKE_RETRY_COUNT=$((attempt - 1))" >> "${GITHUB_ENV}"
              exit 0
            fi
            if [[ "${attempt}" -lt 2 ]]; then
              echo "Smoke suite failed on attempt ${attempt}; retrying once after 20s..."
              sleep 20
            fi
          done
          echo "E2E_SMOKE_STATUS=failed_after_retry" >> "${GITHUB_ENV}"
          echo "E2E_SMOKE_RETRY_COUNT=1" >> "${GITHUB_ENV}"
          echo "::error::Smoke suite failed after 2 attempts"
          exit 1

      - name: Run cross-surface contract suite
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npm run e2e:contract; then
              echo "E2E_CONTRACT_STATUS=passed" >> "${GITHUB_ENV}"
              echo "E2E_CONTRACT_RETRY_COUNT=$((attempt - 1))" >> "${GITHUB_ENV}"
              exit 0
            fi
            if [[ "${attempt}" -lt 2 ]]; then
              echo "Contract suite failed on attempt ${attempt}; retrying once after 20s..."
              sleep 20
            fi
          done
          echo "E2E_CONTRACT_STATUS=failed_after_retry" >> "${GITHUB_ENV}"
          echo "E2E_CONTRACT_RETRY_COUNT=1" >> "${GITHUB_ENV}"
          echo "::error::Contract suite failed after 2 attempts"
          exit 1

      - name: Capture canonical screenshot evidence pack
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npm run e2e:screenshot-pack; then
              echo "SCREENSHOT_PACK_STATUS=passed" >> "${GITHUB_ENV}"
              echo "SCREENSHOT_PACK_RETRY_COUNT=$((attempt - 1))" >> "${GITHUB_ENV}"
              echo "SCREENSHOT_PACK_FAILURE_REASON=none" >> "${GITHUB_ENV}"
              exit 0
            fi
            if [[ "${attempt}" -lt 2 ]]; then
              echo "Screenshot pack failed on attempt ${attempt}; retrying once after 20s..."
              sleep 20
            fi
          done
          echo "SCREENSHOT_PACK_STATUS=failed_after_retry" >> "${GITHUB_ENV}"
          echo "SCREENSHOT_PACK_RETRY_COUNT=1" >> "${GITHUB_ENV}"
          echo "SCREENSHOT_PACK_FAILURE_REASON=playwright_screenshot_pack_failed" >> "${GITHUB_ENV}"
          echo "::error::Screenshot evidence pack failed after 2 attempts"
          exit 1

      - name: Validate screenshot checklist coverage
        if: always()
        run: |
          set -euo pipefail
          required=(
            "screenshot-pack/cross-surface-header-navigation.png"
            "screenshot-pack/legal-search-result-list.png"
            "screenshot-pack/legal-search-detail-panel.png"
            "screenshot-pack/admin-run-launch-preflight.png"
            "screenshot-pack/admin-run-lifecycle-visibility.png"
            "screenshot-pack/operator-journey-events.json"
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "::warning::Missing screenshot checklist file: ${file}"
              missing=1
            fi
          done
          if [[ "${missing}" -eq 0 ]]; then
            echo "SCREENSHOT_CHECKLIST_COVERAGE=complete" >> "${GITHUB_ENV}"
          else
            echo "SCREENSHOT_CHECKLIST_COVERAGE=incomplete" >> "${GITHUB_ENV}"
            if [[ "${SCREENSHOT_PACK_FAILURE_REASON}" == "none" ]]; then
              echo "SCREENSHOT_PACK_FAILURE_REASON=missing_required_capture" >> "${GITHUB_ENV}"
            fi
          fi

      - name: Generate evidence manifest
        if: always()
        run: |
          cat <<EOF > interaction-flow-evidence.md
          # Interaction Flow Evidence

          Source runbook: docs/runbooks/interaction-flow-validation.md
          Source workflow: .github/workflows/legal-search.yml
          Source job: interaction-flow-evidence

          Executed suites:
          - npm run e2e:smoke
          - npm run e2e:contract
          - npm run e2e:screenshot-pack

          Smoke suite status:
          - ${E2E_SMOKE_STATUS}
          - retry_count: ${E2E_SMOKE_RETRY_COUNT}

          Contract suite status:
          - ${E2E_CONTRACT_STATUS}
          - retry_count: ${E2E_CONTRACT_RETRY_COUNT}

          Screenshot pack status:
          - ${SCREENSHOT_PACK_STATUS}
          - retry_count: ${SCREENSHOT_PACK_RETRY_COUNT}
          - failure_reason: ${SCREENSHOT_PACK_FAILURE_REASON}
          - checklist_coverage: ${SCREENSHOT_CHECKLIST_COVERAGE}
          - if failed, inspect test-results traces and retry logs in this run.

          Evidence artifacts in this upload:
          - legal-search/frontend/playwright-report
          - legal-search/frontend/test-results
          - legal-search/frontend/screenshot-pack
          - legal-search/frontend/interaction-flow-evidence.md
          EOF

      - name: Upload interaction-flow evidence artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: interaction-flow-evidence-${{ github.run_id }}
          path: |
            legal-search/frontend/playwright-report
            legal-search/frontend/test-results
            legal-search/frontend/screenshot-pack
            legal-search/frontend/interaction-flow-evidence.md
            docs/runbooks/interaction-flow-validation.md
          if-no-files-found: warn

  # ─── Playwright pixel baselines ───
  # Linux baselines generated via scripts/playwright-visual-update-docker.sh and committed.
  frontend-visual-regression:
    if: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-search/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install platform-control admin dependencies (Playwright webServer)
        working-directory: platform-control/admin
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('legal-search/frontend/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      - name: Visual pixel regression
        run: npm run e2e:visual

      # On failure, upload the Playwright test-results (actual render, diff,
      # trace) so a baseline drift can be inspected — and, when the drift is
      # intended, the `-actual.png` can be promoted to the committed
      # `*-linux.png` baseline without a local Playwright/Docker run. Mirrors
      # the interaction-flow job's evidence upload.
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-regression-results-${{ github.run_id }}
          path: |
            legal-search/frontend/test-results
          retention-days: 7
          if-no-files-found: warn
