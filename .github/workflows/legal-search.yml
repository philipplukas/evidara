# CI for legal-search (frontend + API).
#
# KEY DESIGN DECISION: CI runs `npm run check` — the same npm script that
# pre-commit runs locally, via scripts/check-legal-search.sh. If you add a new
# quality gate, add it to the `check` script in package.json and both
# environments get it.
#
# CI does NOT shell out to scripts/check-legal-search.sh, unlike every other
# surface: the api and frontend run as parallel jobs with per-surface npm
# caches, which one serial script would give up. That means nothing *structural*
# keeps this file and the script in step, and they had already drifted (#688).
# Parity is therefore asserted by a test:
#
#   scripts/tests/test_check_legal_search_parity.py
#
# Add a `npm run` gate to one of the two and that test fails until you add it to
# the other. Do not add a gate here alone.

name: Legal Search

on:
  # Deliberately NOT path-filtered for pull_request: `Legal Search gate` is a
  # required status check, and a workflow that never starts never reports one, so
  # the PR would stay pending forever. The `changes` job below reproduces the old
  # filter at job level, so an unrelated PR still skips every job here and pays
  # only the ~10s filter job. `push` keeps its filter — required checks apply to
  # PRs only. See #719.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'legal-search/**'
      - 'contracts/api/legal-search.openapi.yaml'
      - 'platform-control/admin/**'
      - 'styles/**'
      - '.nvmrc'
      - 'package.json'
      - 'scripts/check-js-workspace-hygiene.sh'
      - 'scripts/check-legal-search.sh'
      - 'scripts/check-e2e-spec-coverage.sh'
      - 'scripts/check_visual_baseline_provenance.py'
      - 'docs/runbooks/interaction-flow-validation.md'
      - 'scripts/run-interaction-flow-local.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Changed-path detection ───
  #
  # Reproduces the `on.pull_request.paths` filter that used to gate this whole
  # workflow, at job level, so `gate` below can always report. See #719.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'legal-search/**'
              - 'contracts/api/legal-search.openapi.yaml'
              - 'platform-control/admin/**'
              # `styles/` holds the shared @evidara/* modules — they are compiled
              # into the frontend bundle, so a change there must run this CI.
              - 'styles/**'
              - '.nvmrc'
              - 'package.json'
              - 'scripts/check-js-workspace-hygiene.sh'
              - 'scripts/check-legal-search.sh'
              - 'scripts/check-e2e-spec-coverage.sh'
              - 'scripts/check_visual_baseline_provenance.py'
              - 'docs/runbooks/interaction-flow-validation.md'
              - 'scripts/run-interaction-flow-local.sh'
              - '.github/workflows/legal-search.yml'

  # ─── JS dependency-resolution hygiene ───
  #
  # Cheap, repo-wide invariants that keep local runs honest: no root
  # `node_modules` symlink, no vestigial `legal-search/package.json`, react
  # deduped for the shared `styles/` modules, and a Node pin that matches
  # `.nvmrc`. Runs the SAME script as the pre-commit hook. See #588.
  js-workspace-hygiene:
    name: JS workspace hygiene
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Read the pin from `.nvmrc` so CI and local cannot drift.
          node-version-file: .nvmrc

      - name: Check JS workspace hygiene
        run: bash scripts/check-js-workspace-hygiene.sh

  # ─── API quality gate ───
  api:
    # GitHub-hosted: keeps the Node tool bootstrap (actions/setup-node) stable.
    # The self-hosted ARC pools serve the required checks and heavy e2e jobs instead.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-search/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # typecheck → lint → test (unit + smoke + integration)
      - name: Check (typecheck + lint + test)
        run: npm run check

  # ─── Frontend quality gate ───
  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-search/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # typecheck → lint → test
      - name: Check (typecheck + lint + test)
        run: npm run check

      # Build separately — catches SSR issues tsc misses.
      - name: Build
        run: npm run build

      # Asserts every e2e spec is selected by some CI command. Runs here because
      # this job already has the frontend node_modules and the check needs no
      # browser (`playwright test --list` does not start the webServer). See #686.
      - name: Check e2e spec coverage
        working-directory: .
        run: bash scripts/check-e2e-spec-coverage.sh

  # ─── Interaction-flow evidence (Playwright smoke + contract) ───
  interaction-flow-evidence:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_SMOKE_STATUS: not_run
      E2E_SMOKE_RETRY_COUNT: "0"
      E2E_CONTRACT_STATUS: not_run
      E2E_CONTRACT_RETRY_COUNT: "0"
      SCREENSHOT_PACK_STATUS: not_run
      SCREENSHOT_PACK_RETRY_COUNT: "0"
      SCREENSHOT_PACK_FAILURE_REASON: "none"
      SCREENSHOT_CHECKLIST_COVERAGE: "unknown"
    defaults:
      run:
        working-directory: legal-search/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install platform-control admin dependencies (Playwright webServer)
        working-directory: platform-control/admin
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('legal-search/frontend/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      - name: Run smoke suite
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npm run e2e:smoke; then
              echo "E2E_SMOKE_STATUS=passed" >> "${GITHUB_ENV}"
              echo "E2E_SMOKE_RETRY_COUNT=$((attempt - 1))" >> "${GITHUB_ENV}"
              exit 0
            fi
            if [[ "${attempt}" -lt 2 ]]; then
              echo "Smoke suite failed on attempt ${attempt}; retrying once after 20s..."
              sleep 20
            fi
          done
          echo "E2E_SMOKE_STATUS=failed_after_retry" >> "${GITHUB_ENV}"
          echo "E2E_SMOKE_RETRY_COUNT=1" >> "${GITHUB_ENV}"
          echo "::error::Smoke suite failed after 2 attempts"
          exit 1

      - name: Run cross-surface contract suite
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npm run e2e:contract; then
              echo "E2E_CONTRACT_STATUS=passed" >> "${GITHUB_ENV}"
              echo "E2E_CONTRACT_RETRY_COUNT=$((attempt - 1))" >> "${GITHUB_ENV}"
              exit 0
            fi
            if [[ "${attempt}" -lt 2 ]]; then
              echo "Contract suite failed on attempt ${attempt}; retrying once after 20s..."
              sleep 20
            fi
          done
          echo "E2E_CONTRACT_STATUS=failed_after_retry" >> "${GITHUB_ENV}"
          echo "E2E_CONTRACT_RETRY_COUNT=1" >> "${GITHUB_ENV}"
          echo "::error::Contract suite failed after 2 attempts"
          exit 1

      - name: Capture canonical screenshot evidence pack
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npm run e2e:screenshot-pack; then
              echo "SCREENSHOT_PACK_STATUS=passed" >> "${GITHUB_ENV}"
              echo "SCREENSHOT_PACK_RETRY_COUNT=$((attempt - 1))" >> "${GITHUB_ENV}"
              echo "SCREENSHOT_PACK_FAILURE_REASON=none" >> "${GITHUB_ENV}"
              exit 0
            fi
            if [[ "${attempt}" -lt 2 ]]; then
              echo "Screenshot pack failed on attempt ${attempt}; retrying once after 20s..."
              sleep 20
            fi
          done
          echo "SCREENSHOT_PACK_STATUS=failed_after_retry" >> "${GITHUB_ENV}"
          echo "SCREENSHOT_PACK_RETRY_COUNT=1" >> "${GITHUB_ENV}"
          echo "SCREENSHOT_PACK_FAILURE_REASON=playwright_screenshot_pack_failed" >> "${GITHUB_ENV}"
          echo "::error::Screenshot evidence pack failed after 2 attempts"
          exit 1

      - name: Validate screenshot checklist coverage
        if: always()
        run: |
          set -euo pipefail
          required=(
            "screenshot-pack/cross-surface-header-navigation.png"
            "screenshot-pack/legal-search-result-list.png"
            "screenshot-pack/legal-search-detail-panel.png"
            "screenshot-pack/admin-run-launch-preflight.png"
            "screenshot-pack/admin-run-lifecycle-visibility.png"
            "screenshot-pack/operator-journey-events.json"
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "::warning::Missing screenshot checklist file: ${file}"
              missing=1
            fi
          done
          if [[ "${missing}" -eq 0 ]]; then
            echo "SCREENSHOT_CHECKLIST_COVERAGE=complete" >> "${GITHUB_ENV}"
          else
            echo "SCREENSHOT_CHECKLIST_COVERAGE=incomplete" >> "${GITHUB_ENV}"
            if [[ "${SCREENSHOT_PACK_FAILURE_REASON}" == "none" ]]; then
              echo "SCREENSHOT_PACK_FAILURE_REASON=missing_required_capture" >> "${GITHUB_ENV}"
            fi
          fi

      - name: Generate evidence manifest
        if: always()
        run: |
          cat <<EOF > interaction-flow-evidence.md
          # Interaction Flow Evidence

          Source runbook: docs/runbooks/interaction-flow-validation.md
          Source workflow: .github/workflows/legal-search.yml
          Source job: interaction-flow-evidence

          Executed suites:
          - npm run e2e:smoke
          - npm run e2e:contract
          - npm run e2e:screenshot-pack

          Smoke suite status:
          - ${E2E_SMOKE_STATUS}
          - retry_count: ${E2E_SMOKE_RETRY_COUNT}

          Contract suite status:
          - ${E2E_CONTRACT_STATUS}
          - retry_count: ${E2E_CONTRACT_RETRY_COUNT}

          Screenshot pack status:
          - ${SCREENSHOT_PACK_STATUS}
          - retry_count: ${SCREENSHOT_PACK_RETRY_COUNT}
          - failure_reason: ${SCREENSHOT_PACK_FAILURE_REASON}
          - checklist_coverage: ${SCREENSHOT_CHECKLIST_COVERAGE}
          - if failed, inspect test-results traces and retry logs in this run.

          Evidence artifacts in this upload:
          - legal-search/frontend/playwright-report
          - legal-search/frontend/test-results
          - legal-search/frontend/screenshot-pack
          - legal-search/frontend/interaction-flow-evidence.md
          EOF

      - name: Upload interaction-flow evidence artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: interaction-flow-evidence-${{ github.run_id }}
          path: |
            legal-search/frontend/playwright-report
            legal-search/frontend/test-results
            legal-search/frontend/screenshot-pack
            legal-search/frontend/interaction-flow-evidence.md
            docs/runbooks/interaction-flow-validation.md
          if-no-files-found: warn

  # ─── Baseline provenance ───
  # Mirrors the pre-commit hook of the same name (AGENTS.md: pre-commit and CI
  # run the same checks). Needs full history for the merge-base diff.
  visual-baseline-provenance:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check visual baseline provenance
        run: |
          python3 scripts/check_visual_baseline_provenance.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}"

  # ─── Playwright pixel baselines ───
  #
  # Runs at ZERO pixel tolerance (#611). The project-level
  # `maxDiffPixelRatio: 0.06` that used to sit in playwright.config.ts made this
  # job structurally incapable of going red: it stayed green across a ~260px
  # layout error for 3.5 months (#605), across a brand-mark replacement, and
  # across the #674 filter-badge bug. Do not reintroduce a default tolerance —
  # scope slack to a single snapshot with a written justification instead.
  #
  # Baselines are generated BY THIS RUNNER via the `visual-baseline-refresh`
  # job below, so generation and verification share one environment. That is
  # what makes zero tolerance achievable: a baseline blessed on a workstation
  # carries that workstation's font rasterisation, which no other machine
  # reproduces exactly.
  frontend-visual-regression:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-search/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install platform-control admin dependencies (Playwright webServer)
        working-directory: platform-control/admin
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('legal-search/frontend/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      - name: Visual pixel regression
        run: npm run e2e:visual

      # The specs that carry no tag CI greps for. Selection in this suite is
      # entirely `-g <tag>` or by path (playwright.config.ts sets no testMatch),
      # so before #686 these were selected by nothing: committed, linted,
      # typechecked, executed nowhere. That is how workspace-panels.spec.ts sat
      # 4/4 red on main unnoticed, and why the geometry guard added in #605 has
      # been inert since it landed.
      # `!cancelled()` so this reports independently of the pixel baselines
      # above rather than being masked by an unrelated baseline drift.
      - name: Workspace panel + mobile layout suites
        if: ${{ !cancelled() }}
        run: npm run e2e:workspace

      # On failure, upload the Playwright test-results (actual render, diff,
      # trace) so a baseline drift can be inspected — and, when the drift is
      # intended, the `-actual.png` can be promoted to the committed
      # `*-linux.png` baseline without a local Playwright/Docker run. Mirrors
      # the interaction-flow job's evidence upload.
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-regression-results-${{ github.run_id }}
          path: |
            legal-search/frontend/test-results
          retention-days: 7
          if-no-files-found: warn

  # ─── Baseline regeneration, in CI, on demand ───
  #
  # Provenance mechanism for #611. Every bad baseline this repo shipped came
  # from a local `--update-snapshots` inside a bug window, against whatever
  # build the developer's dev server happened to be serving. Three of them
  # certified live bugs as correct for months.
  #
  # This job moves generation onto the same runner that verifies, and records
  # WHO asked for it, WHY, and from WHICH commit — in a committed ledger, in
  # the same diff as the images. To use it: add the `visual-baseline-refresh`
  # label to the PR, then push (the label alone does not start a run; the
  # label is read from the PR payload of the next push).
  #
  # It deliberately does not run on `main`.
  visual-baseline-refresh:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'visual-baseline-refresh') &&
      needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: legal-search/frontend

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      # Same toolchain as `frontend-visual-regression` above. If these two ever
      # diverge, baselines will be generated in one environment and verified in
      # another — which is the whole failure this job exists to prevent.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legal-search/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install platform-control admin dependencies (Playwright webServer)
        working-directory: platform-control/admin
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('legal-search/frontend/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      # `=changed`, NOT the bare `--update-snapshots` (which means `=all`).
      # `=all` rewrites every snapshot even when it already matches, so a
      # refresh that should touch 6 images touches all 14 — and a reviewer can
      # no longer tell which baseline actually moved. An unreadable diff is how
      # bad baselines get waved through, which is the failure this whole change
      # is about. Keep the diff minimal so the ledger entry can be checked
      # against it.
      - name: Regenerate baselines (only those that actually differ)
        run: npx playwright test e2e/visual.spec.ts --update-snapshots=changed

      - name: Record provenance and commit
        working-directory: .
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd legal-search/frontend/e2e/visual.spec.ts-snapshots

          changed="$(git status --porcelain . | awk '{print $2}' | xargs -r -n1 basename | sort)"
          if [ -z "$changed" ]; then
            echo "No baseline changed — nothing to record."
            exit 0
          fi

          echo "Regenerated:"; echo "$changed"

          entry="$(mktemp)"
          {
            echo "## $(date -u +%Y-%m-%d) — PR #${PR_NUMBER} — CI-generated refresh"
            echo
            echo "- Generated by: \`visual-baseline-refresh\` on \`ubuntu-latest\` ([run](${RUN_URL}))"
            echo "- Requested by: @${ACTOR}"
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- Reason: _requested via the \`visual-baseline-refresh\` label._"
            echo "  **Replace this line with why the NEW image is correct before merging.**"
            echo "  A reviewer must be able to check the claim against the diff."
            echo "- Files:"
            echo "$changed" | sed 's/^/  - /'
            echo
          } > "$entry"

          # Insert above the newest existing entry. Anchored on a DATE heading,
          # not a bare `## `, so the file's own prose headings are not mistaken
          # for entries — the same distinction the guard script draws.
          awk 'NR==FNR{e=e $0 ORS; next}
               /^## [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ && !done {printf "%s", e; done=1}
               {print}' \
            "$entry" PROVENANCE.md > PROVENANCE.new
          mv PROVENANCE.new PROVENANCE.md

          cd "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-search/frontend/e2e/visual.spec.ts-snapshots

          msg="$(mktemp)"
          {
            printf 'test(legal-search): refresh visual baselines in CI (PR #%s)\n\n' "${PR_NUMBER}"
            printf 'Generated by the visual-baseline-refresh job so the images come from\n'
            printf 'the same environment that verifies them (#611).\n\n'
            printf 'Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>\n'
          } > "$msg"
          git commit -F "$msg"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

          echo "::notice::Baselines refreshed. Fill in the Reason: line in PROVENANCE.md before merging."

  # ─── Required-check aggregator ───
  #
  # The single required status check for this workflow. The jobs above are
  # path-filtered via `changes`, and GitHub reports no conclusion for a job
  # skipped by `if:`, so requiring one directly would leave every unrelated PR
  # pending forever. This job always reports; `skipped` is an accepted result
  # (a docs-only PR skips everything here), `failure` and `cancelled` are not.
  # See #719.
  gate:
    name: Legal Search gate
    needs:
      - changes
      - js-workspace-hygiene
      - api
      - frontend
      - interaction-flow-evidence
      - visual-baseline-provenance
      - frontend-visual-regression
      - visual-baseline-refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed=$(echo "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Job(s) did not pass: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All jobs passed or were skipped."
