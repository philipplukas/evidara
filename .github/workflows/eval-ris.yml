name: RIS Pipeline Evaluation

on:
  workflow_dispatch:
    inputs:
      max_documents:
        description: "Max documents to download (0 = all)"
        required: false
        default: "0"
  pull_request:
    paths:
      - "document-intelligence/src/document_intelligence/normalize/**"
      - "document-intelligence/src/document_intelligence/pipeline.py"
      - "document-intelligence/src/document_intelligence/sectionize/**"
      - "document-intelligence/src/document_intelligence/policy/**"
      - "document-intelligence/tests/golden/ris_*/**"
      - "eval/**"
  push:
    branches: [main]
    paths:
      - "document-intelligence/src/document_intelligence/normalize/**"
      - "document-intelligence/src/document_intelligence/pipeline.py"
      - "eval/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-data-check:
    name: Eval data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document-intelligence (pytest gate + DI import)
        run: pip install -e "./document-intelligence[test]"

      - name: Validate eval CSV integrity
        run: python -m pytest eval/test_eval_pipeline.py -v -k "test_eval_data_integrity or test_query_task_type" --tb=short

  eval-golden-fixtures:
    name: Golden fixture processing
    runs-on: ubuntu-latest
    needs: eval-data-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DI package
        run: pip install -e "./document-intelligence[test]"

      - name: Run RIS golden fixture tests
        run: python -m pytest eval/test_eval_pipeline.py -v -k "test_ris_fixture" --tb=long

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-golden-results
          path: eval/runs/
          retention-days: 30

  eval-download:
    name: Download RIS documents
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download from OGD-RIS API
        run: python eval/download_ris_documents.py eval/data

      - name: Upload downloaded documents
        uses: actions/upload-artifact@v4
        with:
          name: ris-documents
          path: eval/data/
          retention-days: 90
