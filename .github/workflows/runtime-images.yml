name: Runtime Images

on:
  workflow_dispatch:
  # Deliberately NOT path-filtered for pull_request. `Runtime Images gate` is a
  # required status check, and a required check that never reports leaves the PR
  # pending forever — so this workflow must start on every PR. Nothing is wasted:
  # the `changes` job below does the same filtering at job level, so on a PR that
  # touches no image input every build still skips and only `changes` (~10s on the
  # light pool) actually runs. The `push` trigger keeps its path filter, because
  # required checks apply to PRs only. See #719.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-images.yml"
      - "platform-control/**"
      - "legal-search/api/**"
      - "legal-search/frontend/**"
      - "document-intelligence/**"
      - "contracts/**"
      - "marketing/**"
      # The shared design tokens and @evidara/shell are compiled into the
      # marketing bundle (ADR-0027), so a change there changes that image.
      - "styles/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter compares PR head/base via the API on pull_request
  packages: write
  id-token: write   # for Workload Identity Federation to Artifact Registry

jobs:
  # Cheap job on the light pool; drives which image builds run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform_control: ${{ steps.filter.outputs.platform_control }}
      platform_control_worker: ${{ steps.filter.outputs.platform_control_worker }}
      platform_control_admin: ${{ steps.filter.outputs.platform_control_admin }}
      legal_search_api: ${{ steps.filter.outputs.legal_search_api }}
      legal_search_frontend: ${{ steps.filter.outputs.legal_search_frontend }}
      document_intelligence_consumer: ${{ steps.filter.outputs.document_intelligence_consumer }}
      marketing: ${{ steps.filter.outputs.marketing }}
      # One build date for every image in this run, so eight images built from one
      # commit report the same timestamp instead of eight timestamps minutes apart.
      build_date: ${{ steps.buildmeta.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build metadata
        id: buildmeta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform_control:
              - 'platform-control/**'
              - '.github/workflows/runtime-images.yml'
            platform_control_worker:
              - 'platform-control/pyproject.toml'
              - 'platform-control/README.md'
              - 'platform-control/src/**'
              - 'platform-control/Dockerfile.worker'
              - 'document-intelligence/**'
              - '.github/workflows/runtime-images.yml'
            platform_control_admin:
              - 'platform-control/admin/**'
              - '.github/workflows/runtime-images.yml'
            legal_search_api:
              - 'legal-search/api/**'
              - 'contracts/**'
              - '.github/workflows/runtime-images.yml'
            legal_search_frontend:
              - 'legal-search/frontend/**'
              - 'contracts/**'
              - '.github/workflows/runtime-images.yml'
            document_intelligence_consumer:
              - 'document-intelligence/**'
              - '.github/workflows/runtime-images.yml'
            marketing:
              - 'marketing/**'
              - 'styles/**'
              - '.github/workflows/runtime-images.yml'

  platform-control:
    name: Build platform-control image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changes.outputs.platform_control == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config: .github/buildkitd.toml

      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        id: auth
        if: vars.ENABLE_GCP_ARTIFACT_REGISTRY == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
          token_format: access_token

      - name: Login to Artifact Registry
        if: vars.ENABLE_GCP_ARTIFACT_REGISTRY == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Docker metadata (platform-control)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/evidara-platform-control
            ${{ vars.ENABLE_GCP_ARTIFACT_REGISTRY == 'true' && format('{0}-docker.pkg.dev/{1}/{2}/platform-control', vars.GCP_REGION, vars.GCP_ARTIFACT_PROJECT_ID, vars.ARTIFACT_REGISTRY_REPOSITORY) || '' }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform-control/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.changes.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

