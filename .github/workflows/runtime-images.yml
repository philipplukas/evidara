name: Runtime Images

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-images.yml"
      - "platform-control/**"
      - "legal-search/api/**"
      - "legal-search/frontend/**"
      - "document-intelligence/**"
      - "contracts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-images.yml"
      - "platform-control/**"
      - "legal-search/api/**"
      - "legal-search/frontend/**"
      - "document-intelligence/**"
      - "contracts/**"

permissions:
  contents: read
  packages: write
  id-token: write   # for Workload Identity Federation to Artifact Registry

jobs:
  platform-control:
    name: Build platform-control image
    runs-on: ${{ fromJSON(vars.HEAVY_RUNNER_RUNS_ON_JSON || '["self-hosted","linux","x64","gcp-heavy"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        id: auth
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
          token_format: access_token

      - name: Login to Artifact Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Docker metadata (platform-control)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/evidara-platform-control
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_ARTIFACT_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/platform-control
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform-control/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

