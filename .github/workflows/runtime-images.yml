name: Runtime Images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/runtime-images.yml"
      - "platform-control/**"
      - "legal-search/api/**"
      - "legal-search/frontend/**"
      - "document-intelligence/**"
      - "contracts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-images.yml"
      - "platform-control/**"
      - "legal-search/api/**"
      - "legal-search/frontend/**"
      - "document-intelligence/**"
      - "contracts/**"

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter compares PR head/base via the API on pull_request
  packages: write
  id-token: write   # for Workload Identity Federation to Artifact Registry

jobs:
  # Cheap job on GitHub-hosted runners; drives which image builds run (cuts self-hosted load and wall time).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform_control: ${{ steps.filter.outputs.platform_control }}
      platform_control_worker: ${{ steps.filter.outputs.platform_control_worker }}
      platform_control_admin: ${{ steps.filter.outputs.platform_control_admin }}
      legal_search_api: ${{ steps.filter.outputs.legal_search_api }}
      legal_search_frontend: ${{ steps.filter.outputs.legal_search_frontend }}
      document_intelligence_consumer: ${{ steps.filter.outputs.document_intelligence_consumer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform_control:
              - 'platform-control/**'
              - '.github/workflows/runtime-images.yml'
            platform_control_worker:
              - 'platform-control/pyproject.toml'
              - 'platform-control/README.md'
              - 'platform-control/src/**'
              - 'platform-control/Dockerfile.worker'
              - '.github/workflows/runtime-images.yml'
            platform_control_admin:
              - 'platform-control/admin/**'
              - '.github/workflows/runtime-images.yml'
            legal_search_api:
              - 'legal-search/api/**'
              - 'contracts/**'
              - '.github/workflows/runtime-images.yml'
            legal_search_frontend:
              - 'legal-search/frontend/**'
              - 'contracts/**'
              - '.github/workflows/runtime-images.yml'
            document_intelligence_consumer:
              - 'document-intelligence/**'
              - '.github/workflows/runtime-images.yml'

  platform-control:
    name: Build platform-control image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changes.outputs.platform_control == 'true'
    runs-on: ${{ vars.HEAVY_RUNNER_SCALE_SET || 'evidara-heavy' }}
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config: .github/buildkitd.toml

      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        id: auth
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
          token_format: access_token

      - name: Login to Artifact Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Docker metadata (platform-control)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/evidara-platform-control
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_ARTIFACT_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/platform-control
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform-control/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  legal-search-api:
    name: Build legal-search API image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changes.outputs.legal_search_api == 'true'
