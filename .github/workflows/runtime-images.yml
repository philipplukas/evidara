            BUILD_DATE=${{ needs.changes.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The single required status check for this workflow.
  #
  # Individual build jobs cannot be required directly: they are path-filtered via
  # `changes`, and GitHub never reports a conclusion for a job skipped by `if:`,
  # so requiring one would block every PR that does not touch its paths. Two of
  # them also collide by name with `platform-control-image.yml`, which publishes
  # a check run called "Build platform-control image" as well — an ambiguous
  # context to gate on.
  #
  # This job always reports, and fails only when a needed job genuinely failed.
  # `skipped` is an accepted result; `failure` and `cancelled` are not.
  # The public marketing surface (ADR-0039). Its `Marketing` workflow already
  # proves the static export builds; this job is what makes the export
  # *deployable* — before it existed, `infra/hetzner/marketing/` referenced a
  # `marketing` Service whose image nothing published, so the surface could be
  # reviewed and merged and still never reach a cluster.
  marketing:
    name: Build marketing image
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config: .github/buildkitd.toml

      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (marketing)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/evidara-marketing
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          # Repo root, not marketing/: the Dockerfile copies styles/tokens and
          # styles/shell, which live outside the package (ADR-0028).
          context: .
          file: ./marketing/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.changes.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gate:
    name: Runtime Images gate
    needs:
      - changes
      - platform-control
      - legal-search-api
      - legal-search-frontend
      - platform-control-admin
      - platform-control-worker
      - document-intelligence-consumer
      - document-intelligence-document-service
      - marketing
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every image build succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed=$(echo "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Image build(s) did not pass: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All image builds passed or were skipped."
