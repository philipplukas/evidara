name: Runtime Cloud Run CD

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-control-cd.yml"
      - "platform-control/**"
      - "legal-search/api/**"
      - "document-intelligence/**"
      - "infra/env/*/runtime.gcp.tfvars.example"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: runtime-cloud-run-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  # Image tag = full SHA for traceability (must match Runtime Images tags on Artifact Registry).
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy-dev:
    name: Deploy runtime services to dev
    runs-on: ${{ vars.LIGHT_RUNNER_SCALE_SET || 'evidara-light' }}
    environment: dev
    env:
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      ARTIFACT_PROJECT_ID: ${{ vars.GCP_ARTIFACT_PROJECT_ID }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
      PLATFORM_CONTROL_SERVICE_NAME: ${{ vars.PLATFORM_CONTROL_SERVICE_NAME }}
      PLATFORM_CONTROL_WORKER_SERVICE_NAME: ${{ vars.PLATFORM_CONTROL_WORKER_SERVICE_NAME }}
      LEGAL_SEARCH_API_SERVICE_NAME: ${{ vars.LEGAL_SEARCH_API_SERVICE_NAME }}
      DI_CONSUMER_SERVICE_NAME: ${{ vars.DI_CONSUMER_SERVICE_NAME }}
      DOCUMENT_SERVICE_NAME: ${{ vars.DOCUMENT_INTELLIGENCE_DOCUMENT_SERVICE_NAME || 'document-intelligence-document-service' }}
      DOCUMENT_SERVICE_BEARER_TOKEN_SECRET: document-service-bearer-token-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Wait for runtime images (Artifact Registry)
        run: |
          set -euo pipefail
          REPO_PATH="${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          for image in platform-control platform-control-worker legal-search-api di-consumer document-intelligence-document-service; do
            echo "Waiting for ${REPO_PATH}/${image}:${IMAGE_TAG} ..."
            found=""
            for i in $(seq 1 90); do
              if gcloud artifacts docker images describe "${REPO_PATH}/${image}:${IMAGE_TAG}" >/dev/null 2>&1; then
                echo "Found ${image}:${IMAGE_TAG}"
                found=1
                break
              fi
              sleep 10
            done
            if [ -z "${found}" ]; then
              echo "::error::Timeout waiting for ${REPO_PATH}/${image}:${IMAGE_TAG}"
              exit 1
            fi
          done

      - name: Deploy platform-control API (dev)
        run: |
          gcloud run services update "${PLATFORM_CONTROL_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/platform-control:${IMAGE_TAG}"

      - name: Deploy platform-control worker (dev)
        run: |
          gcloud run services update "${PLATFORM_CONTROL_WORKER_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/platform-control-worker:${IMAGE_TAG}"

      - name: Deploy legal-search API (dev)
        run: |
          gcloud run services update "${LEGAL_SEARCH_API_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/legal-search-api:${IMAGE_TAG}"

      - name: Deploy document-intelligence consumer (dev)
        run: |
          gcloud run services update "${DI_CONSUMER_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/di-consumer:${IMAGE_TAG}"

      - name: Deploy document-intelligence document service (dev)
        run: |
          gcloud run services update "${DOCUMENT_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/document-intelligence-document-service:${IMAGE_TAG}"

      - name: Verify deployed revisions (dev)
        id: verify-dev
        run: |
          PC_REV=$(gcloud run services describe "${PLATFORM_CONTROL_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.latestReadyRevisionName)')
          LS_REV=$(gcloud run services describe "${LEGAL_SEARCH_API_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.latestReadyRevisionName)')
          DS_REV=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.latestReadyRevisionName)')
          echo "platform_control_revision=${PC_REV}" >> "$GITHUB_OUTPUT"
          echo "legal_search_revision=${LS_REV}" >> "$GITHUB_OUTPUT"
          echo "document_service_revision=${DS_REV}" >> "$GITHUB_OUTPUT"
          echo "### Dev Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Revision |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| platform-control | \`${PC_REV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| legal-search-api | \`${LS_REV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| document-intelligence-document-service | \`${DS_REV}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify platform-control worker env parity (dev)
        run: |
          set -euo pipefail
          WORKER_JSON=$(gcloud run services describe "${PLATFORM_CONTROL_WORKER_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json)
          for var in \
            PLATFORM_CONTROL_GCP_PROJECT_ID \
            PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND \
            PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND \
            PLATFORM_CONTROL_RAW_ARTIFACT_BUCKET \
            PLATFORM_CONTROL_RAW_ARTIFACT_PUBSUB_TOPIC \
            PLATFORM_CONTROL_ARTIFACT_BUNDLE_PUBSUB_TOPIC
          do
            if ! echo "${WORKER_JSON}" | jq -e --arg name "${var}" '.spec.template.spec.containers[0].env // [] | any(.name == $name)' >/dev/null; then
              echo "::error::platform-control worker is missing required env ${var} in dev"
              exit 1
            fi
          done
          WORKER_REV=$(echo "${WORKER_JSON}" | jq -r '.status.latestReadyRevisionName')
          echo "| platform-control-worker | \`${WORKER_REV}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test — platform-control health (dev)
        run: |
          PC_URL=$(gcloud run services describe "${PLATFORM_CONTROL_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          echo "Checking ${PC_URL}/health ..."
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PC_URL}/health" || echo "000")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::platform-control health check failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Smoke test — legal-search health (dev)
        run: |
          LS_URL=$(gcloud run services describe "${LEGAL_SEARCH_API_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          echo "Checking ${LS_URL}/health ..."
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${LS_URL}/health" || echo "000")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::legal-search health check failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Smoke test — platform-control readiness (dev)
        continue-on-error: true
        run: |
          PC_URL=$(gcloud run services describe "${PLATFORM_CONTROL_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          echo "Checking ${PC_URL}/ready ..."
          BODY=$(curl -s --max-time 10 "${PC_URL}/ready" || echo '{"status":"unreachable"}')
          echo "${BODY}" | jq .
          STATUS=$(echo "${BODY}" | jq -r '.status // "unknown"')
          echo "Readiness status: ${STATUS}"
          if [ "$STATUS" = "degraded" ]; then
            echo "::warning::platform-control readiness is degraded"
          fi

      - name: Resolve DI consumer URL (dev)
        id: di_consumer_dev_url
        run: |
          DI_URL=$(gcloud run services describe "${DI_CONSUMER_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          echo "di_url=${DI_URL}" >> "$GITHUB_OUTPUT"

      - name: Mint DI consumer ID token (dev)
        id: di_consumer_dev_token
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
          token_format: id_token
          id_token_audience: ${{ steps.di_consumer_dev_url.outputs.di_url }}
          id_token_include_email: true

      - name: Smoke test — DI consumer health (dev)
        env:
          DI_URL: ${{ steps.di_consumer_dev_url.outputs.di_url }}
          TOKEN: ${{ steps.di_consumer_dev_token.outputs.id_token }}
        run: |
          echo "Checking ${DI_URL}/health ..."
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${TOKEN}" "${DI_URL}/health" || echo "000")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::DI consumer health check failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Verify DI consumer surface config (dev)
        run: |
          set -euo pipefail
          DI_SURFACES_ROOT_URI=$(gcloud run services describe "${DI_CONSUMER_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="DI_SURFACES_ROOT_URI") | .value // empty')
          if [ -z "${DI_SURFACES_ROOT_URI}" ]; then
            echo "::error::DI consumer is missing DI_SURFACES_ROOT_URI in dev"
            exit 1
          fi
          echo "DI consumer source: DI_SURFACES_ROOT_URI=${DI_SURFACES_ROOT_URI}"

      - name: Smoke test — Document Service health (dev)
        run: |
          DS_URL=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          echo "Checking ${DS_URL}/health ..."
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${DS_URL}/health" || echo "000")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Document Service health check failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Smoke test — Document Service auth and lean wiring (dev)
        run: |
          set -euo pipefail
          DS_URL=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          LS_BASE_URL=$(gcloud run services describe "${LEGAL_SEARCH_API_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="DOCUMENT_INTELLIGENCE_BASE_URL") | .value // empty')
          if [ "${LS_BASE_URL}" != "${DS_URL}" ]; then
            echo "::error::legal-search API DOCUMENT_INTELLIGENCE_BASE_URL is '${LS_BASE_URL:-<empty>}', expected '${DS_URL}'"
            exit 1
          fi
          DS_CONTENT_DIR=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="DOCUMENT_SERVICE_CONTENT_DIR") | .value // empty')
          DS_SURFACES_ROOT_URI=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-dev" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="DI_SURFACES_ROOT_URI") | .value // empty')
          if [ -z "${DS_CONTENT_DIR}" ] && [ -z "${DS_SURFACES_ROOT_URI}" ]; then
            echo "::error::Document Service has neither DOCUMENT_SERVICE_CONTENT_DIR nor DI_SURFACES_ROOT_URI configured"
            exit 1
          fi
          echo "Document Service source: ${DS_CONTENT_DIR:+DOCUMENT_SERVICE_CONTENT_DIR=${DS_CONTENT_DIR}}${DS_SURFACES_ROOT_URI:+DI_SURFACES_ROOT_URI=${DS_SURFACES_ROOT_URI}}"

          TOKEN=$(gcloud secrets versions access latest \
            --project "${PROJECT_ID}" \
            --secret "${DOCUMENT_SERVICE_BEARER_TOKEN_SECRET}")
          DUMMY_DOCUMENT_ID="doc_00000000000000000000000000"
          LEAN_PATH="/v1/documents/${DUMMY_DOCUMENT_ID}/lean?document_revision=1"

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${DS_URL}${LEAN_PATH}" || echo "000")
          echo "Unauthenticated lean probe: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "401" ]; then
            echo "::error::Document Service accepted an unauthenticated lean probe (expected HTTP 401, got ${HTTP_CODE})"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${TOKEN}" \
            "${DS_URL}${LEAN_PATH}" || echo "000")
          echo "Authenticated lean probe: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "404" ]; then
            echo "::error::Authenticated Document Service lean probe failed (expected HTTP 404, got ${HTTP_CODE})"
            exit 1
          fi

  # ── Promotion Gate ──────────────────────────────
  # The prod job requires the dev environment to pass.
  # GitHub environment protection rules can add manual approval.

  deploy-prod:
    name: Deploy runtime services to prod
    runs-on: ${{ vars.LIGHT_RUNNER_SCALE_SET || 'evidara-light' }}
    needs: deploy-dev
    environment: prod
    env:
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      ARTIFACT_PROJECT_ID: ${{ vars.GCP_ARTIFACT_PROJECT_ID }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID_PROD }}
      PLATFORM_CONTROL_SERVICE_NAME: ${{ vars.PLATFORM_CONTROL_SERVICE_NAME }}
      PLATFORM_CONTROL_WORKER_SERVICE_NAME: ${{ vars.PLATFORM_CONTROL_WORKER_SERVICE_NAME }}
      LEGAL_SEARCH_API_SERVICE_NAME: ${{ vars.LEGAL_SEARCH_API_SERVICE_NAME }}
      DI_CONSUMER_SERVICE_NAME: ${{ vars.DI_CONSUMER_SERVICE_NAME }}
      DOCUMENT_SERVICE_NAME: ${{ vars.DOCUMENT_INTELLIGENCE_DOCUMENT_SERVICE_NAME || 'document-intelligence-document-service' }}
      DOCUMENT_SERVICE_BEARER_TOKEN_SECRET: document-service-bearer-token-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PROD }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Preflight — Cloud Run API enabled (prod)
        id: preflight-prod
        run: |
          set -euo pipefail
          if gcloud services list --enabled --project "${PROJECT_ID}" \
            --filter='name:run.googleapis.com' --format='value(name)' | rg -q '^run.googleapis.com$'; then
            echo "cloud_run_api_enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloud Run Admin API is enabled in ${PROJECT_ID}."
          else
            echo "::warning::Skipping prod deploy: run.googleapis.com is disabled in ${PROJECT_ID}."
            echo "cloud_run_api_enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Prod Deployment Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "- Reason: \`run.googleapis.com\` is disabled in \`${PROJECT_ID}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "- Action: enable Cloud Run Admin API, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Deploy the SAME image SHA that passed dev smoke tests
      - name: Deploy platform-control API (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          gcloud run services update "${PLATFORM_CONTROL_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/platform-control:${IMAGE_TAG}"

      - name: Deploy platform-control worker (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          gcloud run services update "${PLATFORM_CONTROL_WORKER_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/platform-control-worker:${IMAGE_TAG}"

      - name: Deploy legal-search API (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          gcloud run services update "${LEGAL_SEARCH_API_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/legal-search-api:${IMAGE_TAG}"

      - name: Deploy document-intelligence document service (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          gcloud run services update "${DOCUMENT_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/document-intelligence-document-service:${IMAGE_TAG}"

      - name: Verify deployed revisions (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          PC_REV=$(gcloud run services describe "${PLATFORM_CONTROL_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.latestReadyRevisionName)')
          LS_REV=$(gcloud run services describe "${LEGAL_SEARCH_API_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.latestReadyRevisionName)')
          DS_REV=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.latestReadyRevisionName)')
          echo "### Prod Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Revision |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| platform-control | \`${PC_REV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| legal-search-api | \`${LS_REV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| document-intelligence-document-service | \`${DS_REV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| image-tag | \`${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify platform-control worker env parity (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          set -euo pipefail
          WORKER_JSON=$(gcloud run services describe "${PLATFORM_CONTROL_WORKER_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json)
          for var in \
            PLATFORM_CONTROL_GCP_PROJECT_ID \
            PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND \
            PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND \
            PLATFORM_CONTROL_RAW_ARTIFACT_BUCKET \
            PLATFORM_CONTROL_RAW_ARTIFACT_PUBSUB_TOPIC \
            PLATFORM_CONTROL_ARTIFACT_BUNDLE_PUBSUB_TOPIC
          do
            if ! echo "${WORKER_JSON}" | jq -e --arg name "${var}" '.spec.template.spec.containers[0].env // [] | any(.name == $name)' >/dev/null; then
              echo "::error::platform-control worker is missing required env ${var} in prod"
              exit 1
            fi
          done
          WORKER_REV=$(echo "${WORKER_JSON}" | jq -r '.status.latestReadyRevisionName')
          echo "| platform-control-worker | \`${WORKER_REV}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test — platform-control health (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          PC_URL=$(gcloud run services describe "${PLATFORM_CONTROL_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PC_URL}/health" || echo "000")
          echo "platform-control health: HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::platform-control health check failed in prod (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Smoke test — legal-search health (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          LS_URL=$(gcloud run services describe "${LEGAL_SEARCH_API_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${LS_URL}/health" || echo "000")
          echo "legal-search health: HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::legal-search health check failed in prod (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Smoke test — Document Service health (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          DS_URL=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${DS_URL}/health" || echo "000")
          echo "document-service health: HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Document Service health check failed in prod (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Smoke test — Document Service auth and lean wiring (prod)
        if: steps.preflight-prod.outputs.cloud_run_api_enabled == 'true'
        run: |
          set -euo pipefail
          DS_URL=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          LS_BASE_URL=$(gcloud run services describe "${LEGAL_SEARCH_API_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="DOCUMENT_INTELLIGENCE_BASE_URL") | .value // empty')
          if [ "${LS_BASE_URL}" != "${DS_URL}" ]; then
            echo "::error::legal-search API DOCUMENT_INTELLIGENCE_BASE_URL is '${LS_BASE_URL:-<empty>}', expected '${DS_URL}'"
            exit 1
          fi
          DS_CONTENT_DIR=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="DOCUMENT_SERVICE_CONTENT_DIR") | .value // empty')
          DS_SURFACES_ROOT_URI=$(gcloud run services describe "${DOCUMENT_SERVICE_NAME}-prod" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="DI_SURFACES_ROOT_URI") | .value // empty')
          if [ -z "${DS_CONTENT_DIR}" ] && [ -z "${DS_SURFACES_ROOT_URI}" ]; then
            echo "::error::Document Service has neither DOCUMENT_SERVICE_CONTENT_DIR nor DI_SURFACES_ROOT_URI configured"
            exit 1
          fi
          echo "Document Service source: ${DS_CONTENT_DIR:+DOCUMENT_SERVICE_CONTENT_DIR=${DS_CONTENT_DIR}}${DS_SURFACES_ROOT_URI:+DI_SURFACES_ROOT_URI=${DS_SURFACES_ROOT_URI}}"

          TOKEN=$(gcloud secrets versions access latest \
            --project "${PROJECT_ID}" \
            --secret "${DOCUMENT_SERVICE_BEARER_TOKEN_SECRET}")
          DUMMY_DOCUMENT_ID="doc_00000000000000000000000000"
          LEAN_PATH="/v1/documents/${DUMMY_DOCUMENT_ID}/lean?document_revision=1"

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${DS_URL}${LEAN_PATH}" || echo "000")
          echo "Unauthenticated lean probe: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "401" ]; then
            echo "::error::Document Service accepted an unauthenticated lean probe (expected HTTP 401, got ${HTTP_CODE})"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${TOKEN}" \
            "${DS_URL}${LEAN_PATH}" || echo "000")
          echo "Authenticated lean probe: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "404" ]; then
            echo "::error::Authenticated Document Service lean probe failed (expected HTTP 404, got ${HTTP_CODE})"
            exit 1
          fi
