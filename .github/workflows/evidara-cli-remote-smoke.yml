# Manual smoke: platform-control + legal-search via evidara-cli against chosen base URLs.
#
# Auth model (private Cloud Run):
#   - Job uses GitHub Environment (dev | staging) for WIF + invoker SA (same secrets as e2e smoke).
#   - OIDC to GCP, then gcloud mints audience-scoped ID tokens for the two URL inputs.
#
# Optional repository secrets (app-layer only):
#   EVIDARA_PLATFORM_CONTROL_API_KEY — X-API-Key
#   EVIDARA_LEGAL_SEARCH_API_KEY     — X-API-Key
#
# Run: Actions → "Evidara CLI remote smoke" → pick environment + both base URLs.
name: Evidara CLI remote smoke

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub Actions environment (must match WIF + GCP_SERVICE_ACCOUNT_* secrets)
        type: choice
        options:
          - dev
          - staging
        default: dev
      platform_control_url:
        description: Platform-control base URL (HTTPS origin, e.g. https://platform-control-api-dev-….run.app)
        required: true
        type: string
      legal_search_url:
        description: Legal-search BFF base URL (HTTPS origin)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  remote-smoke:
    # Keep Python bootstrap on GitHub-hosted Linux until the Hetzner K8s runner
    # pools are available for generic setup-python jobs.
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.github_environment }}
    env:
      EVIDARA_PLATFORM_CONTROL_URL: ${{ github.event.inputs.platform_control_url }}
      EVIDARA_LEGAL_SEARCH_URL: ${{ github.event.inputs.legal_search_url }}
      EVIDARA_PLATFORM_CONTROL_API_KEY: ${{ secrets.EVIDARA_PLATFORM_CONTROL_API_KEY }}
      EVIDARA_LEGAL_SEARCH_API_KEY: ${{ secrets.EVIDARA_LEGAL_SEARCH_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ github.event.inputs.github_environment == 'dev' && secrets.GCP_SERVICE_ACCOUNT_DEV || secrets.GCP_SERVICE_ACCOUNT_STAGING }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Cloud Run audiences
        id: audiences
        env:
          PC_INPUT: ${{ github.event.inputs.platform_control_url }}
          LS_INPUT: ${{ github.event.inputs.legal_search_url }}
        run: |
          set -euo pipefail
          audience_for() {
            python3 -c 'import sys,urllib.parse; u=sys.argv[1].strip().rstrip("/"); p=urllib.parse.urlsplit(u); assert p.scheme and p.netloc, u; print("%s://%s" % (p.scheme, p.netloc))' "$1"
          }
          PC_AUDIENCE="$(audience_for "${PC_INPUT}")"
          LS_AUDIENCE="$(audience_for "${LS_INPUT}")"

          echo "pc_audience=${PC_AUDIENCE}" >> "${GITHUB_OUTPUT}"
          echo "ls_audience=${LS_AUDIENCE}" >> "${GITHUB_OUTPUT}"

      - name: Mint platform-control ID token
        id: pc_id_token
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ github.event.inputs.github_environment == 'dev' && secrets.GCP_SERVICE_ACCOUNT_DEV || secrets.GCP_SERVICE_ACCOUNT_STAGING }}
          token_format: id_token
          id_token_audience: ${{ steps.audiences.outputs.pc_audience }}

      - name: Mint legal-search ID token
        id: ls_id_token
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ github.event.inputs.github_environment == 'dev' && secrets.GCP_SERVICE_ACCOUNT_DEV || secrets.GCP_SERVICE_ACCOUNT_STAGING }}
          token_format: id_token
          id_token_audience: ${{ steps.audiences.outputs.ls_audience }}

      - name: Export audience-scoped Cloud Run ID tokens
        env:
          PC_TOKEN: ${{ steps.pc_id_token.outputs.id_token }}
          LS_TOKEN: ${{ steps.ls_id_token.outputs.id_token }}
        run: |
          if [[ -z "${PC_TOKEN}" || -z "${LS_TOKEN}" ]]; then
            echo "::error::Failed to mint ID tokens (check invoker IAM and URL origins)."
            exit 1
          fi

          echo "::add-mask::${PC_TOKEN}"
          echo "::add-mask::${LS_TOKEN}"
          echo "EVIDARA_PLATFORM_CONTROL_TOKEN=${PC_TOKEN}" >> "${GITHUB_ENV}"
          echo "EVIDARA_LEGAL_SEARCH_TOKEN=${LS_TOKEN}" >> "${GITHUB_ENV}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync CLI and run pings
        run: |
          cd tools/evidara-cli
          uv sync --group dev --quiet
          uv run evidara platform-control ping
          uv run evidara legal-search ping
