name: Secret scan

# The repository is public, so its git history is public with it. Pre-commit
# scans only what is being committed (`gitleaks git --staged`); this job is the
# half that covers everything already in — including commits pushed before the
# hook existed, and anything that reached `main` from a machine where pre-commit
# was not installed.
#
# Baseline measured 2026-09-16: 1,782 commits scanned, eight findings, all of
# them false positives (a secret's NAME, never its value), each allowlisted with
# a reason in .gitleaks.toml. The scan is therefore expected to be CLEAN, and a
# single new finding is a real signal rather than noise to triage.
#
# Not paths-filtered, deliberately. Every other gate in this repo is scoped to
# the surface it covers; a secret has no surface. A credential is just as
# committable in a README or a test fixture as in Terraform.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # GitHub-hosted for the same reason as architecture.yml: the self-hosted
    # Hetzner ARC runners are plain k8s pods, and this needs nothing from them.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The whole point is the history. The default shallow clone
          # (fetch-depth: 1) would scan one commit and report "no leaks found",
          # which is a PASS that means nothing — the exact DID-NOT-RUN-reported-
          # as-PASS failure AGENTS.md names.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Verify the scanner actually detects a secret
        # A scan that reports "no leaks found" is indistinguishable from a scan
        # that matched nothing because it was misconfigured — a bad --config
        # path, an allowlist that grew too broad, a rule set that failed to
        # load. So prove detection works on this exact config before trusting
        # the clean result below. Per AGENTS.md: a guard ships with a check that
        # fails when the guard stops working.
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python3 - "$tmp/planted.tf" <<'PY'
          import random, string, sys
          r = random.Random(7)
          pat = "ghp_" + "".join(r.choice(string.ascii_letters + string.digits) for _ in range(36))
          akid = "AKIA" + "".join(r.choice(string.ascii_uppercase + string.digits) for _ in range(16))
          with open(sys.argv[1], "w") as fh:
              fh.write(f'github_token = "{pat}"\naws_access_key_id = "{akid}"\n')
          PY
          if gitleaks dir --config .gitleaks.toml --redact "$tmp"; then
            echo "::error::gitleaks did NOT flag a planted credential — the scan below cannot be trusted."
            exit 1
          fi
          echo "Detection confirmed: planted credential was flagged."

      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .
