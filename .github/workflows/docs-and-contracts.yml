name: Docs and Contracts Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-validation:
    runs-on: ${{ vars.LIGHT_RUNNER_SCALE_SET || 'evidara-light' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Set up kubectl (kustomize)
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.6"

      - name: Determine contract guard git range
        id: contract_guard_range
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="${{ github.event.before }}"
            if [[ -z "${base_ref}" || "${base_ref}" == "0000000000000000000000000000000000000000" ]]; then
              base_ref="$(git rev-parse HEAD~1)"
            fi
          fi
          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${{ github.sha }}" >> "${GITHUB_OUTPUT}"

      - name: Install shellcheck
        # This job runs on the self-hosted ARC scale set, which is a plain k8s pod
        # with no shellcheck and no guarantee of a package manager. Fetching the
        # upstream static binary is deterministic and needs no root — and pinning
        # the version keeps a new shellcheck release from turning this gate red on
        # an unrelated PR.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          # Extract with Python rather than `tar -xJ`: the runner has no `xz`, and
          # `setup-python` has already run, so stdlib `tarfile`/`lzma` is the one
          # decompressor we can count on being present. `python -c`, not a heredoc:
          # a heredoc body inside this indented YAML block keeps its leading spaces
          # and Python rejects them.
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          python -c "import sys,tarfile,pathlib; d=pathlib.Path(sys.argv[1]); t=tarfile.open(d/'shellcheck.tar.xz'); m=next(x for x in t.getmembers() if x.name.endswith('/shellcheck')); m.name='shellcheck'; t.extract(m, d)" "${tmp}"
          install -Dm755 "${tmp}/shellcheck" "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/shellcheck" --version

      - name: Lint shell scripts
        # The repo carried `# shellcheck disable=` directives for a long time with
        # nothing enforcing them, which is how a deploy script kept an
        # `export X="$(cmd)"` that hid a failing command from `set -e` (#747).
        run: bash scripts/check-shellcheck.sh

      - name: Run guard unit tests
        # Discover the WHOLE directory rather than enumerating one -p pattern per
        # file. The enumerated form silently orphaned test_check_connector_worker_runtime.py
        # and test_lawyer_journey_kpis.py: committed, linted, maintained, executed
        # nowhere. Prefer running the directory and arguing for exclusions over
        # enumerating inclusions (#688, #686).
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Check Docker Compose profiles resolve
        run: python scripts/check_compose_profiles.py

      - name: Check Hetzner image pins roll together
        run: python scripts/check_hetzner_image_pins.py

      - name: Enforce contract manifest version bump
        run: |
          python scripts/check_contract_version_bump.py \
            --base "${{ steps.contract_guard_range.outputs.base_ref }}" \
            --head "${{ steps.contract_guard_range.outputs.head_ref }}"

      - name: Check vendored MacConfig platform contract pin
        run: |
          python scripts/check_platform_contract_vendor.py

      - name: Validate k8s GitOps kustomizations
        run: bash scripts/validate_k8s_gitops_kustomize.sh

      - name: Validate Zitadel deployment values
        # Deliberately WITHOUT --render. This job runs on the self-hosted ARC pool
        # and owns a required check; adding a helm install + chart download to it
        # would put PR merges behind a tool and a third-party registry it does not
        # need. The credential and ingress checks are pure Python and are the part
        # that matters (see #792). The chart render runs in zitadel-values.yml,
        # GitHub-hosted and paths-filtered — same split as architecture.yml.
        run: python scripts/check_hetzner_zitadel.py

      - name: Validate MinIO credentials are referenced, not committed
        # Pure Python, no cluster and no chart — same reasoning as the Zitadel gate
        # above. Guards the regression #792 was: the storage root password committed
        # to main and live, with Trino holding a second copy of it.
        run: python scripts/check_hetzner_minio_credentials.py

      - name: Validate country overlay blueprint templates
        run: |
          python scripts/check_country_overlay.py --country AT
          python scripts/check_country_overlay.py --country DE
          python scripts/check_country_overlay.py --country CH
          python scripts/check_country_overlay.py --country FR
          python scripts/check_country_overlay.py --country IT
          python scripts/check_country_overlay.py --country EU

      - name: Validate country overlay files (schema + vocab cross-refs)
        run: |
          python scripts/check_country_overlay_files.py --country AT
          python scripts/check_country_overlay_files.py --country CH
          python scripts/check_country_overlay_files.py --country DE
          python scripts/check_country_overlay_files.py --country FR
          python scripts/check_country_overlay_files.py --country IT
          python scripts/check_country_overlay_files.py --country EU

      - name: Validate OpenAPI contracts
        run: |
          python scripts/validate_openapi.py

      - name: Validate JSON Schemas and examples
        run: |
          python scripts/validate_json_schemas.py

      - name: Validate MVP contract manifest
        run: |
          python scripts/check_contract_manifest.py

      # The jurisdiction hierarchy legal-search reads is an EXPORT of
      # platform-control's reference seed (ADR-0033 / #583). If the seed grows a
      # jurisdiction and the export is not regenerated, `norm_hierarchy()`
      # silently reports the new place as ungoverned instead of failing.
      - name: Check jurisdiction-hierarchy vocabulary matches the seed
        run: |
          python scripts/generate_jurisdiction_hierarchy_vocab.py --check

      - name: Check staging smoke workflow isolation
        run: |
          python scripts/check-staging-smoke-workflow-isolation.py

      - name: Check workflow vars.* references are terraform-managed
        run: |
          python3 scripts/check_workflow_vars.py

      # Every committed test file must be collectable by some CI job. See
      # ADR-0040 (coverage honesty) and #686.
      - name: Check every test file is reachable from some CI job
        run: |
          python3 scripts/check_test_reachability.py

      # Two branches adding `0038-a.md` and `0038-b.md` merge without a git
      # conflict. This is the first point both are observable in one tree.
      - name: Check no two ADRs claim the same number
        run: |
          python3 scripts/check_adr_numbers.py

      - name: Check Austria overlay consistency
        run: |
          python scripts/check_country_overlay_at.py

  docs-lint:
    runs-on: ${{ vars.LIGHT_RUNNER_SCALE_SET || 'evidara-light' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install markdownlint
        run: |
          npm install --no-save markdownlint-cli

      - name: Install Mermaid validation dependencies
        run: |
          npm ci

      - name: Run markdown lint
        run: |
          npx markdownlint-cli \
            README.md \
            CONTRIBUTING.md \
            SECURITY.md \
            docs/**/*.md \
            .github/pull_request_template.md \
            --config .markdownlint.json

      - name: Check component doc headings
        run: |
          python scripts/check_component_docs.py

      - name: Check runbook metadata
        run: |
          python scripts/check_runbooks.py

      - name: Check doc links
        run: |
          python scripts/check_doc_links.py

      - name: Check diagram format
        run: |
          python scripts/check_diagram_format.py

      - name: Check Mermaid diagrams render
        run: |
          npm run --silent check:mermaid

      - name: Build docs site (strict)
        run: |
          python -m mkdocs build --strict --quiet
