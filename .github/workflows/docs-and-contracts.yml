name: Docs and Contracts Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-docs-and-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Install markdownlint
        run: |
          npm install -g markdownlint-cli

      - name: Run markdown lint
        run: |
          markdownlint \
            README.md \
            CONTRIBUTING.md \
            SECURITY.md \
            docs/**/*.md \
            .github/pull_request_template.md \
            --config .markdownlint.json

      - name: Validate OpenAPI contracts
        run: |
          python scripts/validate_openapi.py

      - name: Validate JSON Schemas
        run: |
          python scripts/validate_json_schemas.py

      - name: Check component doc headings
        run: |
          python scripts/check_component_docs.py

      - name: Check runbook metadata
        run: |
          python scripts/check_runbooks.py

      - name: Check doc links
        run: |
          python scripts/check_doc_links.py

      - name: Build docs site (strict)
        run: |
          mkdocs build --strict --quiet
