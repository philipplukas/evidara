name: PR Title

on:
  pull_request:
    # `synchronize` is required, not optional: `check-title` is a required check
    # and branch protection is `strict` (branch must be up to date). Every
    # "Update branch" pushes a new head SHA via `synchronize` — without it the
    # required check never reports on that SHA and the PR blocks forever.
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-title:
    runs-on: ${{ vars.LIGHT_RUNNER_SCALE_SET || 'evidara-light' }}
    permissions:
      pull-requests: read
    steps:
      - name: Validate conventional commit PR title
        # Pinned to SHA for supply-chain safety (tag: v5.5.3)
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `security` is here because the repo already uses it for issues — #792 was
          # titled `security(infra): ...` — and a PR mirroring its own issue's title
          # was rejected (#811). Two conventions for the same work is a papercut that
          # recurs on exactly the changes least worth adding friction to.
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            test
            style
            perf
            security
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The PR title "{title}" does not follow conventional commit format.

            Use one of: feat, fix, chore, docs, ci, refactor, test, style, perf, security
            Optional scope: feat(legal-search): ...

            Examples:
              feat: add jurisdiction filter
              fix(platform-control): correct run state transition
              docs(adr): ADR-0008 caching strategy
              security(infra): rotate a credential that reached main
