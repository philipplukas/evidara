name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional commit PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            test
            style
            perf
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The PR title "{title}" does not follow conventional commit format.

            Use one of: feat, fix, chore, docs, ci, refactor, test, style, perf
            Optional scope: feat(legal-search): ...

            Examples:
              feat: add jurisdiction filter
              fix(platform-control): correct run state transition
              docs(adr): ADR-0008 caching strategy
