name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-title:
    runs-on: ${{ vars.LIGHT_RUNNER_SCALE_SET || 'evidara-light' }}
    permissions:
      pull-requests: read
    steps:
      - name: Validate conventional commit PR title
        # Pinned to SHA for supply-chain safety (tag: v5.5.3)
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            test
            style
            perf
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The PR title "{title}" does not follow conventional commit format.

            Use one of: feat, fix, chore, docs, ci, refactor, test, style, perf
            Optional scope: feat(legal-search): ...

            Examples:
              feat: add jurisdiction filter
              fix(platform-control): correct run state transition
              docs(adr): ADR-0008 caching strategy
