name: Platform Control

on:
  # Deliberately NOT path-filtered for pull_request: `Platform Control gate` is a
  # required status check, and a workflow that never starts never reports one, so
  # the PR would stay pending forever. The `changes` job below reproduces the old
  # filter at job level, so an unrelated PR still skips `check` and pays only the
  # ~10s filter job. `push` keeps its filter — required checks apply to PRs only.
  # See #719.
  pull_request:
  push:
    branches: [main]
    paths:
      - "platform-control/**"
      - "contracts/api/platform-control.openapi.yaml"
      - "scripts/check-platform-control.sh"
      - "scripts/generate_platform_control_contract.py"
      - "scripts/check-e2e-spec-coverage.sh"
      - "scripts/check_visual_baseline_provenance.py"
      - "scripts/e2e/**"
      - "styles/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reproduces the `on.pull_request.paths` filter that used to gate this
  # workflow, at job level, so `gate` can always report. See #719.
  changes:
    name: Detect changed paths
    # dorny/paths-filter compares PR head/base via the GitHub API on
    # pull_request; without this it fails "Resource not accessible by
    # integration". Scoped to this job so no other job's permissions change.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'platform-control/**'
              - 'contracts/api/platform-control.openapi.yaml'
              - 'scripts/check-platform-control.sh'
              - 'scripts/generate_platform_control_contract.py'
              - 'scripts/check-e2e-spec-coverage.sh'
              - 'scripts/check_visual_baseline_provenance.py'
              - 'scripts/e2e/**'
              - 'styles/**'
              - '.github/workflows/platform-control.yml'

  check:
    # GitHub-hosted keeps setup-node/setup-python stable until Hetzner K8s
    # runners provide an Ubuntu-compatible bootstrap path for both toolchains.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-control/admin/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      # The `temporal` tests drive a real workflow on the temporalio SDK's
      # time-skipping test server. That server is a *local* binary — it binds a
      # loopback port and talks to nothing — but the SDK fetches it from
      # temporal.download once per SDK version. Caching it keeps the tests off
      # the network on all but the first run after a temporalio bump, without
      # resorting to skipping them (which is how they came to never run at
      # all — #564). A cache miss is not fatal: the SDK just re-fetches.
      - name: Cache Temporal test server binary
        uses: actions/cache@v4
        with:
          path: platform-control/.temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('platform-control/uv.lock') }}
          restore-keys: |
            temporal-test-server-${{ runner.os }}-

      - name: Install admin dependencies
        run: npm ci
        working-directory: platform-control/admin

      - name: Check (backend + admin)
        run: bash scripts/check-platform-control.sh

  # ─── Admin Playwright suite ───
  #
  # The admin's e2e specs ran in NO workflow. `npm run check` for that surface is
  # typecheck + lint + vitest + openapi; nothing invoked `npm run e2e`, so six
  # spec files were committed, linted, typechecked and executed by nothing. That
  # is not a coverage nicety — it is why a clipped ACTIONS column, an attention
  # chip contradicting the dashboard, a UA-beveled sort header and a completely
  # absent dark mode all survived review. Vitest cannot see any of them: jsdom
  # has no layout engine and applies no stylesheet.
  #
  # Split from `check` rather than folded into it because this job needs a
  # browser download and a built dev server; keeping it separate means a browser
  # cache miss cannot slow the fast lint/test gate. Both feed `gate`.
  #
  # Every spec mocks platform-control via `page.route`, so no backend, database
  # or API key is required — only the Next dev server Playwright's `webServer`
  # starts itself.
  admin-e2e:
    name: Admin e2e (Playwright)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-control/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Read the pin from `.nvmrc` so CI and local cannot drift.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: platform-control/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform-control/admin/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run e2e:browsers

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      - name: Run admin e2e suite
        run: npm run e2e

      # Asserts every spec under platform-control/admin/e2e/ is selected by some
      # command this workflow invokes — the guard that keeps the job above from
      # silently drifting back to running nothing (#686). Runs here because this
      # job already has node_modules, and the check needs no browser
      # (`playwright test --list` does not start the webServer).
      - name: Check e2e spec coverage
        working-directory: .
        run: bash scripts/check-e2e-spec-coverage.sh

      # `test-results/` FIRST, and it is the one that matters. playwright.config.ts
      # sets `screenshot: only-on-failure` and `trace: retain-on-failure`, which
      # Playwright writes to `outputDir` — `test-results/` by default. No HTML
      # reporter is configured, so `playwright-report/` is never written at all:
      # this step uploaded a directory that does not exist, `if-no-files-found`
      # defaulted to `warn`, and every admin-e2e failure in CI produced ZERO
      # artifacts. The sibling visual-regression job below always had it right.
      #
      # Measured on PR #1000: two consecutive failures of one spec, a screenshot and
      # a trace captured on the runner both times, and nothing retrievable — the
      # failure could not be diagnosed from CI at all (#1001).
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-failure-${{ github.run_id }}
          path: |
            platform-control/admin/test-results
            platform-control/admin/playwright-report
          # Loud, not silent: if this uploads nothing again, the next person should
          # see that rather than infer it from an empty artifact list.
          if-no-files-found: warn
          retention-days: 7

  # ─── Baseline provenance ───
  #
  # Mirrors the pre-commit hook of the same name (AGENTS.md: pre-commit and CI run
  # the same checks) and the identically named job in `legal-search.yml`. The guard
  # covers BOTH snapshot directories, so it must run from whichever surface changed
  # — running it only in the legal-search workflow is the misrouting #913 is about.
  # Needs full history for the merge-base diff.
  visual-baseline-provenance:
    name: Visual baseline provenance
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check visual baseline provenance
        run: |
          python3 scripts/check_visual_baseline_provenance.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}"

  # ─── Admin pixel baselines ───
  #
  # The admin's run-detail v2 layout used to be photographed by a test in
  # `legal-search/frontend/e2e/visual.spec.ts`, with its baseline PNG committed
  # under that surface. An admin layout change therefore failed a LEGAL-SEARCH job
  # (#895), and two branches touching admin layout collided on an unmergeable
  # binary (#902/#905). It lives here now (#913).
  #
  # Split from `admin-e2e` rather than folded into it for the same reason that job
  # is split from `check`: a pixel baseline is the one thing in this workflow that
  # can go red for an environmental reason (font rasterisation), and it must not be
  # able to mask the functional suite — nor be masked by it.
  #
  # ZERO pixel tolerance: `playwright.config.ts` sets no `maxDiffPixelRatio`. Do not
  # add one. The legal-search suite carried 0.06 and stayed green across a ~260px
  # mislaid layout region for 3.5 months (#605/#611).
  admin-visual-regression:
    name: Admin visual regression (Playwright)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-control/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: platform-control/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform-control/admin/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run e2e:browsers

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      - name: Visual pixel regression
        run: npm run e2e:visual

      # On failure, upload the actual render, the diff and the trace so a drift can
      # be inspected without reproducing it locally — and, when the drift is
      # intended, so a reviewer can see what moved before applying the refresh label.
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-regression-results-${{ github.run_id }}
          path: platform-control/admin/test-results
          retention-days: 7
          if-no-files-found: warn

  # ─── Baseline regeneration, in CI, on demand ───
  #
  # The admin twin of `visual-baseline-refresh` in `legal-search.yml`. Generation
  # happens on the same runner that verifies, which is what makes zero tolerance
  # achievable: a baseline blessed on a workstation carries that workstation's font
  # rasterisation, which no other machine reproduces byte-for-byte.
  #
  # To use it: add the `visual-baseline-refresh` label to the PR, then push (the
  # label alone does not start a run; it is read from the PR payload of the next
  # push). It deliberately does not run on `main`.
  admin-visual-baseline-refresh:
    name: Admin visual baseline refresh
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'visual-baseline-refresh') &&
      needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: platform-control/admin

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      # Same toolchain as `admin-visual-regression` above. If these two ever
      # diverge, baselines are generated in one environment and verified in another
      # — the whole failure this job exists to prevent.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: platform-control/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform-control/admin/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run e2e:browsers

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      # `=changed`, NOT the bare `--update-snapshots` (which means `=all`). `=all`
      # rewrites every snapshot even when it already matches, so a reviewer can no
      # longer tell which baseline actually moved. An unreadable diff is how bad
      # baselines get waved through.
      - name: Regenerate baselines (only those that actually differ)
        run: npx playwright test e2e/visual.spec.ts --update-snapshots=changed

      - name: Record provenance and commit
        working-directory: .
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd platform-control/admin/e2e/visual.spec.ts-snapshots

          changed="$(git status --porcelain . | awk '{print $2}' | xargs -r -n1 basename | sort)"
          if [ -z "$changed" ]; then
            echo "No baseline changed — nothing to record."
            exit 0
          fi

          echo "Regenerated:"; echo "$changed"

          entry="$(mktemp)"
          {
            echo "## $(date -u +%Y-%m-%d) — PR #${PR_NUMBER} — CI-generated refresh"
            echo
            echo "- Generated by: \`admin-visual-baseline-refresh\` on \`ubuntu-latest\` ([run](${RUN_URL}))"
            echo "- Requested by: @${ACTOR}"
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- Reason: _requested via the \`visual-baseline-refresh\` label._"
            echo "  **Replace this line with why the NEW image is correct before merging.**"
            echo "  A reviewer must be able to check the claim against the diff."
            echo "- Files:"
            echo "$changed" | sed 's/^/  - /'
            echo
          } > "$entry"

          # Insert above the newest existing entry. Anchored on a DATE heading, not a
          # bare `## `, so the file's own prose headings are not mistaken for entries
          # — the same distinction the guard script draws.
          awk 'NR==FNR{e=e $0 ORS; next}
               /^## [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ && !done {printf "%s", e; done=1}
               {print}' \
            "$entry" PROVENANCE.md > PROVENANCE.new
          mv PROVENANCE.new PROVENANCE.md

          cd "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-control/admin/e2e/visual.spec.ts-snapshots

          msg="$(mktemp)"
          {
            printf 'test(platform-control): refresh admin visual baselines in CI (PR #%s)\n\n' "${PR_NUMBER}"
            printf 'Generated by the admin-visual-baseline-refresh job so the images come\n'
            printf 'from the same environment that verifies them (#611, #913).\n'
          } > "$msg"
          git commit -F "$msg"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

          echo "::notice::Baselines refreshed. Fill in the Reason: line in PROVENANCE.md before merging."

  # The single required status check for this workflow. Individual jobs are
  # path-filtered and GitHub reports no conclusion for a job skipped by `if:`,
  # so requiring one directly would leave unrelated PRs pending forever.
  # This job always reports; `skipped` is accepted, `failure`/`cancelled` are not.
  gate:
    name: Platform Control gate
    needs:
      - changes
      - check
      - admin-e2e
      - visual-baseline-provenance
      - admin-visual-regression
      - admin-visual-baseline-refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed=$(echo "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Job(s) did not pass: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All jobs passed or were skipped."
