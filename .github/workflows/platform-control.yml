name: Platform Control

on:
  pull_request:
    paths:
      - "platform-control/**"
      - "contracts/api/platform-control.openapi.yaml"
  push:
    branches: [main]
    paths:
      - "platform-control/**"
      - "contracts/api/platform-control.openapi.yaml"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Check (ruff + pytest)
        run: bash scripts/check-platform-control.sh
