name: Platform Control

on:
  # Deliberately NOT path-filtered for pull_request: `Platform Control gate` is a
  # required status check, and a workflow that never starts never reports one, so
  # the PR would stay pending forever. The `changes` job below reproduces the old
  # filter at job level, so an unrelated PR still skips `check` and pays only the
  # ~10s filter job. `push` keeps its filter — required checks apply to PRs only.
  # See #719.
  pull_request:
  push:
    branches: [main]
    paths:
      - "platform-control/**"
      - "contracts/api/platform-control.openapi.yaml"
      - "scripts/check-platform-control.sh"
      - "scripts/generate_platform_control_contract.py"
      - "scripts/check-e2e-spec-coverage.sh"
      - "scripts/e2e/**"
      - "styles/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reproduces the `on.pull_request.paths` filter that used to gate this
  # workflow, at job level, so `gate` can always report. See #719.
  changes:
    name: Detect changed paths
    # dorny/paths-filter compares PR head/base via the GitHub API on
    # pull_request; without this it fails "Resource not accessible by
    # integration". Scoped to this job so no other job's permissions change.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'platform-control/**'
              - 'contracts/api/platform-control.openapi.yaml'
              - 'scripts/check-platform-control.sh'
              - 'scripts/generate_platform_control_contract.py'
              - 'scripts/check-e2e-spec-coverage.sh'
              - 'scripts/e2e/**'
              - 'styles/**'
              - '.github/workflows/platform-control.yml'

  check:
    # GitHub-hosted keeps setup-node/setup-python stable until Hetzner K8s
    # runners provide an Ubuntu-compatible bootstrap path for both toolchains.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-control/admin/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      # The `temporal` tests drive a real workflow on the temporalio SDK's
      # time-skipping test server. That server is a *local* binary — it binds a
      # loopback port and talks to nothing — but the SDK fetches it from
      # temporal.download once per SDK version. Caching it keeps the tests off
      # the network on all but the first run after a temporalio bump, without
      # resorting to skipping them (which is how they came to never run at
      # all — #564). A cache miss is not fatal: the SDK just re-fetches.
      - name: Cache Temporal test server binary
        uses: actions/cache@v4
        with:
          path: platform-control/.temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('platform-control/uv.lock') }}
          restore-keys: |
            temporal-test-server-${{ runner.os }}-

      - name: Install admin dependencies
        run: npm ci
        working-directory: platform-control/admin

      - name: Check (backend + admin)
        run: bash scripts/check-platform-control.sh

  # ─── Admin Playwright suite ───
  #
  # The admin's e2e specs ran in NO workflow. `npm run check` for that surface is
  # typecheck + lint + vitest + openapi; nothing invoked `npm run e2e`, so six
  # spec files were committed, linted, typechecked and executed by nothing. That
  # is not a coverage nicety — it is why a clipped ACTIONS column, an attention
  # chip contradicting the dashboard, a UA-beveled sort header and a completely
  # absent dark mode all survived review. Vitest cannot see any of them: jsdom
  # has no layout engine and applies no stylesheet.
  #
  # Split from `check` rather than folded into it because this job needs a
  # browser download and a built dev server; keeping it separate means a browser
  # cache miss cannot slow the fast lint/test gate. Both feed `gate`.
  #
  # Every spec mocks platform-control via `page.route`, so no backend, database
  # or API key is required — only the Next dev server Playwright's `webServer`
  # starts itself.
  admin-e2e:
    name: Admin e2e (Playwright)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-control/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Read the pin from `.nvmrc` so CI and local cannot drift.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: platform-control/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform-control/admin/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run e2e:browsers

      - name: Install Playwright system deps
        if: runner.environment == 'github-hosted'
        run: npx playwright install-deps chromium

      - name: Run admin e2e suite
        run: npm run e2e

      # Asserts every spec under platform-control/admin/e2e/ is selected by some
      # command this workflow invokes — the guard that keeps the job above from
      # silently drifting back to running nothing (#686). Runs here because this
      # job already has node_modules, and the check needs no browser
      # (`playwright test --list` does not start the webServer).
      - name: Check e2e spec coverage
        working-directory: .
        run: bash scripts/check-e2e-spec-coverage.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report
          path: platform-control/admin/playwright-report/
          retention-days: 7

  # The single required status check for this workflow. Individual jobs are
  # path-filtered and GitHub reports no conclusion for a job skipped by `if:`,
  # so requiring one directly would leave unrelated PRs pending forever.
  # This job always reports; `skipped` is accepted, `failure`/`cancelled` are not.
  gate:
    name: Platform Control gate
    needs:
      - changes
      - check
      - admin-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed=$(echo "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Job(s) did not pass: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All jobs passed or were skipped."
