name: Platform Control

on:
  pull_request:
    paths:
      - "platform-control/**"
      - "contracts/api/platform-control.openapi.yaml"
      - "scripts/check-platform-control.sh"
  push:
    branches: [main]
    paths:
      - "platform-control/**"
      - "contracts/api/platform-control.openapi.yaml"
      - "scripts/check-platform-control.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub-hosted keeps setup-node/setup-python stable until Hetzner K8s
    # runners provide an Ubuntu-compatible bootstrap path for both toolchains.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-control/admin/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install admin dependencies
        run: npm ci
        working-directory: platform-control/admin

      - name: Check (backend + admin)
        run: bash scripts/check-platform-control.sh
