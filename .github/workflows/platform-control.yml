name: Platform Control

on:
  pull_request:
    paths:
      - "platform-control/**"
      - "contracts/api/platform-control.openapi.yaml"
      - "scripts/check-platform-control.sh"
  push:
    branches: [main]
    paths:
      - "platform-control/**"
      - "contracts/api/platform-control.openapi.yaml"
      - "scripts/check-platform-control.sh"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-control/admin/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install admin dependencies
        run: npm ci
        working-directory: platform-control/admin

      - name: Check (backend + admin)
        run: bash scripts/check-platform-control.sh
