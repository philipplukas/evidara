name: Document Intelligence

on:
  # Deliberately NOT path-filtered for pull_request: `Document Intelligence gate`
  # is a required status check, and a workflow that never starts never reports
  # one, so the PR would stay pending forever. The `changes` job below reproduces
  # the old filter at job level, so an unrelated PR still skips the check job and
  # pays only the ~10s filter job. `push` keeps its filter — required checks apply
  # to PRs only. See #719.
  pull_request:
  push:
    branches: [main]
    paths:
      - "document-intelligence/**"
      - "contracts/api/document-intelligence.openapi.yaml"
      - "contracts/api/document-intelligence-runtime.openapi.yaml"
      - "contracts/common/**"
      - "contracts/events/**"
      - "contracts/examples/**"
      - "contracts/schemas/**"
      - "contracts/vocabularies/document-type.json"
      - "scripts/check-document-intelligence.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reproduces the `on.pull_request.paths` filter that used to gate this
  # workflow, at job level, so `gate` can always report. See #719.
  changes:
    name: Detect changed paths
    # dorny/paths-filter compares PR head/base via the GitHub API on
    # pull_request; without this it fails "Resource not accessible by
    # integration". Scoped to this job so no other job's permissions change.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'document-intelligence/**'
              - 'contracts/api/document-intelligence.openapi.yaml'
              - 'contracts/api/document-intelligence-runtime.openapi.yaml'
              - 'contracts/common/**'
              - 'contracts/events/**'
              - 'contracts/examples/**'
              - 'contracts/schemas/**'
              - 'contracts/vocabularies/document-type.json'
              - 'scripts/check-document-intelligence.sh'
              - '.github/workflows/document-intelligence.yml'

  document-intelligence-check:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ${{ vars.HEAVY_RUNNER_SCALE_SET || 'evidara-heavy-v2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Keep the extras in sync with scripts/check-document-intelligence.sh. `llm`
      # carries `dspy`, without which 12 tests over the production LLM extraction
      # path silently never ran (#685).
      #
      # This resolves `pyproject.toml`'s FLOORS against PyPI on the day it runs — it is
      # deliberately NOT the versions the image ships, which `document-intelligence-locked`
      # below covers from `uv.lock` (#848). Keeping one job on the floors is what turns a
      # breaking upstream `deltalake`/`pyarrow` release into a signal instead of a
      # surprise at the next image build.
      - name: Install document-intelligence dependencies
        run: python -m pip install -e "./document-intelligence[dev,service,test,llm]"

      - name: Check (ruff + pytest + contracts + dbt)
        run: bash scripts/check-document-intelligence.sh

  # The suite against the dependency set the **image** ships (#848).
  #
  # `document-intelligence-check` above installs with `pip install -e .[...]`, which
  # resolves `pyproject.toml`'s floors against PyPI on the day it runs. That is useful —
  # it is the early warning that a new `deltalake`/`pyarrow` broke us — but it is not
  # what is deployed: the Dockerfiles install from `uv.lock`, so without this job the
  # versions in production are tested by no CI job at all. Measured on 2026-09-03, the
  # two resolutions were `deltalake` 1.6.3 / `pyarrow` 25.0.1 (floors) against 1.5.0 /
  # 23.0.1 (lock, before this change).
  #
  # `uv sync --frozen` fails if `uv.lock` and `pyproject.toml` disagree, so a floor
  # change that nobody re-locked stops here rather than shipping an image built from a
  # lock the gate never saw.
  document-intelligence-locked:
    name: Locked dependency set (what the image ships)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
    runs-on: ${{ vars.HEAVY_RUNNER_SCALE_SET || 'evidara-heavy-v2' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Must match the Dockerfiles' base image and document-intelligence/.python-version.
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install the locked dependency set
        working-directory: document-intelligence
        run: uv sync --frozen --extra dev --extra service --extra test --extra llm

      - name: Report the versions under test
        working-directory: document-intelligence
        run: |
          uv run --frozen python -c "import sys, deltalake, pyarrow; print(f'python={sys.version.split()[0]} deltalake={deltalake.__version__} pyarrow={pyarrow.__version__}')"

      - name: Tests (pytest)
        working-directory: document-intelligence
        run: uv run --frozen pytest tests/ -q

  # The single required status check for this workflow. Individual jobs are
  # path-filtered and GitHub reports no conclusion for a job skipped by `if:`,
  # so requiring one directly would leave unrelated PRs pending forever.
  # This job always reports; `skipped` is accepted, `failure`/`cancelled` are not.
  gate:
    name: Document Intelligence gate
    needs:
      - changes
      - document-intelligence-check
      - document-intelligence-locked
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed=$(echo "$NEEDS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Job(s) did not pass: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All jobs passed or were skipped."
