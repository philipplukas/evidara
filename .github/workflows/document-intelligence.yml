name: Document Intelligence

on:
  pull_request:
    paths:
      - "document-intelligence/**"
      - "contracts/api/document-intelligence.openapi.yaml"
      - "contracts/api/document-intelligence-runtime.openapi.yaml"
      - "contracts/common/**"
      - "contracts/events/**"
      - "contracts/examples/**"
      - "contracts/schemas/**"
      - "contracts/vocabularies/document-type.json"
      - "scripts/check-document-intelligence.sh"
      - "scripts/check-document-intelligence-runtime.sh"
      - "infra/terraform/databricks/document_intelligence/**"
      - "infra/terraform/databricks/document_intelligence_stack/**"
      - "infra/env/*/document_intelligence.databricks.tfvars"
  push:
    branches: [main]
    paths:
      - "document-intelligence/**"
      - "contracts/api/document-intelligence.openapi.yaml"
      - "contracts/api/document-intelligence-runtime.openapi.yaml"
      - "contracts/common/**"
      - "contracts/events/**"
      - "contracts/examples/**"
      - "contracts/schemas/**"
      - "contracts/vocabularies/document-type.json"
      - "scripts/check-document-intelligence.sh"
      - "scripts/check-document-intelligence-runtime.sh"
      - "infra/terraform/databricks/document_intelligence/**"
      - "infra/terraform/databricks/document_intelligence_stack/**"
      - "infra/env/*/document_intelligence.databricks.tfvars"

jobs:
  document-intelligence-check:
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_RUNS_ON_JSON || '["self-hosted","linux","x64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install document-intelligence dependencies
        run: python -m pip install -e "./document-intelligence[dev,service]"

      - name: Check (ruff + unittest + contracts + dbt)
        run: bash scripts/check-document-intelligence.sh

  document-intelligence-runtime-check:
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_RUNS_ON_JSON || '["self-hosted","linux","x64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Runtime / deployment checks
        run: bash scripts/check-document-intelligence-runtime.sh
