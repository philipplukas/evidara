name: Evidara CLI

on:
  pull_request:
    paths:
      - "tools/evidara-cli/**"
      - "scripts/check-evidara-cli.sh"
      - "scripts/smoke-evidara-cli.sh"
      - "scripts/bootstrap-ris-source.py"
      - ".github/workflows/evidara-cli.yml"
      - ".github/workflows/evidara-cli-remote-smoke.yml"
  push:
    branches: [main]
    paths:
      - "tools/evidara-cli/**"
      - "scripts/check-evidara-cli.sh"
      - "scripts/smoke-evidara-cli.sh"
      - "scripts/bootstrap-ris-source.py"
      - ".github/workflows/evidara-cli.yml"
      - ".github/workflows/evidara-cli-remote-smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidara-cli:
    # setup-python is more predictable on GitHub-hosted Linux while the
    # self-hosted Hetzner runner path moves behind Kubernetes-managed runners.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Check evidara-cli
        run: bash scripts/check-evidara-cli.sh
