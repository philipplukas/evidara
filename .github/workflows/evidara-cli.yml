name: Evidara CLI

on:
  pull_request:
    paths:
      - "tools/evidara-cli/**"
      - "scripts/check-evidara-cli.sh"
      - "scripts/smoke-evidara-cli.sh"
      - "scripts/bootstrap-ris-source.py"
      - ".github/workflows/evidara-cli.yml"
      - ".github/workflows/evidara-cli-remote-smoke.yml"
  push:
    branches: [main]
    paths:
      - "tools/evidara-cli/**"
      - "scripts/check-evidara-cli.sh"
      - "scripts/smoke-evidara-cli.sh"
      - "scripts/bootstrap-ris-source.py"
      - ".github/workflows/evidara-cli.yml"
      - ".github/workflows/evidara-cli-remote-smoke.yml"

jobs:
  evidara-cli:
    # First light-cohort cutover after runner-pool smoke proved generic Python
    # bootstrap on the bridge self-hosted labels.
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_RUNS_ON_JSON || '["self-hosted","linux","x64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Python 3.12 with uv
        run: |
          set -euo pipefail
          uv python install 3.12
          uv python find 3.12

      - name: Check evidara-cli
        run: bash scripts/check-evidara-cli.sh
