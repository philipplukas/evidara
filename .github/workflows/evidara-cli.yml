name: Evidara CLI

on:
  pull_request:
    paths:
      - "tools/evidara-cli/**"
      - "scripts/check-evidara-cli.sh"
      - "scripts/smoke-evidara-cli.sh"
      - "scripts/bootstrap-ris-source.py"
      - ".github/workflows/evidara-cli.yml"
      - ".github/workflows/evidara-cli-remote-smoke.yml"
  push:
    branches: [main]
    paths:
      - "tools/evidara-cli/**"
      - "scripts/check-evidara-cli.sh"
      - "scripts/smoke-evidara-cli.sh"
      - "scripts/bootstrap-ris-source.py"
      - ".github/workflows/evidara-cli.yml"
      - ".github/workflows/evidara-cli-remote-smoke.yml"

jobs:
  evidara-cli:
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_RUNS_ON_JSON || '["self-hosted","linux","x64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Check evidara-cli
        run: bash scripts/check-evidara-cli.sh
