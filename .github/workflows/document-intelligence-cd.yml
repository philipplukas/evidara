name: Document Intelligence CD

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/document-intelligence-cd.yml"
      - "document-intelligence/**"
      - "contracts/events/**"
      - "contracts/schemas/**"
      - "scripts/check-document-intelligence-runtime.sh"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: document-intelligence-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy bundle to dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle (dev)
        working-directory: document-intelligence
        env:
          COMPUTE_GUARDRAILS_POLICY_ID: ${{ secrets.DATABRICKS_COMPUTE_GUARDRAILS_POLICY_ID }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${COMPUTE_GUARDRAILS_POLICY_ID:-}" ]; then
            extra+=(--var "compute_guardrails_policy_id=${COMPUTE_GUARDRAILS_POLICY_ID}")
          fi
          databricks bundle validate --target dev "${extra[@]}"

      - name: Deploy Databricks bundle (dev)
        working-directory: document-intelligence
        env:
          COMPUTE_GUARDRAILS_POLICY_ID: ${{ secrets.DATABRICKS_COMPUTE_GUARDRAILS_POLICY_ID }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${COMPUTE_GUARDRAILS_POLICY_ID:-}" ]; then
            extra+=(--var "compute_guardrails_policy_id=${COMPUTE_GUARDRAILS_POLICY_ID}")
          fi
          databricks bundle deploy --target dev "${extra[@]}"

  deploy-staging:
    name: Deploy bundle to staging
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: staging
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle (staging)
        working-directory: document-intelligence
        env:
          COMPUTE_GUARDRAILS_POLICY_ID: ${{ secrets.DATABRICKS_COMPUTE_GUARDRAILS_POLICY_ID }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${COMPUTE_GUARDRAILS_POLICY_ID:-}" ]; then
            extra+=(--var "compute_guardrails_policy_id=${COMPUTE_GUARDRAILS_POLICY_ID}")
          fi
          databricks bundle validate --target staging "${extra[@]}"

      - name: Deploy Databricks bundle (staging)
        working-directory: document-intelligence
        env:
          COMPUTE_GUARDRAILS_POLICY_ID: ${{ secrets.DATABRICKS_COMPUTE_GUARDRAILS_POLICY_ID }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${COMPUTE_GUARDRAILS_POLICY_ID:-}" ]; then
            extra+=(--var "compute_guardrails_policy_id=${COMPUTE_GUARDRAILS_POLICY_ID}")
          fi
          databricks bundle deploy --target staging "${extra[@]}"

  deploy-prod:
    name: Deploy bundle to prod
    runs-on: ubuntu-latest
    needs:
      - deploy-dev
      - deploy-staging
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle (prod)
        working-directory: document-intelligence
        env:
          COMPUTE_GUARDRAILS_POLICY_ID: ${{ secrets.DATABRICKS_COMPUTE_GUARDRAILS_POLICY_ID }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${COMPUTE_GUARDRAILS_POLICY_ID:-}" ]; then
            extra+=(--var "compute_guardrails_policy_id=${COMPUTE_GUARDRAILS_POLICY_ID}")
          fi
          databricks bundle validate --target prod "${extra[@]}"

      - name: Deploy Databricks bundle (prod)
        working-directory: document-intelligence
        env:
          COMPUTE_GUARDRAILS_POLICY_ID: ${{ secrets.DATABRICKS_COMPUTE_GUARDRAILS_POLICY_ID }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${COMPUTE_GUARDRAILS_POLICY_ID:-}" ]; then
            extra+=(--var "compute_guardrails_policy_id=${COMPUTE_GUARDRAILS_POLICY_ID}")
          fi
          databricks bundle deploy --target prod "${extra[@]}"
