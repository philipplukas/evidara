name: Scraping Nightly Canary

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target runtime environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
    env:
      GCP_PROJECT_ID: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') && vars.GCP_PROJECT_ID_STAGING || vars.GCP_PROJECT_ID_DEV }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SCRAPING_CANARY_SLACK_WEBHOOK }}
      EVIDENCE_PATH: tmp/evidence/scraping-canary-${{ github.run_id }}.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') && secrets.GCP_SERVICE_ACCOUNT_STAGING || secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Cloud Run service URLs
        id: service_urls
        run: |
          set -euo pipefail
          PC_URL=$(gcloud run services describe "platform-control-api-${TARGET_ENV}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')
          LS_URL=$(gcloud run services describe "legal-search-api-${TARGET_ENV}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')
          echo "pc_url=${PC_URL}" >> "${GITHUB_OUTPUT}"
          echo "ls_url=${LS_URL}" >> "${GITHUB_OUTPUT}"

      - name: Mint platform-control ID token
        id: pc_id_token
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') && secrets.GCP_SERVICE_ACCOUNT_STAGING || secrets.GCP_SERVICE_ACCOUNT_DEV }}
          token_format: id_token
          id_token_audience: ${{ steps.service_urls.outputs.pc_url }}

      - name: Mint legal-search ID token
        id: ls_id_token
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') && secrets.GCP_SERVICE_ACCOUNT_STAGING || secrets.GCP_SERVICE_ACCOUNT_DEV }}
          token_format: id_token
          id_token_audience: ${{ steps.service_urls.outputs.ls_url }}

      - name: Export audience-scoped Cloud Run ID tokens
        env:
          PC_ID_TOKEN: ${{ steps.pc_id_token.outputs.id_token }}
          LS_ID_TOKEN: ${{ steps.ls_id_token.outputs.id_token }}
        run: |
          echo "::add-mask::${PC_ID_TOKEN}"
          echo "::add-mask::${LS_ID_TOKEN}"
          echo "E2E_PC_ID_TOKEN=${PC_ID_TOKEN}" >> "${GITHUB_ENV}"
          echo "E2E_LS_ID_TOKEN=${LS_ID_TOKEN}" >> "${GITHUB_ENV}"

      - name: Run nightly scraping canary
        id: canary
        run: |
          mkdir -p "$(dirname "${EVIDENCE_PATH}")"
          set +e
          GCP_PROJECT_ID="${GCP_PROJECT_ID}" \
          scripts/e2e-smoke-test.sh --env "${TARGET_ENV}" 2>&1 | tee "${LOG_PATH}"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"
        env:
          LOG_PATH: tmp/evidence/scraping-canary-${{ github.run_id }}.log

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scraping-canary-evidence-${{ github.run_id }}
          path: tmp/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize canary outcome
        if: always()
        run: |
          STATUS=${{ steps.canary.outcome == 'success' && 'PASSED' || 'FAILED' }}
          {
            echo "### Scraping Nightly Canary"
            echo ""
            echo "- Status: **${STATUS}**"
            echo "- Environment: ${TARGET_ENV}"
            echo "- Evidence artifact: scraping-canary-evidence-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(cat <<EOF
          {
            "text": "Evidara scraping nightly canary failed for ${TARGET_ENV}. Run: ${RUN_URL}"
          }
          EOF
          )
          curl -sS -X POST -H "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "${SLACK_WEBHOOK_URL}"
