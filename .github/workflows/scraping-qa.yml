name: Scraping QA Gate

on:
  pull_request:
    paths:
      - "platform-control/**"
      - "contracts/common/**"
      - "contracts/schemas/**"
      - "contracts/events/**"
      - "contracts/examples/**"
      - "scripts/check-scraping-qa.sh"
      - "scripts/validate_json_schemas.py"
      - ".github/workflows/scraping-qa.yml"
      - ".github/pull_request_template.md"
      - "docs/testing/scraping-qa-standard.md"
  push:
    branches: [main]
    paths:
      - "platform-control/**"
      - "contracts/common/**"
      - "contracts/schemas/**"
      - "contracts/events/**"
      - "contracts/examples/**"
      - "scripts/check-scraping-qa.sh"
      - "scripts/validate_json_schemas.py"
      - ".github/workflows/scraping-qa.yml"

jobs:
  scraping-qa:
    # First light-cohort cutover after runner-pool smoke proved generic Python
    # bootstrap on the bridge self-hosted labels.
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_RUNS_ON_JSON || '["self-hosted","linux","x64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Bootstrap Python 3.12 with uv
        run: |
          set -euo pipefail
          uv python install 3.12
          uv python find 3.12

      - name: Scraping/acquisition QA gate
        run: bash scripts/check-scraping-qa.sh
