name: Scraping QA Gate

on:
  pull_request:
    paths:
      - "platform-control/**"
      - "contracts/common/**"
      - "contracts/schemas/**"
      - "contracts/events/**"
      - "contracts/examples/**"
      - "scripts/check-scraping-qa.sh"
      - "scripts/validate_json_schemas.py"
      - ".github/workflows/scraping-qa.yml"
      - ".github/pull_request_template.md"
      - "docs/testing/scraping-qa-standard.md"
  push:
    branches: [main]
    paths:
      - "platform-control/**"
      - "contracts/common/**"
      - "contracts/schemas/**"
      - "contracts/events/**"
      - "contracts/examples/**"
      - "scripts/check-scraping-qa.sh"
      - "scripts/validate_json_schemas.py"
      - ".github/workflows/scraping-qa.yml"
  workflow_dispatch:

jobs:
  scraping-qa:
    # setup-python currently belongs on GitHub-hosted Linux until the Hetzner
    # K8s runner path is ready for generic Python bootstrap jobs.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Scraping/acquisition QA gate
        run: bash scripts/check-scraping-qa.sh
