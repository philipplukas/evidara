    name: Bundesarbeitsgericht
  - authority_id: auth_bsg
    jurisdiction_id: jur_de_federal
    slug: bsg
    name: Bundessozialgericht
  - authority_id: auth_by_skbayern
    jurisdiction_id: jur_de_by
    slug: by-staatskanzlei
