version: 1
country_code: DE

filters:
  jurisdiction:
    label: Jurisdiction
    helper_text: German scope spans federal (Bund), 16 Länder, and large-city Ortsrecht.
  source_type:
    label: Source type
    helper_text: Includes federal statutes, Land legislation, Ortsrecht, decisions, commentary, and administrative guidance.
  court_level:
    label: Court level
    helper_text: Distinguishes constitutional, federal supreme, Land, and administrative courts.
  language:
    label: Language
    helper_text: German sources are primarily in German; English translations may be available for selected federal laws.
  official_only:
    label: Official sources only
    helper_text: Restricts to authoritative German public sources (federal publishers, Land Gesetzblätter, municipal Ortsrecht).

result_subtitle_pattern:
  template: "{jurisdiction} • {source_type} • {court_or_authority} • {effective_date}"

detail_copy:
  translation_indicator:
    original: Original language
    translated: Machine translated from {language}
    unavailable: Translation unavailable

empty_states:
  no_results:
    message: No German results for this query and filter set.
    recovery: Clear one filter, broaden source type, or widen scope to federal.
