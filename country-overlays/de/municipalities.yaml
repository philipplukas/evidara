version: 1
country_code: DE

# German municipality registry (Gemeinden / Städte).
#
# Scope:
#   Out-of-band registry, same pattern as country-overlays/ch/municipalities.yaml.
#   Germany has ~11,000 Gemeinden; seeding all of them as first-class
#   authorities would flood the taxonomy with entities that do not publish
#   structured legal corpora. This file holds a pilot subset of cities known
#   to publish their Ortsrecht as a structured collection. The three
#   city-states (Berlin, Hamburg, Bremen) are simultaneously Länder and
#   municipalities; their legal corpus is covered at Land level and is
#   intentionally not duplicated here.
#
# Identifier:
#   Each entry is keyed by AGS (Amtlicher Gemeindeschlüssel), the stable
#   8-digit municipality identifier maintained by Destatis.
#
# Seed scope:
#   Pilot set only. Full ~11,000-entry load should come from the Destatis
#   Gemeindeverzeichnis via a separate ingestion job. URLs are left for
#   operator onboarding rather than guessed here.

schema:
  required:
    - ags
    - land_jurisdiction_id
    - name
    - primary_language
  optional:
    - names
    - law_collection
  law_collection_shape:
    required:
      - publisher
      - format
    optional:
      - url
      - language
      - note

municipalities:
  - ags: "05315000"
    land_jurisdiction_id: jur_de_nw
    name: Köln
    names:
      de: Köln
      en: Cologne
    primary_language: de
    law_collection:
      publisher: Stadt Köln
      format: html
      note: Ortsrecht collection; URL to be confirmed by operator.

