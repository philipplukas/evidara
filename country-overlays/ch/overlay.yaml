version: 1
country_code: CH
country_name: Switzerland

jurisdiction_overlay:
  canonical_codes:
    - CH
  hierarchy_paths:
    - ch
    - ch/federal
    - ch/cantonal
    - ch/cantonal/{canton_code}
    - ch/municipal
    - ch/municipal/{bfs_id}

language_defaults:
  primary: de
  supported:
    - de
    - fr
    - it
    - rm
    - en

source_family_overlay:
  canonical:
    - law
    - decision
    - commentary
  local_mappings:
    - local_type: bundesgesetz
      canonical_type: law
      note: Federal statutes published via Fedlex (Systematische Rechtssammlung).
    - local_type: verordnung
      canonical_type: law
      note: Ordinances at federal, cantonal, or municipal level; level disambiguated by hierarchy_path.
    - local_type: kantonale_rechtssammlung
      canonical_type: law
      note: Cantonal systematic collections; per-canton publisher and language vary.
    - local_type: gemeindeordnung
      canonical_type: law
      note: Municipal charter; top of a municipality's own legal hierarchy.
    - local_type: reglement
      canonical_type: law
      note: Municipal regulation; cantonal equivalents also exist.
    - local_type: bundesgerichtsentscheid
      canonical_type: decision
      note: Federal Supreme Court decisions (BGE and unpublished rulings).

court_level_overlay:
  expected_levels:
    - supreme
    - appellate
    - cantonal
    - administrative
