version: 1
country_code: CH

# Jurisdictions are modeled hierarchically:
#   - jur_ch               : Confederation (federal scope)
#   - jur_ch_<canton_code> : one per canton, using ISO 3166-2:CH lowercase code
# Municipalities are NOT modeled as jurisdictions here; they live in
# municipalities.yaml and reference their canton's jurisdiction_id.

jurisdictions:
