version: 1
country_code: CH

# Canonical reference data lives in platform-control/seeds/reference/
# {jurisdictions,authorities}.yaml. This file cites IDs only so the
# overlay stays in sync without duplication; the validator cross-checks
# every ID against the seed index.
#
# CH models multiple jurisdictions (federal + 26 cantons) but the overlay
# binds to the country-level anchor; sub-jurisdictions and their authority
# bindings are expressed in the seeds.

jurisdiction_id: jur_ch

authority_ids:
  # Federal
  - auth_fedlex
  - auth_bger
  - auth_bvger
  - auth_bstger
  - auth_bpger
  # Cantonal
  - auth_zh_sk
  - auth_zh_admin
  - auth_be_sk
  - auth_bs_sk
  - auth_ge_ce
  - auth_vd_ce
  - auth_ti_cs
