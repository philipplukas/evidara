version: 1
country_code: CH

filters:
  jurisdiction:
    label: Jurisdiction
    helper_text: Switzerland scope covers federal and cantonal overlays.
  source_type:
    label: Source type
    helper_text: Includes laws, decisions, and commentary.
  court_level:
    label: Court level
    helper_text: Distinguishes supreme, administrative, appellate, and cantonal courts.
  official_only:
    label: Official sources only
    helper_text: Restricts to authoritative Swiss public sources.

result_subtitle_pattern:
  template: "{jurisdiction} • {source_type} • {court_or_authority} • {effective_date}"

detail_copy:
  translation_indicator:
    original: Original language
    translated: Machine translated from {language}
    unavailable: Translation unavailable

empty_states:
  no_results:
    message: No Swiss results for this query and filter set.
    recovery: Clear one filter or broaden source type.
