version: 1
country_code: AT

# Jurisdictions:
#   - jur_at            : country-level Austria
#   - jur_at_federal    : federal scope (Bund); federal authorities bind here
#   - jur_at_<code>     : one per Bundesland; codes follow common Austrian
#                         abbreviations (bgld, ktn, noe, ooe, sbg, stmk, tir,
#                         vbg, wien). Numeric ISO 3166-2:AT codes (1-9) are
#                         recorded in iso_3166_2 for traceability.

jurisdictions:
  - jurisdiction_id: jur_at
    slug: at
    name: Austria
  - jurisdiction_id: jur_at_federal
    slug: at-federal
    name: Republic of Austria (Federal)
  - jurisdiction_id: jur_at_bgld
    slug: at-bgld
    name: Burgenland
    iso_3166_2: AT-1
  - jurisdiction_id: jur_at_ktn
    slug: at-ktn
    name: Kärnten
    iso_3166_2: AT-2
  - jurisdiction_id: jur_at_noe
    slug: at-noe
    name: Niederösterreich
    iso_3166_2: AT-3
  - jurisdiction_id: jur_at_ooe
    slug: at-ooe
    name: Oberösterreich
    iso_3166_2: AT-4
  - jurisdiction_id: jur_at_sbg
    slug: at-sbg
    name: Salzburg
    iso_3166_2: AT-5
  - jurisdiction_id: jur_at_stmk
    slug: at-stmk
    name: Steiermark
    iso_3166_2: AT-6
  - jurisdiction_id: jur_at_tir
    slug: at-tir
    name: Tirol
    iso_3166_2: AT-7
  - jurisdiction_id: jur_at_vbg
    slug: at-vbg
    name: Vorarlberg
    iso_3166_2: AT-8
  - jurisdiction_id: jur_at_wien
    slug: at-wien
    name: Wien
    iso_3166_2: AT-9

# NOTE: The existing auth_at_* IDs in this file differ from the canonical
# seed in platform-control/.../authorities.yaml (auth_ris, auth_ogh, ...).
# That drift is unchanged by this PR and should be reconciled in a separate
# follow-up (same shape as the CH alignment in #244).
authorities:
  - authority_id: auth_at_ris
    jurisdiction_id: jur_at
    slug: at-ris
    name: Rechtsinformationssystem des Bundes
  - authority_id: auth_at_ogh
    jurisdiction_id: jur_at
    slug: at-ogh
    name: Oberster Gerichtshof
  - authority_id: auth_at_vfgh
    jurisdiction_id: jur_at
    slug: at-vfgh
    name: Verfassungsgerichtshof
  - authority_id: auth_at_vwgh
    jurisdiction_id: jur_at
    slug: at-vwgh
    name: Verwaltungsgerichtshof

  # Per-Bundesland RIS Landesrecht publishers. Each is scoped to its own
  # jurisdiction so platform-control source validation
  # (_validate_source_reference_data in source_service.py, which requires
  # authority.jurisdiction_id == requested jurisdiction) can accept
  # Bundesland sources. RIS itself is a single operational surface; the
  # per-Land records model the fact that each Bundesland publishes its
  # Landesrecht under a distinct editorial scope within RIS.
  - authority_id: auth_at_bgld_ris
    jurisdiction_id: jur_at_bgld
    slug: at-bgld-ris
    name: RIS Landesrecht Burgenland
  - authority_id: auth_at_ktn_ris
    jurisdiction_id: jur_at_ktn
    slug: at-ktn-ris
    name: RIS Landesrecht Kärnten
  - authority_id: auth_at_noe_ris
    jurisdiction_id: jur_at_noe
    slug: at-noe-ris
    name: RIS Landesrecht Niederösterreich
  - authority_id: auth_at_ooe_ris
    jurisdiction_id: jur_at_ooe
    slug: at-ooe-ris
    name: RIS Landesrecht Oberösterreich
  - authority_id: auth_at_sbg_ris
    jurisdiction_id: jur_at_sbg
    slug: at-sbg-ris
    name: RIS Landesrecht Salzburg
  - authority_id: auth_at_stmk_ris
    jurisdiction_id: jur_at_stmk
    slug: at-stmk-ris
    name: RIS Landesrecht Steiermark
  - authority_id: auth_at_tir_ris
    jurisdiction_id: jur_at_tir
    slug: at-tir-ris
    name: RIS Landesrecht Tirol
  - authority_id: auth_at_vbg_ris
    jurisdiction_id: jur_at_vbg
    slug: at-vbg-ris
    name: RIS Landesrecht Vorarlberg
  - authority_id: auth_at_wien_ris
    jurisdiction_id: jur_at_wien
    slug: at-wien-ris
    name: RIS Landesrecht Wien
