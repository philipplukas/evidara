version: 1
country_code: AT

filters:
  jurisdiction:
    label: Jurisdiction
    helper_text: Austria scope uses national and federal overlays.
  source_type:
    label: Source type
    helper_text: Includes laws, decisions, commentary, and Austrian legal principles.
  court_level:
    label: Court level
    helper_text: Distinguishes supreme, appellate, and administrative courts.
  official_only:
    label: Official sources only
    helper_text: Restricts to authoritative Austrian public sources.

result_subtitle_pattern:
  template: "{jurisdiction} • {source_type} • {court_or_authority} • {effective_date}"

detail_copy:
  translation_indicator:
    original: Original language
    translated: Machine translated from {language}
    unavailable: Translation unavailable

empty_states:
  no_results:
    message: No Austrian results for this query and filter set.
    recovery: Clear one filter or broaden source type.
