version: 1
country_code: IT

onboarding_checklist:
  - Confirm scope maps to jurisdiction code IT.
  - Confirm source family mapping for leggi, decreti legislativi, and sentenze.
  - Confirm authority records include Gazzetta Ufficiale, Normattiva, and Cassazione.
  - Confirm region-sensitive metadata is handled consistently across filters.

approval_hotspots:
  - authority taxonomy correctness
  - inconsistent metadata quality across decisions (known historical drift)
  - federal vs regional hierarchy-path boundary

triage_overlays:
  mapping_drift:
    first_action: Compare incoming authority/jurisdiction labels against canonical IT mapping.
    escalation_owner: platform-control
  search_projection_mismatch:
    first_action: Verify processed-event projection parity for IT-tagged documents.
    escalation_owner: legal-search
