# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^infra/terraform/
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]
        files: ^(README\.md|AGENTS\.md|docs/.*\.md|CONTRIBUTING\.md|SECURITY\.md|\.github/pull_request_template\.md)$

  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.18.0
    hooks:
      - id: lychee
        args: ["--no-progress", "--exclude-file", ".lycheeignore"]
        types: [markdown]

  - repo: https://github.com/errata-ai/vale
    rev: v3.9.5
    hooks:
      - id: vale
        args: ["--no-exit"]
        types: [markdown]

  - repo: local
    hooks:
      - id: validate-openapi-contracts
        name: Validate OpenAPI contracts
        entry: python scripts/validate_openapi.py
        language: system
        pass_filenames: false
        files: ^contracts/api/.*\.(yaml|yml)$

      - id: validate-json-schemas
        name: Validate JSON Schemas
        entry: python scripts/validate_json_schemas.py
        language: system
        pass_filenames: false
        files: ^contracts/(schemas|events)/.*\.json$

      # Mirrors the CI step in .github/workflows/docs-and-contracts.yml.
      - id: check-jurisdiction-hierarchy-vocab
        name: Check jurisdiction-hierarchy vocabulary matches the seed
        entry: python scripts/generate_jurisdiction_hierarchy_vocab.py --check
        language: system
        pass_filenames: false
        files: ^(platform-control/src/platform_control/seeds/reference/jurisdictions\.yaml|contracts/vocabularies/(jurisdiction-hierarchy|norm-level)\.json)$

      - id: check-platform-contract-vendor
        name: Check vendored MacConfig platform contract pin
        entry: python scripts/check_platform_contract_vendor.py
        language: system
        pass_filenames: false
        files: ^(README\.md|vendor/platform-contract\.yaml)$

      - id: validate-k8s-gitops-kustomize
        name: Validate k8s GitOps kustomizations
        entry: bash scripts/validate_k8s_gitops_kustomize.sh
        language: system
        pass_filenames: false
        files: ^k8s/gitops/

      # Skips when Docker is unavailable locally; CI runs it with --strict
      # (.github/workflows/architecture.yml), same as the kustomize gate above.
      - id: check-architecture
        name: Validate Structurizr workspace DSL
        entry: bash scripts/check-architecture.sh
        language: system
        pass_filenames: false
        files: ^(structurizr/|scripts/check-architecture\.sh$)

      - id: shellcheck
        name: Lint shell scripts with shellcheck
        entry: bash scripts/check-shellcheck.sh
        language: system
        pass_filenames: false
        files: ^.*\.sh$

      - id: check-compose-profiles
        name: Check Docker Compose profiles resolve
        entry: python scripts/check_compose_profiles.py
        language: system
        pass_filenames: false
        files: ^(docker-compose.*\.yml|scripts/.*\.sh|docs/.*\.md|\.github/workflows/.*\.yml|justfile|README\.md)$

      - id: check-hetzner-image-pins
        name: Check Hetzner image pins roll together
        entry: python scripts/check_hetzner_image_pins.py
        language: system
        pass_filenames: false
        files: ^infra/hetzner/apps/(kustomization|migrate-job)\.yaml$

      - id: check-component-doc-headings
        name: Check component doc headings
        entry: python scripts/check_component_docs.py
        language: system
        pass_filenames: false
        files: ^docs/components/.*\.md$

      - id: check-runbook-metadata
        name: Check runbook metadata
        entry: python scripts/check_runbooks.py
        language: system
        pass_filenames: false
        files: ^docs/runbooks/.*\.md$

      - id: check-doc-links
        name: Check documentation index links
        entry: python scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: ^docs/.*\.md$

      - id: check-diagram-format
        name: Check diagram format (Mermaid required)
        entry: python scripts/check_diagram_format.py
        language: system
        pass_filenames: false
        files: ^(docs|legal-search/frontend/docs)/.*\.md$

      - id: check-mermaid-render
        name: Check Mermaid diagrams render
        entry: npm run --silent check:mermaid
        language: system
        pass_filenames: false
        files: ^(docs|legal-search/frontend/docs)/.*\.md$

      # A committed VRT baseline is an assertion about what the product looks
      # like. Three of them silently certified live bugs because they were
      # re-blessed locally with no record of why (#611). Mirrored in CI as the
      # `visual-baseline-provenance` job.
      - id: visual-baseline-provenance
        name: Visual baseline provenance (no unrecorded re-bless)
        entry: python3 scripts/check_visual_baseline_provenance.py
        language: system
        pass_filenames: false
        files: ^legal-search/frontend/e2e/visual\.spec\.ts-snapshots/.*$

      - id: js-workspace-hygiene
        name: JS workspace hygiene (no root node_modules symlink, react deduped)
        entry: bash scripts/check-js-workspace-hygiene.sh
        language: system
        pass_filenames: false
        files: ^(package\.json|\.nvmrc|scripts/check-js-workspace-hygiene\.sh|\.github/workflows/.*\.yml|(legal-search|platform-control/admin|marketing)/.*/?(package\.json|package-lock\.json|tsconfig\.json|vitest\.config\.ts|next\.config\.ts))$

      # A test file that no CI job collects is not coverage. Fires when a spec
      # is added/renamed, when a runner config changes, or when the wiring that
      # selects specs (package.json scripts, workflows) changes. See ADR-0040.
      - id: test-reachability
        name: Test reachability (every spec is collected by some CI job)
        entry: python3 scripts/check_test_reachability.py
        language: system
        pass_filenames: false
        # `vitest[^/]*\.config\.ts` — not just `vitest.config.ts`. A surface may
        # run several vitest projects off several configs (legal-search/api has
        # three), and each one decides what it collects.
        files: ^(scripts/check_test_reachability\.py|\.github/workflows/.*\.yml|scripts/check-.*\.sh|.*/(package\.json|vitest[^/]*\.config\.ts|playwright[^/]*\.config\.ts)|.*(\.spec\.tsx?|\.test\.tsx?)|.*/tests?/.*\.py|.*/test_[^/]*\.py)$

      # Two ADRs may not share a number. Git merges `0038-a.md` and `0038-b.md`
      # cleanly, so nothing else catches this. See ADR-0040.
      - id: adr-numbers
        name: ADR numbering (no two ADRs claim the same number)
        entry: python3 scripts/check_adr_numbers.py
        language: system
        pass_filenames: false
        files: ^docs/adr/.*\.md$

      # Every Playwright spec must be selected by some CI command. Selection in
      # that suite is entirely `-g <tag>` or by path, so an untagged spec runs
      # nowhere while still looking maintained. Skips cleanly when the frontend
      # node_modules is absent. See #686.
      - id: e2e-spec-coverage
        name: e2e spec coverage (every spec is reachable from CI)
        entry: bash scripts/check-e2e-spec-coverage.sh
        language: system
        pass_filenames: false
        files: ^(legal-search/frontend/(e2e/.*|package\.json)|\.github/workflows/legal-search\.yml|scripts/check-e2e-spec-coverage\.sh)$

      # `legal-search/` is NOT an npm workspace root — the real packages are
      # `legal-search/frontend` and `legal-search/api`. This hook used to run
      # `cd legal-search && npm run check` against a vestigial package.json,
      # gated on `^legal-search/src/` — a path that does not exist, so it
      # never fired. It now runs the same gates CI does. See #588.
      # CI runs these same `npm run` gates, but inlined per job rather than
      # through this script (parallel jobs + per-surface npm caches). The two are
      # kept in step by scripts/tests/test_check_legal_search_parity.py, not by
      # shared invocation — the old "same script as CI" claim was false (#688).
      - id: legal-search-check
        name: Legal Search checks (api + frontend, same gates as CI)
        entry: bash scripts/check-legal-search.sh
        language: system
        pass_filenames: false
        files: ^legal-search/

      # Also fires on the generated contract and its generator: the script runs
      # the OpenAPI drift gate (#618), so hand-editing
      # contracts/api/platform-control.openapi.yaml must be caught here and not
      # only in CI. Mirrors the path filters in .github/workflows/platform-control.yml.
      - id: platform-control-check
        name: Platform Control checks (ruff + pytest + OpenAPI contract drift)
        entry: bash scripts/check-platform-control.sh
        language: system
        pass_filenames: false
        files: ^(platform-control/|contracts/api/platform-control\.openapi\.yaml$|scripts/(check-platform-control\.sh|generate_platform_control_contract\.py)$)

      - id: evidara-cli-check
        name: Evidara CLI (ruff + pytest)
        entry: bash scripts/check-evidara-cli.sh
        language: system
        pass_filenames: false
        files: ^(tools/evidara-cli/|.github/workflows/evidara-cli.*\.yml|scripts/check-evidara-cli\.sh|scripts/smoke-evidara-cli\.sh|scripts/bootstrap-ris-source\.py)$

      - id: document-intelligence-check
        name: Document Intelligence checks (schemas + tests + dbt parse)
        entry: bash scripts/check-document-intelligence.sh
        language: system
        pass_filenames: false
        files: ^(document-intelligence/|contracts/(common|events|examples|schemas)/|scripts/check-document-intelligence\.sh|scripts/validate_json_schemas\.py)
