# Example Argo CD Application: sync MacConfig `clusters/prod` kustomization only.
# Copy to your GitOps apps repo or apply from a controlled path; edit placeholders.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: macconfig-platform-prod
  namespace: argocd
  labels:
    platform.macconfig.io/stack: platform
spec:
  project: platform
  source:
    repoURL: https://github.com/philipplukas/MacConfig.git
    targetRevision: main
    path: clusters/prod
  destination:
    server: https://kubernetes.default.svc
    # Omit namespace — Namespace objects set their own metadata.name
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
