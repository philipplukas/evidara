<!--
  Evidara lattice mark — standalone export of styles/shell/BrandMark.tsx
  (branch: feat/shared-brandmark). Geometry authored on a 32x32 grid.

  In the product the strokes are `currentColor` so one component reads navy on the
  light workspace header and white on the dark control-plane bar. A static file
  cannot inherit, so this export hardcodes brand navy #0f4c81 and the violet
  accent node #6246D9. Upload this to Canva / Recraft / Figma as the starting
  geometry; recolour there, and keep the accent node as the only non-navy element.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 32 32" fill="none" role="img" aria-label="Evidara">
  <g stroke="#0f4c81" stroke-width="0.9">
    <path d="M16 2 L30 16 L16 30 L2 16 Z" />
    <path d="M16 2 L16 30" />
    <path d="M2 16 L30 16" />
    <path d="M9 9 L23 23" />
    <path d="M23 9 L9 23" />
    <path d="M9 9 L23 9" />
    <path d="M9 23 L23 23" />
  </g>
  <g fill="#0f4c81">
    <circle cx="16" cy="2" r="1.35" />
    <circle cx="9" cy="9" r="1.35" />
    <circle cx="16" cy="9" r="1.35" />
    <circle cx="2" cy="16" r="1.35" />
    <circle cx="9" cy="16" r="1.35" />
    <circle cx="16" cy="16" r="1.35" />
    <circle cx="23" cy="16" r="1.35" />
    <circle cx="30" cy="16" r="1.35" />
    <circle cx="9" cy="23" r="1.35" />
    <circle cx="16" cy="23" r="1.35" />
    <circle cx="23" cy="23" r="1.35" />
    <circle cx="16" cy="30" r="1.35" />
  </g>
  <!-- the hit: the authority you were looking for. Off-centre on purpose. -->
  <circle cx="23" cy="9" r="2.6" fill="#6246D9" />
</svg>
