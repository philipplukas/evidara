# Ingress for the Evidara UIs via k3s Traefik, behind BasicAuth, on nip.io hostnames
# (no domain needed: *.88-99-26-120.nip.io resolves to the box IP). TLS uses Traefik's
# default cert for now (browser warning); swap to cert-manager + Let's Encrypt + a real
# domain for trusted certs. ADR-0029.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: evidara
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: evidara-evidara-basicauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - admin.88-99-26-120.nip.io
  rules:
    - host: admin.88-99-26-120.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-control-admin
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search
  namespace: evidara
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: evidara-evidara-basicauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - search.88-99-26-120.nip.io
  rules:
    - host: search.88-99-26-120.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legal-search-frontend
                port:
                  number: 8080
