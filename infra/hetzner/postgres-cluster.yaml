# CloudNativePG Postgres cluster for Evidara: platform-control DB, Nessie catalog DB,
# and the Zitadel identity DB.
# Requires the CNPG operator (see infra/hetzner/README.md Stage 1). ADR-0029.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: evidara-pg
  namespace: evidara
spec:
  instances: 1
  storage:
    size: 20Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: platform_control
      owner: platform_control
  # Nessie gets its own database in the same instance (created post-bootstrap):
  #   kubectl -n evidara exec -it evidara-pg-1 -- psql -c "CREATE DATABASE nessie OWNER platform_control;"
  #
  # Zitadel follows the same precedent (ADR-0038 §2 reason 2) with one deliberate
  # difference: it gets its OWN role rather than sharing `platform_control`.
  #   CREATE ROLE zitadel LOGIN PASSWORD '<generated>';
  #   CREATE DATABASE zitadel OWNER zitadel;
  # An IdP is the highest-value target in this runtime (ADR-0038 §2b); a leak of its
  # DSN must not also hand over every run, approval and operator row. Both statements
  # are issued idempotently by infra/hetzner/deploy-stage8.sh — the password is
  # generated there and never committed.
  postgresql:
    parameters:
      max_connections: "200"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  # Backups: base backup + continuous WAL archiving, giving point-in-time recovery.
  # ADR-0038 §2b -- platform_control and zitadel are unrecoverable-by-rebuild:
  # losing them loses every run, approval, operator and credential.
  #
  # barman backs up the INSTANCE, not a database list, so `zitadel` joined this path
  # the moment the database was created -- there is nothing per-database to add, and
  # adding a second backup story would be the mistake. What is NOT automatic is proof:
  # see docs/runbooks/zitadel-identity-provider.md for the restore drill that has to
  # pass before anything depends on the IdP, and note that a database backup alone
  # does NOT restore Zitadel -- the `zitadel-masterkey` Secret is a separate artifact
  # and without it the restored rows are undecryptable.
  #
  # !! INTERIM TARGET !! MinIO's PVC is `local-path` on the SAME disk as this
  # cluster's PVC (both /dev/md2 on the single node). So this protects against
  # logical damage -- a bad migration, a wrong DELETE, table corruption -- but NOT
  # against loss of the node or the disk. It is deliberately not yet a real backup.
  #
  # ADR-0038 step 2 requires a restore-tested path before anything depends on it.
  # An OFFSITE destination is a prerequisite before Zitadel holds real user
  # credentials; only `destinationPath`/`endpointURL`/`s3Credentials` change to move.
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://evidara-pg-backups/
      endpointURL: http://minio.evidara.svc:9000
      # Scoped MinIO user -- can reach ONLY evidara-pg-backups, verified by an
      # explicit deny test against evidara-raw-artifacts and evidara-lakehouse.
      # Provisioned out-of-band (password never committed); see README Stage 1.
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
---
# Nightly base backup. WAL archiving above runs continuously between these, so
# recovery granularity is the WAL stream, not this schedule.
# Schedule is CNPG's 6-field cron (seconds first): 02:30 UTC daily.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: evidara-pg-nightly
  namespace: evidara
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: evidara-pg
