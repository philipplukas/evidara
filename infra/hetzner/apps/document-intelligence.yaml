# NOTE: the `evidara-auth` Secret is REQUIRED, not `optional: true`. It used to be
# optional, which meant a cluster where `deploy-stage5.sh` had never run (or where the
# Secret was deleted) started every pod with no API key — and both APIs then failed
# OPEN, serving the control plane and the search API to anyone who reached them. The
# apps now fail closed (503) instead, and making the Secret required moves the failure
# earlier still: the pod refuses to start rather than starting up unauthenticated.
# Run `infra/hetzner/deploy-stage5.sh` before `kubectl apply -k apps/`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
        - name: document-service
          image: ghcr.io/philipplukas/evidara-document-intelligence-document-service
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
          envFrom:
            - configMapRef:
                name: evidara-config
            # No evidara-app-secrets: once the MinIO keys moved out of it (#813) the only
            # thing left in it is PLATFORM_CONTROL_DATABASE_URL, and no DI process reads
            # a database URL (`grep -r DATABASE_URL document-intelligence/src` is empty).
            # Mounting it here would hand the Postgres application credential to a
            # service that has no use for it.
            #
            # Scoped MinIO credential — READ-ONLY on evidara-lakehouse/canonical/*.
            # document-service only reads the published Delta surfaces back
            # (service/store.py::DeltaPublishedDocumentStore); it writes nothing and has
            # no business reaching raw artifacts or the PITR backups (#813).
            - secretRef:
                name: evidara-s3-document-service
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              # 1Gi, raised from 512Mi. Measured p95 is 925Mi.
              memory: 1Gi
            limits:
              # 4Gi, raised from 1Gi. Same defect as di-consumer's (#1013), one
              # service along, and measured the same way: OOMKilled, exit 137,
              # three restarts in forty minutes, dying seventeen seconds after
              # start while idling at 57Mi. It only dies under a burst of reads.
              #
              # This is very likely the ROOT of #1028. Every projection fetches
              # the canonical document back from here, so under a batch this is
              # the service that falls over — and `fetch failed`, the error
              # legal-search recorded for all 30 placeholder-titled records, is
              # exactly what a caller sees when the upstream is killed mid-request.
              # #1030 makes that refuse rather than write a placeholder; this is
              # what stops it happening.
              #
              # A CEILING, not a measurement: the peak is unprofiled because the
              # crashed containers took their evidence with them (#892). Chosen
              # for headroom against a node with 62Gi allocatable at ~37% used.
              # Profile before raising it again.
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: evidara
spec:
  selector:
    app: document-service
  ports:
    - port: 8090
      targetPort: 8090
---
# DI NATS JetStream consumer. Canonical surface URIs are set in the evidara-config ConfigMap
# (DI_PUBLISHED_DOCUMENTS_URI / _SECTIONS_URI / _PROCESSING_MANIFESTS_URI on MinIO), so
# build_processing_pipeline selects the durable DeltaCanonicalSink and document-service reads the
# same surfaces back (#523). A native IcebergCanonicalSink on MinIO remains the longer-term
# follow-up; Delta-on-S3 is the production-safe interim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: di-consumer
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: di-consumer
  template:
    metadata:
      labels:
        app: di-consumer
    spec:
      containers:
        - name: consumer
          image: ghcr.io/philipplukas/evidara-document-intelligence-consumer
          command: ["sh", "-c", "document_intelligence_nats_consumer --servers \"$NATS_SERVERS\""]
          ports:
            # Named so the `di-consumers` PodMonitor can scrape /metrics off the same
            # health server that already answers /health (ADR-0032).
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidara-config
            # No evidara-app-secrets — see document-service above (#813).
            #
            # Scoped MinIO credential — read evidara-raw-artifacts (ingest/loaders.py
            # fetches the bundle manifest + artifacts), write evidara-lakehouse under
            # canonical/ (persist/sinks.py::DeltaCanonicalSink, the three
            # DI_*_URI values in evidara-config). No access to evidara-pg-backups (#813).
            - secretRef:
                name: evidara-s3-di-consumer
          # Liveness and readiness answer different questions, and #722 is what happens
          # when only one of them is asked. /health is "the process is alive" — it stays
          # green through a broker outage on purpose, because the consumer now retries
          # forever and restarting it would only add CrashLoopBackOff delay to an outage
          # it cannot fix. /ready is "this consumer can reach the broker" and goes 503
          # the moment NATS is gone, so a consumer that is waiting rather than working
          # is visibly not working.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              # 1.5Gi, raised from 512Mi. Measured p95 over 7 days is 1222Mi and
              # the 30-day peak 1411Mi, so the scheduler was placing this pod as
              # if it needed a third of what it routinely uses. A request that
              # low is not free: it is what lets the node accept work it cannot
              # actually hold, and the OOM below is what that looks like from
              # inside the container.
              memory: 1536Mi
            limits:
              # 4Gi, raised from 1Gi (#1012). On 2026-09-17 a 944-document
              # lexfind_api_zh_full run OOMKilled this container SEVEN times in
              # eighteen minutes — exit 137, one of them twelve seconds after
              # startup. It idles at 76Mi and only dies under a batch.
              #
              # This is a CEILING, not a measurement. Nobody has profiled the
              # peak: the crashed containers took their own evidence with them
              # (#892, no log aggregation), so the number is chosen for headroom
              # against a node with 62Gi allocatable at ~37% used, not derived
              # from a high-water mark. If it OOMs again, profile before raising
              # it a second time.
              #
              # It does NOT fix what made the crash expensive. Each kill left the
              # documents it was holding at `processing` with no terminal status,
              # no error and nothing queued to retry them — 59 of 917 from that
              # one run. `processing` still means both "in flight" and "the worker
              # died holding this". That is #1012's second half and #958's
              # absent-vs-broken property; more memory only makes it rarer.
              memory: 4Gi
---
# NATS->legal-search + platform-control event bridge (M0.2 / #550). Subscribes to
# evidara.document-processed, evidara.document-withdrawn and
# evidara.document-processing-status-updated, and POSTs each event to the legal-search
# projections endpoints (so processed documents become searchable without a manual
# local_outbox_replay run) *and* to platform-control's /v1/di/events endpoints (so
# /v1/runs/{id}/pipeline-health advances past `pending` and the admin run-detail
# "DI Processing Status" section is populated). This is the only DI process that makes
# HTTP calls to either peer — di-consumer above only publishes to NATS.
# Reuses the DI consumer image (same package, new entry point); LEGAL_SEARCH_API_URL and
# PLATFORM_CONTROL_API_URL come from evidara-config, both X-API-Keys from evidara-auth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-bridge
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projection-bridge
  template:
    metadata:
      labels:
        app: projection-bridge
    spec:
      containers:
        - name: bridge
          image: ghcr.io/philipplukas/evidara-document-intelligence-consumer
          command: ["sh", "-c", "document_intelligence_projection_bridge --servers \"$NATS_SERVERS\""]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LEGAL_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evidara-auth
                  key: LEGAL_SEARCH_API_KEY
            # X-API-Key for platform-control's /v1/di/events endpoints, which are gated by
            # require_control_plane_service (the operator key satisfies it). Without this
            # the callbacks 401 — loudly now, at ERROR, with retry (#550).
            - name: PLATFORM_CONTROL_OPERATOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evidara-auth
                  key: PLATFORM_CONTROL_OPERATOR_API_KEY
          envFrom:
            - configMapRef:
                name: evidara-config
            # NO object-storage credential, deliberately (#813). projection-bridge makes
            # no S3 call at all — it consumes NATS and POSTs HTTP to legal-search and
            # platform-control. It nevertheless held the shared MinIO *root* key until
            # #813, purely because it took `evidara-app-secrets` via envFrom. It gets
            # neither that Secret (its only remaining key is the Postgres URL, which no
            # DI process reads) nor an evidara-s3-* one.
          # See di-consumer above: liveness = process alive, readiness = broker reachable (#722).
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
