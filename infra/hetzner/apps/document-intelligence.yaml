apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
        - name: document-service
          image: ghcr.io/philipplukas/evidara-document-intelligence-document-service
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
          envFrom:
            - configMapRef:
                name: evidara-config
            - secretRef:
                name: evidara-app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: evidara
spec:
  selector:
    app: document-service
  ports:
    - port: 8090
      targetPort: 8090
---
# DI NATS JetStream consumer. Canonical surface URIs are set in the evidara-config ConfigMap
# (DI_PUBLISHED_DOCUMENTS_URI / _SECTIONS_URI / _PROCESSING_MANIFESTS_URI on MinIO), so
# build_processing_pipeline selects the durable DeltaCanonicalSink and document-service reads the
# same surfaces back (#523). A native IcebergCanonicalSink on MinIO remains the longer-term
# follow-up; Delta-on-S3 is the production-safe interim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: di-consumer
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: di-consumer
  template:
    metadata:
      labels:
        app: di-consumer
    spec:
      containers:
        - name: consumer
          image: ghcr.io/philipplukas/evidara-document-intelligence-consumer
          command: ["sh", "-c", "document_intelligence_nats_consumer --servers \"$NATS_SERVERS\""]
          ports:
            # Named so the `di-consumers` PodMonitor can scrape /metrics off the same
            # health server that already answers /health (ADR-0032).
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidara-config
            - secretRef:
                name: evidara-app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
# NATS->legal-search projection bridge (M0.2). Subscribes to
# evidara.document-processed and POSTs each event to the legal-search projections
# endpoint, so processed documents become searchable without a manual
# local_outbox_replay run. Reuses the DI consumer image (same package, new entry
# point); LEGAL_SEARCH_API_URL comes from evidara-config, the optional X-API-Key
# from evidara-auth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-bridge
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projection-bridge
  template:
    metadata:
      labels:
        app: projection-bridge
    spec:
      containers:
        - name: bridge
          image: ghcr.io/philipplukas/evidara-document-intelligence-consumer
          command: ["sh", "-c", "document_intelligence_projection_bridge --servers \"$NATS_SERVERS\""]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LEGAL_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evidara-auth
                  key: LEGAL_SEARCH_API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: evidara-config
            - secretRef:
                name: evidara-app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
