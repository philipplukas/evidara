# Non-secret app config — in-cluster store endpoints. ADR-0029 stage 4.
apiVersion: v1
kind: ConfigMap
metadata:
  name: evidara-config
  namespace: evidara
data:
  # platform-control
  # Required — `Settings.environment` has no default (#683). Every platform-control pod
  # (api, connector worker, migrate job, retention sweep) reads it via envFrom on this
  # ConfigMap; a missing value now fails at startup rather than silently meaning
  # "development", which is what any environment-based safety gate would have branched on.
  PLATFORM_CONTROL_ENVIRONMENT: "production"
  PLATFORM_CONTROL_ARTIFACT_STORE_BACKEND: "s3"
  PLATFORM_CONTROL_S3_ENDPOINT_URL: "http://minio.evidara.svc:9000"
  PLATFORM_CONTROL_S3_REGION: "us-east-1"
  PLATFORM_CONTROL_RAW_ARTIFACT_BUCKET: "evidara-raw-artifacts"
  PLATFORM_CONTROL_EVENT_PUBLISHER_BACKEND: "nats"
  PLATFORM_CONTROL_NATS_SERVERS: "nats://nats.evidara.svc:4222"
  PLATFORM_CONTROL_RUN_DISPATCH_BACKEND: "inline"
  # document-intelligence
  # Tags every structured log line with its origin. Was read from an unprefixed
  # ENVIRONMENT var that this ConfigMap never set, so all production DI logs were
  # tagged environment="unknown" and could not be filtered or routed (#712).
  # Applies to document-service, di-consumer and projection-bridge — all three take
  # this ConfigMap via envFrom. platform-control needs no equivalent key: it derives
  # its tag from PLATFORM_CONTROL_ENVIRONMENT above.
  DI_ENVIRONMENT: "production"
  DI_S3_ENDPOINT_URL: "http://minio.evidara.svc:9000"
  DI_S3_REGION: "us-east-1"
  NATS_SERVERS: "nats://nats.evidara.svc:4222"
  # Durable canonical surfaces on MinIO (Delta). Set => di-consumer selects DeltaCanonicalSink
  # (writes) and document-service selects DeltaPublishedDocumentStore (reads), so GET
  # /v1/documents/{id}/lean serves real title/sections/citations instead of the thin fallback
  # (#523). Bucket `evidara-lakehouse` is provisioned by values/minio.yaml.
  DI_PUBLISHED_DOCUMENTS_URI: "s3://evidara-lakehouse/canonical/published_documents"
  DI_PUBLISHED_SECTIONS_URI: "s3://evidara-lakehouse/canonical/published_sections"
  DI_PROCESSING_MANIFESTS_URI: "s3://evidara-lakehouse/canonical/processing_manifests"
  # legal-search API base for the NATS->projection bridge (document_intelligence_projection_bridge, M0.2)
  LEGAL_SEARCH_API_URL: "http://legal-search-api.evidara.svc:8080"
  # legal-search
  OPENSEARCH_NODE: "http://opensearch-cluster-master.evidara.svc:9200"
  # legal-search-api reads document bodies from the DI document-service when applying
  # document.processed projections; unset => projection can't fetch bodies to index (M0.1).
  DOCUMENT_INTELLIGENCE_BASE_URL: "http://document-service.evidara.svc:8090"
  # cross-surface
  PLATFORM_CONTROL_API_URL: "http://platform-control-api.evidara.svc:8080"
