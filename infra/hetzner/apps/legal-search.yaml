apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-search-api
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legal-search-api
  template:
    metadata:
      labels:
        app: legal-search-api
    spec:
      containers:
        - name: api
          image: ghcr.io/philipplukas/evidara-legal-search-api
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # API key the guard enforces (see legal-search/api api-key.guard.ts).
            # Optional: when the secret/key is absent the API stays open.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: evidara-auth
                  key: LEGAL_SEARCH_API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: evidara-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: legal-search-api
  namespace: evidara
spec:
  selector:
    app: legal-search-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-search-frontend
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legal-search-frontend
  template:
    metadata:
      labels:
        app: legal-search-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/philipplukas/evidara-legal-search-frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # In-cluster API service — the middleware rewrites /v1/* here server-side.
            # (localhost:3102 was a dev default that ECONNREFUSED inside the pod.)
            - name: NEXT_PUBLIC_API_URL
              value: "http://legal-search-api.evidara.svc:8080"
            # Public admin URL for the cross-surface "control panel" header link.
            # Read server-side at request time (control-plane-entry-server.ts), so a
            # runtime value change takes effect on rollout without an image rebuild.
            # (localhost:3100 was a dev default that pointed real users at their own machine.)
            - name: NEXT_PUBLIC_CONTROL_PANEL_URL
              value: "https://admin.evidara.veyo.dev"
            # Server-side only (NOT NEXT_PUBLIC): middleware injects it as X-API-Key
            # when proxying /v1/*. Optional: absent key => no header => API stays open.
            - name: LEGAL_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evidara-auth
                  key: LEGAL_SEARCH_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: legal-search-frontend
  namespace: evidara
spec:
  selector:
    app: legal-search-frontend
  ports:
    - port: 8080
      targetPort: 8080
