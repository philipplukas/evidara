# NOTE: the `evidara-auth` Secret is REQUIRED, not `optional: true`. It used to be
# optional, which meant a cluster where `deploy-stage5.sh` had never run (or where the
# Secret was deleted) started every pod with no API key — and both APIs then failed
# OPEN, serving the control plane and the search API to anyone who reached them. The
# apps now fail closed (503) instead, and making the Secret required moves the failure
# earlier still: the pod refuses to start rather than starting up unauthenticated.
# Run `infra/hetzner/deploy-stage5.sh` before `kubectl apply -k apps/`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-control-api
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-control-api
  template:
    metadata:
      labels:
        app: platform-control-api
    spec:
      containers:
        - name: api
          image: ghcr.io/philipplukas/evidara-platform-control
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidara-config
            - secretRef:
                name: evidara-app-secrets
            - secretRef:
                name: evidara-auth
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-control-api
  namespace: evidara
  # A ServiceMonitor selects on *Service* labels, not pod labels. See the note on
  # the legal-search-api Service. (ADR-0032)
  labels:
    app: platform-control-api
spec:
  selector:
    app: platform-control-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-control-admin
  namespace: evidara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-control-admin
  template:
    metadata:
      labels:
        app: platform-control-admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/philipplukas/evidara-platform-control-admin
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: evidara-config
            - secretRef:
                name: evidara-auth
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-control-admin
  namespace: evidara
spec:
  selector:
    app: platform-control-admin
  ports:
    - port: 8080
      targetPort: 8080
