# Evidara app workloads for the self-hosted Hetzner cluster (ADR-0029 stage 4).
# Secrets (evidara-app-secrets, ghcr-pull) are created imperatively by deploy-stage4.sh
# because they derive from the CNPG-generated password + your GHCR token.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evidara

resources:
  - configmap.yaml
  - platform-control.yaml
  - legal-search.yaml
  - document-intelligence.yaml
  # Legal-retention hard delete (ADR-0031). In `resources:` so the `images:` pin
  # below applies and the tag never has to be maintained by hand.
  - retention-sweep-cronjob.yaml
  # The Alembic migrate Job, as an Argo CD `PreSync` hook (ADR-0055). It is in
  # `resources:` so Argo CD sees it at all — a hook Argo never renders cannot run,
  # and the rollout would then apply a platform-control expecting a migration the
  # DB has never had. `deploy-stage4.sh` still applies it directly first for
  # bootstrap; the hook annotations are inert to `kubectl apply`.
  - migrate-job.yaml
  - tailnet-ingress.yaml
  # The marketing surface (ADR-0039), brought in here by #884. It was the only
  # workload in the namespace that no declarative config governed: outside
  # `resources:`, outside the `images:` transformer, and pinned inline to
  # 32a13330 — a pre-squash branch commit not reachable from `main`.
  # `check_hetzner_image_pins.py` could not see that drift, because its rule was
  # "pinned to a commit" and 32a13330 *is* a commit; it is simply not one of
  # ours. That gate now requires marketing to agree with the app SHA below, so
  # this entry and that rule hold each other up.
  #
  # This does couple the public page to a platform rollout it has no part in,
  # which is why it was originally kept out. The trade was re-made knowingly: an
  # unnecessary marketing restart is cheap, and a public surface that nothing
  # governs is not. It is referenced as a sibling *base*, not as
  # `../marketing/deployment.yaml` — kustomize's load restrictor rejects a
  # `resources:` path that escapes the kustomization root, so the directory
  # carries its own kustomization.yaml.
  - ../marketing

# Single place to pin the image tag.
#
# Pinned to a commit SHA on `main`, not to `latest` or a branch name: `latest`
# moves under the cluster on every merge, and a branch tag says nothing about
# what is actually running. `runtime-images.yml` tags each image with the full
# `github.sha`, so this pin is exactly reproducible.
#
# Pick a SHA that actually *built*. The gate is the workflow's `push` path
# filter, NOT the per-image filter: a docs-, `scripts/`- or `tools/`-only commit
# does not start `runtime-images.yml` at all and publishes nothing, which would
# leave every reference here unpullable. But once the workflow *does* run on a
# push, every image job's `if:` is `push || workflow_dispatch || <changed>`, so
# all six build and publish regardless of which paths changed. There is no such
# thing as a partial image set on a `main` push — do not hunt per-image for the
# "newest SHA where all six exist" (that reasoning is what under-pinned this file
# at d695b990 while three newer complete sets existed). Confirm with
# `gh run list --workflow=runtime-images.yml --commit <sha>`.
#
# Verify the tags, not just the run's conclusion. A green rollup is necessary but
# it is not what this file depends on — these SEVEN tags existing in GHCR is
# (marketing joined the list in #884; it is pinned here now, so it is no longer
# optional to check):
#
#   for i in platform-control platform-control-admin legal-search-api \
#            legal-search-frontend document-intelligence-document-service \
#            document-intelligence-consumer marketing; do
#     gh api "user/packages/container/evidara-$i/versions?per_page=100" \
#       --jq "[.[]|select(.metadata.container.tags[]? == \"<sha>\")]|length"
#   done
#
# The bounded exception #883 wrote here — "a red rollup may still be a pinnable
# SHA, because marketing cannot push" — is RETIRED. The package was linked, run
# 34028538455 was the first green across all eight jobs, and "newest green `push`
# run on `main`" is the correct rule again. Verifying the tags stays worthwhile
# anyway: it costs one command and it is what the file actually depends on.
#
# Why that distinction is written down (2026-09-04 → 2026-09-06). `marketing`
# joined `runtime-images.yml` as an eighth image, and its GHCR package was not
# linked to this repository, so `GITHUB_TOKEN` could not push it even with
# `packages: write` — every push failed `denied: permission_denied: read_package`.
# `Runtime Images gate` aggregates all eight, so one unpushable image turned every
# `main` run red while the six images below were building and pushing perfectly.
# Production sat at 4dddce3c for 27 commits with every artifact it needed already
# in the registry, because the rollup conclusion was read as the pin criterion.
#
# Two traps worth keeping: the failure is invisible on a PR, because PRs build
# without pushing (#719 and the `push:` expression in `runtime-images.yml`), so it
# surfaces only after merge. And it cannot be fixed from the repo — #881 tried, via
# `org.opencontainers.image.source` in `marketing/Dockerfile`, which cannot work
# because GHCR reads that label only on a push it accepts. The fix was linking the
# package (Package settings → Manage Actions access → `philipplukas/evidara`,
# Write). See #884.
#
# fc981adb (#1024) is `main`'s tip at the time of this pin. All SEVEN tags were
# confirmed present in GHCR before this pin was written, and the alembic delta over
# f5bff6dd is empty (checked, not assumed).
#
# WHAT THIS PIN ADDS. The operational one is #1024; everything else is the harness.
#   - #1024: Bayern and Lombardia get the reference data their templates need.
#     jur_de_by existed with NO authority and jur_it_lombardia did not exist, so
#     POST /v1/sources refused both with "Authority does not belong to the requested
#     jurisdiction" and two live templates were unusable. THIS PIN IS WHAT APPLIES
#     THEM: seeds ship in the image and the PreSync migrate job upserts them
#     (`alembic upgrade head && platform-control-seed-reference-data`). Until it
#     syncs, both templates keep refusing.
#   - #1013: di-consumer's memory ceiling 1Gi -> 4Gi. It was OOMKilled seven times
#     in eighteen minutes on a 944-document batch; it has since run a full batch
#     with zero restarts.
#   - #1015/#1016/#1017/#1019: the acceptance gates could not pass on a corpus that
#     was fine. Read-back had no self-hosted auth so the language and title gates
#     were NOT EVALUATED on every self-hosted run; content gates measured the raw
#     artifact, empty for a PDF; a 10 KB floor withheld a 3,080-character municipal
#     ordinance; the density gate counted only `Art.` and read Basel-Stadt's 126 `§`
#     as no legal text; the first-article gate knew only `Art. 1` and failed an 1874
#     treaty numbered Art. I to Art. VI. Scripts only — no runtime code.
#   - #1023: the NATS DLQ has a reader. Scripts only.
#   - #1020/#1021/#1022: evidence bundles and ADR-0058. Docs only.
#
# ── prior pins, newest first ──
#
# f5bff6dd (#1010) is `main`'s tip at the time of this pin. runtime-images.yml is green
# and all SEVEN tags below were confirmed present in GHCR before this pin was written —
# the run's conclusion is necessary but it is not what this file depends on:
#
#   for i in platform-control platform-control-admin legal-search-api legal-search-frontend \
#            document-intelligence-document-service document-intelligence-consumer marketing; do
#     gh api "user/packages/container/evidara-$i/versions?per_page=100" \
#       --jq "[.[]|select(.metadata.container.tags[]? == \"2d964ef4d435e072707af37d7048df22df3769fa\")]|length"
#   done   # all returned 1
#
# WHAT THIS PIN ADDS over 444115ad. Four merged PRs:
#   - #1004: the local loop's MinIO moved registries. `minio/minio` on Docker Hub stopped
#     serving pulls, so the E2E CH Fedlex Loop canary died in the compose step on every
#     scheduled main run from 2026-09-13, never reaching the loop it measures. Repointed at
#     quay.io and pinned to the RELEASE tag this cluster already runs, so the local loop and
#     the deployed environment now meet the same MinIO. No cluster effect; recorded because
#     the canary's greenness is evidence about THIS deployment.
#   - #1006: `fedlex_sparql_sr_full_de` had no `jurisdiction_id`. #997 added the template in
#     the same batch #1000 filled that field in, so it was missed and
#     `resolve_blueprint_jurisdiction_id()` returned None — the coverage queue could not
#     attribute the template to a jurisdiction.
#   - #1009: the admin Playwright suite aborts and NAMES any platform-control request a spec
#     does not mock, instead of failing later on a missing element. Test-only; no runtime
#     code. It has already earned its keep by DISCONFIRMING #942's leading hypothesis —
#     two specs failed with the guard installed and nothing escaped.
#   - #1010: providers finally read `scope.max_resources` off the run. It was validated by
#     `POST /v1/runs`, stored in `run_metadata`, and read by nothing, so a `max_resources: 25`
#     acceptance run on `lexfind_api_zh_full` published 944 documents (measured in production
#     2026-09-17). THIS is the pin's operational point: without it every acceptance run for
#     the nine config-blocked templates is a full ingest, and the fast-loop driver waits for
#     every captured document to reach canonical_ready (#731) — about two hours each.
#     A run's scope may only NARROW the template's own limit, never widen it.
#
# ZERO alembic delta, verified rather than assumed:
#
#   $ git diff --name-only --diff-filter=AMD 444115ad origin/main -- platform-control/alembic/
#   (empty)
#
# migrate-job.yaml is bumped to this same SHA in this change; keep the two in lockstep,
# since the `images:` transformer below deliberately does not reach it.
#
# ── prior pins, newest first ──
#
# 444115ad (#1000) is `main`'s tip at the time of this pin. runtime-images.yml is green
# and all SEVEN tags below were confirmed present in GHCR before this pin was written —
# the run's conclusion is necessary but it is not what this file depends on:
#
#   for i in platform-control platform-control-admin legal-search-api legal-search-frontend \
#            document-intelligence-document-service document-intelligence-consumer marketing; do
#     gh api "user/packages/container/evidara-$i/versions?per_page=100" \
#       --jq "[.[]|select(.metadata.container.tags[]? == \"2d964ef4d435e072707af37d7048df22df3769fa\")]|length"
#   done   # all returned 1
#
# WHAT THIS PIN ADDS over 63bd639e. Four merged PRs:
#   - #995: Apache-2.0, a gitleaks guard on staged files and full history, and a repository
#     link in the search header. Also DI_CANONICAL_RETRACTIONS_URI in configmap.yaml, WITHOUT
#     which ADR-0057's canonical_retract cannot run at all — the explicit-surface branch of
#     RuntimeSettings reads that key directly and leaves the ledger None when it is absent,
#     so the job raised `missing_retraction_ledger_config` and removed nothing. Applying this
#     pin is what puts that key in the cluster.
#   - #997: `fedlex_sparql` can ENUMERATE the Systematic Collection instead of only acquiring
#     hand-pasted seed_urls (16,965 works), and document-service gains
#     POST /v1/embeddings/query-sparse. The enumerating template ships `enabled: false`.
#   - #999: scripts only — a LexFind deployed-environment loop driver. No image effect.
#   - #1000: blueprint templates declare `jurisdiction_id`, and the coverage queue splits
#     `register_source` into an agent-actionable `register_source_from_template` and a
#     human-owned `register_source`. Sourceless jurisdictions a template already names now
#     ENTER the queue instead of being counted out.
#
# CONTRACT: `apis.platform_control.version` moved 0.31.0 -> 0.33.0 in this range (two
# additive changes; 0.32.0 and 0.33.0 were taken separately rather than collapsed, see
# contracts/manifest.yaml). The document-intelligence spec moved 0.1.0 -> 0.2.0 for the new
# embeddings path. Both additive: a reader that ignores the new fields and enum values sees
# what it saw before.
#
# NOT DEPLOYED BY THIS PIN, deliberately: nothing serves the sparse representation. 882 of
# 897 documents carry `content_sparse` and the query path is still pure BM25, because
# ADR-0054's D4 gate does not separate on the real corpus (measured 2026-09-16).
#
# ZERO alembic delta, verified rather than assumed:
#
#   $ git diff --name-only --diff-filter=AMD 63bd639e origin/main -- platform-control/alembic/
#   (empty)
#
# migrate-job.yaml is bumped to this same SHA in this change; keep the two in lockstep,
# since the `images:` transformer below deliberately does not reach it.
#
# ── prior pins, newest first ──
#
# 2ce8c720 (#937) is `main`'s tip at the time of this pin. Run 34211402824 is green,
# and all SEVEN tags below were confirmed present in GHCR before this pin was written:
#
#   for i in platform-control platform-control-admin legal-search-api \
#            legal-search-frontend document-intelligence-document-service \
#            document-intelligence-consumer marketing; do ... done   # all returned 1
#
# What this pin adds over 40f80f4e (2026-09-07, 5 commits back). Every one of these
# came from DRIVING the operator panel against a seeded stack rather than reading it,
# which is why they had survived their own unit tests:
#   - the dashboard no longer opens by pointing at a CANCELLED run (#932). Its
#     attention card matched on pipeline health alone while the run queue, on the
#     same data, correctly filtered to actionable statuses. One rule, two
#     implementations, and the losing copy was the landing page.
#   - the coverage work queue reads the whole estate instead of one 500-row
#     alphabetical page, and reports sourceless jurisdictions as a count rather than
#     as 2,164 identical rows (#933). It was blind to 77% of the estate.
#   - Coverage opens on the jurisdictions that need work (#937). It used to open on
#     page 1 of 44 of empty communes while its own header said four of 2,169 had any
#     acquisition.
#   - three smaller ones (#934): a section pill that reported a page size as a total,
#     three reachable views with no header while a PARKED one had one, and the
#     overflow fade that was painted behind the very column it warns about.
#
# CONTRACT: `apis.platform_control.version` moved 0.28.0 -> 0.29.0 in this range.
# `GET /v1/acquisition-coverage/queue` gains `jurisdictions_without_a_source` and a
# `no_source` reason, and its `data` gets SHORTER — consumers should expect `total`
# to fall, which is the surprising direction for a queue.
#
# The marketing page stays private (#927 amended ADR-0039 D4). Rolling this pin does
# not change that and must not be read as doing so.
#
# ZERO alembic delta:
#
#   $ git diff --name-only --diff-filter=AMD 40f80f4e origin/main -- platform-control/alembic/
#   (empty)
#
# The migrate Job still runs as a PreSync hook and will complete having applied
# nothing, which is correct here and is exactly the outcome
# `check_hetzner_image_pins.py` exists to stop being *silent* — a successful
# migrate that applies nothing is only fine when it is nothing by construction, as
# verified above, and not because the Job image drifted. migrate-job.yaml is bumped
# to this same SHA in this change; keep the two in lockstep, since the `images:`
# transformer below deliberately does not reach it.
#
# The contract moved 2.37.0 -> 2.39.0 (`apis.platform_control.version`
# 0.26.0 -> 0.28.0). No locked path changed shape.
#
# ── PRECONDITION, SATISFIED AS OF THIS PIN ──
#
# `platform-control.yaml`, `document-intelligence.yaml` and
# `retention-sweep-cronjob.yaml` `envFrom` the per-workload MinIO Secrets
# `evidara-s3-platform-control`, `evidara-s3-di-consumer` and
# `evidara-s3-document-service` (#813). The 4dddce3c pin carried this as an
# UNSATISFIED precondition; the cutover has since been run and all three Secrets
# exist in the `evidara` namespace. Re-check before applying to any cluster that
# is not this one — a pod that starts without one fails at its first artifact
# write rather than at startup, so absence is silent until it matters. Run
# `infra/hetzner/provision-minio-users.sh` (then `verify-minio-scoping.sh`);
# `deploy-stage4.sh` fails fast if they are absent.
# Procedure: docs/runbooks/minio-least-privilege-cutover.md.
#
# ── MARKETING IS NOW COVERED (#884) ──
#
# The previous pin carried this section to say the opposite: `marketing` was in
# neither `resources:` nor `images:`, `infra/hetzner/marketing/deployment.yaml`
# hardcoded its own tag, and bumping this file did not roll the site. Both are fixed
# here — it is a base under `resources:` and has an `images:` entry, and its
# Deployment is untagged like every other workload.
#
# What that comment could not say, because nothing measured it: the site was not
# merely stale, it was UNREACHABLE. `evidara.veyo.dev` had no DNS record and the
# Ingress in `infra/hetzner/marketing/ingress-tls.yaml` had never been applied, so a
# perfectly healthy pod served nobody for the entire life of the deployment. The A
# record (-> 88.99.26.120, matching the other three) was created at the registrar on
# 2026-09-07 and resolves; applying this pin is what puts the Ingress in the cluster.
#
# The page is still behind `basicauth` — see the header of ingress-tls.yaml, which
# is the authority on why and on what must be true before it comes off. Rolling this
# pin does NOT make the page public and is not the decision that should.
#
# ── prior pins, newest first ──
#
# 4932ec2c (#883, 2026-09-06) was the first pin taken after the marketing GHCR
# package was linked, so `runtime-images.yml` could go green on `main` again. It was
# a correctness and operator roll: the operator panel usable under pressure
# (#M16 / #873), a run rendering what it refused and cannot prove (#634 / #861), the
# wizard human gate expiring into a terminal state (#560 / #844), nested-field loss
# fixed across struct columns and sinks (#871 / #876), the rescore store reading
# canonical Delta with credentials (#847 / #860), a regeste on the projection
# (#836 / #857), `strict` matching robots.txt (#866), the capture guard covering nine
# providers (M14 #6 / #862), a policy-less cantonal source refused rather than
# defaulted (#878), one measured `in_force_until` at the boundary (#843 / #859),
# ADR-0047 quarantine recorded (#731 / #851), and learned-sparse embeddings shipped
# but unserved (#882 — ADR-0054's D4 abstention gate still does not exist, and sparse
# retrieval must not reach a user before it does). One alembic revision (0026).
#
# 4dddce3c (#858, 2026-09-04) brought six weeks of fixes to the deployed site after
# production had sat at 8759bec5 for 35 commits. User-visible: the URL search-param
# parser unification (#822 / #829), the regeste headnote on document detail
# (#760 / #830), and the BFF taking sole ownership of metadata visibility
# (#787 / #821). In the acquisition platform: the LexFind cantonal rung went from
# one canton to a working enumeration — BE acceptance evidence (#814), `lexfind_api`
# promoted to LIVE (#815), whole-canton enumeration proving its own denominator
# (#818), the coverage ledger (#819), a locator-less artifact no longer collapsing
# onto one `document_id` (#831), an idempotent shard crawl (#834), the #661 temporal
# trap (#837), a mirror that keeps proving it equals the source (#845), and a FAILED
# dispatch that no longer publishes what it captured (#858). Two alembic revisions
# (0024, 0025). It was pinned with the MinIO per-workload Secrets (#813) listed as
# an unsatisfied precondition; that cutover has since been completed.
#
# 8759bec5 (#804, 2026-07-23) carried the LexFind provider (#797) — 26 cantons plus
# federal behind one unauthenticated JSON API, the rung that holds ADR-0033's dog
# question — `blueprint_enablement` and the ADR-0030 two-key lock,
# `RunMode.ACCEPTANCE` (#743), and the legislative identifier reaching the index
# (#755 / #804) so a law is findable by its own citation. Three alembic revisions
# (0021..0023), one of them overdue because the migrate Job had drifted 143 commits
# behind the pin it was meant to migrate for — the exact failure migrate-job.yaml
# warns about.
#
# da39660d (#626, 2026-07-16) made document body text reach the screen at all
# (#621 / #613 / #609 — the BFF served `content: null` for every document with a
# body while advertising an "Inhalt" tab), and made the platform-control OpenAPI
# spec generated from the FastAPI app and drift-gated (#618, ADR-0034); the
# hand-written spec had described 4 of 11 providers and documented an auth scheme
# the API does not accept. Zero alembic delta.
#
# 5c5c13f5 (#617) stopped the source-version editor corrupting acquisition specs on
# save — resetting `corpus_id`, emptying `language_codes`, nulling
# `document_type_hint` and rewriting 7 of 11 providers to firecrawl, HTTP 200 each
# time, the damaged record rendering identically to a healthy one. Zero alembic
# delta.
