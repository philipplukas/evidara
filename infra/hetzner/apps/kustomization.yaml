# Evidara app workloads for the self-hosted Hetzner cluster (ADR-0029 stage 4).
# Secrets (evidara-app-secrets, ghcr-pull) are created imperatively by deploy-stage4.sh
# because they derive from the CNPG-generated password + your GHCR token.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evidara

resources:
  - configmap.yaml
  - platform-control.yaml
  - legal-search.yaml
  - document-intelligence.yaml
  # Legal-retention hard delete (ADR-0031). In `resources:` — unlike migrate-job.yaml —
  # so the `images:` pin below applies and the tag never has to be maintained by hand.
  - retention-sweep-cronjob.yaml

# Single place to pin the image tag.
#
# Pinned to a commit SHA on `main`, not to `latest` or a branch name: `latest`
# moves under the cluster on every merge, and a branch tag says nothing about
# what is actually running. `runtime-images.yml` tags each image with the full
# `github.sha`, so this pin is exactly reproducible.
#
# Pick a SHA that actually *built* — the workflow is path-filtered, so a
# docs- or test-only commit publishes no images at all and would leave every
# reference here unpullable. Check `gh run list --workflow=runtime-images.yml
# --commit <sha>` before pinning.
#
# a660776 (#600) is the current `main` tip and carries the design + search
# content/fixes the live UI was missing at 6e1816a: the shared BrandMark and
# styles/shell baked into the frontend image (#547, #599), the header/context
# bar/panel-row alignment (#548), search snippets that match the query (#595),
# the acquired expression's real language on the index (#587), the norm-hierarchy
# model (#591), and the Stadt Zürich municipal layer (#584, #589). All six images
# are published at this SHA (verified in GHCR). The alembic delta from 6e1816a is
# a single clean migration (20260714_0021_jurisdiction_norm_level) — history stays
# single-headed, so the migrate job applies one forward revision on rollout.
#
# (Prior pin 6e1816a was the first SHA carrying the M12 pipeline-trust work —
# #554 search 503s, #555 DI status callbacks, #565 /metrics, #569 provider
# live-ready lock — and the first single-headed alembic history after the
# #571–#574 double-0019 hazard, which stays behind us here.)
images:
  - name: ghcr.io/philipplukas/evidara-platform-control
    newTag: a66077620c9e321c424df8db05ab07a15779c4f3
  - name: ghcr.io/philipplukas/evidara-platform-control-admin
    newTag: a66077620c9e321c424df8db05ab07a15779c4f3
  - name: ghcr.io/philipplukas/evidara-legal-search-api
    newTag: a66077620c9e321c424df8db05ab07a15779c4f3
  - name: ghcr.io/philipplukas/evidara-legal-search-frontend
    newTag: a66077620c9e321c424df8db05ab07a15779c4f3
  - name: ghcr.io/philipplukas/evidara-document-intelligence-document-service
    newTag: a66077620c9e321c424df8db05ab07a15779c4f3
  - name: ghcr.io/philipplukas/evidara-document-intelligence-consumer
    newTag: a66077620c9e321c424df8db05ab07a15779c4f3
