# Evidara app workloads for the self-hosted Hetzner cluster (ADR-0029 stage 4).
# Secrets (evidara-app-secrets, ghcr-pull) are created imperatively by deploy-stage4.sh
# because they derive from the CNPG-generated password + your GHCR token.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evidara

resources:
  - configmap.yaml
  - platform-control.yaml
  - legal-search.yaml
  - document-intelligence.yaml
  # Legal-retention hard delete (ADR-0031). In `resources:` — unlike migrate-job.yaml —
  # so the `images:` pin below applies and the tag never has to be maintained by hand.
  - retention-sweep-cronjob.yaml

# Single place to pin the image tag.
#
# Pinned to a commit SHA on `main`, not to `latest` or a branch name: `latest`
# moves under the cluster on every merge, and a branch tag says nothing about
# what is actually running. `runtime-images.yml` tags each image with the full
# `github.sha`, so this pin is exactly reproducible.
#
# Pick a SHA that actually *built*. The gate is the workflow's `push` path
# filter, NOT the per-image filter: a docs-, `scripts/`- or `tools/`-only commit
# does not start `runtime-images.yml` at all and publishes nothing, which would
# leave every reference here unpullable. But once the workflow *does* run on a
# push, every image job's `if:` is `push || workflow_dispatch || <changed>`, so
# all six build and publish regardless of which paths changed. There is no such
# thing as a partial image set on a `main` push — do not hunt per-image for the
# "newest SHA where all six exist" (that reasoning is what under-pinned this file
# at d695b990 while three newer complete sets existed). Confirm with
# `gh run list --workflow=runtime-images.yml --commit <sha>`.
#
# 8759bec5 (#804) is the current `main` tip and all seven image jobs are green on
# its push (run 30027046837).
#
# This rollout is large. Production was pinned at da39660d (2026-07-16), 109
# commits behind, and that gap is why the platform has no corpus: the deployed
# image contained exactly two acquisition providers, `fedlex_sparql` and
# `gemeinde_http`. Everything that makes a Swiss corpus possible was built after
# it. What this pin adds:
#   - the LexFind provider (#797): 26 cantons plus federal behind one
#     unauthenticated JSON API. This is the cantonal rung, and it carries the
#     ADR-0033 dog question — `tol/22871` is the ZH Hundegesetz, md5-identical to
#     the canton's own PDF.
#   - `blueprint_enablement` and the ADR-0030 two-key lock, so template
#     enablement is an operator action against evidence rather than a repo edit.
#   - `RunMode.ACCEPTANCE` (#743), without which no run can be recorded as
#     acceptance evidence at all.
#   - the legislative identifier reaches the index (#755 / #804), so a law is
#     findable by its own citation. `official_citation` is `null` on every
#     document in the live index today: the mapping defines the field and the
#     query boosts it, but nothing populated it. Pinning below this SHA and then
#     rebuilding the index would rebuild it still-null — which is why #804 was
#     merged before this pin rather than after.
#
# NOT zero alembic delta — unlike the previous two pins. THREE forward revisions
# apply on rollout, and the migrate job must complete before the API rolls:
#   20260714_0021_jurisdiction_norm_level      <- already overdue, see below
#   20260717_0022_blueprint_template_overrides
#   20260720_0023_run_mode_acceptance
#
# Three, not two, because the migrate Job had drifted exactly the way the warning
# in migrate-job.yaml predicts: it was pinned at 6e1816a7 (#574), 143 commits
# back and older than the da39660d pin it was supposed to migrate for. So the
# previous rollout shipped code containing 0021 and never ran it. Verified against
# the live DB, not inferred: `alembic_version` reads 20260713_0020, and
# `jurisdictions` has 2169 rows but no `level` column — while the deployed
# da39660d image maps `level` on the Jurisdiction model. Every ORM read of a
# jurisdiction in production currently raises UndefinedColumn, which is one
# concrete reason ADR-0033's `norm_hierarchy` cannot answer anything there.
# migrate-job.yaml is bumped to this same SHA in this change; keep the two in
# lockstep, since the `images:` transformer below deliberately does not reach it.
#
# Prior pin da39660d (#626) advanced the site past 5c5c13f5 (#617) with:
#   - document body text reaches the screen at all (#621 / #613 / #609). The BFF
#     suppressed `content` for EVERY document that had a body: the docling fetch
#     was skipped whenever `content` was present, and the mapper emitted `content`
#     only from `content_docling` — a field the index does not define. Every
#     document detail served `content: null` while advertising an "Inhalt" tab.
#   - the platform-control OpenAPI spec is now GENERATED from the FastAPI app and
#     drift-gated (#618 / #626, ADR-0034). The hand-written spec described 4 of 11
#     acquisition providers, omitted 14 of 61 paths, pointed at a `servers` host
#     that exists nowhere in `infra/`, and documented `Bearer <JWT>` auth "from the
#     identity provider" when the API requires `X-API-Key` — a client built from it
#     could not authenticate at all. Runtime behaviour is unchanged; `/docs` now
#     shows the real title/version, and 8 wizard `operationId`s change (fixing a
#     genuine `get_run` collision). Paths are untouched, so path-based clients are
#     unaffected.
# Zero alembic delta from 5c5c13f5 (no new platform-control migrations across this
# range), so the migrate job applies no forward revision on rollout.
#
# (Prior pin 5c5c13f5 (#617) stopped the source-version editor corrupting
# acquisition specs on save — it had been resetting `corpus_id`, emptying
# `language_codes`, nulling `document_type_hint` and rewriting 7 of 11 providers to
# firecrawl, HTTP 200 each time, with the damaged record rendering identically to a
# healthy one. Zero alembic delta.)
images:
  - name: ghcr.io/philipplukas/evidara-platform-control
    newTag: 8759bec51fc55fa02a155f5b63ddf23adf942bcc
  - name: ghcr.io/philipplukas/evidara-platform-control-admin
    newTag: 8759bec51fc55fa02a155f5b63ddf23adf942bcc
  - name: ghcr.io/philipplukas/evidara-legal-search-api
    newTag: 8759bec51fc55fa02a155f5b63ddf23adf942bcc
  - name: ghcr.io/philipplukas/evidara-legal-search-frontend
    newTag: 8759bec51fc55fa02a155f5b63ddf23adf942bcc
  - name: ghcr.io/philipplukas/evidara-document-intelligence-document-service
    newTag: 8759bec51fc55fa02a155f5b63ddf23adf942bcc
  - name: ghcr.io/philipplukas/evidara-document-intelligence-consumer
    newTag: 8759bec51fc55fa02a155f5b63ddf23adf942bcc
