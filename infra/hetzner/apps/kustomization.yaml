# Evidara app workloads for the self-hosted Hetzner cluster (ADR-0029 stage 4).
# Secrets (evidara-app-secrets, ghcr-pull) are created imperatively by deploy-stage4.sh
# because they derive from the CNPG-generated password + your GHCR token.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evidara

resources:
  - configmap.yaml
  - platform-control.yaml
  - legal-search.yaml
  - document-intelligence.yaml
  # Legal-retention hard delete (ADR-0031). In `resources:` — unlike migrate-job.yaml —
  # so the `images:` pin below applies and the tag never has to be maintained by hand.
  - retention-sweep-cronjob.yaml

# Single place to pin the image tag.
#
# Pinned to a commit SHA on `main`, not to `latest` or a branch name: `latest`
# moves under the cluster on every merge, and a branch tag says nothing about
# what is actually running. `runtime-images.yml` tags each image with the full
# `github.sha`, so this pin is exactly reproducible.
#
# Pick a SHA that actually *built*. The gate is the workflow's `push` path
# filter, NOT the per-image filter: a docs-, `scripts/`- or `tools/`-only commit
# does not start `runtime-images.yml` at all and publishes nothing, which would
# leave every reference here unpullable. But once the workflow *does* run on a
# push, every image job's `if:` is `push || workflow_dispatch || <changed>`, so
# all six build and publish regardless of which paths changed. There is no such
# thing as a partial image set on a `main` push — do not hunt per-image for the
# "newest SHA where all six exist" (that reasoning is what under-pinned this file
# at d695b990 while three newer complete sets existed). Confirm with
# `gh run list --workflow=runtime-images.yml --commit <sha>`.
#
# 4dddce3c (#858) is the newest `main` commit that actually published images: all
# seven image jobs are green on its push (run 33759401696), and all six tags below
# were confirmed present in GHCR before this pin was written.
#
# It is NOT `main`'s tip. The four commits after it (6d5dca3c, e4c38650, 4dd8d081,
# 7cb76544) touch only `docs/`, `scripts/` and `.github/`, so `runtime-images.yml`
# never started on their pushes and no image carries their SHA. Pinning the tip
# would be unpullable — which is the trap the paragraph above describes, met for
# real. When you bump this, pin the newest SHA with a green `push` run — which is
# not always `main`'s tip.
#
# What this pin adds over 8759bec5 (2026-07-23, 35 commits back). User-visible in
# `search.evidara.veyo.dev`:
#   - a deep-linked search reaches the right parser (#822 / #829). Each URL search
#     param had its own ad-hoc parse at every call site, so the same query string
#     resolved differently depending on which component read it first.
#   - the regeste renders as a headnote on document detail (#760 / #830), which is
#     the first thing a lawyer reads on a court decision.
#   - the BFF owns metadata visibility outright (#787 / #821) rather than splitting
#     the rule across BFF and frontend — the AGENTS.md "one rule, one enforcer"
#     failure, where the weaker of the two clients silently became the policy.
# In the acquisition platform (not user-visible, but this is where the corpus comes
# from): the LexFind cantonal rung goes from one canton to a working enumeration —
# BE acceptance evidence (#814), `lexfind_api` promoted to LIVE (#815), whole-canton
# enumeration with the run proving its own denominator (#818), the coverage ledger
# that stores what a jurisdiction should hold (#819), a locator-less artifact no
# longer collapsing onto one `document_id` (#831), an idempotent shard crawl whose
# progress writes cannot be lost (#834), a temporal boolean no longer frozen at
# capture time — the #661 trap (#837), a mirror that keeps proving it equals the
# source (#845), and a FAILED dispatch that no longer publishes what it captured
# (#858). Plus DI quarantine for a manifestation whose text is not law (#841).
#
# NOT zero alembic delta. TWO forward revisions apply on rollout, and the migrate
# Job must complete before the API rolls:
#   20260728_0024_coverage_reconciliations
#   20260903_0025_wizard_shard_idempotency
# migrate-job.yaml is bumped to this same SHA in this change; keep the two in
# lockstep, since the `images:` transformer below deliberately does not reach it.
#
# ── PRECONDITION THIS PIN DOES NOT SATISFY ON ITS OWN ──
#
# `platform-control.yaml`, `document-intelligence.yaml` and
# `retention-sweep-cronjob.yaml` now `envFrom` the per-workload MinIO Secrets
# `evidara-s3-platform-control`, `evidara-s3-di-consumer` and
# `evidara-s3-document-service` (#813). Those Secrets do not exist in a cluster that
# has not been cut over, and a pod that starts without one fails at its first
# artifact write rather than at startup. Run
# `infra/hetzner/provision-minio-users.sh` (then `verify-minio-scoping.sh`) BEFORE
# applying this kustomization; `deploy-stage4.sh` fails fast if they are absent.
# Procedure: docs/runbooks/minio-least-privilege-cutover.md.
#
# ── prior pins, newest first ──
#
# 8759bec5 (#804, 2026-07-23) carried the LexFind provider (#797) — 26 cantons plus
# federal behind one unauthenticated JSON API, the rung that holds ADR-0033's dog
# question — `blueprint_enablement` and the ADR-0030 two-key lock,
# `RunMode.ACCEPTANCE` (#743), and the legislative identifier reaching the index
# (#755 / #804) so a law is findable by its own citation. Three alembic revisions
# (0021..0023), one of them overdue because the migrate Job had drifted 143 commits
# behind the pin it was meant to migrate for — the exact failure migrate-job.yaml
# warns about.
#
# da39660d (#626, 2026-07-16) made document body text reach the screen at all
# (#621 / #613 / #609 — the BFF served `content: null` for every document with a
# body while advertising an "Inhalt" tab), and made the platform-control OpenAPI
# spec generated from the FastAPI app and drift-gated (#618, ADR-0034); the
# hand-written spec had described 4 of 11 providers and documented an auth scheme
# the API does not accept. Zero alembic delta.
#
# 5c5c13f5 (#617) stopped the source-version editor corrupting acquisition specs on
# save — resetting `corpus_id`, emptying `language_codes`, nulling
# `document_type_hint` and rewriting 7 of 11 providers to firecrawl, HTTP 200 each
# time, the damaged record rendering identically to a healthy one. Zero alembic
# delta.
images:
  - name: ghcr.io/philipplukas/evidara-platform-control
    newTag: 4dddce3c02e6966b4e37afcc2262658f990eae91
  - name: ghcr.io/philipplukas/evidara-platform-control-admin
    newTag: 4dddce3c02e6966b4e37afcc2262658f990eae91
  - name: ghcr.io/philipplukas/evidara-legal-search-api
    newTag: 4dddce3c02e6966b4e37afcc2262658f990eae91
  - name: ghcr.io/philipplukas/evidara-legal-search-frontend
    newTag: 4dddce3c02e6966b4e37afcc2262658f990eae91
  - name: ghcr.io/philipplukas/evidara-document-intelligence-document-service
    newTag: 4dddce3c02e6966b4e37afcc2262658f990eae91
  - name: ghcr.io/philipplukas/evidara-document-intelligence-consumer
    newTag: 4dddce3c02e6966b4e37afcc2262658f990eae91
