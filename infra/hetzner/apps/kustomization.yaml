# Evidara app workloads for the self-hosted Hetzner cluster (ADR-0029 stage 4).
# Secrets (evidara-app-secrets, ghcr-pull) are created imperatively by deploy-stage4.sh
# because they derive from the CNPG-generated password + your GHCR token.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evidara

resources:
  - configmap.yaml
  - platform-control.yaml
  - legal-search.yaml
  - document-intelligence.yaml
  # Legal-retention hard delete (ADR-0031). In `resources:` — unlike migrate-job.yaml —
  # so the `images:` pin below applies and the tag never has to be maintained by hand.
  - retention-sweep-cronjob.yaml

# Single place to pin the image tag.
#
# Pinned to a commit SHA on `main`, not to `latest` or a branch name: `latest`
# moves under the cluster on every merge, and a branch tag says nothing about
# what is actually running. `runtime-images.yml` tags each image with the full
# `github.sha`, so this pin is exactly reproducible.
#
# Pick a SHA that actually *built* — the workflow is path-filtered, so a
# docs- or test-only commit publishes no images at all and would leave every
# reference here unpullable. Check `gh run list --workflow=runtime-images.yml
# --commit <sha>` before pinning.
#
# 5c5c13f5 (#617) is the current `main` tip. All six images built and are
# published at this SHA (runtime-images.yml run 29495543024 — every image job
# green). It carries one behaviour change over ac69a83e (#606), and it is the
# reason this rollout is not batched:
#   - the source-version editor no longer corrupts acquisition specs on save
#     (#614 / #617). Renaming a version label used to reset `corpus_id` to the
#     schema default, empty `language_codes`, and null `document_type_hint`;
#     opening a `canton_http` version and saving it unchanged rewrote it to
#     firecrawl and dropped `canton_code`. HTTP 200 every time, and the damaged
#     record rendered identically to a healthy one. Every operator edit against
#     the previous image was destroying data invisibly, so this ships on its own
#     rather than waiting for the next batch.
# Zero alembic delta from ac69a83e (no new platform-control migrations across
# this range), so the migrate job applies no forward revision on rollout. The
# range touches only `platform-control/admin` sources, so every other image is
# rebuilt but functionally unchanged.
#
# (Prior pin ac69a83e (#606) carried the UI fix batch: the filter rail and detail
# panel rendering at all after being 28px/32px wide since 2026-03-29 (#605), the
# admin shell grid + header overlap (#607), Esc closing the mobile drawer (#608),
# aria-busy/role=alert on admin lists (#612), and the Inhalt tab's empty state
# (#606). Zero alembic delta. It was also the first pin to make every workload
# deterministic — four services had been running untagged `:latest` and three
# were 29 commits stale at 6e1816a7.)
images:
  - name: ghcr.io/philipplukas/evidara-platform-control
    newTag: 5c5c13f596512d1d1a00defd958c2c8498aa6eff
  - name: ghcr.io/philipplukas/evidara-platform-control-admin
    newTag: 5c5c13f596512d1d1a00defd958c2c8498aa6eff
  - name: ghcr.io/philipplukas/evidara-legal-search-api
    newTag: 5c5c13f596512d1d1a00defd958c2c8498aa6eff
  - name: ghcr.io/philipplukas/evidara-legal-search-frontend
    newTag: 5c5c13f596512d1d1a00defd958c2c8498aa6eff
  - name: ghcr.io/philipplukas/evidara-document-intelligence-document-service
    newTag: 5c5c13f596512d1d1a00defd958c2c8498aa6eff
  - name: ghcr.io/philipplukas/evidara-document-intelligence-consumer
    newTag: 5c5c13f596512d1d1a00defd958c2c8498aa6eff
