# One-shot: create the EVIDARA JetStream stream (evidara.>) with a 2m dedup window,
# matching the Nats-Msg-Id publish dedup in the Evidara publishers/consumer. ADR-0029.
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-evidara-stream-init
  namespace: evidara
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: evidara
    spec:
      restartPolicy: OnFailure
      containers:
        - name: stream-init
          image: natsio/nats-box:latest
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 1 30); do
                if nats --server nats://nats:4222 stream add EVIDARA \
                     --subjects 'evidara.>' --storage file --retention limits \
                     --discard old --dupe-window 2m --defaults >/dev/null 2>&1; then
                  echo 'EVIDARA stream ready'; exit 0;
                fi;
                echo "waiting for nats ($i/30)"; sleep 2;
              done;
              echo 'failed to create EVIDARA stream'; exit 1
