# kube-prometheus-stack for self-hosted Evidara (ADR-0031).
# Chart: prometheus-community/kube-prometheus-stack, installed into namespace `monitoring`.
# Single node, modest retention — this cluster is one dedicated box, not a fleet.

fullnameOverride: kps

# --- k3s reality check -------------------------------------------------------
# k3s runs the control plane as a single embedded binary: there are no separate
# kube-controller-manager / kube-scheduler / kube-proxy / etcd pods and no metrics
# endpoints for them. The chart's defaults scrape them anyway, which produces
# permanently-down targets and permanently-firing `KubeControllerManagerDown`-style
# alerts. A monitoring stack that cries wolf on day one is worse than none, so they
# are off — and the matching default rules with them.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  create: true
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    etcd: false
    # Single-node cluster: "no redundancy" alerts are structural, not incidents.
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false

# --- Prometheus --------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 18GB
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Discover the Evidara ServiceMonitors/PodMonitors/PrometheusRules that live in the
    # `evidara` namespace (next to the workloads they describe). The chart defaults to
    # `release=<name>` label selectors scoped to its own namespace; nil-ing the selectors
    # makes the operator watch every namespace, which is what a one-namespace app cluster
    # wants. See infra/hetzner/observability/.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 3Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# --- Alertmanager ------------------------------------------------------------
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  # Routing. `critical` is the page tier (see docs/adr/sli-slo-definitions.md); until a
  # real receiver is wired it lands in the Alertmanager UI only. To page for real, add a
  # Slack webhook: see docs/setup/hetzner-observability.md#wiring-a-receiver.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default"
      routes:
        - matchers: ["severity = critical"]
          receiver: "page"
          repeat_interval: 1h
        - matchers: ["alertname = Watchdog"]
          receiver: "null"
    receivers:
      - name: "null"
      - name: "default"
      - name: "page"
    inhibit_rules:
      # A resolved-alias outage implies zero-result queries; don't page twice.
      - source_matchers: ["alertname = DocumentsReadAliasUnresolved"]
        target_matchers: ["alertname =~ SearchZeroResultRateHigh|SearchIndexEmpty"]
        equal: ["namespace"]

# --- Grafana -----------------------------------------------------------------
grafana:
  enabled: true

  # Admin password comes from the `evidara-grafana-admin` Secret, created once by
  # deploy-observability.sh (same create-once pattern as `evidara-auth` in stage 5).
  admin:
    existingSecret: evidara-grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi

  # Dashboards are delivered as labelled ConfigMaps, not baked into these values —
  # the sidecar picks up anything labelled `grafana_dashboard: "1"` in any namespace.
  # The Evidara pipeline funnel lives in infra/hetzner/observability/dashboard-funnel.yaml.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true

  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
    users:
      # Read-only by default once someone is in; the operator logs in as admin.
      viewers_can_edit: false

# Node exporter + kube-state-metrics stay on (chart defaults) — they are the only
# reason "the pod is Running but the node is out of disk" is ever visible.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
