# Ingress for the Evidara marketing page (ADR-0039).
#
# ── IT IS BEHIND BASICAUTH, BY DECISION — NOT BY DEVIATION ──
#
# This header used to call the middleware below "a deviation from ADR-0039" and
# "temporary". As of 2026-09-07 it is neither: ADR-0039's D4 is formally amended
# to say the page stays private, and this annotation is what implements that.
#
# Do not remove it as tidy-up. Removing it is the decision to publish, and it
# reverses an ADR.
#
# ── what it costs, so nobody has to rediscover it ──
#
# A password makes the page INVISIBLE, not SAFE. While this line is here the
# surface cannot do the one job ADR-0039 gave it: someone who hears about
# Evidara still has nothing to read. That was true when this file first said it
# and it is still true.
#
# ── what must be true before removing it ──
#
# All three are currently unmet, and two are outside this surface:
#
#   1. The waitlist posts somewhere. `NEXT_PUBLIC_WAITLIST_ENDPOINT` is unset,
#      so a public page would collect nothing. ADR-0039 D3 chose Listmonk on the
#      existing CNPG cluster, with its own database AND its own role, double
#      opt-in, and a server-side honeypot re-check. Unimplemented.
#   2. A Traefik rate-limit middleware exists on this Ingress. D3 is explicit
#      that this stops being optional the moment a submission endpoint is live.
#   3. The page still links to no product — search has no end-user
#      authentication (ADR-0038). `marketing/src/__tests__/page.test.tsx` fails
#      if a product link appears, deliberately.
#
# A public page with a dead form and no rate limiting is a worse artifact than
# no public page.
#
# When you do remove it: update ADR-0039's D4 amendment and this header in the
# SAME commit, so the next reader finds a decision rather than an absence.
#
# ── the hazard this file used to be the only warning about ──
#
# BasicAuth in this cluster is opt-in PER INGRESS, not a cluster-wide default.
# The default posture is *public*, and protection is something an author must
# remember to add. That is why the annotation below is written out rather than
# assumed, and why removing it later should be a deliberate commit with this
# comment updated in the same diff.
#
# ── What must be true before applying ──
#
#   1. DNS A record exists AND RESOLVES — SATISFIED 2026-09-07, created at the
#      Infomaniak registrar; the certificate issued 52 seconds later:
#        evidara.veyo.dev   A   88.99.26.120
#      (AAAA -> 2a01:4f8:10a:284::2 optional.)
#      Applying before the record resolves fails the cert-manager HTTP-01
#      challenge and burns Let's Encrypt production rate limit. DNS for this
#      umbrella is created by hand at the registrar; it is not in Terraform.
#
#   2. The `marketing` Deployment + Service from deployment.yaml are applied and
#      Ready. This file references that Service; it does not create it.
#
#   3. If the record is new, consider issuing first with `letsencrypt-staging`
#      to dodge rate limits, then switching to `letsencrypt-prod` once a cert is
#      seen to issue.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketing-tls
  namespace: evidara
  annotations:
    # Deliberate — ADR-0039 D4, amended 2026-09-07. Removing this line publishes
    # the page and reverses that decision; see this file's header for the three
    # preconditions, all currently unmet.
    traefik.ingress.kubernetes.io/router.middlewares: evidara-evidara-basicauth@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - evidara.veyo.dev
      secretName: marketing-evidara-tls
  rules:
    - host: evidara.veyo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marketing
                port:
                  number: 8080
