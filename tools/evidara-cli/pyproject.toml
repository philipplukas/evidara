[project]
name = "evidara-cli"
version = "0.1.0"
description = "Agent-oriented CLI for Evidara platform-control and legal-search APIs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0,<1",
  "pyyaml>=6.0.2,<7",
  "typer>=0.15.0,<1",
]

[project.scripts]
evidara = "evidara_cli.main:main"

[dependency-groups]
dev = [
  # test-only: tests/test_envelope.py validates builder output against
  # contracts/schemas/workflow-command-envelope.schema.json. Same validator the
  # repo already uses elsewhere (scripts/validate_json_schemas.py,
  # platform-control/tests/unit/). Deliberately NOT a runtime dependency: the
  # envelope builder must stay import-free (see tests/test_envelope.py).
  "jsonschema>=4.25.0,<5",
  "pytest>=8.4.0,<9",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidara_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
