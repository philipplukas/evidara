# Local development services for Evidara components.
#
# Usage:
#   docker compose up -d                          # Start lite infra (postgres only)
#   docker compose --profile search up -d         # Add OpenSearch
#   docker compose --profile full up -d           # Add OpenSearch + Pub/Sub emulator
#   docker compose --profile lean-stack up -d     # Lean search stack: OpenSearch + Document
#                                                 # Service + bootstrap + legal-search API (3102)
#   docker compose down           # Stop
#   docker compose down -v        # Stop + delete data
#
# Included services:
#   - OpenSearch for legal-search
#   - Postgres for platform-control
#   - Pub/Sub emulator for local event-driven runtime flow
#   - Lean search stack (profile `lean-stack`), driven by scripts/dev-lean-search-stack.sh
#     and documented in docs/setup/legal-search-lean-local.md
#
# After starting platform-control dependencies:
#   cd platform-control
#   cp .env.example .env
#   uv run alembic upgrade head
#   uv run platform-control-seed-reference-data
#   uv run uvicorn platform_control.main:app --reload --app-dir src
#
# After starting legal-search dependencies:
#   cd legal-search/api
#   npm run seed:index
#   npm run dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform_control
      POSTGRES_USER: platform_control
      POSTGRES_PASSWORD: platform_control
    ports:
      - "${EVIDARA_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - platform-control-postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_control -d platform_control"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: ["search", "full", "lean-stack"]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=admin
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "${EVIDARA_OPENSEARCH_HTTP_PORT:-9200}:9200"
      - "${EVIDARA_OPENSEARCH_METRICS_PORT:-9600}:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    mem_limit: 1024m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 10s
      timeout: 5s
      retries: 10

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:522.0.0-slim
    profiles: ["full"]
    command:
      [
        "gcloud",
        "beta",
        "emulators",
        "pubsub",
        "start",
        "--project=evidara-local",
        "--host-port=0.0.0.0:8681",
      ]
    ports:
      - "${EVIDARA_PUBSUB_HOST_PORT:-8681}:8681"
    mem_limit: 256m

  # --- Lean search stack (profiles `lean` / `lean-stack`) ------------------------
  # `lean-stack` is the all-in-one path: OpenSearch + Document Service + one-shot
  # bootstrap + legal-search API on 3102, with DOCUMENT_INTELLIGENCE_BASE_URL wired.
  # `lean` (used with `search`) starts only the Document Service, so the BFF can run
  # on the host with hot reload — see `dev-lean-search-stack.sh up-split`.

  # File-backed Document Service serving GET /v1/documents/{id}/lean from the
  # TAR-89 demo fixture. No Delta/Databricks dependency.
  document-service:
    build:
      context: .
      dockerfile: document-intelligence/Dockerfile.document-service
    profiles: ["lean", "lean-stack"]
    environment:
      # Tags structured log lines with their origin (#712). Unset => environment="unknown".
      DI_ENVIRONMENT: ${DI_ENVIRONMENT:-development}
      DOCUMENT_SERVICE_CONTENT_DIR: /content
      PORT: "8090"
    volumes:
      - ./scripts/fixtures/tar89-demo-content:/content:ro
    ports:
      - "${EVIDARA_DOCUMENT_SERVICE_PORT:-8090}:8090"
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: wait for OpenSearch, create the documents index + projection-history
  # index, point the documents-read alias at documents-write, and seed the stale
  # projection doc that `dev-lean-search-stack.sh replay` later overwrites.
  # Installs jq in-container so the host does not need it (see the lean setup doc).
  lean-bootstrap:
    image: alpine:3.20
    profiles: ["lean-stack"]
    environment:
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_ALIAS_READ: documents-read
      OPENSEARCH_ALIAS_WRITE: documents-write
    volumes:
      - ./scripts:/repo/scripts:ro
    working_dir: /repo
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache bash curl jq >/dev/null && exec bash scripts/validate-tar89-metadata-local.sh --bootstrap
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  # legal-search BFF wired to the lean Document Service. Distinct from the
  # `legal-search-api` service in docker-compose.local.yml, which seeds from
  # OpenCaseLaw and does not set DOCUMENT_INTELLIGENCE_BASE_URL.
  legal-search-api-lean:
    build:
      context: .
      dockerfile: legal-search/api/Dockerfile
    profiles: ["lean-stack"]
    environment:
      NODE_ENV: production
      PORT: "3102"
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_ALIAS_READ: documents-read
      OPENSEARCH_ALIAS_WRITE: documents-write
      DOCUMENT_INTELLIGENCE_BASE_URL: http://document-service:8090
    ports:
      - "${EVIDARA_LEGAL_SEARCH_API_PORT:-3102}:3102"
    mem_limit: 768m
    depends_on:
      lean-bootstrap:
        condition: service_completed_successfully
      document-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12

  # Optional: OpenSearch Dashboards for browsing data
  # Uncomment if you want a web UI at http://localhost:5601
  # dashboards:
  #   image: opensearchproject/opensearch-dashboards:2.17.1
  #   container_name: evidara-dashboards
  #   environment:
  #     - OPENSEARCH_HOSTS=["http://opensearch:9200"]
  #     - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     opensearch:
  #       condition: service_healthy

  # The platform-control connector worker is a real service in
  # docker-compose.local.yml, under the `apps` profile. It used to live here
  # commented out, which was worse than absent: the block set only
  # DATABASE_URL and RUN_DISPATCH_BACKEND, so uncommenting it produced a worker
  # on the default local/noop backends whose bundle manifests the DI consumer
  # could not read — the same env-parity break the 2026-04-14 AT RIS evidence
  # bundle root-caused. It now shares the API's environment via a YAML anchor.

volumes:
  platform-control-postgres-data:
  opensearch-data:
