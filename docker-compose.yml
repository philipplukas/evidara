# Local development services for Evidara components.
#
# Usage:
#   docker compose up -d                          # Start lite infra (postgres only)
#   docker compose --profile search up -d         # Add OpenSearch
#   docker compose --profile full up -d           # Add OpenSearch + Pub/Sub emulator
#   docker compose down           # Stop
#   docker compose down -v        # Stop + delete data
#
# Included services:
#   - OpenSearch for legal-search
#   - Postgres for platform-control
#   - Pub/Sub emulator for local event-driven runtime flow
#
# After starting platform-control dependencies:
#   cd platform-control
#   cp .env.example .env
#   uv run alembic upgrade head
#   uv run platform-control-seed-reference-data
#   uv run uvicorn platform_control.main:app --reload --app-dir src
#
# After starting legal-search dependencies:
#   cd legal-search/api
#   npm run seed:index
#   npm run dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: evidara-platform-control-postgres
    environment:
      POSTGRES_DB: platform_control
      POSTGRES_USER: platform_control
      POSTGRES_PASSWORD: platform_control
    ports:
      - "5432:5432"
    volumes:
      - platform-control-postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_control -d platform_control"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: evidara-opensearch
    profiles: ["search", "full"]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=admin
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    mem_limit: 1024m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 10s
      timeout: 5s
      retries: 10

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:522.0.0-slim
    container_name: evidara-pubsub-emulator
    profiles: ["full"]
    command:
      [
        "gcloud",
        "beta",
        "emulators",
        "pubsub",
        "start",
        "--project=evidara-local",
        "--host-port=0.0.0.0:8681",
      ]
    ports:
      - "8681:8681"
    mem_limit: 256m

  # Optional: OpenSearch Dashboards for browsing data
  # Uncomment if you want a web UI at http://localhost:5601
  # dashboards:
  #   image: opensearchproject/opensearch-dashboards:2.17.1
  #   container_name: evidara-dashboards
  #   environment:
  #     - OPENSEARCH_HOSTS=["http://opensearch:9200"]
  #     - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     opensearch:
  #       condition: service_healthy

  # Optional: Platform-control connector worker
  # Polls for pending runs and dispatches them to connector providers.
  # Uncomment to run the worker alongside the API.
  # platform-control-worker:
  #   build:
  #     context: ./platform-control
  #     dockerfile: Dockerfile.worker
  #   container_name: evidara-platform-control-worker
  #   env_file: ./platform-control/.env
  #   environment:
  #     PLATFORM_CONTROL_DATABASE_URL: postgresql+asyncpg://platform_control:platform_control@postgres:5432/platform_control
  #     PLATFORM_CONTROL_RUN_DISPATCH_BACKEND: worker
  #   command: ["platform-control-connector-worker", "--limit", "10", "--interval-seconds", "5"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  platform-control-postgres-data:
  opensearch-data:
