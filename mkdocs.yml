site_name: Evidara — Document Intelligence Platform
site_description: Architecture, ADRs, contracts, testing, and operational documentation for the Evidara platform.
site_url: https://philipplukas.github.io/evidara/

# MkDocs 1.6+: keep --strict useful without failing on links to repo paths outside docs/
# (contracts/, infra/, .github/, etc.). `scripts/check_doc_links.py` still validates
# markdown targets on disk for docs/**/*.md.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: info
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - swagger-ui-tag

